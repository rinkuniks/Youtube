pipe that runs under the sea.", "There was already a ferry link before that. Since 2001, boats have run between Kinmen and the city of Xiamen.", "For years, people used that ferry for family visits, shopping and trade, on the same water that once carried warships.", "Before the ferry, that stretch of sea was a front line with guns pointing across it in both directions.", "Soon you will hear how bad that front line got. But first, fact four, about who ran the island.", "Fact four: until 1992, ordinary families on Kinmen lived under military rule.", "The army, not a normal local government, ran daily life on the island for decades, with curfews and travel limits.", "Soldiers were stationed all over this small island, and the whole place was built to survive an attack from the sea.", "They dug tunnels by hand through solid rock, including the Zhaishan tunnel, which was cut so boats could hide inside a hill.", "Boats could shelter and unload inside the hill, safe from enemy fire, and tourists can walk through part of it today.", "Villages on Kinmen also have stone wind lions, guardian statues set on roofs and at village edges.", "People believed the wind lions calmed the strong winds on the island, so even the statues have a job here.", "If you enjoy strange places and facts like these, subscribe, because there are plenty more places that sound fake but are real.", "Back to Kinmen. The soldiers had good reason to be nervous, and fact five shows how tense it got.", "Fact five: for years, the two sides fought each other with giant loudspeakers and music.", "On Kinmen, huge speakers pointed across the water at China, and speakers on the other side pointed right back.", "Taiwan's side played songs, including music by the famous singer Teresa Teng, whose songs were frowned on in mainland China.", "The speakers also carried news and messages meant to change minds, not just to make noise.", "At Beishan there is a long concrete wall full of speaker openings that was built to face the mainland.", "Imagine trying to sleep with a speaker war going on across a narrow strip of sea.", "At Mashan, there is an observation post where visitors can look at the Chinese coast through binoculars.", "Past the water, the Chinese island of Dadeng is easy to spot from there.", "Today, some of those speakers are tourist sights, and you can walk right up to them.", "Eventually the speakers fell silent. But the loudspeakers were the gentle part of this fight.", "The last fact is the biggest one, and it is the reason for the knives in the hook.", "Fact six: in 1958, China began firing heavy artillery at Kinmen, shell after shell.", "It is known as the Second Taiwan Strait Crisis, and Kinmen was right at the centre of it.", "Underground shelters and tunnels became part of daily life, because the sky above the island was not safe.", "The shelling later settled into a strange pattern: China fired on odd-numbered days only.", "Even days were quiet, so islanders learned to plan their lives by the calendar.", "Some of the shells were not even explosive. They were filled with propaganda leaflets instead.", "That odd-day shelling went on for more than twenty years, and it finally stopped in 1979.", "Soldiers on both sides spent years watching each other, each side knowing the other was only a short boat ride away.", "Islanders were left with a huge amount of metal: shell casings and bomb pieces lying all over the place.", "A local man named Wu Tseng-tung had an idea: melt that metal and turn it into kitchen knives.", "Today Kinmen steel knives are sold as souvenirs, forged from the shells once fired at the island.", "So a kitchen knife can literally be a bomb from a conflict that has never ended with a peace treaty.", "That answers the hook: a beach facing China, and a knife made from China's own shells.", "Today the island is also known for sorghum liquor, old village houses and visitors who come to see the war leftovers.", "Look back at the opening picture: the skyline across the water, only a few kilometres away.", "The six facts: the skyline, the confused phone, the water pipe, the military rule, the speaker war, and the bomb knives.", "All of it comes from one simple fact of geography: Kinmen sits where Taiwan's reach meets China's coast.", "Tomorrow: another place on the map that looks fake but is completely real."], "job": ""}, {"date": "2026-12-10", "kind": "Short", "category": "geography", "title": "Eleven Churches Carved Down Into the Ground", "hook": "Your church here sits inside a pit.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Lalibela, Ethiopia, eleven churches were carved downward out of solid rock. Each one sits in a pit with its roof level with the ground, and people still pray in them today. Part of the Places That Shouldn't Exist series.\n\n#Shorts #PlacesThatShouldntExist #Ethiopia", "script": ["Your church here sits inside a pit.", "Its roof is level with the ground.", "Workers carved it from one solid rock.", "They started at the top and dug down.", "Lalibela has eleven of these churches.", "No bricks. No stacked blocks. Just rock.", "People still pray in them today.", "Your church was never built. It was freed.", "Tomorrow: giant trees standing alone by a road."], "job": ""}, {"date": "2026-12-10", "kind": "Short", "category": "geography", "title": "Your Road in Madagascar Is Lined With Giants", "hook": "Your road in Madagascar is lined with giants.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Avenue of the Baobabs near Morondava in Madagascar is a road lined with enormous baobab trees standing alone in a row. They are survivors of a forest that once covered the area, and they tower over every passing car. Part of the Places That Shouldn't Exist series.\n\n#Shorts #PlacesThatShouldntExist #Madagascar", "script": ["Your road in Madagascar is lined with giants.", "These baobab trees stand alone, in a line.", "They tower over every car below.", "This is the Avenue of the Baobabs.", "It's a road near Morondava.", "These trees survived a vanished forest.", "Baobabs store water inside thick trunks.", "Some have stood for centuries.", "Giants line your road in Madagascar.", "Tomorrow: a thin arm of land touching China."], "job": ""}, {"date": "2026-12-10", "kind": "Short", "category": "geography", "title": "Afghanistan Has an Arm That Touches China", "hook": "Your map of Afghanistan has a strange arm.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Look at a map of Afghanistan and you'll see the Wakhan Corridor, a thin arm of land about 350 km long that stretches east until it touches China. Britain and Russia shaped it in the 1890s so their empires wouldn't border each other. Part of the Places That Shouldn't Exist series.\n\n#Shorts #PlacesThatShouldntExist #Geography", "script": ["Your map of Afghanistan has a strange arm.", "It stretches east until it touches China.", "It's about three hundred fifty kilometres long.", "This is the Wakhan Corridor.", "Britain and Russia shaped it in the 1890s.", "It kept their empires from touching.", "Britain then ruled India, right next door.", "So Afghanistan got one thin arm.", "That strange arm is still on your map.", "Tomorrow: a statue left on the Moon."], "job": ""}, {"date": "2026-12-10", "kind": "Short", "category": "space", "title": "A Tiny Statue Has Sat on the Moon Since 1971", "hook": "Your tiny statue sits on the Moon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo 15 astronauts left a small aluminium figure called Fallen Astronaut on the Moon in 1971, beside Hadley Rille. It honours astronauts and cosmonauts who died in the exploration of space, and a plaque beside it lists their names. Part of the If You Were in Space series.\n\n#Shorts #IfYouWereInSpace #Apollo15", "script": ["Your tiny statue sits on the Moon.", "It's an aluminium figure of an astronaut.", "It's called Fallen Astronaut.", "Apollo fifteen's crew left it in 1971.", "It lies beside Hadley Rille, a winding valley.", "It honours astronauts who died exploring space.", "Fourteen names, from two rival nations.", "It's still there today.", "Your tiny statue sits on the Moon.", "Tomorrow: the flicker hiding in your lights."], "job": ""}, {"date": "2026-12-10", "kind": "Short", "category": "technology", "title": "Your Room Lights Are Flickering Right Now", "hook": "Your room lights are flickering right now.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Many bulbs pulse with the mains power, and India's supply runs at 50 hertz. Your eyes blur it into steady light, but a phone in slow motion catches the dark bands rolling across the screen. Results vary by bulb and phone. Part of the Try This Now series.\n\n#Shorts #TryThisNow #PhoneTricks", "script": ["Your room lights are flickering right now.", "Your eyes just can't catch it.", "Open slow motion on your phone.", "Film a bulb and watch the bands.", "Dark stripes roll across the screen.", "India's power runs at fifty hertz.", "Many bulbs pulse a hundred times a second.", "Your eyes blur it into steady light.", "Your room lights are flickering right now.", "Tomorrow: another fact that sounds fake."], "job": ""}, {"date": "2026-12-11", "kind": "Long video", "category": "geography", "title": "6 Borders That Make No Sense, Ending in India", "hook": "Your walk across one small town takes you from Estonia to Latvia, and India has a border stranger still.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A walk across one small town takes you from Estonia to Latvia, and that is only number six. Count down six real borders that make no sense, from Valga-Valka and a German town inside Switzerland to the tangle of enclaves on the India-Bangladesh border. Every place is real and on the map.", "script": ["Your walk across one small town takes you from Estonia to Latvia, and India has a border stranger still.", "By the end, you will see a patch of Indian land inside Bangladeshi land, inside Indian land, inside Bangladesh.", "Six real borders. Each one stranger than the last. And number one is right here in India.", "We start with a town where the border runs down a street, through a square and across a park.", "Stay for the last one. Many people have never heard of it, and it only disappeared from the map in 2015.", "So let's start the countdown at number six, in a small town in the Baltics.", "Number six. One town, two countries, and you can cross the border on your way to the shop.", "It is called Valga on the Estonian side and Valka on the Latvian side. Same town, two names, two countries.", "Look at the map and you see one built-up town, with a border line cutting straight through the middle.", "The border runs along a street, across a square and through a park. You can step over it without noticing.", "Each half has its own town council, its own flag and its own local rules, yet the buildings sit side by side.", "So how did this happen? In 1920, both Estonia and Latvia claimed the town, and neither would give way.", "A British officer, Colonel Tallents, was asked to settle it. He drew a line that split the town in two.", "For decades that hardly mattered, because both countries were inside the Soviet Union and the border was only on paper.", "Then the Soviet Union ended, and that paper line became a real border between two independent countries again.", "Today both countries are in the Schengen area, so you can walk across with no passport check at all.", "Both even use the euro. But during Covid, checks came back for a while, and the town felt cut in half.", "Estonian is spoken on one side and Latvian on the other, yet people move between them like crossing a road.", "A town split in half is strange. But wait until you see a town that is stuck inside another country.", "Number five. There is a town that is German on paper, yet completely surrounded by Switzerland on every side.", "It is called Büsingen. Look at the map and you see a small German pocket sitting inside the Swiss border.", "The town is part of the Swiss customs area, even though it belongs to Germany.", "Shops accept Swiss francs, and many people use them every day, even though the town is in Germany.", "Its cars carry a special German number plate with the letters BÜS, so you can spot a Büsingen car at once.", "Its laws are mostly German, but many everyday habits feel Swiss, because Switzerland is all around it.", "Old land deals and treaties from centuries ago left the town cut off, and nobody ever fixed it.", "A German town inside Switzerland is odd. Next is a Spanish town stuck inside France.", "Number four. Llívia is a Spanish town, but you can only reach it by driving through France.", "It sits in a valley in the Pyrenees mountains, with French land on every side.", "In 1659 Spain and France signed a treaty, and Spain handed over a set of villages to France.", "Llívia was officially a town, not a village. So the treaty did not count it, and it stayed Spanish.", "That tiny technical difference is why a Spanish town sits inside France today, more than three hundred years later.", "A road links it back to Spain through French land, so you cross a border just to reach a Spanish town.", "Llívia is quiet and peaceful. Next is a place where a mapmaker's mistake left American land cut off by Canada.", "Number three. There is a piece of the United States that you can only reach by land if you pass through Canada.", "It is called the Northwest Angle, a small piece of Minnesota that sticks up into a huge lake called Lake of the Woods.", "To get there by road, you drive through Canada and then take a boat across the water to American land.", "In winter the lake freezes and an ice road opens, so you can drive on frozen water to reach the United States.", "Only a small number of people live there, and fishing lodges are a big part of life on the Angle.", "Why does it exist? An old treaty from 1783 was written using a map with mistakes on it.", "The mapmakers did not know the real shape of the land, so the line the treaty described did not fit it.", "Later talks tried to fix the line, but they left this odd corner on the American side.", "So the Angle is American, but cut off from the rest of its country by a lake and by Canada.", "If you enjoy strange places like these, subscribe, because there are more coming, and a few are even stranger.", "Number two is not a small pocket. It is a whole region of a huge country, sitting far away from it.", "Number two. Russia owns a piece of land in Europe that does not touch the rest of Russia.", "It is called Kaliningrad, and it sits on the Baltic Sea, between Poland and Lithuania.", "The land was once German, and its main city was Königsberg. After the Second World War, it became Russian.", "Later the Soviet Union ended, the countries around it became independent, and Kaliningrad was cut off from Russia by land.", "To go from Moscow to Kaliningrad by land, you must cross other countries. Many travellers fly or go by sea.", "Imagine a piece of India that you could only reach through another country. That is how Kaliningrad works for Russia.", "It is also home to a large Russian naval base on the Baltic Sea.", "Even so, it is a working region with ports, roads and a big city, all far from Moscow.", "That is strange. But now we reach number one, and it is not in Europe or America. It is in India.", "Number one. India's strangest border was not a single line at all. It was a puzzle of tiny islands of land.", "Along the India-Bangladesh border, there were small patches of Indian land sitting inside Bangladesh.", "And there were patches of Bangladeshi land inside India. These patches are called enclaves.", "There were 111 Indian enclaves inside Bangladesh, and 51 Bangladeshi enclaves inside India.", "The tangle goes back to old deals between the kings of Cooch Behar and the Mughals, long before 1947.", "When India and Pakistan split in 1947, the new line was drawn around these patches, and the puzzle stayed.", "People in an enclave were stuck. To reach a school or a hospital, they often had to cross into the other country.", "Many lacked basic services, because neither country could easily reach them.", "In 2011, officials from both countries went door to door in the enclaves to count the people living there.", "Then there was the most extreme case, a place called Dahala Khagrabari, in the middle of the puzzle.", "It was a patch of Indian land inside Bangladeshi land, inside Indian land, inside Bangladesh. Land inside land inside land.", "Reports called it the only place of its kind in the world, a third-level enclave.", "At midnight on 31 July 2015, India and Bangladesh finally swapped these lands under a land border agreement.", "Residents were allowed to choose which country they wanted to belong to, and some chose to move.", "Many people celebrated that night, and the tangle of enclaves was gone from the map.", "So the strangest border in India is one you can no longer visit. It now lives on old maps.", "A border made of tiny islands inside islands is stranger than any single line, and that is why it takes number one.", "So here is the countdown again. Six, Valga and Valka, a town split between Estonia and Latvia.", "Five, a German town inside Switzerland. Four, a Spanish town inside France. Three, an American corner reached through Canada.", "Two, Russian land far from Russia. And one, India's tangle of land inside land inside land.", "Maps look neat and solid. But every line on them was drawn by people, and people make strange choices.", "Now think back to the start. Your walk across one small town takes you from Estonia to Latvia.", "Come back tomorrow for another place on the map that should not exist, and it is real."], "job": ""}, {"date": "2026-12-11", "kind": "Short", "category": "geography", "title": "Your Car Switches Road Sides on This Bridge", "hook": "Your car switches sides of the road on this bridge.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Hong Kong-Zhuhai-Macau Bridge links places that drive on opposite sides. Hong Kong and Macau drive on the left, mainland China on the right, so ramps near the ends move your car across.\n\nSeries: Places That Shouldn't Exist.\n\n#Shorts #Geography #China", "script": ["Your car switches sides of the road on this bridge.", "Hong Kong and Macau drive on the left.", "Mainland China drives on the right.", "So the bridge has to swap your side.", "Long ramps at each end move your car across.", "It links three cities across open sea.", "Drivers follow a different rule at each end.", "That is how one bridge flips your car.", "Tomorrow: a country that switched sides overnight."], "job": ""}, {"date": "2026-12-11", "kind": "Short", "category": "geography", "title": "Sweden Switched Road Sides in One Night", "hook": "Your road in Sweden used to run on the left.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On 3 September 1967, Sweden moved from driving on the left to driving on the right. The change is known as Dagen H. Almost all traffic stopped while the whole country made the switch.\n\nSeries: Places That Shouldn't Exist.\n\n#Shorts #Sweden #Geography", "script": ["Your road in Sweden used to run on the left.", "On 3 September 1967, everything flipped.", "The whole country moved to the right.", "They called it Dagen H.", "Almost all traffic stopped for the changeover.", "At five in the morning, everyone switched.", "Crews had swapped road signs overnight.", "Now your road in Sweden runs right.", "Tomorrow: a message from Earth, on the Moon."], "job": ""}, {"date": "2026-12-11", "kind": "Short", "category": "space", "title": "A Coin-Sized Disc of Messages Sits on the Moon", "hook": "Your planet left a message on the Moon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo 11 left a small silicon disc on the Moon in 1969. It carries goodwill messages from 73 countries, shrunk to microscopic size.\n\nSeries: If You Were in Space.\n\n#Shorts #Space #Apollo11", "script": ["Your planet left a message on the Moon.", "Apollo 11 left a small silicon disc there.", "It is about the size of a coin.", "It holds goodwill messages from seventy-three countries.", "The messages were shrunk to microscopic size.", "It was left behind with the lander.", "That was in 1969.", "So your planet's words still sit on the Moon.", "Tomorrow: rockets fire right before a landing."], "job": ""}, {"date": "2026-12-11", "kind": "Short", "category": "space", "title": "Soyuz Fires Rockets Just Before Touchdown", "hook": "Your capsule fires rockets right before it lands.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A Soyuz capsule slows under a parachute, then fires small rockets just above the Kazakh steppe. The burst kicks up a cloud of dust and softens the landing.\n\nSeries: If You Were in Space.\n\n#Shorts #Space #Soyuz", "script": ["Your capsule fires rockets right before it lands.", "This is a Soyuz coming home to Kazakhstan.", "First, a parachute slows the fall.", "It is still too fast for comfort.", "So small rockets fire just above the ground.", "They blast a cloud of dust across the steppe.", "That burst softens the landing.", "Your capsule touches down gently, wrapped in dust.", "Tomorrow: your phone shows what eyes cannot see."], "job": ""}, {"date": "2026-12-11", "kind": "Short", "category": "technology", "title": "Your Phone Shows Your Bulb Flickering", "hook": "Your phone can show a light flickering.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Lights run on alternating current, and many bulbs flicker faster than your eyes can notice. Slow-motion video at 240 fps can reveal it, and a ceiling fan can look strange too. Results vary by bulb and phone, so try it yourself.\n\nSeries: Try This Now.\n\n#Shorts #PhoneTricks #Tech", "script": ["Your phone can show a light flickering.", "Switch on a ceiling fan and a bulb.", "Open slow-motion mode at 240 frames per second.", "Point it at the bulb.", "You will see it pulse on screen.", "That is alternating current at work.", "Now film the fan blades.", "The blades can look slowed or frozen.", "Your phone just showed light flickering.", "Tomorrow: a road with a hole in it."], "job": ""}, {"date": "2026-12-12", "kind": "Long video", "category": "geography", "title": "Valga-Valka: 1 Town, 2 Countries, 1 British Colonel", "hook": "Your evening walk in this town takes you from Estonia to Latvia and back, and you never show a passport.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Valga in Estonia and Valka in Latvia are one town split between two countries, and a street, a square and a park all straddle the border. This video walks through seven true surprises: the 1917 Latvian independence decision, the British colonel who drew the line in 1920, the Soviet years with no border, and the Schengen era that followed. Watch to the end for the strangest part of the walk.\n\n#Geography #Borders #Estonia", "script": ["Your evening walk in this town takes you from Estonia to Latvia and back, and you never show a passport.", "One small town, two countries, and a street, a square and a park that all sit across the line.", "By the end, you'll see how a British officer, a Soviet empire and a treaty turned one town into two.", "This is Valga in Estonia and Valka in Latvia, and it is a real place you can walk through today.", "And the strangest part is not the border itself. It is how normal it feels to the people living there.", "We'll go through seven surprises, and each one is stranger than the last. Let's start with how old this town is.", "First surprise: this town is far older than the modern border that cuts through it.", "Valga is first mentioned in 1286, in the age of castles, long before Estonia and Latvia existed as modern countries.", "On the Latvian side, Valka received town rights in 1584 from Stefan Batory, the Polish-Lithuanian king.", "A king far away gave Valka its rights, and centuries later it would become a border town.", "Then in the late 1800s the railway came, and the town became an important junction.", "Trains brought workers and shops. In 1881 about 4,200 people lived here, and by the end of World War One over twenty thousand.", "So by 1917, this was one busy place, with Estonians and Latvians living side by side.", "But the next part is where this town helps create a whole country.", "Second surprise: one half of this town helped create a country. Latvia's story has a chapter written in Valka.", "On 15 November 1917, the Latvian Provisional National Council decided to proclaim an independent Republic of Latvia, in Valka.", "That was during the First World War, when nobody was sure which empire would win or which maps would survive.", "So a modest railway town became a place where a nation's future was discussed. Hold that thought.", "Because just a few years later, that same town was the centre of an argument between two new countries.", "Both Estonia and Latvia wanted Valga and Valka. And the people living there did not make the choice easy.", "Third surprise: the line through this town was drawn by a British colonel who did not live there.", "Estonia and Latvia could not agree where the border should go, and the town could not be cut cleanly.", "The population was split almost evenly between Estonians and Latvians, so there was no easy way to divide it.", "An international commission with British, Latvian and Estonian members tried, but they could not decide.", "So the chairman of the court of arbitration, a British colonel named Tallents, made the final decision.", "His ruling gave the main part of the town to Estonia, and the suburban part to Latvia.", "The line followed a small creek running through the area. A creek decided where two nations begin.", "It took effect on 1 July 1920, and it is still the reason the town has two names today.", "Imagine waking up one summer and learning that your street now belonged to a different country.", "Think of a cricket pitch cut in half by a rope. Same ground, but now two sets of rules.", "You might expect a border like that to feel serious. But for decades, it hardly mattered at all.", "Fourth surprise: for years, this international border did not exist as a real border at all.", "In 1940 the Soviet occupation began, and both Estonia and Latvia came under the same Soviet control.", "Under Soviet rule, the physical border between the two towns was non-existent. You could stroll across as if it was one place.", "Yet each half of the town kept going on its own, with its own life and its own story.", "That period also brought mass deportations of Estonians and Latvians from both towns, a painful chapter in their history.", "Neighbours could cross without thinking, because both halves were part of the same big state.", "Then came 1991. Both countries regained independence, and the border in Valga and Valka was set up again.", "Imagine a line you had forgotten, suddenly drawn back across your own neighbourhood. That is what happened here.", "Hold on, though. Because the border was about to change a second time, and this time it would melt away.", "Fifth surprise: ordinary border checks here ended in 2007, and the towns could finally flow into each other again.", "On 21 December 2007, Estonia and Latvia joined the Schengen zone, which lets people travel without passport checks.", "In Valga and Valka, that meant the streets could simply flow into each other again.", "Both countries also use the euro, so the money in your pocket works on both sides of the line.", "Both are also in the same time zone, so your phone clock doesn't change when you cross.", "Think about what that means: you can buy bread in Latvia and have coffee in Estonia during one short walk.", "Valga's station has a city bus, number 3, that links the twin towns three times a day.", "For most of us, a bus ride that crosses a country border sounds almost unreal. Here it is a normal commute.", "If you enjoy strange places like this, subscribe, because there are more true geography surprises coming.", "But the real surprise is how people have quietly started using this open border to their advantage.", "Sixth surprise: in 2016 it was reported that many Valka residents had registered themselves as residents of Valga.", "The reason given was simple: better welfare and higher salaries on the Estonian side.", "So choosing your country can come down to which side of a small town supports you better.", "It is a bit like choosing which side of a city boundary to register your home, except the boundary is a country.", "The towns even use a slogan: One Town, Two Countries. It sounds like a joke, but it fits perfectly.", "Valga has about twelve thousand people, and Valka about six thousand, so Valka is roughly half the size.", "Together that is a little over eighteen thousand people, and about thirty square kilometres of land.", "Imagine two neighbouring wards in one Indian city, except each ward has its own government and its own flag.", "Quick recap before the finale: a town older than both countries, and a nation's decision made in Valka.", "A British colonel who drew a line in 1920, and a Soviet era when that line barely mattered.", "Then 1991 brought the border back, and 2007 brought ordinary checks to an end, so the two towns joined hands again.", "Final surprise, the one I promised: in Valga and Valka, a street, a square and a park all straddle the border.", "That means you can stand on one street with one foot in Estonia and one foot in Latvia.", "A town square is where people meet, shop and argue. Here, that same square sits across two countries.", "A park is where children play. Here, children can play in a park that sits across two nations.", "Most borders you picture have fences and guards. Here, the border runs through everyday places.", "So when someone says 'I'm going to the park', they may also be saying 'I'm going abroad'.", "Two names, two languages, two countries, and one set of streets. That is what Valga and Valka mean for locals.", "And remember how it began: a British colonel, a small creek, and a decision made in 1920.", "A line drawn when the population was almost evenly split still runs through everything in the town today.", "Picture the map: a thin line, thirty square kilometres of town, and two flags flying side by side.", "That is why this town is stranger than you think: your evening walk can take you from Estonia to Latvia and back.", "Next up: a country completely surrounded by another country, and how people live inside it."], "job": ""}, {"date": "2026-12-12", "kind": "Short", "category": "geography", "title": "The Highway From Alaska to Argentina Has a Gap", "hook": "Your road from Alaska to Argentina has a gap.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Pan-American Highway runs through much of the Americas, but it stops in Panama and Colombia. The Darién Gap is about 100 km of jungle and swamp with no road across it.\n\nSeries: Places That Shouldn't Exist.\n\n#Shorts #Geography #DarienGap", "script": ["Your road from Alaska to Argentina has a gap.", "It is called the Pan-American Highway.", "But in Panama and Colombia, it stops.", "That gap is the Darién Gap.", "It is about a hundred kilometres of jungle and swamp.", "No road crosses it.", "Travellers go around it by boat or air.", "So Alaska to Argentina still has a gap."], "job": ""}, {"date": "2026-12-12", "kind": "Short", "category": "geography", "title": "The Equator Monument Is Not on the Equator", "hook": "Your GPS says the Equator monument is misplaced.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Near Quito, Ecuador, the Mitad del Mundo monument is famous as the Equator. A handheld GPS puts the real zero-latitude line a few hundred metres away. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Geography #Ecuador", "script": ["Your GPS says the Equator monument is misplaced.", "This is Mitad del Mundo, near Quito.", "A big monument claims to mark zero latitude.", "Surveyors measured it in the seventeen hundreds.", "Walk a few hundred metres with GPS.", "Your phone hits the real Equator there.", "The famous monument is slightly off the line.", "So your GPS beats the monument.", "Tomorrow: a famous line that's also misplaced."], "job": ""}, {"date": "2026-12-12", "kind": "Short", "category": "geography", "title": "GPS Zero Is Not on the Greenwich Line", "hook": "Your GPS disagrees with the Prime Meridian line.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At the Greenwich Observatory in London, a brass strip marks the Prime Meridian. Modern GPS uses a reference meridian that sits roughly 100 metres to the east. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Greenwich #Geography", "script": ["Your GPS disagrees with the Prime Meridian line.", "At Greenwich, a brass strip marks zero longitude.", "Tourists stand across it for photos.", "But GPS zero sits about 100 metres east.", "Modern maps use a satellite-based reference line.", "The old line was set by telescope.", "Your phone follows the satellites instead.", "So the brass line isn't your zero.", "Tomorrow: the first satellite, smaller than you'd think."], "job": ""}, {"date": "2026-12-12", "kind": "Short", "category": "space", "title": "The First Satellite Was a Beach-Ball Beeper", "hook": "Your radio could have heard the first satellite.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Sputnik 1 launched in 1957 and was only 58 cm wide. Its transmitter sent beeps that ordinary radios could pick up. Part of the series Places That Shouldn't Exist, from Earth to orbit.\n\n#Shorts #Space #Sputnik", "script": ["Your radio could have heard the first satellite.", "Sputnik 1 launched in 1957.", "It was only 58 centimetres wide.", "That's about the size of a beach ball.", "Inside, a transmitter sent out steady beeps.", "Ordinary radios could pick up those beeps.", "People listened to space from their living rooms.", "One small beeping ball started the space age.", "Tomorrow: a code that works while scribbled on."], "job": ""}, {"date": "2026-12-12", "kind": "Short", "category": "technology", "title": "Scribble on a QR Code. It Still Scans.", "hook": "Your phone can scan a scribbled-on QR code.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "QR codes carry spare repair data, so a phone can often read one that is partly covered or scribbled on. The strongest error-correction setting repairs up to about 30 percent damage, so use a code made with high error correction. Try it with a marker and your phone camera.\n\n#Shorts #Tech #QRCode", "script": ["Your phone can scan a scribbled-on QR code.", "Grab a marker and draw across one.", "Now point your camera at it.", "It can still open, scribble and all.", "QR codes carry spare repair data.", "Like a sentence with missing letters.", "The strongest setting repairs up to thirty percent.", "Try it on a high-repair code.", "Scribbled, and your phone still reads it.", "Tomorrow: a road that crosses the sea."], "job": ""}, {"date": "2026-12-13", "kind": "Long video", "category": "geography", "title": "7 Weird Borders, and India's Is the Strangest", "hook": "Your car can swap sides of the road halfway across a bridge, and that is only border number seven in this countdown.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Cars swap sides of the road on the Thai-Lao Friendship Bridge, a Spanish town sits inside France, and a German town runs on Swiss francs. This countdown ends on India's strangest border, a patch of India inside Bangladesh inside India inside Bangladesh. Every place is real and you can find each one on a map.\n\n#borders #geography #facts", "script": ["Your car can swap sides of the road halfway across a bridge, and that is only border number seven in this countdown.", "Today I will show you seven real borders that make no sense, each one stranger than the one before it.", "By the end, you will see a patch of India inside Bangladesh, inside India, inside Bangladesh, all on a single map.", "Every place in this video is real, and you can search for each one on your phone tonight.", "We start on a river bridge in Asia where drivers have to change which side of the road they use.", "Stay until the very end, because number one took a treaty, a midnight handover and years of waiting to fix.", "Number seven: the Thai-Lao Friendship Bridge, where your car swaps sides of the road right above a river.", "The bridge crosses the Mekong river, joining Nong Khai in Thailand with the Laotian capital Vientiane on the other bank.", "Thailand drives on the left side of the road, just like India does, so Indian viewers would feel at home.", "Laos drives on the right, like most of the world. So the two countries follow opposite rules.", "Now think about the problem. A car arrives from one country and has to leave on the other country's side.", "The switch happens on the bridge itself, not at some normal junction on land, which is why the bridge is famous.", "Road signs and markings tell drivers when to change sides, and the whole stream of traffic moves across together.", "This bridge opened in 1994, and it was the first one built across the lower Mekong river.", "Before that, people mostly crossed the water by boat. Later a short railway link was added as well.", "Picture the drive: left side, then a swap, then right side, all in a few minutes over water.", "That one can be solved with paint and signs. The next border is stuck because of a treaty from 1659.", "Number six: Llívia, a Spanish town that sits inside France with French land on every side.", "On a map of the Pyrenees, you see France everywhere, and then one small patch that is still Spain.", "The reason goes back to 1659, when Spain handed a group of villages in this area over to France.", "Llívia was counted as a town, not a village, so it was left out of the deal and stayed Spanish.", "Today a road that was kept neutral under that old treaty links the town to the rest of Spain.", "So you can drive out of Llívia, and within a short distance you are surrounded by France.", "A deal made more than three and a half centuries ago still decides which flag flies over this town.", "It is a tiny place, but it is a perfect example of how one word in a treaty can change a map.", "Next, a piece of America that you can only reach by road if you drive through Canada first.", "Number five: Point Roberts, a small American community that hangs off the bottom of Canada like a loose thread.", "It sits on the tip of a peninsula, just south of the 49th parallel, which is the US and Canada border line.", "Because the border follows that line on the map, the tip of the peninsula ended up cut off from America.", "To drive from Point Roberts to the rest of Washington state, you must pass through Canada by road.", "That means a border crossing into Canada, and another crossing back into the United States, just to reach an American city.", "Locals live in the United States, but the road to the rest of their state runs through another country.", "On a map it looks like a mistake, but it is a real community with real homes and real people.", "If you enjoy strange places like these, subscribe to the channel, because the next four get even weirder.", "And the next one is a lake that three countries have never agreed how to divide.", "Number four: Lake Constance, a huge lake where three countries never agreed on a final border line.", "The lake sits where Germany, Switzerland and Austria meet, and it is big enough to have ferries and ports.", "On the land around it, every border is clear. On the water, no one ever signed one agreed line.", "The three countries have never agreed whether the lake should be shared or divided.", "So on a lake with boats, fishing and holiday homes, there is no agreed border in the open water.", "People still get along fine, because the countries have separate agreements for shipping, fishing and safety.", "Swim out from the shore and nobody can say for sure which country you are floating in.", "A lake with no border is odd, but a town that uses another country's money is even odder.", "Number three: Büsingen am Hochrhein, a small German town that is completely surrounded by Switzerland on every side.", "Its people are German citizens, they have a German address, and they vote in German elections.", "But the town is inside the Swiss customs area, so Swiss francs are used there every day.", "Its car number plates start with the letters BÜS, a special code that only this one town has.", "Old deals between rulers left this little town on the German side of the paperwork, and it never changed.", "Walk down a street there and you are in Germany, while the land and the money around you are Swiss.", "That is strange enough. But the next place has a village inside a village inside a country.", "Number two: Madha, a patch of Oman that sits inside the United Arab Emirates.", "Madha belongs to Oman but is cut off from it, with UAE land surrounding it on every side.", "Now comes the twist. Inside Madha there is a tiny village called Nahwa, and Nahwa belongs to the UAE.", "So you get UAE land, inside Omani land, inside UAE land. A country inside a country inside a country.", "On satellite maps the shapes look like a puzzle piece, and the border lines wrap around the village.", "A short drive around this area can take you across the line between Oman and the UAE more than once.", "Imagine your phone trying to decide which country you are in, every few minutes.", "It is a beautiful puzzle, but it is still not the strangest border on this list.", "For the strangest one, we are going home to India, and to the border with Bangladesh.", "Number one: the India and Bangladesh border near Cooch Behar in West Bengal, which was cut into tiny pieces.", "For decades, small patches of land belonging to one country sat inside the other country, with no land link back home.", "There were Indian villages inside Bangladesh and Bangladeshi villages inside India. In all, there were 162 of these pockets.", "These are called enclaves, and the people living in them were surrounded by a different country on every side.", "Many residents said it was hard to get schools, hospitals, and official papers, because their own country was not reachable.", "And one of those pockets was stranger than all the rest. It was called Dahala Khagrabari.", "It was a piece of India, inside a piece of Bangladesh, inside a piece of India, inside Bangladesh.", "That is four layers of borders around one patch of land, and no other place on Earth had so many.", "If you stood in the middle of it, you would have had to cross several borders just to reach mainland India.", "In 2015, India and Bangladesh finally signed off on a land deal to end all of these pockets.", "At midnight on 31 July 2015, 111 Indian enclaves became part of Bangladesh, and 51 Bangladeshi ones became part of India.", "Residents were allowed to choose which country they wanted to belong to, after decades of living in the middle of nowhere.", "For many people, it meant a proper address, a vote, and a road to a school for the first time.", "So the strangest border in India was not a wall or a river. It was a puzzle drawn by history.", "That is why it is number one: a place with four borders around it, finally fixed in a single night.", "That was seven borders that make no sense, from a bridge where cars swap sides to a puzzle with four layers.", "Remember the start: your car can switch sides of the road halfway across a bridge between Thailand and Laos.", "Tell me in the comments which border surprised you the most, and I will see you in the next video.", "Tomorrow, in the next video: the country with no border at its own front door."], "job": ""}, {"date": "2026-12-13", "kind": "Short", "category": "geography", "title": "You Can Drive Across the Sea to Bahrain", "hook": "Your car can drive from Saudi Arabia to Bahrain.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The King Fahd Causeway links Saudi Arabia and the island nation of Bahrain across the Gulf. It runs about 25 kilometres and opened in 1986. An artificial island partway along holds the border facilities. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Bahrain #Geography", "script": ["Your car can drive from Saudi Arabia to Bahrain.", "The road runs across the sea.", "It's about 25 kilometres long.", "It's called the King Fahd Causeway.", "Bridges and embankments carry you over the Gulf.", "Halfway, an artificial island holds the border checks.", "Before 1986, Bahrain had no road link.", "Now an island nation is a drive away.", "Tomorrow: a road that dives under the sea."], "job": ""}, {"date": "2026-12-13", "kind": "Short", "category": "geography", "title": "This Road Dives Under the Sea to an Island", "hook": "Your drive from Denmark to Sweden goes underwater.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Driving from Denmark to Sweden over the Øresund link, the road starts in an undersea tunnel and surfaces on Peberholm, a completely man-made island. From there a bridge carries you into Sweden. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Oresund #Geography", "script": ["Your drive from Denmark to Sweden goes underwater.", "First, you enter a tunnel under the sea.", "Then you surface on an island called Peberholm.", "Peberholm is completely man-made.", "Its name means Pepper Islet.", "Next door, a natural island is Saltholm.", "Then a bridge carries you into Sweden.", "Engineers went under to keep ships and planes clear.", "So your road really does vanish underwater.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-12-13", "kind": "Short", "category": "space", "title": "Your dog flew to space before any human", "hook": "Your dog flew to space before any human.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In November 1957 the Soviet Union launched Laika aboard Sputnik 2. She was the first animal to orbit Earth, four years before Yuri Gagarin became the first human in space. Laika did not survive the mission.\n\n#Shorts #Space #Laika", "script": ["Your dog flew to space before any human.", "Her name was Laika.", "November 1957, aboard Soviet Sputnik 2.", "She became the first animal to orbit Earth.", "Yuri Gagarin followed in 1961.", "Laika did not survive the mission.", "She showed a living body could survive launch.", "Your dog flew before any human did.", "Tomorrow: India's first woman in space."], "job": ""}, {"date": "2026-12-13", "kind": "Short", "category": "space", "title": "A girl from Karnal who flew on a shuttle", "hook": "If you grew up in Karnal, so did an astronaut.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Kalpana Chawla was born in Karnal, Haryana. In 1997 she flew aboard Space Shuttle Columbia and became the first Indian-born woman in space. India later named its Kalpana-1 satellite in her honour.\n\n#Shorts #Space #KalpanaChawla", "script": ["If you grew up in Karnal, so did an astronaut.", "Kalpana Chawla was born in Karnal, Haryana.", "In 1997 she flew aboard Space Shuttle Columbia.", "She became the first Indian-born woman in space.", "She flew a second mission in 2003.", "That mission ended in the Columbia disaster.", "India named a satellite Kalpana-1 for her.", "A girl from Karnal, once in orbit.", "Tomorrow: a rainbow hiding on a CD."], "job": ""}, {"date": "2026-12-13", "kind": "Short", "category": "technology", "title": "Your phone camera turns a CD into a rainbow", "hook": "Your phone camera turns a CD into a rainbow.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Tilt any old CD or DVD in sunlight and look at it through your phone camera. The tiny tracks on the disc act as a diffraction grating and split light into a rainbow. Try it with any phone.\n\n#Shorts #PhoneTricks #Science", "script": ["Your phone camera turns a CD into rainbows.", "Tilt any CD or DVD in sunlight.", "Point your phone camera at its shiny side.", "Colors spread across the screen like a spectrum.", "The disc has tiny tracks packed super close.", "They split sunlight into its separate colors.", "That effect is called diffraction.", "Try it now with any old disc.", "Your phone camera just found a rainbow.", "Tomorrow: icebergs on a black beach."], "job": ""}, {"date": "2026-12-14", "kind": "Long video", "category": "geography", "title": "Why Thailand Is Stranger Than You Think", "hook": "Your car swaps sides of the road on a bridge between Thailand and Laos.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Thailand lives in the year 2569, has a city named after Ayodhya, and has a bridge where cars swap sides of the road. Here are seven strange facts about Thailand that sound fake and are true, from a train running through a market to a monkey banquet. Watch to the end for the Thai-Lao Friendship Bridge.\n\n#Thailand #Geography #FactsThatSoundFake", "script": ["Your car swaps sides of the road on a bridge between Thailand and Laos.", "Thailand is full of facts like this, where the real thing sounds more fake than anything you could make up.", "By the end, you will see seven strange true facts, from a year that reads 2569 to a train running through a market.", "The bridge is saved for last, because it is the one that breaks your brain.", "Each fact is stranger than the one before, so do not leave after the first one.", "We start with the date on a Thai calendar today.", "Fact one. Open a Thai calendar today and it does not say 2026. It says 2569.", "Thailand officially counts years from the Buddha's passing, which puts it 543 years ahead of the calendar on your phone.", "Next January, the Thai year will tick over to 2570 while yours reads 2027.", "Their traditional new year, Songkran, comes in April, and the whole country turns into a giant water fight.", "The name Songkran comes from Sanskrit, the same root as India's Sankranti.", "Strangers throw buckets of water at you on the road, and it is meant as a blessing, not an attack.", "Thailand also has no daylight saving, so its clocks sit one and a half hours ahead of India all year.", "Easy trick: Thai time is Indian time plus ninety minutes, so seven in the evening in Delhi is half past eight there.", "Stranger still, Thailand has a city named after a place you know well, and its kings share a name with Lord Ram.", "Stay with me, because that one is next.", "Fact two. A Thai city is named after Ayodhya, and its kings are called Rama.", "Ayutthaya was the old capital of the kingdom, and its name comes from Ayodhya, the city of Lord Ram.", "Thailand's national epic, the Ramakien, is its own version of the Ramayana, with Hanuman, Ravana and Sita all in it.", "Walk into the Grand Palace temple in Bangkok and you will see giant demon guardians from this story standing at the gates.", "The ruling Chakri dynasty gives every king the title Rama, and the current king is Rama the Tenth.", "Thailand is a Buddhist country, yet its main airport is called Suvarnabhumi, Sanskrit for golden land.", "Thai dancers still perform the Ramakien on stage, in masks and gold costumes.", "So an Indian visitor can land in Bangkok and feel oddly at home before leaving the airport.", "But Thailand also did something almost no neighbour managed, and it is the next fact.", "It involves foreign ships, clever kings, and a country that would not be ruled.", "Fact three. Thailand is the one country in Southeast Asia that was never ruled by a European power.", "Britain took land on one side, including Myanmar and Malaysia, and France took Laos and Cambodia on the other.", "Thailand, then called Siam, sat in the middle like a gap on the map.", "Its kings traded some land, stayed friendly with both sides, and kept the country independent.", "The word Thai means free, so Thailand itself means land of the free.", "More than a hundred years ago, the flag of Siam had a white elephant in the middle.", "Siam is also where the term Siamese twins comes from, because Chang and Eng were born there.", "One kingdom gave the world a cat breed, a twin name, and a flag with an elephant.", "But history is not the strange part anymore. Next, a market where a train drives through your shop.", "Yes, through the shop, and the shopkeepers have only moments to move.", "Fact four. At Maeklong, a real train runs straight through a fruit and vegetable market, several times a day.", "Vendors set up their stalls right on the railway tracks, with baskets of food inches from the rails.", "When the horn sounds, they fold back their awnings and pull their goods away in moments.", "The train rolls through slowly, close enough to touch the crates on either side.", "Then it passes, the awnings go back up, and customers walk across the tracks as if nothing happened.", "If you like strange places like this, subscribe, because we have a lot more of them coming.", "Tourists stand on the tracks to film it, and locals just carry on selling chillies and fish.", "It is a working railway and a working market, and both have simply learned to share.", "Next up, Thailand's capital, and a name that does not fit on a signboard.", "Locals do not even use it, and that is the clue.", "Fact five. Bangkok is not what Thai people call their capital, and its real name is enormous.", "Thais say Krung Thep, which means city of angels, and that is the short version.", "The full ceremonial name is one of the longest place names in the world, full of Sanskrit and Pali words.", "Thai children even learn a song that helps them recite it.", "Foreigners kept saying Bangkok, so that name stuck on every map and airline ticket outside Thailand.", "Big cities usually hide their wildlife, but Bangkok does not, because large monitor lizards walk around its parks.", "In Lumphini Park, they sunbathe on the paths and swim in the ponds, right beside joggers.", "Office workers eat lunch on the grass while the lizards stroll past like they own the place.", "And if lizards are not strange enough, the next place hands out a feast to monkeys.", "A whole town does it on purpose, once a year.", "Fact six. In Lopburi, people lay out a banquet every November for the town's wild monkeys.", "Tables of fruit, sweets and vegetables are stacked into towers, and the monkeys climb straight in.", "It is called the Monkey Buffet Festival, and locals hold it to say thank you to the monkeys.", "The monkeys live around old temple ruins in the middle of town, which are among the city's top sights.", "They snatch snacks and sit on parked scooters, and shops often put up nets and cages to protect their goods.", "Visitors are told to keep bags closed, because a monkey will open anything it can reach.", "In this town, the animals are the residents, and humans are the guests.", "So far you have seen a calendar from the future, a borrowed epic, a train in a market, and monkeys at a buffet.", "But the strangest one is a road rule. Thailand drives on the left, exactly like India, so you would feel at home at the wheel.", "That is why the last fact will confuse your brain, even if you drive every day.", "Fact seven. The Thai-Lao Friendship Bridge, where cars change sides of the road on the bridge itself.", "It crosses the Mekong river between Nong Khai in Thailand and Vientiane, the capital of Laos.", "Thailand drives on the left, the same as India, but Laos drives on the right.", "So somewhere on this one structure, traffic has to swap sides without anyone crashing.", "Road signs and markings guide each car from one side to the other, over the water.", "Drivers start the bridge on the left and finish it on the right, with a river under them.", "The Mekong below is one of Asia's great rivers, running along or through Thailand, Laos, Cambodia and Vietnam.", "Your hands know the left side, so for a moment your brain has to learn the road again.", "Most borders change a flag or a language, but this one changes which side of the road keeps you safe.", "That is seven facts: a year of 2569, a city named for Ayodhya, a country nobody ruled, and a train in a market.", "Then a city of angels with lizards in its parks, monkeys at a buffet, and a bridge that flips the road.", "So remember: your car really does swap sides of the road on a bridge between Thailand and Laos.", "Tomorrow: another country that looks normal on a map and is not."], "job": ""}, {"date": "2026-12-14", "kind": "Short", "category": "geography", "title": "A black beach covered in glacier ice", "hook": "Your beach photo here shows ice on black sand.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Diamond Beach in Iceland is a black sand beach scattered with chunks of glacier ice. The ice breaks off into the Jökulsárlón lagoon, floats out toward the sea, and some pieces wash back onto the sand. Places That Shouldn't Exist, part of a series.\n\n#Shorts #Iceland #DiamondBeach", "script": ["Your beach photo here shows ice on black sand.", "It's called Diamond Beach, in Iceland.", "Chunks break off a glacier into Jökulsárlón lagoon.", "They float in the lagoon first.", "Then a short river carries them to the sea.", "Waves wash some back onto the black sand.", "They sparkle like scattered diamonds in sunlight.", "Your photo shows glacier ice on black sand.", "Tomorrow: a capital built like an airplane."], "job": ""}, {"date": "2026-12-14", "kind": "Short", "category": "geography", "title": "A capital city built from scratch in 4 years", "hook": "Your map of Brasília shows an airplane-shaped capital.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Brasília was built from scratch, with construction starting in 1956 and the city opening as Brazil's capital in 1960. Its plan, designed by Lúcio Costa, looks like an airplane from above. Places That Shouldn't Exist, part of a series.\n\n#Shorts #Brasilia #Geography", "script": ["Your map of Brasília shows an airplane-shaped capital.", "Brazil built this entire capital from scratch.", "Construction began in 1956.", "It opened as the capital in 1960.", "Lúcio Costa designed the plan.", "From above, the layout looks like an airplane.", "Its main road forms the airplane's body.", "Government buildings line that road.", "Your map shows a city drawn first.", "Tomorrow: an Italian town inside Switzerland."], "job": ""}, {"date": "2026-12-14", "kind": "Short", "category": "geography", "title": "An Italian town completely inside Switzerland", "hook": "Your walk here stays in Italy, inside Switzerland.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Campione d'Italia is an Italian town that sits entirely inside Swiss territory, right on Lake Lugano. To drive there from Italy you have to cross Switzerland. Places That Shouldn't Exist, part of a series.\n\n#Shorts #Geography #Enclave", "script": ["Your walk here stays in Italy, inside Switzerland.", "This town is Campione d'Italia.", "It sits fully inside Swiss territory.", "It sits right on Lake Lugano.", "To drive there from Italy, you cross Switzerland.", "Its people are Italian, but Swiss land surrounds them.", "India once had enclaves like this too.", "Your walk stays Italian, inside Switzerland.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-12-14", "kind": "Short", "category": "space", "title": "Your Sun Has an Indian Camera Crew", "hook": "Your Sun is being filmed right now.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "India's Aditya-L1 reached its halo orbit at the Sun-Earth L1 point in January 2024. From about 1.5 million km away it keeps watching the Sun. Series: If You Were in Space.\n\n#Shorts #Space #ISRO", "script": ["Your Sun is being filmed right now.", "India's Aditya-L1 does it from space.", "It parks about 1.5 million kilometres away.", "That spot is called Lagrange point one.", "Gravity there helps it stay put.", "It reached that orbit in January 2024.", "From there it sees the Sun nonstop.", "So your Sun has an Indian camera crew.", "Tomorrow: a camera trick that bends fans."], "job": ""}, {"date": "2026-12-14", "kind": "Short", "category": "technology", "title": "Your Phone Camera Bends Spinning Fan Blades", "hook": "Your phone camera can bend a spinning fan.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Film a spinning ceiling fan with any phone camera and the straight blades look curved. It happens because the camera reads the picture line by line, called rolling shutter. Takes ten seconds to try.\n\n#Shorts #Tech #PhoneTricks", "script": ["Your phone camera can bend a spinning fan.", "Switch on a ceiling fan at home.", "Open your camera and film the blades.", "On screen, the straight blades look curved.", "Your camera reads the picture line by line.", "The blades move while it scans.", "That delay bends them on screen.", "Try it now on any phone.", "Your phone really can bend a fan.", "Tomorrow: a mountain with clouds on top."], "job": ""}, {"date": "2026-12-15", "kind": "Long video", "category": "geography", "title": "7 Borders That Make No Sense, Ending in India", "hook": "Your drive across Brunei used to cross Malaysia twice, with passport stamps both ways, just to stay inside one country.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that look fake on the map: Brunei, The Gambia, Nakhchivan, Cabinda, Oecusse, Dahagram-Angarpota and India's Tin Bigha Corridor. Each one is shown on a simple map with the odd shape highlighted. The last one is a strip of Indian land leased to Bangladesh.\n\n#borders #geography #india", "script": ["Your drive across Brunei used to cross Malaysia twice, with passport stamps both ways, just to stay inside one country.", "That is not even the strangest border in this video, and by the end you'll see why.", "Today we count down seven real borders that make no sense, and each one is stranger than the one before.", "The last one is in India: a strip of Indian land, leased to another country, with a gate in the middle.", "Every place here is real and on the map today. We start at number seven and end in India.", "Number seven: Brunei, a small country on the island of Borneo that comes in two separate pieces.", "On the map, Brunei looks like a shape with a bite taken out of it, and the bite is not part of Brunei.", "That bite is Limbang, a district of the Malaysian state of Sarawak, and it splits Brunei's eastern part from the rest.", "The eastern piece is called Temburong. To drive from Temburong to the capital side, you left Brunei, entered Malaysia, then came back.", "That meant border checks and passport stamps in both directions, all for one trip inside a single country.", "Limbang became part of Sarawak in 1890, when the White Rajah of Sarawak took it over, and it never went back.", "In 2009, Brunei and Malaysia signed a deal, and Brunei gave up its claim to Limbang for good.", "In 2020, Brunei opened a long bridge across its bay, so drivers can now skip Malaysia, but the odd shape remains.", "A country in two pieces is strange. But the next one is a whole country that is basically a river.", "Number six: The Gambia, the country in West Africa that looks like a long thin snake lying across the map.", "It follows the Gambia River inland, and it is only a thin strip, roughly twenty-five to fifty kilometres wide.", "Senegal surrounds it on every side except the short Atlantic coast, so nearly every border you cross there leads into Senegal.", "The shape comes from colonial days, when Britain controlled the river and France controlled the land all around it.", "The Gambia is the smallest country on mainland Africa, and its capital, Banjul, sits right where the river meets the Atlantic.", "In 1982, Gambia and Senegal even tried joining together as one country called Senegambia, but it fell apart in 1989.", "A country shaped like a river is odd. Now imagine a piece of your country that you cannot reach by land.", "Number five: Nakhchivan, a part of Azerbaijan that has no land connection to the rest of Azerbaijan.", "It sits to the west, cut off from the main country by a strip of Armenia in between.", "Its land borders are with Armenia, Iran and Turkey. The one country it cannot touch by land is its own mainland.", "Azerbaijan runs it as an autonomous republic with its own parliament, which makes it a whole region sitting alone.", "Most people have reached it by plane, because the land route through Armenia was closed for decades.", "If you enjoy strange places like these, subscribe, because we find a new one every day.", "Stay with me. The next one is an oil-rich region sitting on the wrong side of another country.", "Number four: Cabinda, a piece of Angola that sits on the other side of a different country.", "Angola is in southern Africa, but Cabinda is up north, split away by a slice of the Democratic Republic of Congo.", "That slice is the DR Congo's only access to the Atlantic, where the huge Congo River reaches the sea.", "So the DR Congo gets a narrow door to the ocean, and that same door cuts Angola into two pieces.", "Cabinda has also been a major source of Angola's oil, which is why this odd shape matters so much.", "It became a Portuguese protectorate under a treaty in 1885, and it was handled separately from the rest of Angola.", "A group called FLEC has argued for decades that Cabinda should be its own country.", "Most travellers fly between the two, because going by road means crossing into DR Congo and back out.", "Cut-off pieces are strange. But the next piece sits on an island that belongs mostly to someone else.", "Number three: Oecusse, a piece of East Timor that sits on the island of Timor, inside Indonesian land.", "East Timor's main part is far to the east, but Oecusse sits on the north coast of the western half.", "Indonesian West Timor wraps around it on the land sides, so there is no land link to the rest of East Timor.", "To drive from Dili to Oecusse, you leave East Timor, cross a stretch of Indonesia, then enter East Timor again.", "There is also a ferry along the coast, so travellers can stay in East Timor's waters the whole way.", "The Portuguese built an early capital at Lifau, in Oecusse, so this land has a longer history than the country itself.", "East Timor became independent in 2002, and Oecusse stayed part of it, even though Indonesia surrounds it on land.", "Now we're coming home, because the last two borders are both in India's state of West Bengal.", "And number two is a village where the land around you is India, but the village itself is not.", "Number two: Dahagram and Angarpota, two Bangladeshi villages that sit inside the Indian state of West Bengal.", "In 2015, India and Bangladesh swapped 162 small enclaves, so that people could finally belong to the country around them.", "Dahagram and Angarpota were not part of that swap. They stayed Bangladeshi, linked to Bangladesh by one special strip.", "Under the old treaty the area is about eighteen square kilometres, and by some estimates around twenty thousand people live there.", "On almost every side there is only Indian land. Walk out of almost any side and you step onto Indian soil.", "For decades, reaching the rest of Bangladesh meant crossing Indian land, with no agreed right to do so.", "The fix was a deal, and the deal is a tiny strip of India. That strip is number one.", "Number one: the Tin Bigha Corridor, the strangest border in India, and it is smaller than you'd think.", "The treaty puts it at about 178 metres by 85 metres, a distance you could walk in a few minutes.", "India leased this strip to Bangladesh, so Bangladeshi citizens can pass through it to reach Dahagram and Angarpota.", "Think about that. The ground is Indian, but the people crossing it are Bangladeshi, heading to Bangladeshi villages.", "Its name uses bigha, an old land measure used across India, and tin simply means three.", "A gate controls the corridor, and guards check everyone who goes through, as they would at any border.", "In the early years, that gate opened for only a short time each day, so villagers lived by the clock.", "Imagine running to beat a gate that closes, just to reach your own village in your own country.", "Today the corridor stays open day and night, but people still need permission to cross it.", "For the people of Dahagram, this strip is the road to the rest of their own country.", "India still owns the strip, and Bangladesh has the right to use it. That is a very unusual arrangement anywhere in the world.", "One small rectangle of land shows how far a border can bend to fit the lives of real people.", "So that was the full countdown: Brunei, The Gambia, Nakhchivan, Cabinda, Oecusse, Dahagram and Angarpota, and the Tin Bigha Corridor.", "Each one is real and on your map. Most began when someone drew a line without thinking of the people living there.", "Which brings us back to the start: your drive across Brunei really did cross Malaysia twice, with passport stamps both ways.", "And the strangest border of all is not far away. It is a gate on Indian soil, built for another country's villagers.", "Next video: the Indian neighbour whose clocks run fifteen minutes ahead of ours."], "job": ""}, {"date": "2026-12-15", "kind": "Short", "category": "geography", "title": "Your Hike Ends on a Flat Mountaintop in Clouds", "hook": "Your hike ends on a flat mountaintop.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Mount Roraima in South America is a flat-topped tepui with cliffs on every side, about 2,800 m high. Clouds often sit on top, and Venezuela, Brazil and Guyana meet there. Series: Places That Shouldn't Exist.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your hike ends on a flat mountaintop.", "This is Mount Roraima in South America.", "Sheer cliffs surround it on every side.", "The top is about 2,800 metres high.", "Clouds often sit right on top.", "Three countries meet up there: Venezuela, Brazil, Guyana.", "It inspired the dinosaur novel The Lost World.", "So a flat mountain above clouds is real.", "Tomorrow: a fortress on a rock."], "job": ""}, {"date": "2026-12-15", "kind": "Short", "category": "geography", "title": "Your Climb Ends at a Fortress on a Rock", "hook": "Your climb ends at a fortress on a rock.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Sigiriya in Sri Lanka is a rock about 200 m high with the ruins of a fortress palace on top. It dates to the fifth century and is a UNESCO World Heritage Site. Series: Places That Shouldn't Exist.\n\n#Shorts #SriLanka #PlacesThatShouldntExist", "script": ["Your climb ends at a fortress on a rock.", "This is Sigiriya in Sri Lanka.", "The rock rises about 200 metres.", "A king built his palace on top.", "That was in the fifth century.", "Halfway up, giant lion paws guard the path.", "Old paintings of women still cover the wall.", "A whole fortress sits on one rock.", "Tomorrow: your Moon is shrinking."], "job": ""}, {"date": "2026-12-15", "kind": "Short", "category": "space", "title": "Your Moon Is Shrinking and Wrinkling", "hook": "Your Moon is shrinking and wrinkling.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "NASA's Lunar Reconnaissance Orbiter photographed cliffs on the Moon called lobate scarps. They formed as the Moon's interior slowly cooled and contracted. Series: If You Were in Space.\n\n#Shorts #Moon #NASA", "script": ["Your Moon is shrinking and wrinkling.", "NASA's orbiter photographed cliffs across its surface.", "They are called lobate scarps.", "The Moon's inside is slowly cooling.", "As it cools, it contracts.", "The crust wrinkles like a drying grape.", "It has shrunk about 50 metres.", "Some of those cliffs may still shake.", "So yes, your Moon is wrinkling.", "Tomorrow: a storm bigger than Earth."], "job": ""}, {"date": "2026-12-15", "kind": "Short", "category": "space", "title": "Your Earth Is Narrower Than Jupiter's Storm", "hook": "Your Earth is narrower than this storm.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Jupiter's Great Red Spot is about 16,000 km wide, while Earth is 12,742 km across. Images that put Earth beside the storm show the difference clearly. Series: Space Sizes.\n\n#Shorts #Jupiter #Space", "script": ["Your Earth is narrower than this storm.", "It is Jupiter's Great Red Spot.", "The storm is about 16,000 kilometres wide.", "Earth is only 12,742 kilometres across.", "Images show Earth placed beside it.", "Earth looks small next to it.", "Telescopes have watched this storm for well over a century.", "Winds inside it blow faster than hurricanes.", "Remember, your Earth is narrower than it.", "Tomorrow: more places that shouldn't exist."], "job": ""}, {"date": "2026-12-15", "kind": "Short", "category": "technology", "title": "Your Old CD Turns One Laser Into Dots", "hook": "Your old CD can turn one laser into a wall of dots.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Point a laser pointer at the shiny side of an old CD and a pattern of dots appears on the wall. The disc's tracks are about 1.6 micrometres apart, so they split the light. Never point a laser at anyone's eyes, and don't look into the reflection.\n\n#Shorts #Science #Tech", "script": ["Your old CD can turn one laser into dots.", "Point a laser pointer at its shiny side.", "Now look at the wall behind it.", "A pattern of bright dots appears.", "The disc's tiny tracks split the light.", "Those tracks sit about 1.6 micrometres apart.", "That is far thinner than a human hair.", "One laser, one old disc, a wall of dots.", "Next: dolphins swimming in an Odisha lake."], "job": ""}, {"date": "2026-12-16", "kind": "Long video", "category": "geography", "title": "7 Maps That Look Fake But Are Real", "hook": "Your old drive across Brunei meant crossing Malaysia twice, with passport stamps, just to reach your own country.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Brunei is cut in two by Malaysia, The Gambia is a ribbon inside Senegal, and Bangladeshi villages sit inside India behind a gate. This countdown shows seven real, odd-shaped places on simple animated maps, ending with India's Tin Bigha Corridor. Every fact is true, and the strangest one is on India's own border.\n\n#geography #borders #facts", "script": ["Your old drive across Brunei meant crossing Malaysia twice, with passport stamps, just to reach your own country.", "Today, seven places where a country is cut off from its own land. Every single one is real.", "By the end, you will see a small strip of India with a gate, built for another country's citizens.", "Each stop comes with a simple map, so you can see the odd shape yourself.", "So we start at number seven, and count down to the strangest border in all of India.", "Number seven. Brunei, a small oil-rich country on the island of Borneo, is cut into two separate pieces.", "Look at the map. The big western part holds the capital, Bandar Seri Begawan, and a smaller eastern part called Temburong floats alone.", "Between them sits Limbang, a district of Malaysia's state of Sarawak. It cuts Brunei neatly in two.", "Sarawak's ruler annexed Limbang in 1890, so this split on the map is more than a century old.", "Brunei also claimed Limbang for a long time, though in 2009 the two countries settled the matter.", "Temburong is mostly green rainforest, with a national park inside it, far from the busy capital.", "For years, driving between the two halves meant leaving Brunei, entering Malaysia, then crossing back into Brunei.", "Then you did it all again on the way home. Four immigration checkpoints on that road, with passport stamps.", "In 2020, Brunei opened a bridge about thirty kilometres long, the longest in Southeast Asia, to skip Malaysia completely.", "Brunei is rich from oil and gas, which is why it can afford the kind of bridge most countries only dream about.", "So the bridge exists because of the split. A country built a giant bridge just to avoid crossing a neighbour.", "Number six. Picture a country shaped like a finger poked deep into another country. That is The Gambia.", "It is a thin strip of land, only about twenty-five to fifty kilometres wide, running along a river.", "Senegal surrounds it on every side except the sea. Walk out from the river in any direction, and you reach Senegal.", "Its capital, Banjul, sits where the Gambia River meets the Atlantic Ocean, at the very edge of the strip.", "Take the ferry across the river at Banjul and you are still in The Gambia, with Senegal close on both sides.", "The country follows the river for hundreds of kilometres inland, and nowhere is it very wide.", "It is the smallest country on mainland Africa, yet it has its own flag, its own money and its own government.", "The shape comes from colonial history, when Britain held the river and France held the land all around it.", "So the border follows a river, not people, and the result is a country that looks like a ribbon.", "Next, a piece of land that touches three countries, but not the one it belongs to.", "Number five. Nakhchivan belongs to Azerbaijan, but you cannot drive there from the rest of Azerbaijan.", "Armenia sits right in the way. That makes Nakhchivan an exclave: a piece of a country sitting alone.", "It touches Armenia, Iran and Turkey, but not a single kilometre of the rest of Azerbaijan.", "On the map, it looks like a puzzle piece that fell off the main picture and landed somewhere else.", "The lines come from the early Soviet years, when borders were drawn inside one big country.", "When the Soviet Union broke up in 1991, those inside lines became real international borders, and Nakhchivan was stuck.", "It has its own parliament inside Azerbaijan. But travellers have often had to fly, or take a detour through Iran.", "Next is in Africa: an oil-rich region cut off from its own country by a thin strip of land.", "Number four. Cabinda is part of Angola, but a strip of DR Congo separates it from the rest of Angola.", "That strip runs along the mouth of the Congo River, and it gives DR Congo a small bit of Atlantic coast.", "So Angola is split on the map, with Cabinda in the north and the main country far below.", "Ca
