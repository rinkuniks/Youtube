binda is rich in oil, and a big share of Angola's oil has come from the waters off its coast.", "Its status comes from a colonial past, when Portugal ruled Cabinda as a separate territory from the rest of Angola.", "Cabinda also has a separatist movement that has existed for decades, so its odd shape matches a political struggle.", "To go by road from Cabinda to the rest of Angola, you must pass through DR Congo and cross borders.", "So you leave Angola, enter another country, and come back, just to travel inside your own.", "If you enjoy strange places and facts that sound fake but are true, do subscribe. There is more on the way.", "We are past halfway, and the next three get stranger. One of them is on India's own border.", "Number three. On the island of Timor, Oecusse belongs to East Timor, but sits inside Indonesian West Timor.", "East Timor, also called Timor-Leste, is a small country that holds the eastern half of the island.", "Oecusse is a pocket on the northern coast, with Indonesia on its land sides and sea on the other.", "To reach it from the East Timor capital, Dili, you either cross Indonesia, or take a boat or a plane.", "On the ground, a gate and guards mark where East Timor ends and Indonesia begins.", "Portugal landed here centuries ago, and Lifau, in Oecusse, became the first Portuguese capital on the island of Timor.", "So this pocket is a leftover of old colonial claims, still sitting on today's map.", "Imagine a small piece of Goa sitting inside Tamil Nadu, but still belonging to Goa. That is the idea.", "Today, Oecusse is a special region with its own rules, meant to attract investment.", "Now the last two are in India itself. And the final one has a gate with a timetable.", "Number two. Dahagram and Angarpota are villages that belong to Bangladesh, but sit inside India.", "They lie in West Bengal, near Cooch Behar, with Indian land on every side. That makes them an enclave.", "An enclave is a piece of one country completely surrounded by another country.", "For decades, this border was a puzzle of Indian and Bangladeshi villages mixed together like pieces of two different jigsaws.", "In 2015, India and Bangladesh swapped most of those enclaves, and thousands of people chose which country to live in.", "But Dahagram and Angarpota stayed Bangladeshi, because they already had a link back to the rest of Bangladesh.", "The people there are Bangladeshi citizens, but every road around their homes leads into India.", "Just across the corridor lies Patgram, in Bangladesh's Lalmonirhat district, their nearest piece of mainland Bangladesh.", "So how do they get to their own country? Through a small gift of land from India.", "That gift of land is number one, and it is the strangest border in India.", "Number one. The Tin Bigha Corridor, a small strip of Indian land leased to Bangladesh.", "It measures about 178 metres by 85 metres, shorter than two football pitches laid end to end.", "India leased it in perpetuity, under a 1974 agreement, so Bangladeshis can reach Dahagram and Angarpota.", "The land is still India's. But the people walking across it are Bangladeshi citizens, going home.", "Even with an agreement in 1974, the corridor only opened on the twenty-sixth of June, 1992.", "And there is a gate. For years, guards opened it only at set times, around an hour at a time.", "Miss your slot, and you waited at the gate until the next opening. Imagine a road with a timetable.", "Each time the gate opens, people from Dahagram walk through Indian land to Bangladesh, and walk back again.", "In 2011, the two countries agreed to keep it open round the clock, which made life easier for the villagers.", "Even now, it is a strip of Indian soil, with a gate and border guards, used by citizens of another country.", "A door, a gate and a lane, built in the middle of India so strangers can walk home.", "Now go back to the hook. Crossing Malaysia twice, with passport stamps, just to reach your own country in Brunei.", "Seven maps, seven odd shapes, and every one of them is true. The map in your head is never the full story.", "Next time you look at a map, remember: some lines go around corners, through villages, and even through a gate.", "Next video: another place on the map that should not exist. Come and see it."], "job": ""}, {"date": "2026-12-16", "kind": "Short", "category": "geography", "title": "Dolphins Live In This Odisha Lake", "hook": "Your boat ride in Odisha can find wild dolphins in a lake.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Chilika Lake in Odisha is India's largest coastal lagoon. Its brackish water mixes river and sea, and Irrawaddy dolphins live there. Boat trips from places like Satapada are popular for spotting them.\n\n#Shorts #Odisha #Geography", "script": ["Your boat ride in Odisha can find wild dolphins.", "This is Chilika Lake, beside the Bay of Bengal.", "It is India's largest coastal lagoon.", "The water is brackish, part river, part sea.", "Irrawaddy dolphins live right inside it.", "Boat trips from Satapada go looking for them.", "Sea water and river water share one lake.", "Yes, wild dolphins swim in an Odisha lake.", "Next: a bay with 1,600 stone islands."], "job": ""}, {"date": "2026-12-16", "kind": "Short", "category": "geography", "title": "Vietnam's Bay Of 1,600 Stone Towers", "hook": "Your cruise in Vietnam sails between 1,600 stone towers.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Ha Long Bay in Vietnam holds about 1,600 limestone islands and islets rising straight out of the sea. Many are covered in green forest above emerald water. It is a UNESCO World Heritage Site.\n\n#Shorts #Vietnam #Geography", "script": ["Your cruise in Vietnam sails between stone towers.", "This is Ha Long Bay.", "About 1,600 limestone islands rise from the water.", "Many are wrapped in thick green forest.", "The water around them looks emerald green.", "Boats glide right between the rock walls.", "It is a UNESCO World Heritage Site.", "Green towers standing in a green sea.", "Next: a country with two capitals."], "job": ""}, {"date": "2026-12-16", "kind": "Short", "category": "geography", "title": "Bolivia Has Two Capitals", "hook": "Your map of Bolivia shows two capitals.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Bolivia's constitutional capital is Sucre, and the courts sit there. La Paz is where the president and congress work. So both cities have a real claim to being the capital.\n\n#Shorts #Bolivia #Geography", "script": ["Your map of Bolivia shows two capitals.", "Sucre is the constitutional capital.", "The country's highest court sits there.", "But La Paz is where the government sits.", "The president and congress work in La Paz.", "Many people simply call La Paz the capital.", "Both claims are real and both are official.", "So yes, Bolivia has two capitals.", "Next: what happens if you cry in space."], "job": ""}, {"date": "2026-12-16", "kind": "Short", "category": "space", "title": "Your Tears Won't Fall In Space", "hook": "If you cried in space, your tears would not fall.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In microgravity there is nothing to pull tears down your face. They cling to the eye and gather into a wobbling liquid ball. Astronaut Chris Hadfield showed this on the International Space Station.\n\n#Shorts #Space #ISS", "script": ["If you cried in space, tears would not fall.", "With no gravity pulling down, they cling to your eyes.", "They gather into a wobbling liquid ball.", "The ball keeps growing as you keep crying.", "Astronaut Chris Hadfield showed this on the space station.", "The tears stay stuck until you wipe them off.", "In space, crying never really falls.", "Next: your camera sees through black plastic."], "job": ""}, {"date": "2026-12-16", "kind": "Short", "category": "technology", "title": "Your Camera Sees Through Black Plastic", "hook": "Your phone camera can see through some black plastic.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Cover an old-style filament bulb with a thin black plastic bag and film it. Near-infrared light passes through the plastic and your camera picks it up, so the bulb shows on screen. It works better on some phones than others, and the plastic must be thin.\n\n#Shorts #PhoneTricks #Tech", "script": ["Your phone camera can see through some black plastic.", "Switch on an old filament bulb.", "Cover it with a thin black plastic bag.", "To your eyes, the bulb nearly disappears.", "Now film it with your phone camera.", "The bulb shows up right through the bag.", "Near-infrared light passes through the plastic.", "You can't see it, but your camera can.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-10-22", "kind": "Long video", "category": "geography", "title": "The Island That Changes Country Every 6 Months", "hook": "Your calendar decides which country owns this tiny island.", "status": "Published", "seconds": 388.2, "publish_at": "2026-10-22 19:30", "uploaded": "2026-10-21 19:14", "url": "https://youtube.com/shorts/Cfsvom1xfPM", "description": "A tiny island on the Bidasoa river is Spanish for six months and French for the other six. It is number two in our countdown of six real borders that make no sense, and number one is in India. Watch to the end to see the border where a village sat inside a village inside a village.\n\n#borders #geography #facts\n\nChapters:\n0:00 Intro\n0:34 6: Point Roberts\n1:37 5: Büsingen\n2:33 4: Gibraltar's runway road\n3:37 3: Llívia\n4:38 2: Pheasant Island\n6:04 1: India's village in a village", "script": ["Your calendar decides who owns a tiny island in Europe. For six months it is Spanish, then it quietly turns French.", "That is real, and it has worked this way for more than 360 years.", "But that island is only number two on today's list of borders that make no sense.", "Number one is in India, and it is a place inside a place inside a place inside another place.", "Stay to the end and you will see a village that sat inside a village, inside a village, inside another country.", "We count down from six. Every border is stranger than the one before it. Let's start with a town you can only reach through Canada.", "Number six. Imagine a piece of America that you cannot drive to from the rest of America.", "It is called Point Roberts, a small town hanging off the coast just south of Vancouver.", "In 1846 the United States and Britain agreed that the border would follow the forty-ninth parallel, a straight line on the map.", "A straight line does not care about coastlines. It sliced the tip of this peninsula off, and left it on the American side.", "So if you live there and want to drive to any other American town, you must first drive through Canada.", "That means a passport check going out, and another passport check coming back, just to reach your own country.", "It is a bit odd, but it is not even close to the strangest one. Next is a village that uses two currencies.", "Number five is Büsingen, a German village that sits entirely inside Switzerland.", "Look at the map and you see the Swiss border wrapping around it on almost every side, with the Rhine river nearby.", "The people there are German citizens, and they follow German law, but shops and businesses also use Swiss francs.", "It sits inside the Swiss customs area, so goods move easily one way and the paperwork gets complicated the other way.", "Imagine paying your phone bill in euros and your grocery bill in francs, in the same street.", "Now let's go somewhere where the border is in the middle of a road, and a plane can close it.", "Number four. Your car has to stop at a red light for airplanes at Gibraltar.", "Gibraltar is a small British territory at the southern tip of Spain, with a huge rock on the map.", "There is almost no flat land there, so the airport runway was built straight across the main road.", "When a plane is about to land or take off, barriers come down, and every car, bike and walker waits.", "Then the plane passes right in front of you, and the road opens again like nothing happened.", "And to reach this road from Spain, you cross a border on foot or by car, right next to the runway.", "Few places in the world make you cross a border and a runway on the same short walk.", "If you enjoy strange places like these, subscribe, because tomorrow's video has another set of places that sound fake but are true.", "Now stay with me, because the next one has a Spanish town sitting deep inside France.", "Number three is Llívia, a Spanish town that is completely surrounded by French land.", "It sits in the Pyrenees mountains, and if you leave town in any direction, you are in France within minutes.", "To drive to the rest of Spain, you follow a road through French territory, and then you reach Spanish land again.", "The reason goes back to 1659, when Spain and France signed the Treaty of the Pyrenees.", "France was given a list of villages, but Llívia was a town, not a village, so it stayed with Spain.", "A single word in an old treaty is why a Spanish town still sits inside France today.", "Keep that treaty in mind, because the very same agreement is behind the island at number two.", "Number two. The Bidasoa river runs between Spain and France and flows out to the sea.", "In the middle of that river there is a small island, about the size of a couple of football pitches.", "It is called Pheasant Island in English, Île des Faisans in French, and Isla de los Faisanes in Spanish.", "Nobody lives there. It is mostly grass and trees, with a monument, and the public is not allowed to visit.", "From the first of February to the end of July, the island belongs to Spain.", "From the first of August to the end of January, the same island belongs to France.", "No one packs a bag or moves a single soldier. On the stroke of the date, ownership simply passes over.", "In practice, the naval commanders of two nearby ports, one Spanish and one French, take charge in turn.", "So why does this island exist as a shared border at all? Because of a royal wedding.", "After the war between Spain and France, the two kings met on this island in 1659 to settle the peace.", "The peace was sealed with a marriage between Louis the Fourteenth of France and Maria Theresa, a Spanish princess.", "The island was neutral ground for the talks, and over time, it became shared ground that nobody wanted to give up.", "Today that old arrangement still stands, and it is one of the oldest border deals in Europe that is still in use.", "So the next time you check a calendar, remember that on this island, the date decides the country.", "Now for number one. It is in India, and it makes even this island look simple.", "In West Bengal, near Cooch Behar, there were tiny pockets of land that belonged to the wrong country.", "Some were Indian villages sitting inside Bangladesh, and some were Bangladeshi villages sitting inside India.", "Old agreements between local rulers had mixed up the land, and the mix stayed on the map for decades.", "A person might have to cross a foreign country just to reach their own nearest market, school or hospital.", "Then it got stranger. Some enclaves held smaller enclaves, and one of them held another one inside it.", "There was an Indian patch inside a Bangladeshi patch, inside an Indian patch, inside Bangladesh.", "It was called Dahala Khagrabari, and it was the only place on Earth with that many layers of country inside country.", "Picture standing in a field there. Step in one direction and you cross a border, step again and you cross another.", "People in these enclaves often had trouble getting proper papers, schools, electricity or even simple medical help.", "They were officially citizens of one country, but stuck on land surrounded by another, and cut off from both.", "In 2015, India and Bangladesh finally signed a deal to swap these enclaves and end the confusion.", "At midnight on the thirty-first of July, 2015, the old enclaves were handed over, and the map was finally tidied up.", "In total, 162 enclaves changed hands, and residents were allowed to choose which country they wanted to live in.", "People celebrated with flags and sweets, because many of them were getting their country's address for the first time.", "So the strangest border on this list was the one where a village sat inside a village inside a village.", "And the best part is that it happened in our own backyard, in West Bengal, not on some faraway island.", "Today it is history, but for decades you could stand on a map that looked like a puzzle gone wrong.", "Remember where we started: a tiny island that changes country every six months, just because a calendar says so.", "Your calendar really does decide who owns Pheasant Island. Tomorrow: a country that has no border at its own front door."], "job": "20261021-185209-long-strange-borders-countdown-pheasant-islan"}, {"date": "2026-10-22", "kind": "Short", "category": "geography", "title": "Trees That Look Like Umbrellas and Bleed Red", "hook": "Your idea of a tree breaks on Socotra, Yemen.", "status": "Published", "seconds": 22.6, "publish_at": "2026-10-22 09:00", "uploaded": "2026-10-21 19:15", "url": "https://youtube.com/shorts/18bLmsfh0sQ", "description": "Socotra is an island in the Arabian Sea that belongs to Yemen. Its dragon blood trees grow in an umbrella shape and ooze a deep red sap. It really looks like another planet.\n\n#Shorts #Geography #Socotra", "script": ["Your idea of a tree breaks on Socotra, Yemen.", "These trees are shaped like giant umbrellas.", "Cut the bark and red sap oozes out.", "It is called dragon blood for a reason.", "Socotra is an island in the Arabian Sea.", "It belongs to Yemen, not some alien planet.", "It is a UNESCO World Heritage Site.", "So your idea of a tree? Wrong here.", "Next: steps made of stone."], "job": "20261021-184803-dragon-blood-trees-of-socotra"}, {"date": "2026-10-22", "kind": "Short", "category": "geography", "title": "A Path Made of 40,000 Stone Columns", "hook": "Your steps here land on about 40,000 stone columns.", "status": "Published", "seconds": 21.5, "publish_at": "2026-10-22 16:00", "uploaded": "2026-10-21 19:15", "url": "https://youtube.com/shorts/u-jvpot2IdA", "description": "The Giant's Causeway in Northern Ireland is made of about 40,000 interlocking stone columns. Many of them are hexagons that fit together like tiles. It is a UNESCO World Heritage Site, and it is real.\n\n#Shorts #Geography #GiantsCausewayNorthernIreland", "script": ["Your steps here land on 40,000 stone columns.", "This is the Giant's Causeway, Northern Ireland.", "Most of the columns are hexagons.", "They lock together like perfect tiles.", "Nobody laid them down by hand.", "Cooling volcanic rock cracked into these shapes.", "It is a UNESCO World Heritage Site.", "So every step lands on a stone column.", "Next: lunch that floats."], "job": "20261021-185012-giant-s-causeway-basalt-columns"}, {"date": "2026-10-22", "kind": "Short", "category": "space", "title": "Astronauts Can't Eat Bread in Space", "hook": "Your sandwich in space would be a tortilla.", "status": "Uploaded, scheduled", "seconds": 19.9, "publish_at": "2026-10-23 22:00", "uploaded": "2026-10-22 22:30", "url": "https://youtube.com/shorts/b2aWIrmrdtw", "description": "Bread makes crumbs, and crumbs float in space. They can drift into equipment and even into eyes. That is why ISS crews eat tortillas instead.\n\n#Shorts #Space #ISS", "script": ["Your sandwich in space would be a tortilla.", "Bread is a problem up there.", "Bread makes crumbs, and crumbs don't fall.", "They float and drift everywhere.", "Crumbs can get into equipment.", "They can even float into eyes.", "So ISS crews eat tortillas instead.", "Your space sandwich? A tortilla wrap.", "Next: flowers that bloomed in orbit."], "job": "20261022-210010-tortillas-instead-of-bread-on-the-iss"}, {"date": "2026-10-22", "kind": "Short", "category": "space", "title": "A Flower Bloomed on the Space Station", "hook": "Your zinnia flowers once bloomed in space.", "status": "Uploaded, scheduled", "seconds": 23.4, "publish_at": "2026-10-23 13:00", "uploaded": "2026-10-22 22:30", "url": "https://youtube.com/shorts/y3FkyHzIS0M", "description": "In 2016, zinnia flowers bloomed on the ISS. They were grown in a plant chamber, and astronaut Scott Kelly shared the photos. The orange flower in the pictures is real.\n\n#Shorts #Space #ISS", "script": ["Your zinnia flowers once bloomed in space.", "This happened on the space station in 2016.", "They grew inside a small plant chamber.", "No soil from Earth, no normal gravity.", "Astronaut Scott Kelly shared the photos.", "That bright orange flower is real.", "It bloomed hundreds of kilometres above Earth.", "So yes, your zinnia flowers bloomed in space.", "Tomorrow: another place that looks fake."], "job": "20261022-210601-zinnia-flowers-bloomed-on-the-iss"}, {"date": "2026-10-22", "kind": "Short", "category": "technology", "title": "Your Selfie Preview Is Backwards", "hook": "Your selfie preview shows your face backwards.", "status": "Created, waiting upload", "seconds": 22.8, "publish_at": "", "uploaded": "", "url": "", "description": "Hold a shirt with words on it up to your front camera. The preview shows the text reversed, and the saved photo shows it normally. Try it on any phone. Part of the Phone Tests series.\n\n#Shorts #PhoneTricks #TechFacts", "script": ["Your selfie preview shows your face backwards.", "Hold up a shirt with words.", "The preview shows them reversed.", "Tap the shutter and look again.", "The saved photo flips them back to normal.", "Your phone mirrors the preview on purpose.", "That way it feels like a mirror.", "But the photo shows how others see you.", "So your preview is never your real face.", "Next: a mountain painted by minerals."], "job": "20261022-211006-selfie-camera-mirror-flip"}, {"date": "2026-10-21", "kind": "Long video", "category": "geography", "title": "The Town Where Your Front Door Picks Your Country", "hook": "Your neighbour lives in Belgium, you live in the Netherlands, and you share one street.", "status": "Published", "seconds": 401.4, "publish_at": "2026-10-20 19:30", "uploaded": "2026-10-20 17:19", "url": "https://youtube.com/shorts/ZEocuhE-Ka4", "description": "In Baarle, a small town on the Belgium-Netherlands border, white crosses on the pavement mark a border that runs through streets, shops and houses. See seven true facts: the front door rule, two town halls, a Dutch patch inside a Belgian patch, and why it all happened. We also compare it with the 2015 India-Bangladesh enclave swap.\n\n#Baarle #Borders #Geography\n\nChapters:\n0:00 Intro\n0:32 The White Crosses\n1:22 The Front Door Rule\n2:10 Two of Everything\n3:04 The Bar With a Border\n3:56 Land Inside Land\n4:52 How It Happened\n5:47 India Had One Too", "script": ["Your neighbour lives in Belgium, you live in the Netherlands, and you share one street.", "This is a real town, and a small white cross on the pavement is the only sign of the border.", "Today you will see seven strange things about Baarle, a place where two countries are mixed like spilled puzzle pieces.", "By the end, you will see a Dutch piece of land sitting inside a Belgian piece, inside the Netherlands.", "That sounds fake. It is not. Let us start with the crosses.", "Stay till the last part, because the reason this happened goes back many centuries.", "And one rule about front doors will change how you think about a home.", "Number one: the white crosses. Walk down the main shopping street in Baarle and look at the ground.", "Small white crosses are set into the pavement, and each one marks the border between Belgium and the Netherlands.", "Your left foot can be in one country, and your right foot can be in another.", "There is no wall here, no gate, no guard, and nobody checks your passport.", "Shops, cafes and homes sit right on those lines, so a single street holds two countries.", "The Belgian side is called Baarle-Hertog. The Dutch side is called Baarle-Nassau.", "Both speak Dutch, both use the euro, and people cross the line many times a day without noticing.", "Tourists stand on the crosses and take photos with one foot on each side.", "Find a cross, stand on it, and you are standing on the edge of two governments.", "But a cross is only a marker. The real rule is hidden in something much more ordinary.", "That rule is about your front door, and it is next.", "Number two: the front door rule. Here, your front door decides which country your house belongs to.", "Say a border line cuts across your garden, your kitchen and your bedroom. It does not matter.", "Whichever country the front door stands in, that is the country the whole house counts as.", "So a house can have its bedroom in one country, and still be fully Belgian or fully Dutch.", "This rule is used so that families are not split into two countries inside one living room.", "Imagine being told your sofa is Dutch but your television is Belgian. The door rule stops that.", "It also means a door is a big deal. Where it stands decides your address and which town hall you deal with.", "Some houses are cut by the line, and the owners have lived with it for years.", "If you think that is odd, wait, because the line goes through a lot more than houses.", "It goes through places where people eat, sleep and shop every day.", "Number three: two of everything. Baarle has two town halls, two mayors and two sets of local rules.", "One town hall serves the Belgian parts, and the other serves the Dutch parts.", "The same street can have houses with Belgian postcodes next to houses with Dutch postcodes.", "Each country numbers its houses its own way, so two neighbours can follow different numbering.", "Phone numbers can differ too. A Belgian landline starts with the Belgian code, and a Dutch one with the Dutch code.", "Each side has its own police and fire services, so two sets of officers can work on one street.", "Paperwork depends on where your door stands, even if your neighbour's door is five steps away.", "Now imagine living here and having to choose the right office for every small form.", "And if all this sounds like too much admin, the next one is where it gets funny.", "Number four is about a beer, a toilet and a very confused rule book.", "Number four: the bar with a border. In some places here, the line cuts straight through a building.", "In one famous case, a bar is said to have its beer in one country and its toilet in the other.", "So you can order a drink in one country and walk to another country to wash your hands.", "If you enjoy strange places like this, this is a good moment to subscribe, because we find a new one every day.", "Shops are the same. A shop door decides if the shop is Belgian or Dutch.", "That can matter for rules such as opening hours, because each country can set its own.", "Locals know which side to use for which task, and they treat it as normal everyday life.", "Visitors stare at the pavement and the crosses. Locals just walk to the bakery.", "It is a bit like living in a map game, except people really do pay rent here.", "Still, all of that is nothing next to a Dutch piece of land hidden inside a Belgian piece.", "That is number five, and it is where the map really breaks.", "Number five: land inside land. Around Baarle, there are about twenty small Belgian pieces inside the Netherlands.", "Each piece is Belgian, but you cannot reach it without crossing Dutch ground first.", "These are called enclaves, which means a piece of one country completely surrounded by another.", "Now comes the twist. Some of those Belgian pieces have a small Dutch piece inside them.", "So you stand on Dutch land, inside Belgian land, inside the Netherlands. That is called a counter-enclave.", "It is a country sandwich: Dutch, then Belgian, then Dutch again.", "That small Dutch patch inside Belgium makes this one of the most tangled borders in Europe.", "Walk across it and you might change country several times in a few minutes.", "Maps of Baarle look like someone spilled paint across the border.", "Yes, that sounds like a bad video game level. It is a real place with real shops.", "So how did anyone let a border get this messy? The answer starts in the Middle Ages.", "Number six is the history, and it is shorter than you would think.", "Number six: how it happened. Centuries ago, local lords and the Duke of Brabant swapped and shared land around this area.", "Those deals were made by owners of fields and farms, not by map makers.", "Later, Belgium and the Netherlands split into two countries, and they had to draw a new border.", "In 1843 they signed the Treaty of Maastricht to fix the line, and they could not agree here.", "So they did something unusual. They gave a nationality to each piece of land, one by one.", "That means more than five thousand small parcels, each one counted on its own.", "Over time those parcels joined together into the odd shapes you see on the map today.", "Nobody planned a puzzle. It is just what happens when old land deals meet new countries.", "Even the names tell the story: Hertog means duke, and Nassau is a famous Dutch royal house.", "And once the border was set, nobody wanted to move house, so the pattern stayed.", "Number seven shows that this kind of mess is not only European, and India knows it well.", "Number seven: India had a tangle like this too. For decades, India and Bangladesh had border enclaves.", "In 2015, the two countries swapped them. India handed over more than a hundred enclaves and received about fifty.", "People who lived there had often struggled to reach their own country's schools and clinics.", "Baarle has not gone through that. Its odd border still stands, and people choose to live with it.", "Today it is a tourist spot as much as a town, and visitors come just to see the crosses.", "So here is the payoff: the border is real, the crosses are real, and your front door is the judge.", "To recap: crosses on the pavement, a door rule, two of everything, and a bar with a border.", "Then land inside land, a messy history from the Middle Ages, and an Indian echo of the same idea.", "Remember where we began? Your neighbour lives in Belgium, you live in the Netherlands, and you share one street.", "Now you know it is true, and the pavement has the white crosses to prove it.", "Tomorrow: a country with a famous border and almost nothing to mark it. See you there."], "job": "20261020-164035-long-baarle-hertog-and-baarle-nassau-why-this"}, {"date": "2026-10-21", "kind": "Short", "category": "geography", "title": "This Bubblegum Pink Lake Is Real", "hook": "Your eyes would swear this lake is edited.", "status": "Published", "seconds": 23.0, "publish_at": "2026-10-21 22:00", "uploaded": "2026-10-20 17:20", "url": "https://youtube.com/shorts/foE44TcvSFs", "description": "Lake Hillier in Western Australia looks bubblegum pink from above. Salt-loving microbes in the water are the likely cause. A narrow strip of land separates it from the blue ocean.\n\n#Shorts #geography #LakeHillier", "script": ["Your eyes would swear this lake is edited.", "This is Lake Hillier, in Western Australia.", "The water is bubblegum pink.", "From the air, it glows bright pink.", "Salt-loving microbes give it the colour.", "A narrow strip of land separates it from the ocean.", "The ocean beside it stays deep blue.", "No filter. This pink lake is real.", "Tomorrow: a desert pit that burns all night."], "job": "20261020-163759-lake-hillier-pink-lake"}, {"date": "2026-10-21", "kind": "Short", "category": "geography", "title": "A Desert Pit That Burns All Night", "hook": "Your night view here is a giant pit of fire.", "status": "Published", "seconds": 22.0, "publish_at": "2026-10-21 22:00", "uploaded": "2026-10-21 19:14", "url": "https://youtube.com/shorts/Bi4ZqO8P0wE", "description": "The Darvaza gas crater in Turkmenistan is a pit of fire in the desert. Locals call it the Door to Hell. It is reportedly burning since 1971, though authorities have tried to reduce the flames in recent years.\n\n#Shorts #geography #Turkmenistan", "script": ["Your night view here is a pit of fire.", "This is the Darvaza gas crater, Turkmenistan.", "It is a hole in the desert, burning.", "Locals call it the Door to Hell.", "Natural gas keeps feeding the flames.", "It was reportedly lit back in 1971.", "That is more than fifty years of fire.", "A pit of fire, in the middle of a desert.", "Tomorrow: acid pools on a hot salt desert."], "job": "20261021-003838-darvaza-gas-crater"}, {"date": "2026-10-21", "kind": "Short", "category": "geography", "title": "Ethiopia's Acid Pools Look Like Mars", "hook": "Your photo here would look like another planet.", "status": "Published", "seconds": 22.0, "publish_at": "2026-10-22 13:00", "uploaded": "2026-10-21 19:15", "url": "https://youtube.com/shorts/zLc9J_xMH7Y", "description": "The Danakil Depression in Ethiopia has yellow, green and red acid pools on a hot salt desert. The colours come from minerals and sulfur. Parts of it lie below sea level and it is one of the hottest places on Earth.\n\n#Shorts #geography #Ethiopia", "script": ["Your photo here would look like another planet.", "This is the Danakil Depression, in Ethiopia.", "Acid pools glow yellow, green and red.", "They sit on a hot salt desert.", "The colours come from minerals and sulfur.", "Parts of it lie below sea level.", "It is one of the hottest places on Earth.", "Another planet, but it is right here on Earth.", "Tomorrow: another place that should not exist."], "job": "20261021-004110-danakil-depression"}, {"date": "2026-10-21", "kind": "Short", "category": "space", "title": "Your Space Toilet Straps You Down", "hook": "Your toilet in space would strap you down.", "status": "Published", "seconds": 19.5, "publish_at": "", "uploaded": "2026-10-21 20:50", "url": "https://youtube.com/shorts/8EEL9RdcYVw", "description": "Astronaut toilets on the ISS use moving air instead of gravity. Fans create suction, and thigh restraints keep the astronaut in place. Nothing falls on its own in orbit, so the airflow does the work.\n\n#Shorts #Space #ISS", "script": ["Your toilet in space would strap you down.", "Without that, you would float right off.", "Bars hold your thighs against the seat.", "There is no flush with water.", "Fans pull everything away with moving air.", "Nothing falls on its own up there.", "Suction does the job gravity can't.", "So yes, your toilet would hold you down.", "Next: the sandwich space forbids."], "job": "20261021-004327-space-toilet-suction-and-restraints"}, {"date": "2026-10-21", "kind": "Short", "category": "technology", "title": "One Water Drop Shows Your Phone's Pixels", "hook": "Your phone screen turns into red, green and blue dots.", "status": "Published", "seconds": 21.1, "publish_at": "2026-10-22 18:00", "uploaded": "2026-10-21 19:15", "url": "https://youtube.com/shorts/XdMoFG0aOrk", "description": "Put a tiny drop of water on your phone screen and look closely. The drop acts like a magnifying lens, so you can see the red, green and blue dots that build every picture. It works on any phone, and you can wipe it off after.\n\n#Shorts #Tech #PhoneTricks", "script": ["Your phone screen turns into red, green and blue dots.", "All you need is one drop of water.", "Open a white image on your screen.", "Place a tiny drop on the glass.", "The drop works like a magnifying glass.", "Look closely and the dots appear.", "Every picture you see is made of those.", "So your whole screen is just dots.", "Next: a tree that looks fake."], "job": "20261021-184509-water-drop-reveals-phone-pixels"}, {"date": "2026-10-20", "kind": "Long video", "category": "geography", "title": "Your Door in 2 Countries: 6 Borders, 1 in India", "hook": "Your front door can be in Belgium while your kitchen is in the Netherlands, and India has a border even stranger.", "status": "Published", "seconds": 437.6, "publish_at": "2026-10-20 19:30", "uploaded": "2026-10-20 17:21", "url": "https://youtube.com/shorts/75k4H-RHg5k", "description": "Six real borders that make no sense, from a house in Baarle where the front door decides the country, to the Indian enclaves in Bangladesh that vanished from the map at midnight in 2015. Each stop is a real place you can find on a map, and each one is stranger than the last. Watch to the end for India's strangest border, then tell us which one you would live on.\n\n#borders #geography #india\n\nChapters:\n0:00 Intro\n0:33 6: Büsingen, Germany in Switzerland\n1:32 5: Llívia, Spain in France\n2:28 4: Point Roberts, USA via Canada\n3:19 3: Campione, Italy in Switzerland\n4:04 2: Baarle, the door decides\n5:11 1: India's vanished enclaves", "script": ["Your front door can be in Belgium while your kitchen is in the Netherlands, and India has a border even stranger.", "Six real borders, each stranger than the last. At the end, a whole set of borders disappears at midnight.", "Every border here is real, and all but one still sit on the map today.", "We start small, with a village that is German on paper but surrounded by Swiss land on every side.", "And keep watching, because the last border on this list is the one that ended one of the strangest maps on Earth.", "These borders are not accidents. Each one exists because of an old treaty, a king, or a deal.", "Number six: Büsingen. Look at your map and you will find a German village wrapped completely inside Switzerland.", "It sits on the northern bank of the Rhine river, right next to the Swiss city of Schaffhausen.", "Everyone there lives under German law, yet the shops take Swiss francs and many locals work across the line in Switzerland.", "Cars from this village carry the letters BÜS on the number plate, a code you will not find anywhere else in Germany.", "Walk a few minutes in any direction and you leave Germany, but you never reach the rest of Germany.", "To get to another German town, you have to cross Swiss land first. The village is an island without any sea.", "The whole village sits inside the Swiss customs area, so trade rules there follow Switzerland, not Germany.", "In 1918, the villagers voted to join Switzerland. The deal never happened, and the village stayed German.", "Imagine paying for your chai in Swiss francs, in a village that officially belongs to Germany.", "So one street mixes a German address, Swiss money and Swiss customs rules. Strange, but still fairly calm.", "Number five exists because of one word in an old treaty. Meet Llívia, a Spanish town inside France.", "In 1659, Spain and France signed the Treaty of the Pyrenees. Spain gave a group of villages to France.", "But Llívia was officially a town, not a village. So the treaty's words did not cover it.", "That one word kept Llívia Spanish, while the new border was drawn all around it. It is still Spanish today.", "Look at the map and you see a small patch of Spain, sitting inside France, with no Spanish land touching it.", "A short road links Llívia to Spain. It crosses French land, but travellers are allowed to use it.", "Walk the streets and you see Spanish flags, Catalan signs and Spanish shops, with France waiting just outside town.", "Think about that: more than three hundred years ago, one word saved a town from changing countries, and it still matters today.", "Remember this idea of a place cut off from its own country. Number one is the biggest version of it.", "Number four: Point Roberts, an American town that you can only reach by land through Canada.", "In 1846, a treaty set the US-Canada border along the 49th parallel, a straight line of latitude across the map.", "That straight line cut through the tip of a small peninsula, and the southern tip landed on the American side.", "So Point Roberts is part of Washington state, but it hangs off the coast of Canada, with no road to America.", "To drive to the rest of the United States, you must enter Canada first, then cross into America again.", "The nearest big city is Vancouver, in Canada, not any city in the state it belongs to.", "Imagine a village that belongs to Kerala, but you can only reach it by driving through Tamil Nadu.", "If you enjoy strange places like these, subscribe to the channel. There is a lot more like this coming.", "Back to the map. A line drawn on paper in 1846 still decides how people on this peninsula live today.", "Number three: Campione d'Italia, an Italian town on the shore of a Swiss lake, hidden inside Switzerland.", "It sits on Lake Lugano, and Swiss land surrounds it on all sides except the lake.", "To drive from Campione to the rest of Italy, you have to pass through Switzerland.", "How did it happen? Centuries ago, the land belonged to a monastery in Milan, and it stayed Italian as Switzerland grew.", "Today, the town is part of the Swiss customs area, and people there pay in Swiss francs.", "It is an Italian town with Italian people, Swiss money and Swiss mountains rising right behind the houses.", "So you can eat Italian food, pay in Swiss money, and still be in Italy.", "So far, every border had a reason: a river, a word, a monastery. Now the line cuts through people's homes.", "Number two: Baarle. Two towns, Baarle-Hertog in Belgium and Baarle-Nassau in the Netherlands, tangled together like spaghetti.", "Walk down the street and you will see white crosses painted on the pavement. Each one marks the border.", "The line runs through streets, gardens and houses. Step over a cross and you change countries.", "Belgium owns little islands of land inside the Netherlands, and some of those islands hold Dutch islands inside them.", "That means a Dutch patch inside a Belgian patch inside Dutch land. Try drawing that on a map.", "It goes back centuries to land deals between local lords, long before Belgium and the Netherlands were countries.", "Some buildings have the border running right through them, with one room in Belgium and the next in the Netherlands.", "In 1995, the two countries agreed on a simple rule for houses: the front door decides which country the house belongs to.", "So a kitchen can cross the line, yet the whole house counts as the country of its front door.", "Many houses show a flag or number plate near the door, so visitors know which country they are in.", "Neighbours on the same street can follow different national rules, such as shop opening hours.", "Two towns, two sets of rules, and tourists take photos with one foot in each country.", "You would think nothing beats that. But number one is a set of borders that vanished at midnight on 31 July 2015.", "Number one: India's strangest border. For decades, India and Bangladesh held small islands of each other's land, deep inside their territory.", "They were called enclaves, or chhitmahals, and there were 162 of them in total.", "111 of them were Indian land inside Bangladesh, and 51 were Bangladeshi land inside India, mostly around Cooch Behar in West Bengal.", "Which side you lived on decided everything: your school, your vote and your hospital.", "Some were so small that a single field was foreign land. Step across its edge and you had left your country.", "Dahala Khagrabari was an Indian patch, inside a Bangladeshi patch, inside an Indian patch, inside Bangladesh.", "Draw it on paper and it looks like Russian nesting dolls, each country sitting inside the other.", "One legend says it began with a chess game between two kings, who bet villages on the board.", "Historians say the real cause was old land deals and treaties, and then Partition in 1947 froze the pieces in place.", "Imagine living there. Your own country's police, school and hospital are on the other side of a border you cannot legally cross.", "Reports say many people there had little access to roads, power, schools or health care.", "Then at midnight on 31 July 2015, India and Bangladesh swapped the enclaves under a historic land agreement.", "The 51 Bangladeshi pieces became Indian land, and the 111 Indian pieces became Bangladeshi land.", "Residents were allowed to choose their country. Some stayed where they were and changed nationality overnight, others moved.", "For thousands of people, that midnight finally gave them a country on their own doorstep.", "That is why India's strangest border is the one that no longer exists. Those 162 pieces are gone from the map.", "So here are all six: Büsingen, Llívia, Point Roberts, Campione, Baarle, and the Indian enclaves.", "And remember how this started: your front door can sit in Belgium while your kitchen is in the Netherlands. In Baarle, that is true.", "Tomorrow: time zones that make no sense, including a country that sets its clocks 15 minutes off from its neighbour."], "job": "20261020-164034-long-6-strange-borders-countdown-ending-on-in"}, {"date": "2026-10-20", "kind": "Short", "category": "geography", "title": "Drive On Earth's Lowest Dry Land", "hook": "Your car can drive on the lowest dry land on Earth.", "status": "Published", "seconds": 22.5, "publish_at": "2026-10-20 22:00", "uploaded": "2026-10-20 17:20", "url": "https://youtube.com/shorts/a09hfMrzCJk", "description": "The Dead Sea shore is the lowest dry land on Earth, more than 400 metres below sea level. The water is so salty that people float and read a newspaper on it. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your car can drive on the lowest dry land on Earth.", "It is the Dead Sea shore.", "It sits over 400 metres below sea level.", "The water is so salty that you cannot sink.", "People float and read a newspaper on it.", "No swimming needed, you just lie back.", "Fish cannot live in it, so it is called dead.", "So you drive on the lowest land, then float.", "Tomorrow: a place where the ground becomes sky."], "job": "20261020-163007-dead-sea-lowest-dry-land"}, {"date": "2026-10-20", "kind": "Short", "category": "geography", "title": "The Salt Flat That Turns Into A Mirror", "hook": "Your sky and ground become one at Salar de Uyuni in Bolivia.", "status": "Published", "seconds": 20.8, "publish_at": "2026-10-21 13:00", "uploaded": "2026-10-20 17:20", "url": "https://youtube.com/shorts/Zb9rvcfcE0I", "description": "Salar de Uyuni in Bolivia is the world's largest salt flat. After rain, a thin layer of water covers the salt and reflects the sky like a giant mirror. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your sky and ground become one in Bolivia.", "This is Salar de Uyuni.", "It is the largest salt flat in the world.", "Most days, it is flat white salt.", "Then rain covers it with a thin layer of water.", "The water reflects the sky like a giant mirror.", "You cannot tell where the ground stops.", "So here, you walk on the sky.", "Tomorrow: another place that should not exist."], "job": "20261020-163105-salar-de-uyuni-mirror"}, {"date": "2026-10-20", "kind": "Short", "category": "space", "title": "Your Face Puffs Up in Space", "hook": "Your face would puff up the moment you reach space.", "status": "Published", "seconds": 23.4, "publish_at": "2026-10-20 18:00", "uploaded": "2026-10-20 17:20", "url": "https://youtube.com/shorts/V5jH3l54DCE", "description": "In space, body fluids shift toward the head. The face swells while the legs get thinner, which astronauts joke about as chicken legs. Part of the If You Were in Space series.\n\n#Shorts #space #astronaut", "script": ["Your face would puff up in space.", "On Earth, gravity pulls your fluids downward.", "In space, those fluids drift toward your head.", "Astronauts get puffy cheeks and swollen eyes.", "Meanwhile, their legs actually get thinner.", "Astronauts joke about having chicken legs.", "It fades once they are back on Earth.", "So that is your puffy face, floating in space.", "Tomorrow: the workout astronauts cannot skip."], "job": "20261020-163254-puffy-face-in-space"}, {"date": "2026-10-20", "kind": "Short", "category": "space", "title": "Astronauts Get Strapped Into Their Gym", "hook": "Your gym session in space means being strapped to a treadmill.", "status": "Published", "seconds": 23.7, "publish_at": "2026-10-21 09:00", "uploaded": "2026-10-20 17:20", "url": "https://youtube.com/shorts/ZfmAP9Dsvfw", "description": "Astronauts on the ISS exercise about two hours a day. They run on a treadmill held down by a harness and lift using vacuum piston machines. Without it, their bones and muscles waste away.\n\n#Shorts #space #ISS", "script": ["Your gym session in space is strapped on.", "Astronauts run in a harness on a treadmill.", "Without it, they would just float away.", "They also lift using vacuum piston machines.", "Weights float, so the machine pushes back.", "About two hours of this, almost every day.", "Skip it, and bones and muscles waste away.", "Your workout, strapped down, hundreds of kilometres up.", "Tomorrow: a phone test with your ceiling fan."], "job": "20261020-163324-iss-daily-workout"}, {"date": "2026-10-20", "kind": "Short", "category": "technology", "title": "Your Phone Bends Spinning Fan Blades", "hook": "Your phone makes a spinning fan look bent.", "status": "Published", "seconds": 20.7, "publish_at": "2026-10-21 16:00", "uploaded": "2026-10-20 17:20", "url": "https://youtube.com/shorts/AftMvbAl-FQ", "description": "Film a ceiling fan with any phone and the blades look bent. The camera reads the picture line by line, called rolling shutter, so the fan moves between lines. The real blades are straight.\n\n#Shorts #phonetricks #tech", "script": ["Your phone makes a spinning fan look bent.", "Film your ceiling fan on high speed.", "The blades look warped and wobbly.", "But the real blades are perfectly straight.", "Your camera reads the picture line by line.", "This is called rolling shutter.", "The blade moves between each line.", "So try it now. Your fan is not bent.", "Tomorrow: a lake that looks edited, but is not."], "job": "20261020-163743-rolling-shutter-fan-test"}, {"date": "2026-10-19", "kind": "Long video", "category": "geography", "title": "Why India Is Stranger Than You Think", "hook": "Your sunrise in Arunachal comes long before Mumbai, yet both use the same clock.", "status": "Published", "seconds": 312.4, "publish_at": "2026-10-20 19:30", "uploaded": "2026-10-19 21:03", "url": "https://youtube.com/shorts/b0wt50SFMdM", "description": "India has one clock for a country so wide that the sun rises almost two hours earlier in the east. This video shows seven true facts: Assam's tea-garden time, Kanyakumari's two seas, rice farming below sea level in Kuttanad, living root bridges, a floating national park and a coal fire that has burned since 1916.\n\n#India #IndiaFacts #StrangePlaces\n\nChapters:\n0:00 Intro\n0:23 One clock, two different times\n1:31 Kanyakumari's sunrise and sunset\n2:10 Rice farms below sea level\n2:48 Bridges that are alive\n3:33 The floating national park\n4:14 The fire that never went out", "script": ["Your sunrise in Arunachal comes long before Mumbai, yet both use the same clock.", "That is the first of seven strange facts about India, and every single one is true.", "By the end, you will see ground that has been on fire for more than a hundred years.", "Then you will meet a bridge that is alive, and a national park that floats on water.", "Stay until the last one, because the strangest place is the one with smoke rising from the ground.", "First, look at how wide India is, from Gujarat in the west to Arunachal Pradesh in the far east.", "The whole country runs on one clock, Indian Standard Time, even though the sun rises almost two hours earlier in the east.", "In Arunachal, it can be bright morning while people in Gujarat are still waiting for first light.", "Offices and schools in both places open at nearly the same clock time, so the east loses daylight every morning.", "The sun also sets earlier in the east, so evenings there turn dark while the clock still says afternoon.", "A separate time zone for the north-east has been suggested for years, but the whole country still follows one clock.", "Now here is the twist. Some places in India quietly decided to run on their own time.", "In Assam's tea gardens, the clock is one hour ahead of the rest of India.", "It is called Bagan time, and it started in British days so workers could use the early daylight.", "Garden workers begin and end their day by that clock, while the town nearby follows Indian Standard Time.", "So two people in the same district can both say ten o'clock and mean different moments.", "Ask for a time in Assam, and you may have to ask which clock they mean.", "That is strange enough, but the next place is where India itself runs out of land.", "At Kanyakumari, the southern tip of India, you can watch the sun rise and set over the sea from the same shore.", "The Bay of Bengal lies on one side, the Arabian Sea on the other, and the Indian Ocean in front.", "In the morning the sun climbs out of the water, and in the evening it drops back into water.", "On the full moon day of Chaitra, crowds gather because the sun sets and the moon rises almost together.", "The meeting of the waters also makes it a famous spot for pilgrims and tourists from across the country.", "Most coastlines give you a sunrise or a sunset over the sea, but rarely both from one place.", "So the country ends with an ocean at its feet, and the next fact is about farming below the sea.", "In Kuttanad in Kerala, farmers grow rice in fields that sit below sea level.", "Very few places in the world farm rice this way, and it only works because of long earth walls.", "In some places the water in the canal sits higher than the fields next to it.", "Boats move between homes and rice fields here, and the backwaters work like roads for the villagers.", "A barrage keeps salt water from the sea out of the fields, so the rice can grow.", "Fields are drained before planting, and farmers here work on land that is wet for much of the year.", "If you like strange places like this, subscribe, because there are more of them coming.", "Next, a bridge that nobody built with bricks, because its builder was a tree.", "In Meghalaya, there are living bridges, grown from the roots of rubber fig trees.", "The Khasi people guide the roots across a river and tie them in place, then wait for them to thicken.", "It takes many years, and in some places decades, before a living bridge is strong enough to walk on.", "A wooden or steel bridge can rot or rust in the heavy rain there, but a living one keeps growing stronger.", "Some of these bridges are said to be hundreds of years old, and people still use them today.", "Near Nongriat, there is even a double-decker root bridge, with two living bridges stacked over one stream.", "Cherrapunji is nearby, one of the wettest places on earth, and that rain is why these roots grow so well.", "Now imagine a national park that floats. That one is in Manipur, and it has a rare deer.", "Loktak Lake in Manipur has floating islands called phumdis, made of soil, plants and rotting plant matter.", "Some are thick enough to hold huts, and fishing families live and work on them.", "One large phumdi forms Keibul Lamjao National Park, the only floating national park in the world.", "It is home to the sangai, a rare deer that lives in the wild only in this park.", "Its hooves are suited to soft, marshy ground, so it can walk on the floating land.", "The park rises and sinks with the changing water level, so the ground is never fixed.", "Fishermen paddle small boats between the floating patches, and the lake is their main source of living.", "Floating land is strange, but the last place is stranger, because the ground there is burning.", "In Jharia, Jharkhand, coal under the ground has been burning since 1916.", "That is more than a hundred years of fire, and it still has not been put out.", "Smoke rises from cracks in the earth, and in some places you can feel the heat from the ground.", "Mining opened the coal to air, and air getting in through cracks and old workings keeps the fire alive.", "Families live close to the smoke, and the ground can sink as the coal underneath burns away.", "People have talked about moving residents for years, but many stay because their work and homes are right there.", "So here is a place where a fire has outlived generations, and the ground itself still smokes.", "Now go back to the start. Arunachal's sun rises before Mumbai's, yet one clock rules both.", "One clock, tea on its own time, an ocean sunrise, rice below the sea, living bridges, floating land, burning ground.", "All seven are real, and all seven are on the Indian map.", "Tomorrow: the Indian river island that is slowly disappearing into the water around it."], "job": "20261019-190541-long-why-india-is-stranger-than-you-think"}, {"date": "2026-10-19", "kind": "Short", "category": "geography", "title": "A Country Fully Locked Inside Another", "hook": "Your map shows a whole country hiding inside another one.", "status": "Published", "seconds": 23.0, "publish_at": "2026-10-19 22:00", "uploaded": "2026-10-19 19:26", "url": "https://youtube.com/shorts/4fQUlEDjSt0", "description": "Lesotho is an independent country completely surrounded by South Africa. Its border circles it on every side, so there is no way in or out without crossing South Africa. Only a few countries in the world are enclaves like this. Part of Places That Shouldn't Exist.\n\n#Shorts #Lesotho #Geography", "script": ["Your map shows a country inside another country.", "This is Lesotho, in southern Africa.", "South Africa surrounds it on every side.", "The border circles it completely.", "Every road out leads into South Africa.", "It is still its own independent country.", "Countries like this are called enclaves.", "So Lesotho lives inside South Africa's border.", "Tomorrow: a place where your GPS gets confused."], "job": "20261019-184509-lesotho-enclave-in-south-africa"}, {"date": "2026-10-19", "kind": "Short", "category": "geography", "title": "Russia's Territory Cut Off From Russia", "hook": "Your map shows a piece of Russia between Poland and Lithuania.", "status": "Published", "seconds": 23.3, "publish_at": "2026-10-20 13:00", "uploaded": "2026-10-19 19:26", "url": "https://youtube.com/shorts/_OaeqtnUXRc", "description": "Kaliningrad is a Russian region with no land link to the rest of Russia. Poland and Lithuania sit on its borders, and the Baltic Sea is on the other side. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your map shows Russia between Poland and Lithuania.", "That piece is called Kaliningrad.", "It touches no other part of Russia.", "Poland is on one side, Lithuania on the other.", "The Baltic Sea closes the third side.", "By land, Russia must cross other countries to reach it.", "Kaliningrad is still cut off today.", "So yes, Russia sits between Poland and Lithuania.", "Tomorrow: a Spanish town inside France."], "job": "20261019-184749-kaliningrad-exclave"}, {"date": "2026-10-19", "kind": "Short", "category": "geography", "title": "The Spanish Town Surrounded By France", "hook": "Your map shows a Spanish town sitting inside France.", "status": "Published", "seconds": 24.0, "publish_at": "2026-10-20 18:00", "uploaded": "2026-10-19 19:26", "url": "https://youtube.com/shorts/18PUAgXfboM", "description": "Llívia is a Spanish town completely surrounded by France in the Pyrenees. A 1659 treaty gave France villages, but Llívia counted as a town, so Spain kept it. A short road links it to the rest of Spain.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your map shows a Spanish town inside France.", "It is called Llívia.", "France surrounds it on every side.", "A 1659 treaty gave France villages.", "But Llívia counted as a town, so Spain kept it.", "One short road links it to the rest of Spain.", "Drive it and you cross France to reach Spain.", "So yes, a Spanish town sits inside France.", "Tomorrow: how astronauts sleep."], "job": "20261019-185055-ll-via-spanish-enclave-in-france"}, {"date": "2026-10-19", "kind": "Short", "category": "space", "title": "Astronauts Sleep Strapped To A Wall", "hook": "If you slept in space, you would sleep in a bag on the wall.", "status": "Published", "seconds": 22.5, "publish_at": "2026-10-20 09:00", "uploaded": "2026-10-19 19:26", "url": "https://youtube.com/shorts/dcJEVPT05Ds", "description": "On the space station there is no up or down, so astronauts sleep in a bag fixed to the wall. Their arms float up in front of them while they rest. Part of the If You Were in Space series.\n\n#Shorts #Space #IfYouWereInSpace", "script": ["If you slept in space, you would sleep in a bag.", "That bag is strapped to the wall.", "There is no up or down up there.", "Without a tether, you would drift around the cabin.", "And your arms float up in front of you.", "That is how a relaxed body rests in weightlessness.", "The station circles Earth about every 90 minutes.", "So sleeping in space means a bag on the wall.", "Tomorrow: the light that flickers on camera."], "job": "20261019-185333-sleeping-in-space"}, {"date": "2026-10-19", "kind": "Short", "category": "technology", "title": "Film Your Tube Light, See Dark Bands", "hook": "Your tube light shows dark bands when you film it on your phone.", "status": "Published", "seconds": 22.7, "publish_at": "2026-10-19 22:00", "uploaded": "2026-10-19 21:03", "url": "https://youtube.com/shorts/xVXbLT7jUT4", "description": "Point your phone camera at a tube light or LED bulb and dark bands can roll across the screen. Many lights flicker faster than your eye can notice, and the camera catches it. Try it on any Android or iPhone.\n\n#Shorts #Tech #PhoneTricks", "script": ["Open your phone camera and point it at a tube light.", "Dark bands roll across your screen.", "Your eyes see a steady light.", "But many lights flicker with the mains power.", "Your eye is too slow to notice.", "Your camera reads the picture line by line.", "Each line catches a different brightness.", "Those lines become the bands.", "So your steady light is really flickering.", "Tomorrow: land lower than any other."], "job": "20261019-190313-light-flicker-bands-on-phone-camera"}, {"date": "2026-10-18", "kind": "Long video", "category": "geography", "title": "7 Borders That Make No Sense (India's Is Craziest)", "hook": "Your map of India hides a tiny road that Bangladesh is allowed to use, and it is the strangest border on Earth.", "status": "Published", "seconds": 322.9, "publish_at": "2026-10-19 19:30", "uploaded": "2026-10-18 21:01", "url": "https://youtube.com/shorts/ypETjjqaS-I", "description": "Seven real borders that look like mistakes on the map, counting down from a split Brunei to a gate on an Indian road. Every place is real and checkable on any map. Watch to the end for India's strangest border of all, the Tin Bigha Corridor.\n\n#borders #geography #india\n\nChapters:\n0:00 Intro\n0:27 Brunei: split in two\n1:10 The Gambia: a country in a river\n1:52 Three cut-off pieces\n3:38 Dahagram: a village inside India\n4:14 Tin Bigha: India's strangest", "script": ["Your map of India hides a tiny road that Bangladesh is allowed to use, and it is the strangest border on Earth.", "Seven real borders are coming, counting down, and every one of them looks like a mistake someone made on the map.", "By the end, you'll see a gate on an Indian road that lets another country's citizens walk straight through.", "Each border is stranger than the one before it, so stay for the whole list if you want to see India's.", "But first, a country that is cut into two pieces, so you cannot drive across it without leaving it.", "Number seven: Brunei, a small, rich country on the island of Borneo, shaped like two pieces that do not touch.", "A strip of Malaysia called Limbang runs all the way to the sea and splits Brunei into a western part and an eastern part.", "That strip is part of the Malaysian state of Sarawak, which means Malaysia sits right in the middle of Brunei.", "For years, driving from one half to the other meant leaving Brunei, entering Malaysia, and then entering Brunei again.", "That meant passports, stamps and queues, just to travel between two parts of the very same country.", "Since 2020, a long bridge lets drivers skip Malaysia, but the map still shows Brunei in two separate pieces.", "That is a split country. The next one is a whole country squeezed into the shape of a river.", "Number six: The Gambia, in West Africa, a country that looks like a finger poked into the middle of another one.", "It follows the Gambia River inland, and it is only about 25 to 50 kilometres wide.", "Senegal surrounds it on every side except the short Atlantic coast, so the whole country is basically one river valley.", "Both banks of the river are Gambian, which makes that one river the heart of the entire country.", "Britain and France shaped these lines in colonial times, and the strange outline survived long after both left.", "Imagine a whole country wrapped by its only land neighbour, like a thread running through the middle of a bigger one.", "Strange, yes. But the next countries have a bigger problem: pieces of them are cut off, far away from home.", "Number five: Nakhchivan, a part of Azerbaijan that is completely cut off from the rest of the country.", "Armenia lies in between, so mainland Azerbaijan and Nakhchivan do not share a single metre of border.", "It touches Iran, Turkey and Armenia, but not the country it belongs to, which is a very odd way to be part of a nation.", "Nakhchivan is an autonomous republic inside Azerbaijan, with its own parliament, yet it sits on the far side of another country.", "To reach the rest of Azerbaijan, people usually fly or take a long route around through other countries.", "Number four: Cabinda, an oil-rich piece of Angola on the Atlantic coast, and it is not connected to Angola.", "A narrow strip of the Democratic Republic of the Congo reaches the sea and cuts Cabinda completely off.", "Put one finger on Angola and another on Cabinda, and you will find Congo's strip sitting between your fingers.", "So Angola owns a province you cannot reach by road without first crossing into another country.", "That strip of Congo exists because of old colonial deals, not because anyone planned a sensible map.", "Stay with me, because number three is cut off on an island, with another country all around it.", "Number three: Oecusse, a pocket of East Timor sitting inside Indonesian West Timor, with the sea on its other side.", "The main part of East Timor is far away on the same island, and Indonesia lies in between.", "It is a small patch of land on the northern coast, hemmed in by Indonesian territory and the sea.", "To go from one part of East Timor to the other, you cross Indonesian land or you take a boat.", "Portugal ruled this pocket for centuries while the Dutch ruled the west, and the odd shape is a leftover from that.", "Three cut-off pieces so far. The last two are on our side of the world, and one is inside India.", "If you like strange places and facts like these, subscribe, because we post more things that sound fake but are true.", "Number two: Dahagram and Angarpota, Bangladeshi villages in West Bengal, surrounded on all sides by Indian land.", "Take a few steps in any direction from these villages, and you are standing in India, not in Bangladesh.", "They sit in the Cooch Behar area, near the border in northern West Bengal, with Indian farms on every side.", "For decades their biggest problem was simple: the way to the rest of Bangladesh ran across Indian land.", "Villagers needed a way out of their own country's pocket, and that need created the strangest border of all.", "Remember Dahagram, because number one is the road that solves it, and you can find it on a map of India.", "Number one: the Tin Bigha Corridor, a small strip of Indian land leased to Bangladesh so its citizens can reach Dahagram.", "The name is plain: tin means three in Bengali, and bigha is an old unit of land used in India.", "It connects the villages to the Bangladeshi mainland, so people can walk or ride from their homes to their own country.", "The land under that road is still Indian, but another country's citizens are allowed to use it.", "The lease was agreed in 1992, and it turned a locked-in village into a place with a way out.", "And along the strip stands a gate that has opened and closed at set hours, like a shop with a timetable.", "When the gate was shut, the villages were locked inside India again, and no one could simply walk out.", "Border guards watch the strip, so people move along it under watchful eyes, on a path that two countries care about.", "For people living there, the corridor is the difference between being trapped and being able to reach the rest of their country.", "Indian land, a Bangladeshi route and a gate on a timetable. That is why this border is number one.", "So go back to the start: a tiny road on India's map that Bangladesh is allowed to use. Now you know where it is.", "Tomorrow: more places on the map that look fake but are completely real. See you there."], "job": "20261018-185723-long-7-borders-that-make-no-sense-ending-on-i"}, {"date": "2026-10-18", "kind": "Short", "category": "geography", "title": "Your Car Rolls Uphill in Ladakh", "hook": "Your car rolls uphill here with the engine off.", "status": "Published", "seconds": 20.0, "publish_at": "2026-10-18 22:00", "uploaded": "2026-10-18 21:01", "url": "https://youtube.com/shorts/BYnm2KPy-NA", "description": "At Magnetic Hill near Leh in Ladakh, a car in neutral seems to roll uphill. It is a gravity-hill illusion: the surrounding land hides the horizon, so a downhill slope looks like an uphill one. Places That Shouldn't Exist, part of our geography series.\n\n#Shorts #Ladakh #MagneticHill", "script": ["Your car rolls uphill here, engine off.", "This is Magnetic Hill, near Leh.", "Put the car in neutral and wait.", "It starts creeping up the road.", "But the slope really runs downhill.", "The mountains hide the true horizon.", "Your eyes get fooled, not your car.", "So your car was rolling downhill all along.", "Tomorrow: a whole country shrunk to a dot."], "job": "20261018-184508-magnetic-hill-ladakh"}, {"date": "2026-10-18", "kind": "Short", "category": "geography", "title": "A Whole Country You Can Walk Across", "hook": "Your map shows a whole country as a tiny dot.", "status": "Published", "seconds": 20.9, "publish_at": "2026-10-19 13:00", "uploaded": "2026-10-18 21:01", "url": "https://youtube.com/shorts/lEjLrGEQsvg", "description": "Vatican City is a fully independent country, yet it covers less than half a square kilometre. Zoom out on a map and it shrinks to a speck, and you can walk across it in minutes. It sits entirely inside the city of Rome.\n\n#Shorts #VaticanCity #Geography", "script": ["Your map shows a whole country as a dot.", "This is Vatican City, in the middle of Rome.", "It is a real, independent country.", "It covers under half a square kilometre.", "You can walk across it in minutes.", "Zoom out and it nearly disappears.", "It has its own post office and stamps.", "So that dot on your map is a country.", "Tomorrow: wring out a cloth in space."], "job": "20261018-184740-vatican-city-size"}, {"date": "2026-10-18", "kind": "Short", "category": "space", "title": "Wring a Washcloth in Space, No Drip", "hook": "If you wrung out a wet cloth in space, the water would not drip.", "status": "Published", "seconds": 23.4, "publish_at": "2026-10-19 18:00", "uploaded": "2026-10-18 21:01", "url": "https://youtube.com/shorts/qQsCOhfzV5I", "description": "Astronaut Chris Hadfield showed this on camera aboard the ISS. Wring a wet washcloth in microgravity and the water wraps around the cloth and his hands instead of falling. Surface tension holds it there. Part of our If You Were in Space series.\n\n#Shorts #Space #ISS", "script": ["If you wrung a wet cloth in space, nothing would drip.", "Astronaut Chris Hadfield showed this on camera.", "He squeezed the cloth with both hands.", "The water wrapped around it like a skin.", "It clung to the cloth and his hands.", "There is no gravity to pull it down.", "Surface tension holds the water in place.", "So in space, a wrung cloth stays wet.", "Tomorrow: a water ball with bubbles trapped inside."], "job": "20261018-185000-wringing-a-washcloth-in-space"}, {"date": "2026-10-18", "kind": "Short", "category": "space", "title": "A Fizzy Tablet Inside a Floating Water Ball", "hook": "If you drop a fizzy tablet in a space water ball, the bubbles stay trapped.", "status": "Published", "seconds": 24.3, "publish_at": "2026-10-19 09:00", "uploaded": "2026-10-18 21:01", "url": "https://youtube.com/shorts/KPj1C7fF9Mk", "description": "In microgravity, water pulls itself into a floating, wobbling sphere. Astronauts on the ISS dropped an effervescent tablet into one, and the gas bubbles stayed inside the ball because nothing makes them rise. Part of our If You Were in Space series.\n\n#Shorts #Space #ISS", "script": ["If you dropped a fizzy tablet in space water, bubbles stay trapped.", "Squeeze water out in space and it floats.", "It pulls itself into a perfect sphere.", "The ball wobbles like jelly in mid-air.", "Now drop in an effervescent tablet.", "Bubbles fizz up but cannot rise out.", "On Earth, gravity pushes bubbles to the top.", "In space, the bubbles stay inside the ball.", "Tomorrow: your phone screen goes black."], "job": "20261018-185310-water-blob-and-fizzy-tablet-in-space"}, {"date": "2026-10-18", "kind": "Short", "category": "technology", "title": "Your Screen Goes Black Through Sunglasses", "hook": "Your phone screen can go completely black through your sunglasses.", "status": "Published", "seconds": 23.0, "publish_at": "2026-10-19 16:00", "uploaded": "2026-10-18 21:02", "url": "https://youtube.com/shorts/a4KSImggqRQ", "description": "Try this in 10 seconds. Hold polarized sunglasses in front of an LCD screen and slowly tilt them sideways. Many LCDs emit polarized light, so at one angle the glasses block it and the screen goes dark. It works best on LCD screens, and some phone screens will only dim.\n\n#Shorts #Tech #PhoneTricks", "script": ["Your phone screen can go black through sunglasses.", "Grab polarized sunglasses and any LCD screen.", "Hold the glasses up to the screen.", "Now slowly tilt them sideways.", "The screen fades to completely black.", "An LCD screen sends out polarized light.", "Your lenses block it at one angle.", "The camera sees the black-out too.", "Tomorrow: a country locked inside another."], "job": "20261018-185535-polarized-sunglasses-vs-lcd-screen"}, {"date": "2026-10-17", "kind": "Short", "category": "geography", "title": "India Once Sat Inside Bangladesh Inside India", "hook": "Your country can hide inside another country, inside itself.", "status": "Published", "seconds": 36.0, "publish_at": "2026-10-17 22:00", "uploaded": "2026-10-17 21:11", "url": "https://youtube.com/shorts/Ubjnlrm_vds", "description": "Near Cooch Behar, India and Bangladesh had land so tangled that one field was India inside Bangladesh inside India inside Bangladesh. These enclaves were finally swapped in 2015, and residents could choose their country. A real place that sounds like a glitch in the map.\n\n#Shorts #Geography #Borders", "script": ["Your country can hide inside another country, inside itself.", "Near Cooch Behar, two borders were tangled like a knot.", "Indian villages sat inside Bangladesh, cut off from India.", "Bangladeshi villages sat inside India, the same way.", "One field was India, inside Bangladesh, inside India, inside Bangladesh.", "People there struggled to reach roads, schools and power.", "In 2015, both countries finally swapped the lands.", "Residents even got to choose which country to belong to.", "Now that country inside itself is gone. Tomorrow: a road that crosses a border by itself."], "job": "20261017-2101-india-bangladesh-enclaves-dahala-khagrab"}, {"date": "2026-10-17", "kind": "Short", "category": "technology", "title": "Your Phone Still Finds You in Airplane Mode", "hook": "Your phone still shows your location in airplane mode.", "status": "Published", "seconds": 22.6, "publish_at": "2026-10-18 13:00", "uploaded": "2026-10-17 21:11", "url": "https://youtube.com/shorts/IGwg_tdFyvQ", "description": "Turn on airplane mode, open your maps app, and the blue dot still follows you. Your phone's GPS only listens to satellites, so it keeps working with every radio switched off. Try it on any Android or iPhone in 10 seconds. Tomorrow: the country with no border at its own front door.\n\n#Shorts #Phone #TechFacts", "script": ["Your phone still shows your location in airplane mode.", "Switch airplane mode on. Wi-Fi and mobile data go dead.", "Now open your maps app.", "The blue dot is still there.", "Walk around, and the dot moves with you.", "Your phone only listens to GPS satellites. It never talks back.", "So airplane mode switches off your signal, not your location.", "That's why your phone still shows your location in airplane mode."], "job": "20261017-2105-phone-gps-still-works-in-airplane-mode"}, {"date": "2026-10-17", "kind": "Short", "category": "geography", "title": "Your Clock Says 10 AM. The Sky Says Night.", "hook": "Your phone says 10 AM, but in western China it's still dark.", "status": "Published", "seconds": 27.0, "publish_at": "2026-10-18 18:00", "uploaded": "2026-10-17 21:11", "url": "https://youtube.com/shorts/VUbkw83kOT0", "description": "One huge country runs on a single clock, so in the far west the sun can rise hours later than the clock says. People there often use an unofficial local time just to get through the day. Would you pick the official clock or the sun?\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your phone says 10 AM, but in western China it's still dark.", "China is as wide as five time zones.", "But the whole country uses just one clock.", "So the east sees sunrise first, like normal.", "But far in the west, the sun comes up hours late.", "Some locals quietly run a second, unofficial clock.", "So two people can say the same hour and mean different times.", "That's why your phone's 10 AM can still be night.", "Tomorrow: the country with no border at its own front door."], "job": "20261017-2108-china-s-single-time-zone"}, {"date": "2026-10-17", "kind": "Short", "category": "diwali", "title": "Your Diwali Sky Is Burning Metal", "hook": "Every colour in your Diwali sky is a different metal on fire.", "status": "Published", "seconds": 25.6, "publish_at": "", "uploaded": "2026-10-17 21:39", "url": "https://youtube.com/shorts/N0RR9q1eoZE", "description": "Every colour in a Diwali firework comes from a different metal salt: strontium for red, barium for green, copper for blue. Blue is the hardest to get right, because the heat has to be just right. Watch the sky differently tonight.\n\n#Shorts #Diwali #Fireworks", "script": ["Every colour in your Diwali sky is a different metal on fire.", "Red comes from burning strontium.", "Green comes from barium.", "Yellow and orange come from sodium and calcium.", "Copper makes the blue ones.", "But blue is the hardest colour to make.", "Too hot, and the copper breaks down.", "So makers must hit the heat exactly right.", "Tonight, spot a blue one. That is rare chemistry.", "Your sky is metal on fire. Tomorrow: the road that changes countries."], "job": "20261017-2128-diwali-firework-colours-come-from-burnin"}, {"date": "2026-10-17", "kind": "Short", "category": "diwali", "title": "Your Diwali Date Is
