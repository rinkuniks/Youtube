serve in the Indian Army, in Gorkha regiments that have stood on our side for generations.", "Money is tied together too. Nepal fixes its rupee to ours: one hundred Indian rupees equal one hundred sixty Nepali rupees.", "And a short drive from this gate is Lumbini, where the Buddha was born. Many people cross at Sunauli just for that.", "So you crossed a country line without a visa. Now watch what happens to your watch.", "Two: the clock that is fifteen minutes off.", "India runs on one time zone, five hours thirty minutes ahead of world time. Walk into Nepal and it becomes five forty-five.", "So if your phone follows the local network, it jumps fifteen minutes ahead. Same sun, same sky, a different minute.", "Look at that number. A time ending in forty-five is almost unheard of anywhere else on Earth.", "Nepal is the only country in the world that uses this offset for its whole territory.", "The reason is a choice Nepal made for itself: a time tied to a line of longitude that runs through its own mountains.", "In other words, Nepal wanted its own clock, even if it sits only a quarter of an hour away from ours.", "So when it is noon in Sunauli, it is already twelve fifteen a few minutes away in Belahiya.", "A quarter of an hour sounds small. But the next thing is bigger: Nepal is living in a different year.", "Three: a country that lives in the future.", "Look at an official Nepali calendar today and it does not say 2026. It says 2083.", "That is Bikram Sambat, Nepal's official calendar, and it runs more than fifty-six years ahead of the one on your phone.", "It is a very old calendar, also known in parts of India, and Nepal uses it for government work and official dates.", "Its months have names like Baisakh and Jestha, which will sound familiar to anyone who knows the traditional Indian calendars.", "The new year does not begin in January. It begins in mid-April, around the time of Baisakhi.", "So a Nepali friend might say, I was born in twenty sixty. In your calendar, that is about two thousand three.", "The week is different too. Offices in Nepal usually work Sunday to Friday, and Saturday is the main day off.", "Cross the gate on a Saturday and many offices on the Nepal side are shut, while the Indian side is open.", "A different year, a different weekend, a different clock. Now look up at what is flying above the buildings.", "Four: the only flag in the world that is not a rectangle.", "Every other national flag is a rectangle or a square. Nepal's is the only one that is neither.", "It is two triangles stacked on top of each other, crimson red with a blue border, and a moon and a sun inside.", "Many people explain the two triangles as two Himalayan peaks, or as the two major religions, Hinduism and Buddhism.", "The moon and the sun stand for the hope that Nepal will last as long as they do.", "Crimson is the national colour, and the rhododendron, the national flower, is red too. Nepal even has forests of them.", "The flag is so exact that Nepal's constitution gives step by step instructions. You could draw it with just a ruler and compass.", "If you enjoy strange places and facts like these, subscribe now, because the next two are the ones I was saving.", "The next one is a mountain that two countries could not agree on.", "Five: the mountain that had to be measured twice.", "Mount Everest sits on the line between Nepal and China. Nepal calls it Sagarmatha. In Tibet, it is Chomolungma.", "For years the two countries gave different heights. Nepal said eight thousand eight hundred forty-eight metres. China said about eight thousand eight hundred forty-four.", "The gap came from the top. China counted the solid rock, while Nepal counted the snow and ice sitting over it.", "In December 2020, both countries announced one shared number together: eight thousand eight hundred forty-eight point eight six metres.", "A Nepali survey team climbed to the top as part of that work, so Nepal had its own measurement from the summit.", "And Everest is not alone. Nepal is home to eight of the world's fourteen peaks above eight thousand metres.", "Many climbers begin at Lukla, a tiny airport on a cliff, famous for a short runway that slopes uphill.", "Now think back to the gate at Sunauli. That land is low, flat farmland called the Terai, right beside Uttar Pradesh.", "The same country holds that flat plain and the highest point on Earth. Travel north and hot fields give way to ice.", "Big mountains are strange. But the strangest thing in Nepal is not a mountain. It is a child.", "Six: a little girl who is worshipped as a goddess.", "In Kathmandu, a young girl called the Kumari is believed to hold the spirit of a goddess, and people truly worship her.", "She is chosen as a small child, from a particular Newar community, after priests check her for many signs of calm and perfection.", "She then lives in a special house called the Kumari Ghar, right beside Durbar Square in the middle of Kathmandu.", "Visitors can sometimes see her at a carved window above the courtyard, but taking her photograph is not allowed.", "She leaves rarely, and tradition says she must be carried, so that her feet do not touch the ground outside.", "Once a year, during the Indra Jatra festival, she is pulled through the streets in a chariot while crowds watch.", "Leaders have traditionally visited her for a blessing. A child sits in that seat of honour, in a modern capital.", "When she grows up and reaches puberty, she is no longer the goddess, and a new child is chosen to take her place.", "Nepal's Supreme Court has even told the state to make sure the Kumari gets an education, like any other child.", "Think about that: a child who is a goddess, in a capital only a short flight from Delhi.", "So that rickshaw at Sunauli carries you somewhere with a different clock, a different year, a different flag and a taller mountain.", "And all of it begins at an open gate with no visa, a few minutes' walk from an Indian road.", "Your rickshaw ride at Sunauli takes you into a country where the year is 2083, and now you know why.", "Next in this series: why Japan is stranger than you think."], "job": ""}, {"date": "2026-11-22", "kind": "Short", "category": "geography", "title": "Ships Stranded In A Desert Where A Sea Was", "hook": "Your satellite map shows ships stuck in a desert.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Aral Sea in Central Asia, between Kazakhstan and Uzbekistan, was once a huge lake. Water from its rivers was diverted for farming and the lake shrank away. Rusting ships still sit on the dry ground near Moynaq.\n\n#Shorts #AralSea #Geography", "script": ["Your satellite map shows ships stuck in a desert.", "This was once the Aral Sea.", "It sat between Kazakhstan and Uzbekistan.", "Its rivers were diverted for farming.", "The water slowly vanished.", "Fishing boats were left on dry sand.", "Rusting ships still sit there today.", "A sea turned into a desert.", "Open your map and find those ships."], "job": ""}, {"date": "2026-11-22", "kind": "Short", "category": "geography", "title": "A Waterfall Frozen In Solid Stone", "hook": "Your hike ends at a waterfall frozen in stone.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hierve el Agua in Oaxaca, Mexico looks like a waterfall turned to rock. Mineral-rich spring water flows over the cliff and leaves minerals behind, slowly building the formations. It is not ice and it is not a statue.\n\n#Shorts #HierveElAgua #Mexico", "script": ["Your hike ends at a waterfall frozen in stone.", "This is Hierve el Agua, in Oaxaca, Mexico.", "It is not ice, and it is not a statue.", "Mineral-rich spring water flows over the cliff.", "It leaves its minerals behind on the rock.", "Slowly, those minerals built the cliff formations.", "So the water made the waterfall of rock.", "Your hike ends at a waterfall made of stone."], "job": ""}, {"date": "2026-11-22", "kind": "Short", "category": "geography", "title": "A Boat Ride Through Swirling Blue Marble", "hook": "Your boat glides through caves of swirling blue stone.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Marble Caves sit on General Carrera Lake in Patagonia, Chile. The lake's waves carved the marble into smooth chambers with swirling blue and white patterns. You reach them by boat.\n\n#Shorts #MarbleCaves #Patagonia", "script": ["Your boat glides through caves of swirling blue stone.", "These are the Marble Caves in Patagonia, Chile.", "They sit right on General Carrera Lake.", "The walls are solid marble, not paint.", "Waves slowly carved the rock into smooth chambers.", "Light bounces off the water onto the stone.", "That makes the blue and white swirls glow.", "Your boat glides through carved blue marble."], "job": ""}, {"date": "2026-11-22", "kind": "Short", "category": "space", "title": "Coffee That Climbs Up Its Own Cup In Space", "hook": "Your coffee crawls up its own cup in space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On the International Space Station, coffee does not stay at the bottom of a normal cup. A special cup with a sharp inner corner, tested in 2015, lets surface tension pull the coffee along the corner toward the astronaut's mouth. No straw, no pouch.\n\n#Shorts #Space #ISS", "script": ["Your coffee crawls up its own cup in space.", "On the space station, nothing stays at the bottom.", "So astronauts got a cup with a sharp corner.", "Surface tension pulls coffee along that corner.", "It crawls upward all by itself.", "This cup was tested on the ISS in 2015.", "No straw and no pouch needed.", "Your coffee crawls up the cup in space."], "job": ""}, {"date": "2026-11-22", "kind": "Short", "category": "technology", "title": "A Humanoid Robot Backflips And Sticks It", "hook": "Your robot does a backflip and lands on its feet.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Boston Dynamics' Atlas is a humanoid robot, and it can do a backflip. In the video it jumps, flips in the air, and lands back on its feet. It is real robotics, not CGI.\n\n#Shorts #BostonDynamics #Robots", "script": ["Your robot does a backflip and lands.", "This is Atlas, from Boston Dynamics.", "It is a humanoid robot, built like a person.", "It jumps and flips through the air.", "Then it lands right back on its feet.", "The video shows the whole move in one go.", "Robots used to struggle just to walk.", "Now your robot can do a backflip."], "job": ""}, {"date": "2026-11-23", "kind": "Long video", "category": "geography", "title": "6 Strange Borders, Ending on India's Gifted Island", "hook": "Your fishing boat from Rameswaram can pass an island that India gave away, with a church Indians still sail to every year.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A countdown of six real borders that look like map mistakes: a German town inside Switzerland, a Spanish town inside France, a road through Canada, and a runway that stops cars. The last one is India's Katchatheevu, an island ceded to Sri Lanka in 1974 that still has a church fishermen sail to.\n\n#borders #katchatheevu #geography", "script": ["Your fishing boat from Rameswaram can pass an island that India gave away, with a church Indians still sail to every year.", "It sounds fake, but that island is real, and it is the strangest of the six borders in this video.", "By the end, you'll see how one tiny rock holds a church, a fishing net and a signature from 1974.", "But first we start in Europe, where a whole town sits inside the wrong country.", "Six borders, counted down. Each one is stranger than the last, and the final one belongs to India.", "Stay with me, because every border here is real, and every place I mention you can look up yourself.", "Number six: Büsingen. Picture a German town with Swiss land on every single side of it.", "It sits beside the Rhine, wrapped completely by Switzerland, with no German land touching it anywhere.", "Shops there accept euros and Swiss francs, because the town is part of the Swiss customs area.", "Phone numbers follow the Swiss system, yet the cars still wear German number plates.", "Residents vote in German elections, yet much of daily life follows Swiss rules.", "A vote in 1918 even asked to join Switzerland, but that never went through.", "Old deals from centuries ago were never tidied up, so the odd shape just stayed.", "That is strange. But the next place is a whole town hiding inside France.", "Number five: Llívia. A Spanish town surrounded by France, and it is there because of one word.", "In 1659, Spain and France signed a treaty that handed France a list of villages in the Pyrenees.", "But Llívia counted as a town, not a village, so the treaty's wording left it with Spain.", "On the map, it is a small dot of Spain with the French border looping all the way around it.", "A special neutral road links the town to Spain through French land, so locals can still drive home.", "People there speak Catalan, pay in euros, and look out at mountains on every side.", "A whole town saved by one word. Next, we cross the Atlantic, where an American road runs through Canada.", "Number four: Point Roberts. It belongs to Washington state, yet to drive home you must cross into Canada.", "In 1846, a treaty drew the border along a straight line, the forty-ninth parallel.", "That straight line sliced the tip off a peninsula and left a small American piece stuck to Canada.", "So people in Point Roberts live in the United States, but the only road to the rest of it runs through British Columbia.", "That means passport checks, queues and a drive through another country just to reach the next American town.", "In 2020, when travel across the border was restricted, this odd shape made life there very hard.", "If that sounds odd, wait until you hear about a corner of Minnesota that is cut off by a lake in Canada.", "Number three: the Northwest Angle. A corner of Minnesota that sits above the rest of the United States.", "It lies on Lake of the Woods, and by road you can only reach it through Canada.", "The reason is a mapmaking mistake. The 1783 peace treaty relied on a map that got the rivers wrong.", "Later agreements fixed most of the line, but they left this little piece of land on the American side.", "On the map, it looks like a small notch sticking up into Canada, mostly made of water and forest.", "If you enjoy strange places like these, subscribe, because new ones are coming every day.", "Now for number two, where cars wait at a red light for airplanes.", "Number two: Gibraltar. A British territory at the tip of Spain, with a road that crosses an airport runway.", "The road is called Winston Churchill Avenue, and it cuts straight across the runway.", "When a plane is about to land or take off, the barriers come down and cars have to stop.", "So your car waits at a red light for an airplane. Cars stop, planes go.", "The runway sits on a narrow strip of land right beside the Spanish border.", "It is a real working airport, not a museum, and the road is part of everyday life.", "Walk a few minutes and you pass a border, a runway, and the huge Rock of Gibraltar.", "Britain has held Gibraltar since the early 1700s, though Spain still claims it, so this border is argued over.", "Locals treat the waiting planes as normal life. Now the last border is Indian, and it began with one signature in 1974.", "Number one: Katchatheevu. A tiny island in the Palk Strait, between Rameswaram and Sri Lanka's Delft island.", "It is less than two kilometres long, and no one lives there. There is no drinking water either.", "Look at where it sits. The Palk Strait is narrow, and fishermen on both sides have shared these waters for ages.", "Tamil fishermen on the Indian side and Tamil fishermen in Sri Lanka speak the same language.", "Yet the island has a church, St Anthony's, built in the early 1900s by a Tamil fisherman named Srinivasa Padaiyachi.", "St Anthony is the saint of fishermen, so sailors from both sides of the water have prayed there for generations.", "For a long time, the island was linked to the Raja of Ramnad, in what is now Tamil Nadu.", "Then came 1974. Indira Gandhi's government and Sri Lanka's Sirimavo Bandaranaike signed an agreement drawing the sea border.", "That line put Katchatheevu on Sri Lanka's side, so India gave up the island without a shot being fired.", "The agreement even lets Indian fishermen rest there, dry their nets, and visit the church without a visa.", "Two years later, a 1976 pact said fishing boats from each country must stay out of the other's waters.", "Here is where the trouble starts. Fish do not read maps, and the sea has no painted line.", "So fishermen from Rameswaram still sail out, cross the line by mistake or need, and meet the Sri Lankan navy.", "Boats have been seized and fishermen arrested many times, which is why this island keeps coming up in Indian politics.", "Remember, every other border here changed a road or a currency. This one changes where a fisherman can cast a net.", "Many Tamil Nadu leaders have demanded it back, and it became a talking point in the 2024 election.", "Sri Lanka says the island is legally its own, so both sides feel strongly about this tiny rock.", "Now the part I promised. Look at what the island is truly famous for, and it is not the border.", "Every year in February or March, pilgrims sail to St Anthony's for a weekend of prayer.", "Priests from India and Sri Lanka lead the mass together, and no passport is needed to attend.", "So one rock holds a gifted island, a fishing dispute, and a church that two countries share.", "The map can fool you. From Rameswaram it looks like a stepping stone, yet it is Sri Lankan land.", "Let us count them down. Six: Büsingen, a German town wrapped in Switzerland, using two currencies.", "Five: Llívia, a Spanish town saved inside France by one word in a treaty.", "Four: Point Roberts, where Americans must drive through Canada to get home.", "Three: the Northwest Angle, a piece of Minnesota left behind by a bad map.", "Two: Gibraltar, where cars stop at a red light for airplanes.", "One: Katchatheevu, an island India gave away, with a church people from both countries still sail to.", "So the next time a map looks simple, remember that a boat from Rameswaram can pass an island India gave away.", "Tomorrow: another place where one small step changes the country you stand in."], "job": ""}, {"date": "2026-11-23", "kind": "Short", "category": "geography", "title": "Your Map Shows a River as Red as Rust", "hook": "Your map shows a rust-red river in Spain.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Spain's Rio Tinto runs rust-red because of dissolved iron and acidic water linked to old mines. The colours are so unusual that the area is studied as a Mars-like place. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your map shows a rust-red river in Spain.", "It is called the Rio Tinto.", "Its water is full of dissolved iron.", "It is also very acidic.", "Mining here goes back thousands of years.", "Old mines feed that acid into the water.", "The colours look more like Mars than Earth.", "So yes, that rust-red river is real.", "Tomorrow: a city carved inside solid rock."], "job": ""}, {"date": "2026-11-23", "kind": "Short", "category": "geography", "title": "Your Hotel Room in Italy Could Be a Cave", "hook": "Your hotel room in Italy could be a cave.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Matera in southern Italy has an old town called the Sassi, carved into the rock. It is a UNESCO World Heritage Site, and some of the caves are now hotels. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Italy #PlacesThatShouldntExist", "script": ["Your hotel room in Italy could be a cave.", "This is Matera, in southern Italy.", "Its old town, the Sassi, is carved into rock.", "Homes, churches and streets, dug into the hillside.", "People lived in these caves for ages.", "Today it is a UNESCO World Heritage Site.", "And some caves are now real hotels.", "Yes, your room really could be a cave.", "Next: a wing nut that flips itself in space."], "job": ""}, {"date": "2026-11-23", "kind": "Short", "category": "space", "title": "A Wing Nut Flips Itself in Space", "hook": "Your wing nut would flip itself in space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Spin a T-handle or wing nut in zero gravity and it tumbles over, then spins steadily, then tumbles again. It is called the Dzhanibekov effect, and it has been filmed on camera in orbit. Part of the If You Were in Space series.\n\n#Shorts #Space #IfYouWereInSpace", "script": ["Your wing nut would flip itself in space.", "Spin a wing nut in zero gravity.", "It spins steadily, then suddenly flips over.", "Then it spins steadily again.", "No one touches it during the flip.", "It repeats, flip after flip.", "It is called the Dzhanibekov effect.", "Physics predicts it, and cameras caught it.", "Next: closed eyes that still see flashes."], "job": ""}, {"date": "2026-11-23", "kind": "Short", "category": "space", "title": "In Space, Closed Eyes Still See Flashes", "hook": "In space, your closed eyes still see flashes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Astronauts have reported streaks and sparks of light with their eyes shut. These flashes are linked to cosmic rays hitting the eye. Part of the If You Were in Space series.\n\n#Shorts #Space #IfYouWereInSpace", "script": ["In space, your closed eyes still see flashes.", "Astronauts report streaks and sparks of light.", "Even in total darkness, eyes shut.", "Cosmic rays are the suspected cause.", "They are fast particles from space.", "They can hit the eye itself.", "Your brain reads that hit as light.", "Astronauts have reported it since Apollo.", "Next: a spaceship that sails on sunlight."], "job": ""}, {"date": "2026-11-23", "kind": "Short", "category": "technology", "title": "A Spaceship Really Sailed on Sunlight", "hook": "Your spaceship can sail on sunlight.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Japan's IKAROS unfurled a thin square solar sail in 2010. It was the first to do so in interplanetary space, and it flew toward Venus. Part of the Space Firsts series.\n\n#Shorts #Technology #SpaceFirsts", "script": ["Your spaceship can sail on sunlight.", "Japan's IKAROS proved it in 2010.", "It unfurled a thin square sail.", "Sunlight pushes on it, very gently.", "That push needs no engine fuel.", "It was the first to do this in interplanetary space.", "It flew toward Venus.", "So yes, a spaceship can sail on sunlight.", "Next: a city that goes down about 18 levels."], "job": ""}, {"date": "2026-11-24", "kind": "Long video", "category": "geography", "title": "Why Rameswaram Is Stranger Than You Think", "hook": "Your fishing boat near Rameswaram floats past an island India gave away in 1974, and a church still stands on it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Rameswaram sits at the southern tip of India, and its coast hides a train that crosses open sea, a town wiped out in one night, a chain of shoals toward Sri Lanka, and an island India gave away in 1974. Here are six true facts about this strange stretch of the Palk Strait, ending with the church on Katchatheevu.\n\n#Rameswaram #Katchatheevu #IndiaFacts", "script": ["Your fishing boat near Rameswaram floats past an island India gave away in 1974, and a church still stands on it.", "That island is called Katchatheevu, and you will see it at the end of this video.", "But first, a few stranger things hide on this one small stretch of India's southern tip.", "A train that crosses open sea, a ghost town, a road that ends in water, and a bridge made of sand.", "Every fact here is true, and each one is stranger than the one before.", "Let's start with the bridge where a train rides over the middle of the sea.", "Rameswaram is an island, and for a long time the only way in by rail was a bridge over the sea.", "The old Pamban Bridge opened in 1914, and trains crossed it for more than a hundred years.", "Its middle section could open like a pair of scissors so that boats could pass beneath it.", "Workers had to open it by hand, working the gears, every time a boat needed to pass.", "But salty sea air eats iron, and by 2022 the old bridge was shut to trains because of corrosion.", "So a new Pamban Bridge was built beside it, and it opened in April 2025.", "It is India's first vertical lift sea bridge, which means a piece of the railway rises straight up.", "When a tall fishing boat needs to pass, the middle span climbs about 17 metres into the air.", "The train waits, the boat sails through, and then the track comes back down.", "Picture it: your train halts in the middle of the sea while the track ahead rises into the sky.", "Now step off that bridge, because the island holds a temple with a very odd feature.", "Rameswaram's Ramanathaswamy Temple stands very close to the beach, with the sea only a short walk away.", "Yet pilgrims inside the temple bathe in a series of wells, and tradition counts twenty-two of them.", "Buckets of water are poured over each visitor, one well after another, and people say each tastes different.", "Many Hindus believe this is among the holy places linked to Lord Rama, which is why pilgrims come.", "Whatever you believe, the setting is strange: wells inside a temple on a sandy island ringed by salt water.", "The temple is also known for its corridors, among the longest in India, lined with carved stone pillars.", "Walk them and the pillars seem to go on forever, like a hallway in a dream.", "Pilgrims have come here for centuries, and many then travel on to the very end of the island.", "That end is where the road stops, and the sea takes over.", "And that brings us to a town that was wiped out in a single night.", "Dhanushkodi sits at the far tip of Rameswaram island, and today it is a ghost town.", "Before 1964 it had a railway station, a post office, a church and a temple.", "It was also the place where passengers left the train and boarded a ferry to Sri Lanka.", "Then, in December 1964, a powerful cyclone hit, and a huge wave rolled over the land.", "A passenger train heading for Dhanushkodi was swept away that night, and the toll in the town was heavy.", "Afterwards the government declared the town unfit to live in, and it was left to the sea.", "Walk there today and you see roofless walls, a broken church and a station with nothing around it.", "Some fishing families still live near the ruins today, with the sea at their door.", "A road now runs to the very tip, and the sea sits on both sides of you.", "Here the Bay of Bengal on one side meets the Indian Ocean on the other, and the two sides often look different.", "If you like strange places like this, subscribe, because tomorrow's video goes somewhere equally odd.", "And from this tip of land, Sri Lanka is only about thirty kilometres away.", "But first, meet a shy animal in these waters that sailors may once have mistaken for a mermaid.", "Along this coast lives the dugong, a gentle sea mammal also called the sea cow.", "Old sailors who saw one from a distance are often said to have imagined mermaids.", "A dugong grazes on seagrass, the way a cow grazes on grass, but underwater.", "Palk Bay has big seagrass meadows, and that is why dugongs still come here.", "In September 2022, Tamil Nadu declared India's first dugong conservation reserve in this bay.", "It covers roughly four hundred and fifty square kilometres of sea, with the grass meadows at its heart.", "In 2025, the world conservation body IUCN voted to recognise the reserve at its congress in Abu Dhabi.", "Dugongs are rare, so damaged seagrass and tangled fishing nets are real dangers to them.", "Healthy seagrass also helps fish, so protecting these meadows helps the fishing coast too.", "Now look south from here, and you can see a line that seems to walk across the sea.", "From Dhanushkodi, a chain of sandbanks and limestone shoals stretches toward Sri Lanka, and satellites show it clearly.", "It is called Adam's Bridge, and in India it is also known as Ram Setu.", "Many people believe it was built in the age of the Ramayana, and it is deeply sacred to them.", "Geologists describe it as a natural chain of shoals, and its story is still discussed and debated.", "Everyone agrees on one thing: in many places the water here is very shallow.", "Because of those shallows, big ships cannot sail through, so they go all the way around Sri Lanka.", "Some old accounts say people could once cross much of it on foot, until storms deepened the sea.", "India once planned a shipping canal through here, and the idea set off a long debate that continues.", "On a clear satellite picture it looks like a dotted line drawn between two countries.", "So the same strip of sea is a map curiosity, a sacred story and a shipping problem all at once.", "And now, at last, we go out in a small fishing boat to the island in the middle of the sea.", "Katchatheevu is a tiny uninhabited island in the Palk Strait, less than two kilometres long.", "It lies in the strait between Rameswaram and Sri Lanka's Jaffna peninsula, and on the map it looks close to India.", "For years it was claimed by both sides, and in 1974 an agreement placed it with Sri Lanka.", "That agreement is why the island belongs to Sri Lanka, even though Indian fishing boats pass right by it.", "Nobody lives on Katchatheevu, but it does have one thing that draws crowds: a small church.", "It is the Church of St Anthony, and every year it holds a festival.", "Pilgrims from both India and Sri Lanka travel across the water to attend, by boat.", "For those few days, an island that is foreign on paper becomes a place where two countries pray together.", "The rest of the year it is silent, with just sand, scrub and the sea around it.", "The waters around it are also rich fishing grounds, which is why the island still matters so much.", "Fishermen from Tamil Nadu and Sri Lankan authorities have clashed over those waters for years, and the issue is still raised today.", "That is why a tiny rock with a church makes headlines in two countries, even today.", "A map line drawn in the 1970s still decides where a fisherman may cast his net.", "It is a reminder that borders are not only on land, they are also lines drawn across water.", "So here is what we saw: a train over the sea, a ghost town, a sea cow, a bridge of sand.", "And an island with a church that India gave away, sitting just across the water from Rameswaram.", "Now go back to the start. Your fishing boat floats past an island India gave away in 1974.", "A church still stands on it, and once a year, two countries pray there together.", "Tell me in the comments: which of these places would you visit first?", "Next in this series: another place that looks ordinary on a map, until you zoom in."], "job": ""}, {"date": "2026-11-24", "kind": "Short", "category": "geography", "title": "Your Trip Goes 18 Levels Underground", "hook": "Your underground trip here goes down about 18 levels.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Derinkuyu in Turkey is an underground city that goes down about 18 levels. It had stables, wells and room for thousands of people. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Turkey #PlacesThatShouldntExist", "script": ["Your underground trip here goes down about 18 levels.", "This is Derinkuyu, in Turkey.", "A whole city was built under the ground.", "It had stables for animals.", "It had wells for drinking water.", "It was built to house thousands of people.", "Today visitors can walk down inside.", "Level after level of carved rock.", "So yes, your trip goes about 18 levels down."], "job": ""}, {"date": "2026-11-24", "kind": "Short", "category": "geography", "title": "Your Hotel Room Is Dug Into a Hillside", "hook": "Your hotel room here can be underground.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Coober Pedy, Australia, locals dug homes into the hillside to escape the desert heat. Hotels, bedrooms and even churches sit inside the rock. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your hotel room here can be underground.", "This is Coober Pedy, in the Australian outback.", "Summer heat here gets brutal.", "So locals dug their homes into the hillside.", "Bedrooms, kitchens, even churches sit inside the rock.", "Underground, the temperature stays far cooler.", "Visitors sleep in those same carved rooms.", "Your hotel room really can be underground.", "Next: islands made of reeds."], "job": ""}, {"date": "2026-11-24", "kind": "Short", "category": "geography", "title": "Your Boat Docks on an Island Made of Reeds", "hook": "Your boat here docks on an island of reeds.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On Lake Titicaca, between Peru and Bolivia, the Uros people live on floating islands woven from totora reeds. New reeds are added on top as the old ones rot away. Part of the Places That Shouldn't Exist series.\n\n#Shorts #LakeTiticaca #PlacesThatShouldntExist", "script": ["Your boat here docks on an island of reeds.", "This is Lake Titicaca, between Peru and Bolivia.", "The Uros people live on floating islands.", "Everything is woven from totora reeds.", "The ground under your feet is just reeds.", "New reeds go on top as old ones rot.", "Even their houses are made of reeds.", "So your boat parks beside a woven island.", "Tomorrow: tacos grown in space."], "job": ""}, {"date": "2026-11-24", "kind": "Short", "category": "space", "title": "Astronauts Grew Chile Peppers for Tacos in Orbit", "hook": "Your tacos were grown in space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2021, astronauts on the International Space Station grew Hatch chile peppers, picked them and ate them in tacos. NASA shared photos of the meal. Part of the If You Were in Space series.\n\n#Shorts #Space #IfYouWereInSpace", "script": ["Your tacos were grown in space.", "In 2021, astronauts grew chile peppers on the ISS.", "Then they picked the peppers by hand.", "Then they put them in tacos.", "NASA shared photos of the whole meal.", "Those peppers grew while floating above Earth.", "Real fresh food, grown in orbit.", "So yes, your tacos were grown in space.", "Tomorrow: a flame that cannot burn a flower."], "job": ""}, {"date": "2026-11-24", "kind": "Short", "category": "technology", "title": "A Flame Can't Burn This Flower on Aerogel", "hook": "Your flame cannot burn this flower.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Aerogel, nicknamed frozen smoke, is mostly air and is one of the best insulators known. A flower on top stays safe while a flame heats the underside. NASA used aerogel to catch comet dust.\n\n#Shorts #Science #Aerogel", "script": ["Your flame cannot burn this flower.", "It sits on aerogel, called frozen smoke.", "Flame below, flower above, and the petals stay safe.", "Aerogel is mostly air, trapped in tiny pores.", "That makes it one of the best insulators.", "NASA even used it to catch comet dust.", "Dust from a comet, caught in frozen smoke.", "That is why the flower never burns.", "Tomorrow: a pool on the edge of a waterfall."], "job": ""}, {"date": "2026-11-25", "kind": "Long video", "category": "geography", "title": "Sir Creek and 6 Borders That Make No Sense", "hook": "Your map of Gujarat ends in a border that runs through mud, and two countries still cannot agree where it is.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that make no sense, counted down from a lake with no line to a rocket city that Russia rents. The last one is India's Sir Creek, a border in a tidal marsh where the water keeps moving and India and Pakistan still disagree on where the line lies. Open any map and check them yourself.\n\n#borders #geography #India", "script": ["Your map of Gujarat ends in a border that runs through mud, and two countries still cannot agree where it is.", "That is Sir Creek, India's strangest border, and we will get there last. But six others come first, and each is stranger.", "By the end, you will see a line on a map that the water itself keeps moving.", "Here are seven real borders that make no sense, counted down from seven to one, starting with a lake that has no line.", "Every place in this video is real, and every one is on a map you can open right now.", "So let us start with a border that was simply never drawn, in the middle of rich, careful Europe.", "Number seven: a lake with no agreed border. Lake Constance touches three countries, Germany, Austria and Switzerland, all careful and well organised.", "On land, their borders are clear. But out on the water, the three have never agreed on one shared line.", "Their views differ, so for decades the lake has been used by all three without a fixed line.", "Ferries cross it all day, boats of all three nations sail it, and nobody checks a passport in the middle of the water.", "Think about that. An entire lake, in the middle of Europe, with the border left as a blank on the map.", "Fishing and shipping rules there are agreed between the neighbours, even without a border line.", "That one is just a blank. Number six is much stranger: a whole town stuck in the wrong country.", "Number six: Llívia. It is a Spanish town that sits completely inside French land, with France on every side.", "Walk out of the town in any direction and you step onto French soil. Spain is only a short drive away.", "The reason goes back to 1659, when Spain handed France a set of villages after a long war, in the Treaty of the Pyrenees.", "But Llívia was counted as a town, not a village. So it was not handed over, and it stayed Spanish.", "One word on a piece of paper left a Spanish town stranded inside France, and it is still there.", "Today a special road joins Llívia to the rest of Spain, and that road runs through French land.", "That is a town inside the wrong country. Number five is a village, and it is surrounded by Switzerland.", "Number five: Büsingen. It is a village in Germany, but it is completely surrounded by Switzerland.", "Its people live under German law, yet it sits inside the Swiss customs area, so goods move there much like in Switzerland.", "Shops there often take both euros and Swiss francs, because both currencies are part of daily life.", "Its cars have their own special number plate code, BÜS, so you can spot a Büsingen car at a glance.", "Old land deals and old wars left it behind, and nobody ever tidied it away. It still sits on the map as a German island in Swiss land.", "Imagine your home address being German, while everything you can see from your window is Switzerland.", "That one was about land. Number four is about a runway, and what happens when a plane wants to land.", "Number four: Gibraltar. A British territory on Spain's southern tip, with a border that runs right across its airport.", "To walk or drive from Spain into Gibraltar, you often have to cross the airport runway itself.", "When a plane is about to land or take off, the road is closed. Barriers come down, just like at a railway crossing.", "Cars, bikes and people simply wait, while a jet lands or lifts off right in front of them.", "Few places on Earth have a border crossing where the plane has the right of way.", "Spain does not even accept that the land under the runway belongs to Gibraltar, so the argument is literally on the tarmac.", "Number three is a place that is American, but to drive there, you must first pass through another country.", "Number three: Point Roberts, in Washington state. It is part of the United States, but it hangs off the coast of Canada.", "The border follows the 49th parallel, a perfectly straight line, and that line sliced the tip of a peninsula off from America.", "So to reach the rest of the United States by road, you must drive through Canada and cross the border twice.", "On the map it looks like a small cut-out of America, sitting just below Canada, with the sea on its other sides.", "Its shops, its mail and many of its visitors all depend on a single crossing. When the border closed in 2020, the town felt it badly.", "A straight line drawn on a map long ago, by people who never needed to drive that road.", "Now, number two is a city that is not in Russia, though Russia runs it, and it sends people into space.", "Number two: Baikonur. It is a city inside Kazakhstan that is leased to and run by Russia.", "It is where Yuri Gagarin's rocket lifted off in 1961, and it is still a working launch site today.", "The land belongs to Kazakhstan, but Russia pays rent to use it, and the Russian space programme runs the launches.", "So you can stand in Kazakhstan, and watch a Russian rocket carry astronauts to the space station.", "Entering the city comes with its own rules, and visitors need permission, even though it sits inside Kazakhstan.", "If you like strange places like these, subscribe, because we find a new one every single day.", "A whole city, rented out like a flat, and rockets leave from it. Strange, but there is one left.", "Number one is in India, close to home, and it is a border where you cannot even see the line.", "Number one: Sir Creek. On your map of Gujarat's far west, a border runs straight into a tidal marsh.", "Sir Creek is a long, narrow channel of water, where the Rann of Kutch meets the Arabian Sea.", "On one side is Gujarat, in India. On the other side is Sindh, in Pakistan.", "But this is not a neat river with two clear banks. It is a maze of mud flats, reeds and salt water.", "Twice a day the tide floods the marsh, then drains it, and the shape of the channels keeps changing.", "Silt builds up, channels shift, and a patch of mud can appear in one season and vanish in another.", "Now try drawing a permanent line through that. That is the whole problem, and it has lasted for decades.", "The story starts before 1947. This land was split between Kutch, a princely state, and Sindh, a province of British India.", "In 1914 the Bombay government settled a dispute between them, with a resolution, and maps to go with it.", "Pakistan reads those papers as putting the line on the eastern edge of the creek, which would make the whole channel Pakistani.", "India reads them differently. It says the line runs down the middle of the channel, and points to a 1925 map with pillars set along it.", "There is even a name for that idea, the thalweg: a border that follows the middle of the main channel.", "Pakistan argues that rule applies only to waterways that ships really use, and says this creek is not one of them.", "Both sides have a serious argument. It all comes down to which part of a muddy channel the line sits in.", "In 1965 the two countries clashed in the nearby Rann of Kutch, and a tribunal later ruled on that area in 1968.", "But Sir Creek was not settled by that ruling, so it stayed open, and it is still open today.", "Talks have gone on for decades, and the line has still not been agreed by both countries.", "And because the channels shift, the question gets harder every year. Which channel was the creek, and where is its middle now?", "Fishermen feel it most. These waters are full of fish, and boats from both sides can drift across a line nobody can see.", "Gujarat fishermen have often been arrested by Pakistan, and Pakistani fishermen by India, for crossing a line that was never clear.", "Border guards patrol in boats, through salt flats and tidal water where there is very little except mud and sky.", "And it matters far beyond mud. Where the creek line ends helps decide where the sea border starts.", "That means one muddy bend, barely visible on a map, shapes who controls a large patch of the Arabian Sea.", "That is why this is India's strangest border. It is not a wall or a fence, just a line that moves with the water.", "So remember where we started: your map of Gujarat ends in a border that runs through mud.", "Seven borders, and not one of them makes sense. But the last one cannot even sit still.", "Next video: a place where your phone picks up a signal from the wrong country."], "job": ""}, {"date": "2026-11-25", "kind": "Short", "category": "geography", "title": "Your Selfie Can Be on a Waterfall's Edge", "hook": "Your selfie here can be on the edge.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At Victoria Falls on the Zambia-Zimbabwe border, the Devil's Pool is a natural rock pool right at the edge of the drop. It is only reachable when the river runs low. Part of the Places That Shouldn't Exist series.\n\n#Shorts #VictoriaFalls #PlacesThatShouldntExist", "script": ["Your selfie here can be on the edge.", "This is Victoria Falls, on the Zambia-Zimbabwe border.", "The Devil's Pool is a natural rock pool.", "It sits right at the edge of the drop.", "A rock lip keeps swimmers from going over.", "It only opens when the river runs low.", "Then people swim up and look straight down.", "That is your selfie, right on the edge.", "Tomorrow: the world's tallest statue."], "job": ""}, {"date": "2026-11-25", "kind": "Short", "category": "geography", "title": "India's Statue Is Taller Than Statue of Liberty", "hook": "Your photo here shows the world's tallest statue.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Statue of Unity in Gujarat stands 182 metres tall, the world's tallest statue and almost double the height of the Statue of Liberty. It honours Sardar Vallabhbhai Patel, who helped unite India's princely states. Part of the Places That Shouldn't Exist series.\n\n#Shorts #StatueOfUnity #India", "script": ["Your photo here shows the world's tallest statue.", "This is the Statue of Unity, in Gujarat.", "It stands 182 metres tall.", "That is almost double the Statue of Liberty.", "It honours Sardar Vallabhbhai Patel.", "He helped unite India's princely states into one country.", "You can even ride a lift up inside.", "Your photo shows the tallest statue on Earth.", "Tomorrow: another place that should not exist."], "job": ""}, {"date": "2026-11-25", "kind": "Short", "category": "space", "title": "Your ISS Window Looks Down on the Aurora", "hook": "Your ISS window looks down on the aurora.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "From the International Space Station, astronauts fly over the aurora and photograph its green ripple from above. On Earth we look up at it, but from orbit you look down. Part of the series: If You Were in Space.\n\n#Shorts #Space #Aurora", "script": ["Your ISS window looks down on the aurora.", "Glowing green curtains of light, rippling below.", "Astronauts fly straight over them.", "On Earth, you have to look up.", "From orbit, you look down instead.", "The green glow comes from oxygen high up.", "Charged particles from the Sun make it shine.", "So up there, the aurora is below you.", "Next: a rocket that lands itself."], "job": ""}, {"date": "2026-11-25", "kind": "Short", "category": "space", "title": "A Rocket Landed Itself Standing Upright", "hook": "Your rocket booster lands upright on its own legs.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In December 2015, SpaceX's Falcon 9 first stage touched down upright on a landing pad. It was the first orbital rocket booster to do it. Before that, boosters were thrown away after one flight.\n\n#Shorts #SpaceX #Rockets", "script": ["Your rocket booster lands upright on its own legs.", "In December 2015, Falcon 9 did exactly that.", "Its first stage touched down standing on a pad.", "First orbital rocket ever to manage it.", "Before that, boosters were thrown away.", "Imagine throwing away a jet after one flight.", "Now the same boosters fly again.", "So yes, a rocket can park itself.", "Tomorrow: a disc that floats on nothing."], "job": ""}, {"date": "2026-11-25", "kind": "Short", "category": "technology", "title": "A Disc That Hangs in Mid-Air Over a Magnet", "hook": "Your superconductor can hang in mid-air.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Cool a superconductor and it can float above a magnet and lock in place. This is called quantum locking, and the disc can even hang upside down. It works because magnetic field lines get pinned inside the superconductor.\n\n#Shorts #Physics #Technology", "script": ["Your superconductor can hang in mid-air.", "Cool it down, and put it near a magnet.", "It floats, and then it locks in place.", "Push it, tilt it, even flip it upside down.", "It stays exactly where you left it.", "This is called quantum locking.", "Magnetic field lines get pinned inside it.", "A disc frozen in mid-air, no strings.", "Tomorrow: money made of giant stone."], "job": ""}, {"date": "2026-11-26", "kind": "Long video", "category": "geography", "title": "Why Kutch Is Stranger Than You Think", "hook": "Your Gujarat map hides a 96 kilometre creek that India and Pakistan still argue over, because the water around it keeps moving.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Sir Creek is a tidal channel between Gujarat and Pakistan where India and Pakistan still disagree on where the border runs. This video explains why, and tours the strange land around it: a salt desert that turns into a sea, swimming camels, the Harappan city of Dholavira and an 1819 earthquake that raised a wall of land.\n\n#SirCreek #Kutch #IndiaFacts", "script": ["Your Gujarat map hides a 96 kilometre creek that India and Pakistan still argue over, because the water around it keeps moving.", "That border runs through mud and mangroves, where the water changes shape with every tide.", "By the end of this video, you will see exactly why a single line on a map can be so hard to draw.", "But first, the region around it is just as strange. It is called Kutch, and it is the largest district in India.", "Here is what is coming: a desert that turns into a sea, camels that swim, and a city older than most countries.", "And an earthquake that built a wall across a river. Stay for the last one, because Sir Creek is the strangest of all.", "First, the White Rann. In winter it looks like a snowfield, a flat white plain of salt that runs all the way to the horizon.", "But it is not snow. It is a salt marsh, and in the monsoon, water spreads over it until the plain becomes a shallow sea.", "Then the water dries up, the salt is left behind, and the white desert appears again. Same place, two completely different maps.", "So a map of this place is never really finished. Whatever you draw in July is wrong by December.", "Keep that in mind. A land that flips between sea and desert is exactly where a border becomes hard to fix.", "Next, a fact that sounds fake. In Kutch, there is a breed of camel that swims in the sea.", "They are called Kharai camels. Kharai means salty, and these camels eat the leaves of mangroves growing on islands off the coast.", "During the monsoon, herds swim out to those mangrove islands and can stay there for days, eating.", "Experts say they can swim about three kilometres through salt water. A camel, in the sea, paddling its way to lunch.", "Local herding communities have looked after them for generations, but coastal industry has cut into the mangroves they depend on.", "So the breed is now classed as threatened. A swimming camel sounds like a joke, but it is a real and fragile animal.", "Stranger things sit under the ground nearby. And one of them is a city that planned for every drop of rain.", "Dholavira. Imagine a city in the middle of a salt desert that was built around saving water.", "It sits on an island in the Rann, and it is one of the great cities of the Harappan civilisation.", "UNESCO made it a World Heritage Site in 2021, the first Harappan site in India to get that honour.", "The people here built big stone reservoirs and channels to catch rain and store it, thousands of years ago.", "The streets followed a plan, and the city was divided into separate parts. This was serious engineering.", "And it even had a signboard. Archaeologists found large letters of the Harappan script, and nobody has been able to read them.", "Think about that. A message from thousands of years ago, in a script still unread, in the middle of the Rann.", "If you like strange places and facts that sound fake but are true, subscribe. We post a new one every day.", "The next one explains why this whole region has the shape it does. It happened on a single day in 1819.", "In June 1819, a huge earthquake hit Kutch. Scientists estimate its magnitude at about seven point seven.", "A long ridge of land rose up, and local people named it Allah Bund, which means the dam of God.", "It ran for many kilometres across the old river channels and dammed the water that used to flow through them.", "Nearby, Sindri Fort partly sank, and the ground around it filled with water to form a lake.", "Some accounts say the lower mouth of that river became a tidal inlet, and that inlet is now called Kori Creek.", "And on 26 January 2001, Republic Day, another earthquake hit near Bhuj, the main city of Kutch.", "So this land is still moving. Rivers, shorelines and creeks here are not fixed lines, and that matters for the last chapter.", "The last chapter is about a creek two countries cannot agree on. But there is one more strange thing first.", "Here is a thing about time. Your clock shows the same time in Kutch and in Arunachal Pradesh.", "But the sun does not agree. Kutch is in the far west and Arunachal is in the far east, so the sun reaches them almost two hours apart.", "India uses one time, Indian Standard Time, across the whole country. So the sunrise in the east comes while Kutch is still dark.", "In Kutch, the evening sun sets late by the clock, and it stays light long after the east has gone dark.", "It is one more way this corner of India feels like the edge of the map. And at the very edge, there is a creek.", "Now the big one. Sir Creek. It is a narrow channel of water, about 96 kilometres long, in the marshes between Gujarat and Pakistan's Sindh.", "On a map, it looks like a thin blue crack running into the Arabian Sea. On the ground, it is mud, mangroves and tides.", "Patrols here often move by boat, because the land floods and the mud can swallow a boot.", "So why do India and Pakistan disagree? Because one simple question has two answers: where exactly does the border run in this water?", "Is it along the eastern bank, which would give the whole creek to Pakistan? Or right down the middle of the water?", "The story starts before 1947. Kutch was a princely state, and Sindh was part of British India, under the Bombay government.", "In 1914, the Bombay government issued a resolution to settle a border argument between Sindh and the ruler of Kutch.", "That document has two paragraphs that seem to pull in different directions. One points toward the eastern bank.", "The other uses a rule called the thalweg principle, which puts the border in the middle of the main navigable channel.", "Thalweg is a German word for the line of the deepest channel. Creeks move, and the middle moves with them.", "In the 1920s, pillars were placed along the creek's mid-channel, and a map from 1925 shows that line.", "India says that map settles it. The border is in the middle, and that is where India's claim stands.", "Pakistan says the thalweg rule should not apply, because in its view the creek is not navigable, so the east bank is the line.", "India disagrees. It says the creek is navigable for much of the year, so the mid-channel rule applies.", "So both sides are reading from the same old papers, and both can point to a line in them.", "Now the part that sounds fake. The creek itself changes. Tides push mud, silt builds up, and channels shift over the years.", "A border drawn in the middle of a channel is a border that wants to move when the channel moves.", "That is the problem with water. A fence stays where you build it. A creek will not.", "The creek is more than a few lines on a map. It also helps decide where the sea border begins.", "Analysts say that where the land border meets the sea, a small shift in the line can change a large area of water.", "That water matters. It holds fishing grounds, and analysts say there may be oil and gas under the seabed too.", "Fishermen feel the dispute the most. Boats drift across an invisible line, and crews on both sides have been arrested for it.", "Out there, the line is not painted anywhere. A boat can cross it without anyone on board knowing.", "Talks have gone on for decades. India and Pakistan have discussed Sir Creek in rounds of official talks, and it is still unresolved.", "It is in the news again. In recent years, Indian leaders have spoken sharply about Sir Creek and security in the area.", "There is history here too. In 1965, a clash in the nearby Rann of Kutch led to fighting between the two countries.", "In 1968 a tribunal ruled on the Rann of Kutch border, but the dispute over Sir Creek never fully went away.", "So let us pull it together. Sir Creek is a border that depends on a word, a pillar, and a channel of water.", "Two old paragraphs, pillars from the 1920s, and a creek that moves. That is enough to keep a dispute alive for decades.", "So go back to the first line. Your Gujarat map hides a creek India and Pakistan still argue over, because the water keeps moving.", "A salt desert that becomes a sea, swimming camels, a sign nobody can read, and a quake that built a wall.", "All of that sits in one stretch of India, and all of it ends at one muddy creek.", "Next time: the country whose clocks run fifteen minutes ahead of India's. Watch it, and see how a clock can feel like a border."], "job": ""}, {"date": "2026-11-26", "kind": "Short", "category": "geography", "title": "The Island Where Money Was Giant Stone", "hook": "Your payment on Yap can be a stone disc.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On the Pacific island of Yap, huge stone discs called rai stones were used as money. Some are taller than a person. Ownership could change without the stone ever moving. Part of the series: Places That Shouldn't Exist.\n\n#Shorts #Geography #Yap", "script": ["Your payment on Yap can be a stone disc.", "Yap's rai stones were real money.", "Some are taller than a person.", "You couldn't carry them to a shop.", "Ownership was just agreed and remembered.", "A stone could change owners without moving.", "Like a bank transfer, but in rock.", "Your wallet suddenly feels light.", "Tomorrow: a town where you need a rifle."], "job": ""}, {"date": "2026-11-26", "kind": "Short", "category": "geography", "title": "The Town Where You Carry a Rifle for Bears", "hook": "Your walk outside Longyearbyen comes with a rifle.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Longyearbyen, in Norway's Svalbard, polar bears live beyond the edge of town. Leave the settlement and you're expected to carry protection, usually a rifle. Part of the series: Places That Shouldn't Exist.\n\n#Shorts #Svalbard #Geography", "script": ["Your walk outside Longyearbyen comes with a rifle.", "It's a town in Norway's Arctic Svalbard.", "Beyond town, polar bears roam.", "So you're expected to carry a rifle.", "Tourist groups hire guides who carry rifles.", "Signs at the edge of town warn about bears.", "Some shops ask you to leave rifles outside.", "Leave town, and you're in bear country.", "Tomorrow: a post office floating on a lake."], "job": ""}, {"date": "2026-11-26", "kind": "Short", "category": "geography", "title": "India's Post Office That Floats on a Lake", "hook": "Your Srinagar letter can be posted from a houseboat.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On Dal Lake in Srinagar, there's a post office housed on a houseboat. You can post letters and postcards from the water. It's India's floating post office. Part of the series: Places That Shouldn't Exist.\n\n#Shorts #Srinagar #DalLake", "script": ["Your Srinagar letter can be posted from a houseboat.", "It's the floating post office on Dal Lake.", "A real post office, built on a houseboat.", "Yes, you can mail letters from the water.", "Tourists love sending postcards from it.", "Boats glide up to its counter.", "India's only floating post office.", "So your letter starts its trip on water.", "Tomorrow: more places that sound fake."], "job": ""}, {"date": "2026-11-26", "kind": "Short", "category": "space", "title": "Your Spaceship Rode Piggyback On A Jumbo Jet", "hook": "Your spaceship used to ride piggyback on a jet.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "NASA really carried the space shuttle orbiter on top of a modified Boeing 747 called the Shuttle Carrier Aircraft. It flew shuttles across the US, and one still sits on top of its jet in Houston. Series: Wait, What? Space.\n\n#Shorts #Space #NASA", "script": ["Your spaceship used to ride piggyback on a jet.", "NASA bolted the orbiter onto a modified Boeing 747.", "It flew across America like that.", "Shuttles often landed in California, far from Florida.", "The jet carried them back to Florida.", "Its real name: Shuttle Carrier Aircraft.", "Today one sits in Houston, shuttle still on top.", "Yes, a spaceship really rode piggyback on a jet.", "Tomorrow: a liquid that grows spikes."], "job": ""}, {"date": "2026-11-26", "kind": "Short", "category": "technology", "title": "Your Magnet Makes This Liquid Grow Spikes", "hook": "Your magnet can make a black liquid grow spikes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Ferrofluid is a liquid full of tiny magnetic particles. Bring a magnet close and it rises into spikes, then relaxes when the magnet moves away. NASA researchers developed it in the 1960s.\n\n#Shorts #Science #Technology", "script": ["Your magnet can make a black liquid grow spikes.", "Bring a magnet near, and spikes appear.", "This black liquid is called ferrofluid.", "It is oil full of tiny magnetic particles.", "The magnet pulls every particle toward it.", "Together they form a spiky crown.", "Remove the magnet and the spikes melt away.", "NASA researchers invented it in the 1960s.", "So yes, a liquid really grows spikes.", "Tomorrow: a German town inside Switzerland."], "job": ""}, {"date": "2026-11-27", "kind": "Long video", "category": "geography", "title": "6 Borders That Make No Sense (One Just Stops)", "hook": "Your map of India has a border that just stops, and nobody ever wrote down where it goes next.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Six real borders that look fake on a map, from a road that stops for airplanes to a village that uses two currencies. The last one is India's strangest: the Line of Control ends at a point called NJ9842, and the agreement only says 'thence north to the glaciers', which leaves the Siachen area undefined. Watch to the end to see why two armies still stand on that ice.\n\n#borders #india #geography", "script": ["Your map of India has a border that just stops, and nobody ever wrote down where it goes next.", "By the end, you will see where that line ends, and why two armies still sit on the ice.", "But first, five borders from around the world that make no sense. Each one is stranger than the last.", "Some cut across runways. Some leave towns trapped inside other countries. One leaves a piece of America reachable only through Canada.", "And the last one is ours. A single point on the map, with a code name: NJ9842.", "Let's start with a road where cars have to stop for airplanes.", "Number six. Your drive into Gibraltar from Spain goes straight across an airport runway.", "Gibraltar is a small British territory on the southern tip of Spain, with a famous rock and a very short border.", "The land is so tight that the runway had to be built right across the main road.", "When a plane is about to land or take off, barriers come down and the cars wait.", "Walkers, scooters and buses all stop together, and a jet rolls past just metres from the queue.", "Then the barriers lift, and you carry on into a different country, as if nothing happened.", "Imagine a border crossing where the biggest delay is a plane overhead.", "That is strange. But the next one is a whole town in the wrong country.", "Number five. Your map of Llívia shows a Spanish town sitting inside France.", "Llívia is not on the Spanish side of the Pyrenees. It is surrounded by French land, a few kilometres from Spain.", "The reason goes back to a treaty in 1659, when Spain handed France a set of villages.", "But Llívia was counted as a town, not a village, so on paper it was never handed over.", "So it stayed Spanish, and a small road now links it to Spain through French territory.", "You can stand in a Spanish town, look in any direction, and see only France.", "A single word in an old treaty did that, and the map still shows it today.", "Now imagine that, but the trapped place is a village that uses two different currencies.", "Number four. Your shopping in Büsingen could be paid in euros or in Swiss francs.", "Büsingen is a German village, but it sits completely inside Switzerland, with Swiss land around it on every side.", "Germany owns the village, yet it is also treated as part of the Swiss customs area.", "So shops there commonly take both euros and Swiss francs. One village, one street, two money systems.", "The story is a mix of old land deals and old borders that nobody bothered to tidy up.", "Nobody redrew it, and so a German village is today a tiny island inside Switzerland.", "Open the map and you can trace it. A small German shape, wrapped in Swiss land.", "Next, a place in America that you can only reach by going through another country.", "Number three. Your map of Minnesota has a piece of America that sits north of the rest.", "It is called the Northwest Angle, and it is the only part of the main United States above the 49th parallel.", "The border there was drawn from an old map that got the rivers and lakes wrong.", "When the real land was surveyed, the line had to take a strange jump around Lake of the Woods.", "The result is a patch of American land, with lake water between it and the rest of Minnesota.", "You can drive there only by going through Canada, or you can cross the lake by boat.", "Residents have to deal with border rules just to reach the rest of their own country.", "So a road trip home can mean leaving the United States and coming back in.", "If you enjoy strange places like these, subscribe, because tomorrow there is another one.", "The next one is a region of Europe that is not connected to its own country.", "Number two. Your map of Kaliningrad shows a Russian region with no land border to the rest of Russia.", "It sits on the Baltic coast, squeezed between Poland and Lithuania, far from the Russian mainland.", "Before 1945, this was the German city of Königsberg. After the Second World War, the Soviet Union took it.", "Then the Soviet Union broke up, and Lithuania became its own country.", "Suddenly, Russia had a region that could be reached by land only by crossing another country.", "That is why people reach it by air, by sea, or by land only through other countries.", "A Russian address, and the nearest Russian land is on the far side of other nations.", "Imagine a part of Gujarat that you could reach only by passing through another country.", "Five strange borders so far, and all of them have one thing in common: somebody drew a line.", "But the last one is different. This time, nobody finished drawing the line.", "Number one. Your map of the Line of Control stops at a point called NJ9842.", "Not a city. Not a river. Just a code on a map, in the high Himalayas.", "In 1949, India and Pakistan signed the Karachi Agreement, which marked a ceasefire line across Kashmir.", "Later, after the 1971 war, the Simla Agreement turned it into the Line of Control.", "The line was described point by point, across mountains, rivers and passes.", "Then the description reaches NJ9842, and after that, the precise points simply run out.", "The last words of the agreement are: thence north to the glaciers.", "That is it. No coordinates, no landmarks, no peaks. Just north, towards the ice.", "The people who wrote it believed the terrain was so brutal that nobody would ever fight there.", "Nobody lived on those glaciers. No roads, no farms, no reason to argue about a line.", "So they left it open, and a gap on a map became a very real problem.", "This is the top of the map, where Kashmir meets the Karakoram, some of the highest land on Earth.", "At the end of that gap sits the Siachen Glacier, one of the longest glaciers outside the polar regions.", "Both India and Pakistan read those few words differently, and each said the glacier was theirs.", "In April 1984, India launched Operation Meghdoot and moved soldiers on to the main ridges of the glacier.", "Pakistan then sent troops to the lower ground, and the glacier turned into a frozen front line.", "It became known as the highest battlefield in the world, with posts far above the clouds.", "Soldiers there live in snow and ice for months, with air so thin that every step is hard.", "Temperatures can fall far below freezing, and winds can turn a storm into a wall of white.", "Reports say far more soldiers have died from avalanches and cold than from gunfire.", "Helicopters bring food, fuel and letters, because a road cannot exist on moving ice.", "A ceasefire has held on the glacier since 2003, but the soldiers remain, because neither side wants to leave first.", "The two armies' positions have their own name: the Actual Ground Position Line, or AGPL.", "So there are two lines. The one on paper that ends, and the real one, held by people on ice.", "Imagine a border where the two sides disagree not on a river, but on a few words in a sentence.", "Look at the map, and the Line of Control stops at the top. That ending is NJ9842.", "A frozen front line, and years of standoff, all because of one code and five vague words.", "So that is the strangest border in India: a line that does not end on a river, a peak or a wall.", "It ends in a sentence. Five words that say go north, and leave the rest to the ice.", "Back to where we started. Your map of India has a border that just stops, and now you know where.", "Where that line stops, two armies still stand on ice that moves, guarding a place that no agreement ever named.", "Tomorrow: another place on the map that should not exist."], "job": ""}, {"date": "2026-11-27", "kind": "Short", "category": "geography", "title": "Your Walk Here Enters Europe From Africa", "hook": "Your short walk here crosses from Africa into the EU.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Ceuta and Melilla are Spanish cities on Africa's northern coast, surrounded by Morocco. They are the EU's only land borders with Africa, marked by tall fences. Series: Places That Shouldn't Exist.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your short walk here crosses from Africa into the EU.", "Ceuta and Melilla sit on Africa's coast.", "Both belong to Spain, not Morocco.", "Moroccan land surrounds both cities.", "A tall fence marks the border.", "They are the EU's only land borders with Africa.", "Spain has held Melilla since 1497.", "So you can stand in Africa, yet be in the EU.", "Tomorrow: a German town inside Switzerland."], "job": ""}, {"date": "2026-11-27", "kind": "Short", "category": "geography", "title": "A German Town Surrounded By Switzerland", "hook": "Your drive here is Germany, with Switzerland on every side.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Büsingen am Hochrhein is a German town completely surrounded by Swiss territory. It even has its own car plate prefix, BÜS. Series: Places That Shouldn't Exist.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your drive here is Germany, with Switzerland on every side.", "Büsingen is a German town.", "Swiss land surrounds it completely.", "On the map, it looks like a tiny pocket.", "Its car plates start with BÜS.", "Fewer than two thousand people live there.", "German address, but Swiss land all around.", "That is a German pocket inside Switzerland.", "Tomorrow: a rocket caught by giant arms."], "job": ""}, {"date": "2026-11-27", "kind": "Short", "category": "space", "title": "A Giant Rocket Was Caught By Metal Arms", "hook": "Your rocket booster just got caught by giant metal arms.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In October 2024, SpaceX's Super Heavy booster returned to its launch tower and was caught mid-air by the arms nicknamed the chopsticks. It had no landing legs. Series: Wait, What? Space.\n\n#Shorts #SpaceX #Starship", "script": ["Your rocket booster just got caught by giant metal arms.", "In October 2024, SpaceX tried something wild.", "Its Super Heavy booster flew back to the tower.", "Two giant arms, called chopsticks, closed around it.", "No landing legs. No landing pad.", "The booster was caught in mid-air.", "Catching it makes reuse faster.", "Yes, giant arms really caught a rocket.", "Tomorrow: India's mark on the Moon."], "job": ""}, {"date": "2026-11-27", "kind": "Short", "category": "space", "title": "India's Rover Stamped Its Logo On The Moon", "hook": "Your Ashoka emblem is pressed into the Moon's soil.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "ISRO's Pragyan rover, which landed on the Moon with Chandrayaan-3 in 2023, had wheels designed to imprint the ISRO logo and the Ashoka emblem into the lunar soil as it rolled. Series: Wait, What? Space.\n\n#Shorts #ISRO #Chandrayaan3", "script": ["Your Ashoka emblem is pressed into the Moon's soil.", "India's Pragyan rover landed on the Moon.", "Its wheels carried the ISRO logo.", "They also carried the Ashoka emblem.", "Every roll pressed them into the lunar soil.", "There is no wind on the Moon to wipe them.", "Chandrayaan-3 landed near the Moon's south pole.", "India was the first country to land there.", "So India's mark really sits on the Moon."], "job": ""}, {"date": "2026-11-27", "kind": "Short", "category": "technology", "title": "A Robot Suit Makes Paralysed Legs Walk", "hook": "Your legs can walk without your spine's help.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Exoskeletons like ReWalk use motors at the hips and knees so a person with a spinal cord injury can stand and take steps. Videos of it are easy to find online. Real technology that feels like science fiction.\n\n#Shorts #Technology #Exoskeleton", "script": ["Your legs can walk without your spine's help.", "A robot suit does the stepping for you.", "Suits like ReWalk strap onto the legs.", "Motors bend the hips and knees.", "A person with spinal paralysis stands up.", "Then they take real steps, on camera.", "You can watch it in videos online.", "Legs that can't move, walking again.", "So yes, your legs can walk without your spine. Tomorrow: a beach under landing jets."], "job": ""}, {"date": "2026-11-28", "kind": "Long video", "category": "geography", "title": "Why Siachen Is Stranger Than You Think", "hook": "Your map of the Line of Control stops at a point called NJ9842, and nobody wrote down exactly where it goes next.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Line of Control on your map stops at a point called NJ9842, and the 1949 agreement only says it runs 'thence north to the glaciers'. This video walks through six true facts about Siachen: how a vague sentence became the highest battlefield on Earth, the 1984 race for the ridges, the brutal cold, and one soldier's six days under the snow. Watch to the end to see why that gap on the map is still open today.\n\n#Siachen #LineOfControl #StrangeFacts", "script": ["Your map of the Line of Control stops at a point called NJ9842, and nobody wrote down exactly where it goes next.", "That missing stretch sits on the highest battlefield on Earth, where soldiers have died for decades, mostly from cold and snow.", "By the end, you'll see six strange facts about Siachen, and the last one explains why this gap is still open.", "Stay for the final fact, because it comes down to five words written in 1949 and never fixed.", "First, let's find that point. Open any map of India and Pakistan and follow the Line of Control north.", "The line crawls through the mountains of Kashmir, and then, near the top, it simply stops.", "That is not a printing error in your atlas. That is exactly how the agreement was written.", "Fact one: a real border on a real map ends at a spot called NJ9842, and then it just stops.", "NJ9842 is a map grid reference, a tiny dot high in the Karakoram mountains.", "It comes from the Karachi Agreement of 1949, signed by Indian and Pakistani army officers after the first war over Kashmir.", "United Nations military observers were sent to watch over that ceasefire line.", "They marked the ceasefire line carefully, point by point, all the way up to NJ9842.", "After that point, the agreement says only one thing: the line runs thence north to the glaciers.", "Read that again. No coordinates, no peaks, no valleys. Just north, to the glaciers.", "Why so vague? The usual explanation is simple: nobody believed anyone would ever want that frozen land.", "In 1972, after another war, the Simla Agreement set up the Line of Control, and the line still ended at NJ9842.", "So one of the most watched borders in the world has a loose end, hidden in plain sight on a map.", "Let's see how that loose end turned into a fight.", "Fact two: the argument did not start with soldiers. It started with maps and mountain climbers.", "The words north to the glaciers can be read in more than one way, and the two countries read them differently.", "India says the line should follow the natural watershed, along a mountain wall called the Saltoro Ridge.", "Pakistan's reading, shown on some maps, runs the line from NJ9842 toward the Karakoram Pass instead.", "Between those two lines lies the Siachen Glacier, over seventy kilometres long, one of the longest glaciers outside the polar regions.", "In the la
