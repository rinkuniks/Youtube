rns them into cursor movement. Series: Facts That Sound Fake.\n\n#Shorts #Neuralink #Technology", "script": ["Your brain can move a cursor without your hand.", "Neuralink patients did it in public demo videos.", "They live with paralysis and use only thought.", "A tiny implant reads signals from the brain.", "Those signals become cursor movement on screen.", "Patients have even played chess this way.", "No mouse, no hands, just intention.", "Your brain really can move a cursor.", "Tomorrow: a sky that flashes lightning almost every night."], "job": ""}, {"date": "2026-11-16", "kind": "Long video", "category": "geography", "title": "The US-Mexico Border Is Stranger Than You Think", "hook": "Your hug through a metal fence is real, and that fence runs straight into the sea.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A fence you can hug through that runs into the Pacific, clocks that follow the border, a bridge from America to a Mexican airport, and a river that forced two countries to swap land. These are true facts about the US-Mexico border, from Friendship Park near San Diego and Tijuana to El Paso and Ciudad Juarez. Watch to the end for the strangest one.\n\n#geography #borders #facts", "script": ["Your hug through a metal fence is real, and that fence runs straight into the sea.", "At Friendship Park, families meet through thick mesh, while the US-Mexico border walks right into the Pacific Ocean.", "By the end of this video, you will see five more things about this border that sound fake but are true.", "One is a bridge that lets you walk from America straight into an airport in Mexico.", "Another is a river that moved, and forced two countries to argue over one patch of land for about a hundred years.", "Stay for the last one. It changed the map in 1967, and you can still see the proof today.", "First, the fence in the sea. Friendship Park sits where San Diego in America meets Tijuana in Mexico.", "It is inside Border Field State Park, right at the corner where the border meets the Pacific Ocean.", "The park was dedicated in 1971 by First Lady Pat Nixon, and the barrier back then was a simple wire fence.", "She said she hoped there would not need to be a fence at all one day. That did not happen.", "Over the years the barrier became stronger, and a fine metal mesh now covers the spot where families meet.", "Families split by the border walk up to this mesh from both sides, and talk through the tiny holes.", "People have pressed fingers through the holes, held hands, and on some days even shared a hug.", "On the Mexican side, the plaza is open to everyone. On the American side, visiting has long been limited.", "Now look at the end of the fence. It does not stop at the beach. It walks right into the waves.", "Metal poles stand in the surf, and the Pacific washes straight through the border without asking anyone.", "This whole border is more than three thousand kilometres long, running from this beach all the way to the Gulf of Mexico.", "It touches four American states and six Mexican states. And along the way, it gets stranger.", "Next, two towns that share one name, and a wall running right between them.", "Second, look at Nogales. There is a Nogales in Arizona, and a Nogales in Sonora, Mexico.", "A tall fence runs down the middle, and the name means walnut trees in Spanish.", "Both towns grew up around the same railway crossing, so they started life as one place.", "Further west, Calexico in California and Mexicali in Mexico have names that mix both countries together.", "Calexico is California plus Mexico. Mexicali is Mexico plus California. Each name is a mirror of the other.", "Many families have relatives on both sides, and cross every day for work, school and shopping.", "San Ysidro, near San Diego, is one of the busiest land crossings in the world.", "Two cities, joined in their names, and divided by a steel wall you can see from either street.", "That was the easy part. The next one is about time itself, and it breaks a rule you probably trust.", "Third, a time rule that bends around the border.", "In October 2022, Mexico ended daylight saving time for most of the country. Those clocks stopped changing.", "But the cities along the border were allowed to keep changing their clocks, to match the United States.", "So Tijuana still moves its clocks with San Diego, while Mexico City, far away, stays put all year.", "That makes sense, because so many people cross every day. One shared clock keeps school and work simple.", "We in India run one time for the whole country. Here, the border decides whose clock a town follows.", "A border that changes your clock is odd. But the next one lets you walk to a plane in another country.", "Fourth, a walkway that crosses a border. It is called the Cross Border Xpress.", "It is a covered bridge linking a terminal in San Diego with the international airport in Tijuana.", "It opened in December 2015, and it lets travellers cross the border without ever stepping out onto a street.", "You buy a ticket, pass the border checks, walk across the bridge, and you arrive inside the Mexican airport.", "Many travellers use it to fly from Tijuana, because the airport is only a short walk from the American side.", "So here, the border is not a fence. It is a hallway inside a building, with a plane waiting at the end.", "If you like strange places that sound fake but are true, subscribe, because we find a new one every day.", "And now, a nation whose homeland the border cut in two, long before most of us were born.", "Fifth, a people who lived here before the border existed. They are the Tohono O'odham Nation.", "Their traditional homeland stretched across what is now southern Arizona and northern Sonora, in the Sonoran Desert.", "In the 1850s, the Gadsden Purchase moved the border through their land, and the homeland ended up in two countries.", "Today the Nation's reservation in Arizona touches the border for a long stretch, and members live on both sides.", "On much of that land there is no tall wall, only low vehicle barriers that stop cars but not walkers.", "Tribal leaders have long said a full wall would cut families, ceremonies and sacred places in two.", "So here, the line was drawn straight through a living community, and it is still felt every single day.", "India has villages like this too, and you may have heard of some. But the next one is a children's game.", "Sixth, a playground that crossed the border. Three bright pink seesaws did it.", "In July 2019, designers Ronald Rael and Virginia San Fratello fitted seesaws into the border wall near El Paso.", "The wall there has gaps between steel slats. They pushed the long pink planks right through those gaps.", "People on the American side and the Mexican side went up and down on the very same plank.", "When someone pushed down on one side, someone in the other country went up. That was the whole point.", "It lasted only a short time, but the photos travelled the world, and you can still look them up.", "A playground made of steel slats and pink paint. And the last story is bigger than all of these.", "Seventh, a river that moved, and a border that had to move with it.", "First, the line itself. It was drawn after a war, and in 1848 a treaty gave America land that was once Mexico's.", "Mexico lost roughly half of its territory then, and in Texas the line follows the middle of the Rio Grande.", "But rivers wander. After a flood in 1864, the Rio Grande jumped south near El Paso and Ciudad Juarez.", "Suddenly a patch of land called the Chamizal was on the American side, though Mexico said it belonged to them.", "The two countries argued about that one patch for about a hundred years. Imagine a dispute lasting a full century.", "In 1963 they signed a deal, and in 1967 America handed the land back to Mexico.", "To stop the river wandering again, the Rio Grande there was forced into a straight concrete channel.", "Today you can see that straight concrete river on a satellite map, with El Paso on one side and Juarez on the other.", "A national memorial park now stands on the American side to mark the Chamizal settlement, so the proof is real.", "So a hug through a fence, clocks that follow a border, a bridge to a plane, and a river that moved land.", "Remember the hug through the fence, where the border walks into the sea? That was only the start of how strange this line is.", "Tomorrow: another place that sounds fake, but is real. Come back for it."], "job": ""}, {"date": "2026-11-16", "kind": "Short", "category": "geography", "title": "The Sky That Has Lightning Hundreds of Nights", "hook": "Your night sky here flashes with lightning hundreds of nights a year.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Where the Catatumbo River meets Lake Maracaibo in Venezuela, thunderstorms light up the night sky on hundreds of nights a year. Sailors once used the flashes as a natural lighthouse. Series: Places That Shouldn't Exist.\n\n#Shorts #Venezuela #Geography", "script": ["Your night sky here flashes with lightning hundreds of nights a year.", "This is Lake Maracaibo in Venezuela.", "It happens where the Catatumbo River meets it.", "The storms return night after night.", "Sailors once used it as a natural lighthouse.", "The flashes can be seen from far away.", "Very few places on Earth storm this often.", "Your night sky really can flash that much.", "Tomorrow: a cave with crystals as long as a bus."], "job": ""}, {"date": "2026-11-16", "kind": "Short", "category": "geography", "title": "The Cave With Bus-Sized Crystal Beams", "hook": "Your torch here lights crystal beams nearly as long as a bus.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Cave of the Crystals in Naica, Mexico holds giant white gypsum beams, the biggest around eleven meters long. The cave is dangerously hot and humid, so people cannot stay long without protective gear. Series: Places That Shouldn't Exist.\n\n#Shorts #Mexico #Geography", "script": ["Your torch here lights crystal beams nearly as long as a bus.", "This is the Cave of the Crystals in Mexico.", "The beams are solid white gypsum.", "The biggest are around eleven meters long.", "They grew slowly, deep underground.", "But the cave is dangerously hot and humid.", "People need protective gear to stay inside.", "Your torch lights a cave you cannot survive in.", "Tomorrow: Street View filmed by sheep."], "job": ""}, {"date": "2026-11-16", "kind": "Short", "category": "geography", "title": "Sheep Filmed Street View of Faroe Islands", "hook": "Your Street View here was filmed by sheep.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Faroe Islands lacked Google Street View coverage, so locals strapped solar-powered 360 cameras onto sheep and made Sheep View 360. It really happened. Series: Places That Shouldn't Exist.\n\n#Shorts #FaroeIslands #Geography", "script": ["Your Street View here was filmed by sheep.", "This is the Faroe Islands.", "Locals strapped 360 cameras onto sheep.", "Each camera had a solar panel on top.", "The islands lacked Street View coverage.", "So they made Sheep View 360 themselves.", "Google later added its own coverage too.", "Sheep really mapped these islands first.", "Tomorrow: water spraying into space from Saturn's moon."], "job": ""}, {"date": "2026-11-16", "kind": "Short", "category": "space", "title": "Saturn's Moon Sprays Ice Into Space", "hook": "If you stood on Enceladus, ice would spray into space beside you.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Saturn's moon Enceladus shoots water ice into space from cracks at its south pole. NASA's Cassini spacecraft flew through the plumes and photographed them. Series: If You Were in Space.\n\n#Shorts #Space #Saturn", "script": ["If you stood on Enceladus, ice would spray into space beside you.", "The jets burst from cracks at its south pole.", "Water erupts and freezes into tiny ice grains.", "NASA's Cassini flew straight through the plumes.", "It photographed the jets spraying outward.", "The water appears to come from an ocean below.", "That spray is real water from another world.", "Ice really sprays into space from Enceladus.", "Tomorrow: a man flying with jet engines."], "job": ""}, {"date": "2026-11-16", "kind": "Short", "category": "technology", "title": "A Man Really Flies With Jet Engines", "hook": "Jet engines on your arms can really make you fly.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Richard Browning of Gravity Industries flies using jet engines on his arms and back, and the footage shows him in the air. He steers by moving his arms. Series: Facts That Sound Fake.\n\n#Shorts #JetSuit #Technology", "script": ["Jet engines on your arms can really make you fly.", "His name is Richard Browning.", "He founded a company called Gravity Industries.", "Engines on his arms and back lift him.", "He steers just by moving his arms.", "The footage shows him high in the air.", "No wings and no cockpit.", "Jets on your arms really can fly you.", "Tomorrow: another fact that sounds completely fake."], "job": ""}, {"date": "2026-11-17", "kind": "Long video", "category": "geography", "title": "7 Borders That Make No Sense, Ending in Sikkim", "hook": "Your Nathu La visit puts you a few steps from Chinese soldiers, and that is the last border on this list.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A countdown of seven real borders that look fake on the map: a road through Canada to reach America, a Spanish town inside France, a German village on Swiss money, and more. The last stop is Nathu La in Sikkim, where Indian visitors can stand metres from Chinese soldiers.\n\n#borders #geography #nathula", "script": ["Your Nathu La visit puts you a few steps from Chinese soldiers, and that is the last border on this list.", "Here are seven real borders, each one stranger than the one before. Every one of them is on the map today.", "One road leaves a country and comes back without turning. One village is German, but sits inside Switzerland.", "One road was shut for aeroplanes. And one border is a ceremony that happens every evening.", "By the end, you will see why the pass at Nathu La is the strangest of them all.", "Let us start the countdown, with a piece of America that you cannot reach by driving through America.", "Number seven: Point Roberts, in Washington state. It is part of America, but you cannot drive there from America.", "The border follows the 49th parallel, a straight line on the map that ignores the shape of the land.", "That line cuts across a small peninsula, so the tip ended up American while everything around it stayed Canadian.", "To reach Point Roberts by road, you drive into Canada first. Then you drive out again, back into the United States.", "Residents cross borders just to reach the rest of their own country. Shopping, doctors and work can all mean a queue.", "Boats and small planes can get there without touching Canada. But for most people, the road runs through another country.", "When the border closed to non-essential travel in 2020, this small community felt it hard.", "Imagine living in your own country, and needing a passport to get home from the shops.", "A straight line drawn on paper in 1846 still decides how these people live today.", "That was a line cutting through land. Next, a town that was left behind when a whole region changed hands.", "And that town sits beside a road that belongs to nobody.", "Number six: Llívia. It is a Spanish town sitting inside France, high in the Pyrenees mountains.", "Walk out of town in any direction and you step onto French land. The rest of Spain is a short distance away.", "It goes back to a treaty in 1659, when Spain handed France a number of villages in this area.", "But Llívia counted as a town, not a village. So the treaty skipped it, and it stayed Spanish.", "One word in a treaty left a Spanish town stranded inside France, and nobody has changed it since.", "Today a road links Llívia to Spain. That strip of road is treated as neutral ground.", "Both countries are in the Schengen area, so you drive through with no border check, yet you still cross French land.", "The town has Spanish rules and Spanish street signs, with France on every side.", "How can a single word in a treaty still matter after hundreds of years? Because borders stick.", "The next one is even stranger, because this time the village is German, but the country around it is Switzerland.", "And its shops run on Swiss money.", "Number five: Büsingen am Hochrhein. A German village that is separated from the rest of Germany by Swiss land.", "It sits on the Rhine river, with Swiss fields and Swiss towns all around it, yet it is legally German.", "German law applies there, and people vote in German elections, but the village sits inside the Swiss customs area.", "That means shops and businesses there widely use Swiss francs as well as euros.", "A German village on Swiss money, inside a Swiss customs area, with German law. That is a tangled border.", "Locals can walk into a Swiss town in minutes, and still be crossing a border on paper.", "The border here is no great wall or fence. It is mostly a line on a map and small markers.", "Most days nothing looks different. That is exactly what makes it so strange.", "You could pass through without noticing, and only a sign tells you which country's law applies.", "Now for number four, where the border and an airport share one road.", "And yes, that road used to cross the runway.", "Number four: Gibraltar. A British territory at the southern tip of Spain, with a huge rock you can spot from far away.", "To enter from Spain, you walk or drive over the border, and then you meet a runway.", "For years, the main road to the border, Winston Churchill Avenue, crossed the airport runway at ground level.", "When a plane was about to land or take off, barriers came down and the road simply closed.", "Cars, buses and people waited while an aeroplane passed right in front of them.", "If you like strange places like this, subscribe, because there are more of them coming.", "In 2023, a tunnel opened for everyday traffic, so cars now go under the east end of the runway.", "Pedestrians and cyclists can still use the runway crossing, so the strange sight has not fully disappeared.", "The reason is simple: Gibraltar is tiny, and there was almost no flat land for an airport.", "Spain also claims Gibraltar, so this small border carries an argument that has run for a very long time.", "Next, a piece of America that you reach through Canada, because of a mapmaker's mistake.", "Number three: the Northwest Angle in Minnesota. It is the only part of the lower 48 states north of the 49th parallel.", "It sits on Lake of the Woods, and by road you must drive through Canada to reach it.", "Like Point Roberts, it is American land that you reach through Canada.", "The story goes back to 1783, when a treaty described the border using a map that was wrong.", "That map showed the Mississippi river beginning much farther north and west than it really does.", "When the real source was found, the treaty line no longer made clean sense, and this corner was left over.", "In the end the corner stayed American, a small patch of land cut off by lakes and forest.", "Many visitors come by boat across the lake, or by plane.", "One wrong map from the 1700s still decides how you travel there today.", "Now we move to India, with a border that is strange because of what happens there every evening.", "Two armies that rarely agree on anything perform together, and thousands of people come to watch.", "Number two: Wagah-Attari, the road crossing between Amritsar in India and Lahore in Pakistan.", "Every evening at sunset, crowds gather on both sides, and the soldiers put on a loud, high-kicking show.", "Border guards from both countries march to the line with stiff steps, big boots and fierce looks.", "It is called the Beating Retreat ceremony, and it has been performed for decades.", "The crowds cheer, chant and wave flags, almost like a cricket match, but with soldiers.", "Then the flags of both countries are lowered at the same time, and the gates are shut.", "Two countries that have fought wars still perform a daily ceremony, side by side, with a gate between them.", "It is a rivalry and a performance in the same few metres, and everybody knows the steps.", "Many Indians have sat in those stands and felt a strange mix of pride, noise and a border they could see.", "But there is one Indian border with no show and no crowd, only a fence and a few metres.", "Number one is high in the Himalayas, and it is the highest border on this list.", "Number one: Nathu La, in Sikkim. It is a mountain pass at more than fourteen thousand feet.", "On the other side is Tibet, which is part of China. The border runs right across the pass.", "Indian visitors with a permit can drive up from Gangtok and reach the border point. This visit is for Indian citizens.", "And when you get there, you stand metres away from Chinese soldiers, with a fence between you.", "Indian and Chinese guards stand on either side, close enough to see each other's faces.", "This pass was once part of an old trade route between India and Tibet.", "After the 1962 war, it was shut. It reopened for trade in 2006, after decades.", "Trade stopped again around 2020, and it has restarted after about six years.", "So the same few metres hold soldiers, tourists and traders, in a place most of us only know from a map.", "That is what makes it the strangest: a military border that is also a trading post and a tourist stop.", "From a road through Canada to a fence in the clouds, every one of these borders is real.", "Your Nathu La visit puts you a few steps from Chinese soldiers. Next video: more places on the map that look fake but are real."], "job": ""}, {"date": "2026-11-17", "kind": "Short", "category": "geography", "title": "Your Desert Fills With Blue Lagoons", "hook": "Your desert here fills with blue lagoons every year.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Lençóis Maranhenses in northern Brazil looks like a desert of white dunes. After the rains, freshwater lagoons fill the gaps between them. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your desert here fills with blue lagoons.", "This is Lençóis Maranhenses, in northern Brazil.", "Those white dunes look like a desert.", "Then the rainy season arrives.", "Rainwater collects between the dunes.", "Rock beneath the sand traps the water.", "Freshwater lagoons appear, blue against white sand.", "Your desert turns blue, then dries again.", "Tomorrow: a fence across Australia."], "job": ""}, {"date": "2026-11-17", "kind": "Short", "category": "geography", "title": "Your Map Shows a 5,600 km Dog Fence", "hook": "Your map of Australia shows one fence about 5,600 km long.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Dingo Fence in Australia is about 5,600 km long. It was built to keep wild dogs out of the sheep country to its south. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Australia #PlacesThatShouldntExist", "script": ["Your map of Australia shows one fence.", "It runs about 5,600 kilometres.", "It is called the Dingo Fence.", "It was built to keep wild dogs out.", "Behind it lies Australia's sheep country.", "Dingoes hunt sheep, so farmers walled them off.", "It is among the longest structures on Earth.", "Your map shows one fence across a continent.", "Tomorrow: a moon bigger than a planet."], "job": ""}, {"date": "2026-11-17", "kind": "Short", "category": "space", "title": "Jupiter's Moon Is Bigger Than Mercury", "hook": "If you flew to Jupiter, you'd find a moon bigger than Mercury.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Ganymede, a moon of Jupiter, is wider than the planet Mercury and is the largest moon in the Solar System. Mercury is still the heavier of the two. Part of the series If You Were in Space.\n\n#Shorts #Space #IfYouWereInSpace", "script": ["Fly to Jupiter and you'd find a moon bigger than Mercury.", "This moon is called Ganymede.", "It is wider than the planet Mercury.", "It is the largest moon in the Solar System.", "Mercury still weighs more, though.", "Ganymede is mostly ice and rock.", "It even has its own magnetic field.", "Your Moon looks small beside it.", "Tomorrow: a giant heart on Pluto."], "job": ""}, {"date": "2026-11-17", "kind": "Short", "category": "space", "title": "Your Photo of Pluto Shows a Giant Heart", "hook": "Your photo of Pluto shows a giant heart.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2015, NASA's New Horizons flew past Pluto and photographed a heart-shaped region called Tombaugh Regio. Its left side is a plain of nitrogen ice. Part of the series If You Were in Space.\n\n#Shorts #Pluto #Space", "script": ["Your photo of Pluto shows a giant heart.", "NASA's New Horizons flew past in 2015.", "It photographed a bright, heart-shaped region.", "That region is named Tombaugh Regio.", "Its left side is a plain of nitrogen ice.", "Nitrogen is also most of the air you breathe.", "On Pluto, it is frozen solid.", "A heart drawn in ice, billions of kilometres away.", "Tomorrow: a man who flew across the sea."], "job": ""}, {"date": "2026-11-17", "kind": "Short", "category": "technology", "title": "He Crossed the Sea on a Jet Board", "hook": "Your hoverboard dream flew across the English Channel in 2019.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2019, Franky Zapata tried to cross the English Channel on his jet-powered Flyboard Air. His first attempt ended in the water. On the second try he made it to England.\n\n#Shorts #Technology #Hoverboard", "script": ["Your hoverboard dream flew across the English Channel.", "Franky Zapata stood on a jet-powered board.", "It is called the Flyboard Air.", "In 2019, he tried to cross the English Channel.", "His first attempt failed at a refuel stop.", "He fell into the water.", "Days later, he tried again.", "This time, he landed in England.", "Tomorrow: a perfectly round hole in the ocean."], "job": ""}, {"date": "2026-11-18", "kind": "Long video", "category": "geography", "title": "Why Nathu La Is Stranger Than You Think", "hook": "Your permit to Sikkim's border pass puts you metres from Chinese soldiers, and only Indians can go.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Nathu La in Sikkim is a high Himalayan pass where Indian and Chinese soldiers stand on either side of a wire fence. In this video we go through seven true facts about it: Sikkim's days as a kingdom, the old Silk Road route, the years it was shut, who is allowed to visit, and the soldier people still talk about.\n\nSubscribe for more places and facts that sound fake but are true.\n\n#NathuLa #Sikkim #IndiaChinaBorder", "script": ["Your permit to Sikkim's border pass puts you metres from Chinese soldiers, and only Indians can go.", "That is Nathu La, a mountain gap above four thousand metres, where two armies stand on either side of one wire fence.", "You will learn why this pass stayed shut for decades, and why soldiers honour a man who died in 1968.", "We start in Sikkim, a place that was not even part of India until 1975.", "The biggest surprise is saved for last, because it is the fence itself. Stay till the end.", "Seven facts, each one stranger than the last. We begin at the bottom of the mountain.", "Fact one. Sikkim was a separate Himalayan kingdom, ruled by a king called the Chogyal.", "The Chogyal's family ruled for centuries, and Gangtok was its capital, the same city tourists start from today.", "Even after India became independent in 1947, Sikkim did not simply become an Indian state.", "India protected it and handled its defence, but Sikkim kept its own king and its own flag.", "Then in 1975, the people of Sikkim voted, and the kingdom became a state of India.", "So the road to Nathu La runs through a land that was a kingdom within living memory.", "Sikkim is tiny, yet it touches three other countries: China, Nepal and Bhutan.", "It is also home to Kangchenjunga, the third highest mountain on Earth, visible from Gangtok on a clear day.", "And in 2016, Sikkim became India's first fully organic state, a fact most visitors never hear.", "But that old doorway between India and Tibet is exactly what makes our next fact so strange.", "Fact two. Nathu La sits on an old branch of the Silk Road, linking Tibet with India.", "For centuries, traders walked this track with mules, carrying wool, silk and other goods over the mountains.", "On the way up, you pass Tsomgo Lake, a high mountain lake that freezes over in winter.", "Prayer flags line the roadside, fluttering in the cold wind as the bends get sharper.", "The pass itself is above four thousand metres, higher than Darjeeling or Shimla.", "At this height the air holds noticeably less oxygen, so tourists often get headaches and breathe hard on arrival.", "Even climbing a short flight of stairs can leave you gasping for breath.", "Snow often covers the road for long stretches, and soldiers must stay posted here through the winter.", "And this pass was not always open. For many years, nobody could cross it at all.", "Fact three. After the 1962 war between India and China, Nathu La was closed to trade.", "The old route that had carried goods for generations simply went quiet.", "The border stayed sealed for more than forty years, and the mountain track sat empty.", "For people on both sides, that meant a trade link of generations was cut.", "It finally reopened in 2006, with trade between India and China through the pass again.", "But do not imagine a busy market. Trade here is limited to certain goods and certain days.", "Traders cross only at set times, and only with the right paperwork.", "So the pass that once carried Silk Road caravans now handles a small, tightly controlled trickle.", "Next comes a rule that surprises many visitors, because not everyone is allowed to see this border.", "Fact four. Nathu La is open to tourists, but only Indian citizens may visit.", "Foreign passport holders are not allowed up, and reports say that includes OCI card holders.", "Indian visitors need a special permit, which you arrange through the tourism office in Gangtok.", "Army posts line the road, and your permit is checked before you are allowed to go higher.", "Visits are limited to certain days of the week, so check with Sikkim tourism before you plan.", "Carry a photo ID and warm clothes, and be patient, because the checks take time.", "The result is odd: a live border where families come on holiday and take selfies.", "If you like strange places and facts that sound fake but are true, subscribe, because there is more like this coming.", "Now fact five shows how tense things once got up here.", "Fact five. In 1967, Indian and Chinese troops fought each other right here at Nathu La.", "It was one of the rare clashes between the two armies, and it happened on this narrow pass.", "The two sides also faced a standoff in 2017 at Doklam, a plateau not far from Nathu La.", "Yet today, the same border has something no one would expect from soldiers who once fought.", "On some national days, officers from both armies meet at the border and exchange sweets.", "So the same few metres of ground have seen gunfire in one era and mithai in another.", "That does not mean the border is relaxed. Both sides keep soldiers posted all year.", "Think about that contrast the next time you hear the word border.", "Next is a soldier whose story is told on this mountain, even though he died decades ago.", "Fact six. Near Nathu La, there is a shrine to Baba Harbhajan Singh, an Indian soldier.", "Accounts say he died in 1968 after falling into a fast stream while leading a mule train.", "Soldiers believe his spirit never left, and that he still warns them of danger in their dreams.", "Whatever you believe, the shrine is real, and soldiers and visitors both stop there to pay respect.", "Faith or folklore, it shows how lonely and hard life on a high border can be.", "Many Nathu La trips include a stop at his shrine, so you can see this for yourself.", "Now for the last fact, the one I promised at the start.", "Fact seven. At the top, the border is a simple wire fence.", "On one side stand Indian soldiers. On the other side, just metres away, stand Chinese soldiers.", "You can stand on the Indian side and watch them watching you.", "There is no giant concrete wall, no huge gate, just a fence, a line and a few uniforms.", "Nathu La is one of the few border passes where India and China have allowed trade across.", "Together, India and China are home to billions of people, and here the line between them is a wire.", "In winter, temperatures at this height fall below freezing, and soldiers stand there in thick jackets.", "The pass is also a pilgrim route. Indian pilgrims heading to Kailash Mansarovar travel over it into Tibet.", "In 2017, after the Doklam standoff, China did not allow pilgrims through Nathu La, and the route reopened in 2018.", "So this gate between two giant countries opens and closes with politics, not weather.", "Let us go back to where we began: your permit, a vehicle from Gangtok, and a short walk uphill.", "At the top is a fence, and on the other side stand Chinese soldiers, close enough that you can see their faces.", "A kingdom, a Silk Road track, forty years shut, and now a live border you can visit.", "Your permit, a wire fence, and Chinese soldiers just metres away. That is Nathu La.", "Next in this series: the neighbour whose clocks run fifteen minutes ahead of India."], "job": ""}, {"date": "2026-11-18", "kind": "Short", "category": "geography", "title": "Your Drone Sees a Perfect Hole in the Sea", "hook": "Your drone view of Belize shows a perfectly round hole in the ocean.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Great Blue Hole off Belize is a giant marine sinkhole, about 300 m across, set inside a reef. It formed on land long ago and was flooded as sea levels rose. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Belize #PlacesThatShouldntExist", "script": ["Your drone sees a perfect dark circle in the sea.", "It is called the Great Blue Hole.", "It is about 300 metres across.", "It sits inside a reef, in shallow turquoise water.", "It is a sinkhole, flooded by the sea.", "It formed on land, before the ocean rose.", "Divers say it is over 120 metres deep.", "A perfect circle, hiding in the sea.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-11-18", "kind": "Short", "category": "geography", "title": "Your Winter Road Is a Frozen River", "hook": "Your winter road in Ladakh is a frozen river.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In winter, the Zanskar river in Ladakh freezes over and becomes a walking path. Locals call walking on it the Chadar trek. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Ladakh #Chadar", "script": ["Your winter road in Ladakh is a frozen river.", "The Zanskar river freezes into a white path.", "Locals walk on it and call it Chadar.", "Chadar means blanket, a blanket of ice.", "For villagers, this ice was the winter road.", "Today trekkers walk it too.", "Every step is on a river, frozen over.", "Your winter road in Ladakh is a frozen river.", "Next: a staircase thirteen storeys deep."], "job": ""}, {"date": "2026-11-18", "kind": "Short", "category": "geography", "title": "A 13-Storey Staircase Into the Ground", "hook": "Your staircase here goes thirteen storeys straight down.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Chand Baori in Rajasthan is a stepwell with about 3,500 steps arranged in perfect geometric patterns. It drops 13 storeys down. Part of the Places That Shouldn't Exist series.\n\n#Shorts #ChandBaori #Rajasthan", "script": ["Your staircase here goes thirteen storeys straight down.", "This is Chand Baori, in Rajasthan.", "It has about 3,500 steps.", "The steps form perfect zigzag patterns.", "It's a stepwell, built to reach water.", "People climbed down these steps to fetch it.", "It is over a thousand years old.", "Thirteen storeys down, all made of steps.", "Next: a comet shaped like a duck."], "job": ""}, {"date": "2026-11-18", "kind": "Short", "category": "space", "title": "A Real Comet That Looks Like a Rubber Duck", "hook": "Your rubber duck has a twin floating in space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Comet 67P, visited by the European Space Agency's Rosetta probe in 2014, has two lobes joined by a thin neck, so it looks like a rubber duck. Rosetta orbited it for about two years and sent down a lander named Philae.\n\n#Shorts #Comet #Space", "script": ["Your rubber duck has a twin in space.", "It is a real comet called 67P.", "Two lumps joined by a thin neck.", "Scientists think two comets gently stuck together.", "Europe's Rosetta probe reached it in 2014.", "It then orbited the comet for two years.", "It even sent down a lander, Philae.", "Your rubber duck has a twin in space.", "Next: sound that makes water float."], "job": ""}, {"date": "2026-11-18", "kind": "Short", "category": "technology", "title": "Sound Waves Can Make Water Float", "hook": "If you aim sound the right way, water floats in mid-air.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Acoustic levitation uses sound waves to hold small droplets and beads in mid-air. Two opposing waves create still spots where light objects get trapped. It is real and you can see it on camera.\n\n#Shorts #Science #Technology", "script": ["If you aim sound right, water floats.", "Tiny droplets hang in mid-air, doing nothing.", "Small beads float there too.", "It's called acoustic levitation.", "Sound is pressure pushing on air.", "Two opposing waves create still spots.", "Small objects get trapped in those spots.", "Sound you can't hear holds them up.", "Next: watch one sunset twice."], "job": ""}, {"date": "2026-11-19", "kind": "Long video", "category": "geography", "title": "6 Borders That Break Logic (The Last Is in India)", "hook": "Your watch jumps forward half an hour when you walk through one gate in India, and nobody stops you.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Six real borders that sound fake but are true, from a lake with no agreed border to a Spanish town inside France. The countdown ends at Bhutan Gate in Jaigaon, where you walk from India into Phuentsholing, Bhutan, and the clock jumps forward half an hour. Watch to the end for the one border you can actually visit.\n\n#borders #geography #bhutan", "script": ["Your watch jumps forward half an hour when you walk through one gate in India, and nobody stops you.", "That gate is number one in a countdown of six real borders that make no sense.", "On the way, you will see a road that closes for planes, and a town trapped inside another country.", "By the end, you will know why a simple gate in West Bengal beats every one of them.", "Each border is stranger than the last, so keep watching, because number one is a place you can actually visit.", "We start with a lake that three countries share, and have never agreed how to divide.", "Number six: a lake where the border simply does not exist on paper.", "This is Lake Constance, in the heart of Europe, where Germany, Austria and Switzerland all touch the water.", "On a map, the shoreline looks perfectly clear. Three countries, one big blue lake in the middle.", "But out on the water, there is no agreed border between the three. Not in the middle, not near the shore.", "The countries have never signed a deal to split the lake, and each one has a different view.", "Some say the lake should be shared like common property. Others want it cut into three slices.", "Meanwhile, ferries, sailboats and swimmers cross it every day, and nobody checks a single passport.", "Picture a cricket ground where nobody agrees where the boundary rope goes. Players just carry on playing.", "Practical rules for shipping and fishing do exist, but the border line itself is still left open.", "So a lake you can see from a plane has a border that only exists in arguments.", "Having no border is odd. But the next one has a clear border, and it still makes no sense.", "Number five: a town that belongs to Spain, but sits completely inside the country of France.", "It is called Llívia, a small town in the Pyrenees. Drive out in any direction, and you are in France.", "To find out why, go back to 1659, when Spain and France signed the Treaty of the Pyrenees.", "Spain agreed to give France a group of villages. But Llívia was officially a town, not a village.", "So it stayed Spanish. One single word in an old treaty drew this border.", "A short road, treated as neutral ground, connects Llívia to the rest of Spain.", "Think of it as a Spanish island, but with French land around it instead of sea.", "People there live in Spain, yet every neighbouring village around them is in France.", "Borders are just decisions people wrote down long ago, and sometimes they hang on one word.", "Number four: a road that has to stop and wait for airplanes to pass.", "This is Gibraltar, a British territory at the southern tip of Spain, with its own land border.", "To enter Gibraltar from Spain, on foot or by car, you cross the airport runway itself.", "Yes, the main road, Winston Churchill Avenue, cuts straight across the runway where planes land.", "When a plane is about to land or take off, barriers come down and the traffic simply waits.", "Cars, bikes and people stand there, a few metres from a jet, waiting for it to pass.", "So you can wait in a queue at a border, and then wait in another queue for an airplane.", "Gibraltar is small, with very little flat land, so the runway and the road had to share space.", "Spain also claims Gibraltar, so the same road crosses a disputed border and a runway together.", "Few borders in the world make you check for airplanes before you step across.", "Number three: a town in the United States that you can only reach by going through Canada.", "If you enjoy strange places like this, subscribe now, because the best ones are still coming.", "It is called Point Roberts, in Washington state, on a small piece of land that hangs below Canada.", "In 1846, the United States and Britain agreed that the border would follow the forty-ninth parallel.", "A straight line on a map. But that line cut through the tip of this peninsula and left it with the US.", "So the land is American, but the road out of it leads only into Canada.", "To drive to the rest of Washington state, you cross into Canada, and then cross back into the US.", "That means two border checks, just to go from one American place to another American place.", "It is like going from one Indian city to another and having to cross a foreign country in the middle.", "A straight line drawn in 1846 is still causing travel headaches today.", "Number two: a German town where people use Swiss money and drive cars with a special plate.", "This is Büsingen am Hochrhein, a town of Germany that is completely surrounded by Switzerland.", "Germany is the country, but the nearest German land is not next door. Swiss land lies all around the town.", "Büsingen is part of the Swiss customs area, even though it belongs to Germany.", "That means shops there use Swiss francs a lot, along with the euro.", "Cars from Büsingen carry their own number plate code, B-U-S, which you will not see anywhere else in Germany.", "So a German town has Germany's flag, Swiss money, and Swiss neighbours in every direction.", "Its people vote in German elections, yet they shop and trade inside a Swiss customs zone.", "A whole town lives in a mixed world: German law, Swiss customs, and two currencies.", "That is strange. But number one is stranger, because it is not hidden in the mountains. It is a normal Indian market town.", "Number one: a gate in West Bengal where India ends and a different country begins.", "The Indian town is Jaigaon. The Bhutanese town right next to it is Phuentsholing.", "They sit side by side, with shops, hotels and traffic on both sides of the same line.", "In the middle stands Bhutan Gate, a big arch in traditional Bhutanese style.", "Walk through it, and you are in Bhutan. In town, that gate is the border marker most people notice.", "Indian and Bhutanese citizens move across freely, with no long queue at the arch.", "Indians do not need a visa, and you can walk around Phuentsholing without a permit. Going deeper needs one from the immigration office.", "Now the strange part. Bhutan keeps its own time, thirty minutes ahead of India.", "So when your Indian clock says ten o'clock, the clock on the Bhutan side says ten thirty.", "One step through the gate, and half an hour appears out of nowhere.", "Your phone may even switch network and update its time on its own as you cross.", "Money gets mixed too. Bhutan's currency, the ngultrum, is fixed one to one with the Indian rupee.", "Indian rupees are accepted in Bhutan, so many shopkeepers there will take your notes without a fuss.", "Both countries drive on the left, so the traffic flows straight through the town without a change.", "On the Indian side, the Sashastra Seema Bal guards the border. On the other side, Bhutan's own police.", "Many people shop and work on both sides, and cross the line several times a day.", "Most borders in this video are mistakes of history. This one works like a friendship, and it shows in the street.", "A gate, a half-hour time jump, and two currencies that match. A border that makes no sense, in the best way.", "Now think back to number six, five and the rest. None of them lets you swap countries as easily as this.", "Remember where we began? Your watch jumps forward half an hour when you walk through one gate in India.", "That gate is Bhutan Gate in Jaigaon, and the country on the other side is Bhutan.", "Which of these six borders surprised you the most? Tell me in the comments below.", "Next video: five places where your phone picks the wrong country all on its own."], "job": ""}, {"date": "2026-11-19", "kind": "Short", "category": "geography", "title": "Watch the Same Sunset Twice in Dubai", "hook": "Your sunset in Dubai can happen twice in one evening.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At the Burj Khalifa in Dubai you can watch the sun set from the ground, ride the elevator up, and see it set again from the top. The tower is 828 metres tall, so the horizon drops as you rise. Part of the Places That Shouldn't Exist series.\n\n#Shorts #BurjKhalifa #Dubai", "script": ["Your sunset in Dubai can happen twice.", "Watch the sun set from the ground.", "Then ride the elevator to the top.", "The Burj Khalifa is 828 metres tall.", "From up there, you can see the sun again.", "You are higher, so the horizon drops.", "The sun slips below it a second time.", "Your sunset in Dubai happens twice.", "Next: a drive that goes underground for twenty minutes."], "job": ""}, {"date": "2026-11-19", "kind": "Short", "category": "geography", "title": "A Road Tunnel You Drive 20 Minutes Through", "hook": "Your drive in Norway goes underground for twenty minutes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Lærdal Tunnel in Norway is 24.5 km long, the longest road tunnel in the world. Driving through takes around 20 minutes. Blue-lit caverns along the way break up the long drive. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Norway #LaerdalTunnel", "script": ["Your drive in Norway goes underground for twenty minutes.", "This is the Lærdal Tunnel.", "It is 24.5 kilometres long.", "That makes it the longest road tunnel in the world.", "So engineers added caverns lit in blue.", "They break up the endless grey tunnel.", "Cars drive through a mountain for miles.", "Your drive in Norway goes underground for twenty minutes.", "More places that shouldn't exist, coming soon."], "job": ""}, {"date": "2026-11-19", "kind": "Short", "category": "space", "title": "NASA Crashed Into an Asteroid and Moved It", "hook": "Your planet once crashed a spacecraft into an asteroid on purpose.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2022 NASA's DART spacecraft hit the asteroid Dimorphos on purpose. It shortened the little moon's orbit around Didymos by about 32 minutes. It was the first time humans changed the motion of a space object.\n\n#Shorts #Space #NASA", "script": ["Your planet once crashed a spacecraft into an asteroid on purpose.", "It was NASA's DART mission, in 2022.", "The target was a small moonlet, Dimorphos.", "DART hit it head-on at huge speed.", "Its orbit around Didymos got shorter.", "By about thirty-two minutes.", "Humans had moved a space object for the first time.", "That crash may protect your planet one day.", "Tomorrow: the fastest thing humans ever built."], "job": ""}, {"date": "2026-11-19", "kind": "Short", "category": "space", "title": "The Probe That Touched the Sun at 692,000 km/h", "hook": "Your fastest human-made object touched the Sun.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "NASA's Parker Solar Probe flew through the Sun's corona and reached about 692,000 km/h in December 2024. It is the fastest human-made object ever. It survives on a heat shield built for the job.\n\n#Shorts #Space #NASA", "script": ["Your fastest human-made object touched the Sun.", "It's NASA's Parker Solar Probe.", "It flew through the Sun's blazing outer atmosphere.", "In December 2024, it hit about 692,000 kilometres per hour.", "That's the fastest anything we've ever built.", "Delhi to Mumbai in a few seconds.", "A thick heat shield keeps it alive.", "Your fastest object touched the Sun.", "Tomorrow: a laser that burns drones from the sky."], "job": ""}, {"date": "2026-11-19", "kind": "Short", "category": "technology", "title": "India's Laser Burns Drones Out of the Sky", "hook": "Your drone can be burnt out of the sky by a laser.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2025 India's DRDO tested a 30-kilowatt laser weapon that brought down drones. The beam is invisible light and it heats the drone until it fails. It's a big step for India's defence tech.\n\n#Shorts #Technology #India", "script": ["Your drone can be burnt out of the sky by a laser.", "India's DRDO tested this in 2025.", "It's a thirty-kilowatt laser weapon.", "The beam stays on the drone.", "The drone heats up and fails.", "Then it drops out of the sky.", "No missile needed, just a beam of light.", "Your drone met a laser, and lost.", "Tomorrow: a highway tunnel through the Himalayas."], "job": ""}, {"date": "2026-11-20", "kind": "Long video", "category": "geography", "title": "Why Bhutan Is Stranger Than You Think", "hook": "Your watch gains thirty minutes when you walk through one gate in Jaigaon, and nobody stops you.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Walk through Bhutan Gate in Jaigaon and you step from India into Phuentsholing, Bhutan, with a 30-minute time jump and no wall in between. This video covers seven true facts about Bhutan: its time zone, its forests, Gross National Happiness, the late arrival of TV, a capital with no traffic lights, the Paro airport, and a mountain no one has climbed.\n\n#Bhutan #GeographyFacts #StrangePlaces", "script": ["Your watch gains thirty minutes when you walk through one gate in Jaigaon, and nobody stops you.", "That gate leads from India into Bhutan, a country with no traffic lights in its capital and a ban on climbing its mountains.", "By the end, you will see a mountain nobody has ever climbed, and why the rule keeping it that way is so strict.", "But first, we start at the gate, because it is one of the strangest border crossings you can walk in a minute.", "Stay with me, because every fact here is a little stranger than the one before it.", "Chapter one. In West Bengal, the Indian town of Jaigaon sits right beside the Bhutanese town of Phuentsholing.", "The line between them is a gate, called Bhutan Gate. Walk through it on foot and you have left India.", "There is no river and no wall. The streets and shops simply carry on, on the other side of the arch.", "Indian citizens do not need a visa for Bhutan. They need an entry permit, which can be collected at the border.", "Even your money works. Bhutan's ngultrum is tied one to one with the Indian rupee, and rupees are widely accepted.", "So you can pay in rupees, in a different country, a few steps from where you started.", "Phuentsholing is the main road gateway into Bhutan. From here, travellers begin the long drive up into the mountains to Thimphu.", "Many visitors say the Bhutanese side feels calmer and cleaner within minutes of crossing. Same street level, different feeling.", "Chapter two. Bhutan runs on a time that is thirty minutes ahead of Indian Standard Time.", "India sits at plus five thirty from universal time. Bhutan sits at plus six. One gate, one half hour.", "So a phone that updates itself can jump forward by half an hour while you are buying a cup of tea.", "The same time on a wall clock can mean two different moments, depending on which side of the arch you stand.", "Nepal has its own odd offset too, forty-five minutes past the hour, but Bhutan's is a clean half hour.", "That was the mild one. The next fact is about how Bhutan treats its forests.", "Chapter three. Bhutan takes in more carbon dioxide than it releases. It calls itself carbon negative.", "Most countries cannot say that. Bhutan can, mainly because forests cover most of its land.", "Its constitution says at least sixty percent of the country must stay under forest cover.", "That is not a slogan on a poster. It is written into the highest law of the land.", "Those forests are home to tigers, red pandas and snow leopards, animals most people only meet in documentaries.", "Bhutan also makes electricity from hydropower, using fast rivers that rush down from the Himalayas.", "It even sells extra power to India, so some lights in Indian homes run on Bhutanese rivers.", "A small mountain kingdom is helping to power its giant neighbour, and it all connects back to that little gate.", "Now something more personal. Bhutan measures how happy its people are, and it does so on purpose.", "Chapter four. Most countries track money. Bhutan also tracks happiness, and calls it Gross National Happiness.", "The idea is linked to the fourth king of Bhutan, who talked about it in the 1970s.", "He said happiness matters more than gross national product. That was a bold thing for a king to say.", "Today the government looks at health, education, time use, culture and a healthy environment, not only income.", "Policies are meant to be checked against this idea, not just against how much money they make.", "That does not make everyone happy. Many young Bhutanese leave to find work abroad, and the country knows it.", "But the idea is real, and very few countries put it at the centre of their planning.", "Even the national sport, archery, feels more like a festival, with teams, singing and dancing at the matches.", "If you like strange places and facts that sound fake, subscribe, because there is plenty more like this coming.", "Bhutan also opened up to the world very late. Until 1999, there was no television in the country at all.", "Think about that. India already had cable channels in the nineties, while Bhutan was still living without a screen.", "In 1999 the king allowed television and the internet, and Bhutan became one of the last countries to get TV.", "Leaders worried what a flood of foreign shows would do to local culture and old traditions.", "Imagine the first village evening when a glowing screen switched on in a room that had never seen one.", "Today many Bhutanese understand Hindi, partly thanks to Bollywood films and Indian channels.", "Which makes the next fact feel even stranger, because it is about the roads of the capital.", "Chapter five. Thimphu, the capital of Bhutan, has no traffic lights.", "Reports say lights were tried once in the late nineties, and people did not like them.", "They were taken away, and a police officer went back to directing cars by hand.", "An officer stands at a junction, raising his arms and turning his body to guide every car.", "Visitors film it like a performance. It is a job, a tourist stop and a traffic system, all at once.", "It works because Thimphu is small, with far fewer cars than cities like Delhi or Mumbai.", "Picture your own city with no signals, no wall of honking, and one person in charge of the whole junction.", "Bhutan also keeps tourism small with a daily fee, which has been 1,200 rupees per night for Indian visitors.", "Chapter six. Paro is Bhutan's only international airport, and it sits in a deep valley between high peaks.", "Pilots cannot simply line up and land as they do at Delhi. They must follow a curved path between mountains.", "Only a small group of specially trained pilots can land here, and it is known as one of the hardest airports.", "Flights here depend on daylight and good weather, because there is almost no room for a mistake.", "From the window you can see houses, rice fields and monasteries close enough to count.", "Bhutan's national airline is Drukair, and Druk means thunder dragon.", "Bhutan's own name for itself is Druk Yul, the land of the thunder dragon.", "Those peaks around the airport are high, but the biggest one in Bhutan is stranger than all of them.", "Chapter seven, the one I promised. Bhutan has a mountain that no human has ever climbed.", "It is called Gangkhar Puensum, and at about seven thousand five hundred metres, it is the highest unclimbed mountain on Earth.", "A few expeditions tried in the 1980s. None of them reached the top.", "Then in 1994 Bhutan banned climbing its highest peaks, and in 2003 it banned mountaineering altogether.", "The reason is spiritual. Many Bhutanese believe mountains are homes of gods and spirits, and should not be stepped on.", "That means no permits, no base camp and no summit photo, as long as the rule stands.", "Almost anywhere else, a peak this high would have a queue of climbers and a line of tents.", "Instead it sits in clean snow, with no flags and no footprints, because a whole country chose to say no.", "So look again at that gate in Jaigaon. A few steps, no wall, and you enter a country that bans climbing a mountain.", "A capital with no traffic lights, a thirty minute time jump, and a constitution that protects its forests.", "All of it begins at a gate you can walk through in under a minute.", "Your watch gains thirty minutes at the gate in Jaigaon, and a country that does things its own way is waiting beyond it.", "Next in this series: another country that is stranger than you think. Follow along so you do not miss it."], "job": ""}, {"date": "2026-11-20", "kind": "Short", "category": "geography", "title": "The World's Longest High-Altitude Tunnel", "hook": "Your drive here goes 9 km under a Himalayan pass.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Atal Tunnel in Himachal Pradesh runs about 9 km beneath the Rohtang Pass. It is the longest highway tunnel in the world above 10,000 feet. It keeps this Himalayan road open when snow blocks the pass.\n\n#Shorts #Geography #India", "script": ["Your drive here goes nine kilometres under a Himalayan pass.", "This is the Atal Tunnel, in Himachal.", "It runs beneath the famous Rohtang Pass.", "Snow used to close that road for months.", "Now cars drive straight through the mountain.", "It's above ten thousand feet.", "No highway tunnel is longer at that height.", "Your road now goes under the Himalayas.", "Tomorrow: a train bridge that lifts into the air."], "job": ""}, {"date": "2026-11-20", "kind": "Short", "category": "geography", "title": "The Indian Rail Bridge That Rises Into the Air", "hook": "Your train waits while the bridge itself lifts into the air.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The new Pamban Bridge near Rameswaram has a middle span that rises vertically so ships can pass. It is India's first vertical-lift sea bridge. Trains wait until it lowers again.\n\n#Shorts #Geography #India", "script": ["Your train waits while the bridge itself lifts into the air.", "This is the Pamban Bridge, near Rameswaram.", "The train runs over open sea.", "Then a ship needs to pass.", "The middle span rises straight up.", "Trains stop until it comes back down.", "It's India's first vertical-lift sea bridge.", "Your train waits for a bridge to rise.", "Tomorrow: an island the sea cuts off."], "job": ""}, {"date": "2026-11-20", "kind": "Short", "category": "geography", "title": "The Island the Sea Cuts Off Twice a Day", "hook": "Your walk to this castle island can be cut off by the sea.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Mont Saint-Michel in France is a tidal island. At high tide the sea cuts it off from the mainland. At low tide, you can walk across the sands.\n\n#Shorts #Geography #France", "script": ["Your walk to this castle island can be cut off by the sea.", "This is Mont Saint-Michel, in France.", "At low tide, you can walk across the sand.", "Then the sea comes rushing back in.", "At high tide, it becomes a true island.", "The water cuts it off from land.", "A whole abbey sits on top.", "Your walk ends where the sea decides."], "job": ""}, {"date": "2026-11-20", "kind": "Short", "category": "space", "title": "Your Hair Wash in Space Has No Water", "hook": "Your hair wash in space uses no running water.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Astronaut Karen Nyberg showed on camera how she washes her long hair in space. She uses rinseless shampoo, because there is no shower and water would just float. Series: If You Were in Space. Tomorrow: brushing your teeth with no sink.\n\n#Shorts #Space #Astronaut", "script": ["Your hair wash in space uses no running water.", "Astronaut Karen Nyberg showed it on camera.", "She works rinseless shampoo into her hair.", "It clings to every strand.", "Nothing drips, because there is no down.", "Her long hair floats up like a cloud.", "She wipes it with a towel. No rinsing.", "Your hair wash needs gravity. She has none."], "job": ""}, {"date": "2026-11-20", "kind": "Short", "category": "technology", "title": "China Held an Artificial Sun for 1,066 Seconds", "hook": "Your artificial sun is real, and it burned for 1,066 seconds.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "China's EAST fusion reactor held superheated plasma for 1,066 seconds in January 2025. That is a record for this kind of reactor, and it is nicknamed the artificial sun. Fusion is the same process that powers the real Sun.\n\n#Shorts #Fusion #Technology", "script": ["Your artificial sun is real, and it burned for 1,066 seconds.", "China built it. It is called EAST.", "Inside, plasma gets hotter than the Sun's core.", "Nothing solid can touch it.", "So giant magnets hold it floating in air.", "That is the same power that lights our Sun.", "It held that plasma for over seventeen minutes.", "Your artificial sun is real, and it keeps getting longer."], "job": ""}, {"date": "2026-11-21", "kind": "Long video", "category": "geography", "title": "6 Weird Borders, and India's Has No Visa", "hook": "Your own country has a border so open you can walk across it before your tea cools.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Six real borders that look fake on a map, from a US town you reach through Canada to a whole country inside another. The last one is in India: at Sunauli, Indians and Nepalis walk across a simple gate with no visa. Watch to the end to see why the open gate may be the strangest one.\n\n#borders #geography #india", "script": ["Your own country has a border so open you can walk across it before your tea cools.", "No visa. No passport stamp. Just a plain gate, a rickshaw ride and a few steps into Nepal.", "First, six borders around the world that really do make no sense. Each one is stranger than the last.", "By the end, you'll see why India's wide open gate may be the strangest of them all.", "Every one of these is real, and you can find each of them on your phone map right now.", "We start with an American place that you can only reach by road if you leave America.", "Number six: Point Roberts, in Washington state. Your drive to the rest of America goes through Canada.", "Point Roberts sits on the tip of a small peninsula. The land is American, but it hangs off Canada.", "The reason is one straight line. America and Britain agreed to split their territory along the 49th parallel.", "Nobody stopped to check that this line would slice through the bottom of a peninsula.", "So a small piece of the United States ended up cut off from the rest of the United States.", "To drive to the rest of Washington, you leave America, cross Canadian roads, and then enter America again.", "That means two border checks to go from one American town to another American town.", "Locals still make that trip for everyday errands like shopping and work.", "One old line drawn on a map still decides which road everyone there must take.", "That was a piece of America stuck on foreign land. Next, a village that did the opposite.", "Number five: Büsingen am Hochrhein. This is a German village, but all around it is Switzerland.", "Look at the map and you see a small German patch sitting inside Swiss land.", "It ended up there through old deals between rulers, and later talks to change it never worked out.", "Today the village is German on paper, but it sits inside the Swiss customs area.", "That means Swiss francs are part of daily life there, alongside the euro.", "Its people follow German law, yet live inside Swiss customs rules, so every day mixes two systems.", "A walk down a road can take you from Germany into Switzerland with no border check at all.", "It is a whole German village, with homes and shops, living inside another country.", "No guards, no fence, just a village that belongs to one country and sits inside another.", "Next, a Spanish town inside France, and it exists because of one word in a treaty.", "Number four: Llívia. This Spanish town sits inside France, with French land on every side.", "In 1659, Spain and France signed the Treaty of the Pyrenees to end a long war.", "Spain handed over a list of villages to France as part of the deal.", "But Llívia was a town, not a village. So by the wording of the treaty, it stayed Spanish.", "Think about that. A single word kept a whole town on the other side of a border.", "Today you can still drive there. A short road links Llívia back to Spain. It runs through France, but cars can pass freely.", "So you can drive from Spain to a Spanish town while passing over French ground.", "On the map, it looks like a drop of Spain spilled onto the French side of the mountains.", "The lesson of number four: a border is sometimes just a word that nobody ever changed.", "If you enjoy facts that sound fake but are true, subscribe, because there are more of these coming.", "The next one is not a village or a town. It is a whole region cut off from its own country.", "Number three: Kaliningrad. A piece of Russia that has no land connection to the rest of Russia.", "Look at the map and you will find it squeezed between Poland and Lithuania, with the Baltic Sea to the north.", "Before 1945 this was the German city of Königsberg, and the famous thinker Immanuel Kant lived his whole life here.", "After the Second World War it became part of the Soviet Union.", "When the Soviet Union broke up in 1991, Lithuania, Latvia and Belarus became separate countries between Kaliningrad and the rest of Russia.", "Overnight, a Russian region was sitting alone, surrounded by other countries and the sea.", "Going by land from the rest of Russia means passing through other countries, with rules for every crossing.", "A trip inside one country can become an international trip, just because of where the lines fell.", "Same country, but a German past and no road home on Russian soil.", "Kaliningrad is only a region, though. The next border is an entire country trapped inside another.", "Number two: Lesotho. This is not a village or a region. It is an entire country, surrounded by one other.", "South Africa wraps around Lesotho on every side. No sea, no third neighbour, just one country around another.", "Lesotho has its own king, its own flag, its own money and its own seat at the United Nations.", "Yet every road out of it leads into South Africa.", "It is called the Kingdom in the Sky, because the whole country sits high in the mountains.", "Even its lowest point is more than one thousand metres above sea level.", "Winters there bring real snow, and people even ski in a country with South Africa all around it.", "Lesotho has just one neighbour, and that neighbour is on all sides.", "Imagine a free country sitting inside the map of another, like a coin in a ring.", "Now for number one, and it comes with a map mistake and a very big lake.", "Number one: the Northwest Angle in Minnesota. It is American land that you can reach by road only through Canada.", "On a map of the United States, there is a small square sticking up from the top of Minnesota.", "It sits north of the 49th parallel, which is the line that marks much of the US-Canada border.", "It is the only part of the lower 48 states that lies north of that line.", "The reason goes back to 1783, when negotiators used a map that had mistakes about the rivers and lakes.", "The treaty line was drawn using that map, and later surveys found it did not match the real land.", "That left a piece of Minnesota stuck on the wrong side, across a big lake.", "To reach it by road, you drive through Manitoba in Canada, then arrive back in the United States.", "Or you take a boat across the Lake of the Woods and stay on the water.", "A mapping mistake from 1783 is still making people use another country's roads today.", "That was number one on the list. But India has a border that is stranger in the opposite way.", "It is the India-Nepal border at Sunauli, in Uttar Pradesh. Cross it, and you arrive in Bhairahawa, Nepal.", "Here the strange part is not a cut-off island. It is that you can walk across without a visa.", "Indians and Nepalis cross on foot, by bicycle, by rickshaw, or on a bus, in front of a simple gate.", "Shops, hotels and traffic run on both sides, with one quiet gate between two countries.", "The reason is a treaty signed in 1950, called the Treaty of Peace and Friendship.", "Under it, Indians and Nepalis can travel, live and work in each other's country without a visa or work permit.", "Many Nepalis work in India, and many Indians have family, business and pilgrimage ties in Nepal.", "You should still carry a valid ID, and foreign travellers must use official crossing points with their documents.", "A short drive from the Nepal side is Lumbini, where the Buddha was born.", "Step across, and even the clock changes: Nepal is fifteen minutes ahead of Indian time.", "Most borders are made to stop you. This one is made to let you through.", "So the strangest border on this list is not cut off, split or lost. It is open.", "From a town in Washington to a gate in Uttar Pradesh, one line on a map can change everything.", "Tomorrow: a real city that sits on two continents at once."], "job": ""}, {"date": "2026-11-21", "kind": "Short", "category": "geography", "title": "The Sea Here Rises About 16 Metres Twice a Day", "hook": "Your tide table here shows the sea rising about 16 metres.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Bay of Fundy in Canada has the biggest tides on Earth. The difference between low and high tide can reach about 16 metres. Boats sit on mud at low tide and float high above it hours later.\n\n#Shorts #Geography #Canada", "script": ["Your tide table here shows the sea rising about 16 metres.", "That is the Bay of Fundy, in Canada.", "At low tide, boats sit stuck on mud.", "Hours later, those same boats float high above.", "People walk the sea floor, then run back.", "These are the biggest tides on Earth.", "The sea comes in twice a day, every day.", "So your tide table here shows a 16 metre climb."], "job": ""}, {"date": "2026-11-21", "kind": "Short", "category": "geography", "title": "India's Tip Where Both Sun Events Hit the Sea", "hook": "Your sunrise and sunset can both happen over the sea at this spot.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At Kanyakumari, the southern tip of India, the Bay of Bengal, the Arabian Sea and the Indian Ocean meet. On clear days you can watch the sun rise over the water and set over the water from the same shore. It is one of the most visited coasts in India.\n\n#Shorts #India #Kanyakumari", "script": ["Your sunrise and sunset can both happen over the sea here.", "This is Kanyakumari, the southern tip of India.", "Three bodies of water meet right here.", "The Bay of Bengal sits on the east.", "The Arabian Sea sits on the west.", "The Indian Ocean opens up straight south.", "On clear days, the sun rises out of the sea.", "Then it sets into the sea. Same shore.", "Your sunrise and sunset, both over water."], "job": ""}, {"date": "2026-11-21", "kind": "Short", "category": "space", "title": "Your Toothpaste in Space Gets Swallowed", "hook": "Your toothpaste in space gets swallowed or wiped into a towel.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "There is no sink on the space station, and spit would float around the cabin. So astronauts either swallow their toothpaste or wipe it into a towel. Astronauts have filmed themselves brushing with a floating blob of paste.\n\n#Shorts #Space #Astronaut", "script": ["Your toothpaste in space gets swallowed or wiped into a towel.", "There is no sink on the station.", "Spit would just float around the cabin.", "So the paste sits as a floating blob.", "Astronauts have filmed themselves brushing on camera.", "Then some just swallow it.", "Others wipe their mouth with a towel.", "Your toothpaste has nowhere to go up there."], "job": ""}, {"date": "2026-11-21", "kind": "Short", "category": "space", "title": "Your Haircut in Space Uses a Vacuum Hose", "hook": "Your haircut in space needs clippers attached to a vacuum.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On the space station, cut hair would float around the cabin and could get into equipment or eyes. So astronauts use clippers attached to a vacuum hose that sucks each hair straight in. Haircuts in space have been filmed.\n\n#Shorts #Space #Astronaut", "script": ["Your haircut in space needs clippers attached to a vacuum.", "Cut hair does not fall in space.", "It would float all around the cabin.", "It could get into eyes and equipment.", "So the clippers are attached to a hose.", "Each hair gets sucked straight in.", "Nothing is left to float away.", "Your haircut in space is a vacuum job."], "job": ""}, {"date": "2026-11-21", "kind": "Short", "category": "technology", "title": "A Car That Grew Wings And Flew Cities", "hook": "Your car grows wings and flies to another city.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2021, Klein Vision's AirCar flew from Nitra to Bratislava in Slovakia. Its wings fold out of the car body, then fold back so it can drive on the road. A real car, a real flight between two real cities.\n\n#Shorts #AirCar #FlyingCar", "script": ["Your car grows wings and flies.", "It really happened in Slovakia in 2021.", "The AirCar drove onto a runway.", "Then its wings folded out from the body.", "It flew from Nitra to Bratislava.", "Two real cities, no traffic jam.", "It landed, folded its wings, and drove off.", "Your car grows wings, and one already did."], "job": ""}, {"date": "2026-11-22", "kind": "Long video", "category": "geography", "title": "Nepal: 15 Minutes Ahead and Already in 2083", "hook": "Your rickshaw ride at Sunauli takes you into a country where the year is 2083.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Walk across the open India-Nepal border at Sunauli and you enter a country with its own clock, its own year, a flag that is not a rectangle and a child worshipped as a living goddess. This video covers six true facts about Nepal that sound made up, from the 45-minute time zone to how Mount Everest was measured by two countries. Stay to the end for the strangest one.\n\n#Nepal #StrangeFacts #Geography", "script": ["Your rickshaw ride at Sunauli takes you into a country where the year is 2083.", "No visa. No passport stamp. Just a plain gate, a few rickshaws, and suddenly you are standing in a different country.", "And that is only the first strange thing. Nepal runs a clock fifteen minutes off from yours, and flies a flag that breaks a world rule.", "By the end you will see how Mount Everest was measured twice, and why a small child is worshipped as a living goddess.", "Stay for the last one. It happens in a capital city that is only a short flight from Delhi.", "But let us start where you stand, at the border town of Sunauli in Uttar Pradesh, a few hours from Gorakhpur.", "One: a border you can simply walk across.", "Walk a few minutes north from Sunauli and you reach Belahiya, in Nepal. The next big town beyond it is Bhairahawa.", "There is a gate, a sign, and a line of rickshaws. There is no wall of visa counters and no queue for a stamp.", "From there, buses run on to Kathmandu and Pokhara, so many travellers begin their whole Nepal trip right on this road.", "The reason is an old treaty. In 1950, India and Nepal signed a friendship treaty that keeps the border open for their citizens.", "Under it, Indians and Nepalis can travel, live and work across the line with a freedom that most countries never give each other.", "You should still carry a valid ID, and vehicles have their own paperwork. But you never apply for a visa.", "Many Nepali citizens even
