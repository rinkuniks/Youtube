<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#5f6672;--line:#e3e6ea;--accent:#2563eb;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.card span{color:var(--muted);font-size:12px}
.card.on{outline:2px solid var(--accent)}
pre.run{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;margin:0 0 16px;font:13px/1.5 ui-monospace,Consolas,monospace}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input{flex:1;min-width:180px}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:96px 90px 1fr 190px;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.list>.row:first-child{border-top:0}.row:hover{background:var(--greybg)}.t{font-weight:600}.m{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-ok{color:var(--ok);background:var(--okbg)}.s-warn{color:var(--warn);background:var(--warnbg)}.s-bad{color:var(--bad);background:var(--badbg)}
.s-info{color:var(--info);background:var(--infobg)}.s-grey{color:var(--grey);background:var(--greybg)}
.detail{display:none;padding:4px 12px 14px 12px;border-top:1px dashed var(--line)}.detail.open{display:block}
.detail ol{margin:6px 0 10px 18px;padding:0}.detail li{margin:2px 0}a{color:var(--accent)}
@media (max-width:700px){.row{grid-template-columns:1fr;gap:4px}}

const D={"rows": [{"date": "2026-10-23", "kind": "Short", "category": "geography", "title": "Your Peru Hike Ends at a Striped Mountain", "hook": "Your hike in Peru ends at a striped mountain.", "status": "Published", "seconds": 25.9, "publish_at": "2026-10-23 09:00", "uploaded": "2026-10-22 22:31", "url": "https://youtube.com/shorts/ra95l1Dw7FU", "description": "Vinicunca in Peru looks painted in red, yellow and turquoise bands. The colours come from real minerals in the rock layers. It is known as Rainbow Mountain. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Peru #Geography", "script": ["Your hike in Peru ends at a striped mountain.", "Red, yellow and turquoise bands run across it.", "No paint. No filter. No tricks.", "The colours come from different minerals in the rock.", "Layers of sediment were pushed up and tilted.", "Ice that once covered it melted away.", "Then the colours showed up for hikers.", "People call it Rainbow Mountain.", "Your striped mountain in Peru is completely real.", "Next: a giant bullseye in the Sahara."], "job": "20261022-211254-rainbow-mountain-vinicunca-peru"}, {"date": "2026-10-23", "kind": "Short", "category": "geography", "title": "A 40 km Bullseye Sits in the Sahara", "hook": "Your satellite view of the Sahara shows a bullseye.", "status": "Failed", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Zoom into the Sahara on a satellite map and you will find a giant ring pattern called the Richat Structure. It is about 40 km wide in Mauritania. Scientists say it is eroded rock layers. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Sahara #Geography", "script": ["Your satellite view of the Sahara shows a bullseye.", "It is called the Richat Structure.", "It is about 40 kilometres wide.", "That is big enough to spot from orbit.", "Astronauts used it as a landmark.", "It sits in the desert of Mauritania.", "For years people called it a crater.", "Scientists say it is rock layers worn away.", "Your Sahara bullseye is real, and it is rock.", "Next: a beach in the Maldives that glows."], "job": "20261022-211928-richat-structure-sahara"}, {"date": "2026-10-23", "kind": "Short", "category": "geography", "title": "This Maldives Beach Glows Blue at Night", "hook": "Your Maldives beach can glow blue at night.", "status": "Uploaded, scheduled", "seconds": 22.1, "publish_at": "2026-10-23 16:00", "uploaded": "2026-10-22 22:31", "url": "https://youtube.com/shorts/fv0P2w88RJ8", "description": "On Vaadhoo island in the Maldives, waves can light up electric blue at night. The glow comes from tiny bioluminescent plankton that flash when the water moves. It does not happen every night. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Maldives #Bioluminescence", "script": ["Your Maldives beach can glow blue at night.", "Vaadhoo island is where it happens.", "Step in, and the water sparkles.", "Waves crash and light up electric blue.", "It is not a light show.", "Tiny glowing plankton make the light.", "They flash when the water moves.", "It does not happen every night.", "Still, your Maldives beach can glow blue.", "Next: water flooding an astronaut's helmet."], "job": "20261022-220255-vaadhoo-glowing-beach-maldives"}, {"date": "2026-10-23", "kind": "Short", "category": "space", "title": "An Astronaut's Helmet Filled With Water", "hook": "Your spacesuit helmet can fill with water in space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2013, water flooded the helmet of astronaut Luca Parmitano during a spacewalk outside the International Space Station. It pooled around his head and covered his eyes and nose, and he had to rush back inside. He made it back safely. Part of the If You Were in Space series.\n\n#Shorts #Space #Astronaut", "script": ["Your spacesuit helmet can fill with water in space.", "It happened to Luca Parmitano in 2013.", "He was spacewalking outside the space station.", "Water pooled around his head.", "In weightlessness, it clings to your face.", "It covered his eyes and his nose.", "He could not see well.", "He had to rush back inside.", "He made it, and he was okay.", "Your helmet should never fill with water."], "job": ""}, {"date": "2026-10-23", "kind": "Short", "category": "technology", "title": "Your Phone Can Put You in a Photo Twice", "hook": "Your phone can put one person in a photo twice.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Panorama mode stitches slices taken over a few seconds, so a person who moves can appear twice. Have someone stand in the scene, sweep the phone past them, and let them run behind you to the far side. It works on any phone with panorama mode. Part of the Phone Tests series.\n\n#Shorts #PhoneTricks #Panorama", "script": ["Your phone can put one person in a photo twice.", "Open panorama mode and start sweeping.", "Have a friend stand in the scene.", "Once the camera passes them, they run.", "They sprint behind you to the far side.", "The camera finds them there again.", "Tap done, and the same person appears twice.", "Panorama is not one shot, it is many slices.", "Your phone just stitched two moments together.", "Try it, and your phone makes two of you."], "job": ""}, {"date": "2026-10-23", "kind": "Long video", "category": "geography", "title": "Spain and France Swap This Island Every 6 Months", "hook": "Your calendar decides who owns Pheasant Island, because Spain and France swap this tiny island between them every six months.", "status": "Uploaded, scheduled", "seconds": 442.0, "publish_at": "2026-10-23 19:30", "uploaded": "2026-10-22 22:30", "url": "https://youtube.com/shorts/MgKfJpAtCoM", "description": "Spain and France share a tiny island in a river, and it changes country every six months. This video counts through six true facts about Spain, France and the places between them, from a clock stuck on Berlin time to a town trapped inside France, ending on the island itself. Every fact is real and you can find each place on a map.\n\n#geography #borders #spain\n\nChapters:\n0:00 Intro\n0:36 Spain's Wrong Clock\n1:24 The Spanish Town Inside France\n2:17 A British Rock With Monkeys\n2:54 Spain's Cities in Africa\n3:48 Andorra's Two Princes\n4:40 The Island That Switches Country", "script": ["Your calendar decides who owns Pheasant Island, because Spain and France swap this tiny island between them every six months.", "That is real, it is on the map, and nobody lives there. By the end, you will see exactly how it works.", "But first, five other facts about Spain and France that sound fake and are true, each one stranger than the one before.", "We start with a clock that is wrong, then a Spanish town trapped inside France, and a rock full of wild monkeys.", "After that come two Spanish cities in Africa, and a country ruled by a French president and a Spanish bishop.", "Stay till the end, because the island is the one that breaks every rule you know about maps.", "Fact one: Spain's clocks are wrong, and they have been wrong for more than eighty years, ever since 1940.", "Find Madrid on a map and you will see it sits slightly west of London, further out into the Atlantic.", "Yet Spain's clocks run one hour ahead of London, the same time as Paris, Berlin and Warsaw, far to the east.", "In 1940, the dictator Francisco Franco moved Spain's clocks forward by one hour, to match the time in Nazi Germany.", "Nobody ever moved them back, so Spain still lives on Berlin time, even though the sun does not agree.", "In midsummer, the sun sets after nine at night in Madrid, and even later in the far northwest of the country.", "That is one reason lunch in Spain happens around two or three, and dinner often starts at nine or ten.", "A wrong clock is odd, but it is only a warm-up. The next place is a whole town standing in the wrong country.", "Fact two: Llívia is a Spanish town that sits completely inside France, with French land on every single side.", "Look at the map and you see a small Spanish patch, floating in the middle of France, high in the Pyrenees.", "The reason goes back to 1659, when Spain and France finally signed a peace treaty after a very long war.", "In that treaty, Spain handed over a group of villages in the Pyrenees mountains to France, to settle the border.", "But Llívia was officially a town, not a village, so the exact wording of the treaty left it with Spain.", "A short road now joins Llívia to the Spanish town of Puigcerdà, but that road runs across French land.", "So a single word in an old treaty still decides which country a whole town belongs to today.", "Remember that treaty from 1659, because it comes back at the end, and it created the biggest surprise of all.", "But next, we go to the southern tip of Spain, where a huge rock is not Spanish at all.", "Fact three: at the very southern edge of Spain, there is a piece of Britain, and it is called Gibraltar.", "It has been British since a treaty signed in 1713, and Spain has claimed it back ever since.", "Even so, people walk across the land border between Gibraltar and Spain all the time, to work, to shop and to visit.", "At the top of the huge rock live Barbary macaques, which are the only wild monkeys living anywhere in Europe.", "So Europe's only wild monkeys live on a British rock, attached to Spain, looking out across the sea at Africa.", "And speaking of Africa, Spain has something even more surprising there, whole cities that count as part of Spain and Europe.", "Fact four: Spain owns two cities on the African continent, called Ceuta and Melilla, both on the coast of Morocco.", "They are not colonies. They are Spanish cities, with Spanish passports, the euro, and the rules of the European Union.", "That means the European Union has land borders with Africa, and these two cities are the only places where it happens.", "Tall fences mark those borders, so you can stand in a city that is in Europe's club while looking at Morocco.", "Ceuta even looks across the narrow strait at Gibraltar, so European-run land sits on both shores of that water.", "Morocco also claims these cities, so the border here is a live argument, not just a line on a map.", "So far we have a clock, a trapped town, a monkey rock and two cities in Africa, and it keeps getting stranger.", "If you like strange maps and strange facts like these, subscribe, because there are many more places to come.", "Now the next fact has a country with two leaders, and neither of them is actually from that country.", "Fact five: Andorra, a tiny country in the mountains between France and Spain, has two heads of state at the same time.", "One is the Bishop of Urgell, a Catholic bishop who lives in Spain. The other is the President of France.", "Yes, the president of France is also, officially, a prince of another country. He gets that job just by being president.", "The deal goes back to 1278, when a French count and a Spanish bishop argued over who ruled the Andorran valleys.", "Instead of fighting it out, they signed an agreement to share the land, and that sharing never really ended.", "Today the two princes mostly have a ceremonial role, and Andorra's own government runs daily life in the country.", "Andorra is not in the European Union, yet it uses the euro, which makes its status even more unusual.", "Sharing a country between two rulers is strange, but sharing one island by the calendar is stranger, and that is next.", "Fact six: Pheasant Island, the one we promised you. Your calendar decides who owns it, and the rules are strict.", "It sits in the Bidasoa river, which forms part of the border, with the Spanish town of Irun on one bank.", "On the other bank is the French town of Hendaye, so the island floats right between two countries and two languages.", "It is only about two hundred metres long and about forty metres across, which is smaller than many city parks.", "Nobody lives there, and the island is closed to the public, so there are no houses, shops or tourist boats.", "From the first of February to the thirty-first of July, the island belongs to Spain, and Spain looks after it.", "From the first of August to the thirty-first of January, it belongs to France instead, and France takes over.", "So it is Spanish for six months, French for six months, and it changes country twice every year without any fight.", "The story starts in 1659. Spain and France had been at war for about twenty-four years, and both sides were exhausted.", "They needed a meeting place that felt fair to both, so they picked this little island in the middle of the river.", "There, the two sides negotiated the Treaty of the Pyrenees, the same treaty that left Llívia inside France.", "The peace was sealed with a royal marriage, and in 1660 the kings of Spain and France met on this island.", "The Spanish king's famous court painter, Diego Velázquez, helped organise the royal trip, and he died not long after returning home.", "Even earlier, in 1526, the French king Francis the First was freed on this river, in exchange for his two sons.", "So this small island has seen kings, hostages and royal brides cross it, long before it became a quiet river rock.", "Even today, the island has a governor, and the job goes to a naval officer from whichever country holds the island.", "While the island is Spanish, a Spanish naval officer is in charge. When it turns French, a French one takes over.", "There is no wall on it and no fight over it, only a calendar that two old rivals have followed for centuries.", "Think about that. Two countries that fought for decades settled their peace on a tiny island, and the sharing has lasted ever since.", "You cannot visit, but from the riverbank you can see it, a small green island, with two nations quietly taking turns.", "So on any day of the year, you can tell who owns Pheasant Island, just by checking which month it is.", "Let us run through them again: a clock stuck on Berlin time, and a Spanish town trapped inside France.", "A British rock with wild monkeys, two Spanish cities in Africa, and a country with a French president as its prince.", "And one island that is Spanish for six months, then French for six months, then Spanish again.", "So remember, your calendar decides who owns Pheasant Island, and it has done so since 1659.", "Next in this series: another country that looks perfectly normal on the map, and is not."], "job": "20261022-220507-long-why-spain-and-france-are-stranger-than-y"}, {"date": "2026-10-24", "kind": "Long video", "category": "geography", "title": "Your Library Card Works in 2 Countries + 6 More Borders", "hook": "Your library card can work in two countries at once, and a black line on the floor shows where one ends.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A library with a border across its reading room, a Spanish town trapped inside France, a runway that stops traffic, and India's own maze of land inside land inside land. We count down seven real borders that make no sense, from number seven to number one. Every place in this video is real, and you can find each one on a map.\n\n#borders #geography #factsyoudidntknow", "script": ["Your library card can work in two countries at once, and a black line on the floor shows where one ends.", "Seven real borders that make no sense: a library, a runway, two islands a day apart, and a Spanish town trapped inside France.", "Number one is in India, and a popular story says it began with two kings and a game of chess.", "By the end you will see land inside land inside land, and people who once lived in a country they could not easily reach.", "So let us count down, starting with a library you could walk into right now.", "Number seven. Picture a reading room where the border runs straight across the floor, between the chairs.", "This is the Haskell Free Library, between Derby Line in Vermont, America, and Stanstead in Quebec, Canada.", "A black line on the floor marks the border. One reader can sit in America while a friend sits in Canada.", "The building opened in 1904, and it was built to serve the towns on both sides of the line.", "Upstairs there is an opera house. The stage is in the United States, and most of the seats are in Canada.", "You can stand with one foot in each country, and the bookshelves do not care which one you pick.", "People sit, read and borrow books here, and a line on the floor is the only reminder of the border.", "That was the gentle one. Next, a whole Spanish town that is stuck inside France.", "Number six. Look at the French side of the Pyrenees mountains, and you will find a Spanish town.", "It is called Llívia. French land surrounds it on every side, so you cannot reach it from Spain without crossing France.", "The reason goes back to a treaty in 1659, when Spain gave France a group of villages.", "But Llívia was officially a town, not a village. So the treaty never named it, and it stayed Spanish.", "More than three hundred and fifty years later, it is still Spanish, still sitting alone inside French territory.", "Today a short road, called the neutral road, links Llívia to the Spanish town of Puigcerdà.", "That road runs over French land, but a special rule keeps it open, so a Spanish town stays joined to Spain.", "Picture driving out of a Spanish town and having to pass through France to reach the next Spanish town.", "Number five. There is a piece of America that you can only reach by land if you drive through Canada.", "It is called the Northwest Angle, in the state of Minnesota, on a huge lake named Lake of the Woods.", "On a map it looks like a little square of America stuck on top of Canada, cut off from the rest.", "The cause was a mapmaking mistake. A treaty in 1783 used a map that got the geography of the region wrong.", "The treaty said the border should run to the Mississippi river, but the river does not reach that far north.", "Later treaties settled the line and left this corner on the American side, and it was never moved.", "So to drive there from the rest of Minnesota, you have to go through Canada, or cross the lake by boat.", "There are fishing lodges there, and in winter the frozen lake becomes a road across the ice.", "That is still ordinary compared to the next one, where the road itself crosses an airport runway.", "Number four. Your road here has to stop at a red light for airplanes, and the same road crosses a border.", "This is Gibraltar, a small British territory at the southern tip of Spain, right beside a giant rock.", "To enter from Spain, you cross the border, and then you walk or drive straight onto the airport runway.", "A main road, Winston Churchill Avenue, runs across the runway. When a plane is due, barriers close the road.", "Cars, bikes and people all wait while a jet lands or takes off, only a short distance in front of them.", "For people who live in Gibraltar, walking across a runway is a normal part of the day.", "Gibraltar has belonged to Britain since a treaty in 1713, even though it sits on the Spanish coast.", "Spain still disputes that, and the argument is part of why this border matters so much.", "If you like strange places and facts like these, subscribe, because there is another one coming tomorrow.", "And remember number one. It involves a game of chess, and it is even stranger than it sounds.", "Number three. Two islands face each other across a narrow sea, and they are almost a whole day apart.", "They are the Diomede Islands, in the Bering Strait. Little Diomede belongs to America, and Big Diomede belongs to Russia.", "The gap between them is less than four kilometres. On a clear day, people on one island can see the other.", "The International Date Line runs between them. So Big Diomede is almost a whole day ahead of Little Diomede.", "That is why people call them Tomorrow Island and Yesterday Island. Big Diomede is tomorrow, Little Diomede is yesterday.", "Little Diomede is a tiny village, and its people have long looked at Russia from their own windows.", "In winter the sea can freeze between them, but crossing on foot is not allowed, because this is an international border.", "In 1987, the American swimmer Lynne Cox swam between the two islands in freezing water, and made it across.", "A few kilometres of water, and a whole day of difference. Now we come home, to India.", "Number two. Every evening, soldiers from two rival countries lower their flags together, while thousands of people cheer from both sides.", "This is Attari-Wagah, on the road between Amritsar in India and Lahore in Pakistan.", "Before sunset, border guards from both sides march with high kicks, stare each other down, and slam the gates.", "Then the two flags are lowered at the same time, and the crowds on each side shout their own slogans.", "Behind all the drama, the land on both sides is the same Punjab, with the same language and the same food.", "The border was drawn in 1947, and families and farms were cut in two by a line on a map.", "In recent times the usual handshake and the opening of the gates have been stopped, but the flags still come down together.", "Many visitors travel to Amritsar just to watch it, and the stands fill up every evening.", "Two rival armies perform one shared show every evening. That is a border that makes no sense.", "But the strangest border of all is still ahead, and it hides in West Bengal, in India.", "Number one. Before 2015, one corner of India and Bangladesh looked like a bowl of scrambled puzzle pieces.", "In and around Cooch Behar, 162 small patches of land sat inside the other country: 111 Indian ones inside Bangladesh, and 51 Bangladeshi ones inside India.", "These were called enclaves. Each one was an island of one country, completely surrounded by the other country.", "A popular story says it started with a game. The king of Cooch Behar and a Mughal officer played chess, with villages as the stakes.", "Historians say the truth is messier, and came from old wars and treaties. But the maze was very real.", "People inside an enclave lived in a country they could not easily reach, with their own government's land out of sight.", "Getting a school, a hospital or electricity was very hard, because the country around them did not treat them as its own.", "Imagine your house sitting inside another country, with no road that leads to your own.", "Reaching a doctor could mean crossing into a foreign country, and many families simply managed without.", "And one of them was a world record. A patch called Dahala Khagrabari was the only third-level enclave on Earth.", "Think of it: an Indian patch, inside a Bangladeshi patch, inside an Indian patch, inside Bangladesh. Land inside land inside land.", "At midnight on 31 July 2015, India and Bangladesh finally swapped the enclaves and ended the maze.", "People were asked which country they wanted to belong to, and many got proper citizenship for the first time.", "Tens of thousands of people lived in these pockets, and many say the swap finally gave them a country.", "So that is seven real borders: a library, a Spanish town in France, and an American corner inside Canada.", "A runway across a road, two islands a day apart, a flag show between rivals, and land inside land inside land.", "Which brings us back to the start. Your library card really can work in two countries, and a line on the floor proves it.", "Next video: more places where the map and the ground do not agree. See you there."], "job": ""}, {"date": "2026-10-24", "kind": "Short", "category": "geography", "title": "Your Bridge in Meghalaya Is a Living Tree", "hook": "Your walk in Meghalaya crosses a bridge that is alive.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Meghalaya, villagers grow bridges from the roots of rubber fig trees. They guide the roots across rivers over decades, and some of these bridges are centuries old. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Meghalaya #LivingRootBridge", "script": ["Your walk in Meghalaya crosses a bridge that is alive.", "Nobody built it from steel or wood.", "Villagers grew it from rubber fig roots.", "They guide the roots across the river.", "It takes decades before a bridge is ready.", "Some of these bridges are centuries old.", "The roots keep thickening, so it keeps strengthening.", "The bridge under your feet is still growing.", "Tomorrow: a lake that turned pink."], "job": ""}, {"date": "2026-10-24", "kind": "Short", "category": "geography", "title": "This Indian Lake Turned Pink Overnight", "hook": "Your Maps view of Lonar shows a round lake that turned pink.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Lonar Lake in Maharashtra sits inside a crater formed by a meteor impact. In 2020 its water turned pink, and scientists linked the change to microorganisms in the salty water. Part of the Places That Shouldn't Exist series.\n\n#Shorts #LonarLake #IndiaFacts", "script": ["Your Maps view of Lonar shows a perfectly round lake.", "In 2020, its water turned pink.", "That is not a filter or an edit.", "The lake sits inside a meteor crater.", "Its water is very salty.", "Scientists linked the colour to tiny microbes.", "Space rock made a hole, then life painted it.", "Your round pink lake is real.", "Tomorrow: the astronaut who got stuck in space."], "job": ""}, {"date": "2026-10-24", "kind": "Short", "category": "space", "title": "Her 8-Day Trip Lasted 286 Days in Space", "hook": "Your 8-day trip just became 286 days, like Sunita Williams.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Sunita Williams launched on Boeing's Starliner in June 2024 for a trip planned to last about eight days. Starliner had problems and returned without her, so she came home in March 2025 after 286 days. Part of the If You Were in Space series.\n\n#Shorts #SunitaWilliams #Space", "script": ["Your 8-day trip just became 286 days.", "That happened to Sunita Williams.", "She launched on Starliner in June 2024.", "It was meant to be about eight days.", "Starliner developed problems, so it flew home empty.", "She stayed on the station for months.", "She finally landed in March 2025.", "A short trip turned into a very long stay.", "Tomorrow: an Indian flag on the space station."], "job": ""}, {"date": "2026-10-24", "kind": "Short", "category": "space", "title": "An Indian Flag Floated Inside the ISS", "hook": "Your Indian flag went to the space station in 2025.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In June 2025, Shubhanshu Shukla launched on the Axiom-4 mission and became the first Indian on the International Space Station. He carried the Indian flag with him. Part of the If You Were in Space series.\n\n#Shorts #ShubhanshuShukla #ISS", "script": ["Your Indian flag went to the space station.", "It travelled with Shubhanshu Shukla.", "He launched on Axiom-4 in June 2025.", "He became the first Indian on the station.", "Up there, the flag floats without gravity.", "Earth spins below, as it passes over India.", "Your flag has now seen Earth from orbit.", "Tomorrow: light that shows the veins in your finger."], "job": ""}, {"date": "2026-10-24", "kind": "Short", "category": "technology", "title": "Your Phone Torch Can Show Your Veins", "hook": "Your finger over the phone torch glows red and shows your veins.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Cover your phone's torch with a fingertip in a dim room and your finger glows red. Light passes through your flesh, and the darker lines you see are blood vessels. It works on any phone with a torch.\n\n#Shorts #PhoneTricks #TryThis", "script": ["Your finger over the phone torch glows red.", "Turn the torch on in a dim room.", "Press your fingertip gently over the light.", "Your whole finger lights up from inside.", "The light is passing through your flesh.", "Those dark lines are your blood vessels.", "Red light travels through skin better than other colours.", "Your finger is glowing red, so go try it.", "Tomorrow: the island in the middle of a river."], "job": ""}, {"date": "2026-10-25", "kind": "Long video", "category": "geography", "title": "Why the US-Canada Border Is Stranger Than You Think", "hook": "Your library card can work in two countries, and a black line on the floor marks the border.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A library with a black line on the reading-room floor, a fort built in the wrong country, and a town you can only reach through Canada. These seven places on the US-Canada border look fake on a map, but every one of them is real. Watch to the end for the library where people sit in two countries at once.\n\n#geography #borders #facts", "script": ["Your library card can work in two countries, and a black line on the floor marks the border.", "People sit on both sides of that line, reading quietly, and nobody checks a passport at the table.", "The US-Canada border is the longest between two countries, and it hides places that make no sense on a map.", "Today you will see a fort built in the wrong country, and a town you can only reach by driving through Canada.", "You will see a patch of America sitting above Canada, and an island that both countries say is theirs.", "Seven places, each one stranger than the last, and every single one of them is real.", "By the end, you will step inside that library and see the black line on the floor yourself.", "Number one: a fort that America built in Canada by mistake, and then had to give up.", "In the early 1800s, the United States started building a big fort at Rouses Point, in New York state.", "The border there follows a line of latitude, the forty-fifth parallel, and the plan was to build just south of it.", "But the first survey was wrong. When it was checked again, the half-built fort stood on British land.", "Work stopped at once. A fort meant to guard America was sitting on the wrong side of the line.", "People started calling it Fort Blunder, and the name stuck for good.", "The problem was fixed in 1842, when a treaty gave that small piece of land to the United States.", "A new fort, Fort Montgomery, was later built on that spot, right beside Lake Champlain.", "This was long before GPS, so surveyors measured the land with chains and instruments, and small errors could be huge.", "So the first surprise is that this border was once drawn by careful guesses, and guesses can be wrong.", "But it gets stranger. Next is a piece of America that you cannot drive to without crossing Canada.", "Number two: a town where even a trip home by road means crossing an international border.", "Point Roberts is a small piece of Washington state, hanging off the end of a Canadian peninsula.", "The border was drawn along the forty-ninth parallel, and that straight line cut right through the land.", "That straight line, the forty-ninth parallel, runs across much of the western border between the two countries.", "So the southern tip ended up American, while everything joined to it by land is Canadian.", "To drive from Point Roberts to the rest of America, you must go through Canada and show your documents.", "Imagine going to the next city in your own state, but you have to cross a border first.", "It is a piece of one country that you can only reach by land through another.", "The same kind of line also made an even stranger oddity, far to the east, in Minnesota.", "Number three: a piece of Minnesota that sits north of the border line, all on its own.", "It is called the Northwest Angle, and it is the northernmost point of the lower forty-eight US states.", "Its odd shape comes from a mapping mistake. The treaty of 1783 relied on a map that got the geography wrong.", "Negotiators believed the Mississippi began further north than it really does, so the line they described did not fit the land.", "Later talks fixed the problem by following the water, and that left this odd corner of land attached to Minnesota.", "By land, the only road to it runs through Manitoba, in Canada. Many visitors cross the lake by boat instead.", "It is a part of America with Canada on its land side and a huge lake on the other.", "So far, these are borders that were drawn wrong. The next place is a town where the border barely matters.", "If you like strange places like these, subscribe, because tomorrow's video is just as odd.", "Number four: an Alaskan town where the only road out leads straight into Canada.", "Hyder, Alaska, sits at the end of a road in the far southeast of the state.", "That road does not connect to any other Alaskan town. It runs to Stewart, a Canadian town in British Columbia.", "When you drive from Canada into Hyder, there is no US customs booth waiting for you.", "Heading back the other way, Canadian officers check you at the border crossing.", "Hyder depends on Stewart for many everyday things, and the two towns feel almost like one place.", "Hyder even keeps the same clock as Stewart, Pacific time, while the rest of Alaska runs an hour behind.", "Two towns, two countries, one shared clock, and only one road in or out.", "Now picture something even smaller: a rocky island in the sea that both countries say is theirs.", "Number five: a puffin island that the United States and Canada both claim.", "Machias Seal Island sits in the Gulf of Maine, between the coast of Maine and New Brunswick.", "Nobody has settled who owns it, so the waters around it are called the Grey Zone.", "Canada keeps a lighthouse on the island with keepers, while the United States still says the island is American.", "The island is famous for its Atlantic puffins, small birds with bright orange beaks that nest there each summer.", "The puffins, of course, have no idea which country they belong to.", "Tour boats carry visitors to see the birds, and everyone lives with the dispute year after year.", "Lobster fishing in the waters around it is the real prize, and fishermen on both sides keep a close watch.", "Yet there is no gunfire. The two countries have not fought a war against each other since 1812.", "Next, the place where that peace is easiest to see, because the border runs down the middle of a street.", "Number six: a street where one side of the road is America and the other side is Canada.", "In Derby Line, Vermont, and Stanstead, Quebec, two towns have grown together into one community.", "Canusa Street is named for Canada and USA, and the border runs along it.", "Houses on one side of the street are in the United States, and the houses opposite are in Canada.", "Neighbours can wave across the road, but crossing it without going through border control is not allowed.", "Before the world changed after 2001, people in these towns crossed far more freely to visit friends and shops.", "Today there are rules and officers, but the two towns still feel like one community.", "And right in the middle of that community stands a building that sits on both sides of the line.", "Number seven, the strangest of all: a library where you can sit in two countries at once.", "The Haskell Free Library and Opera House opened in 1904, right on the border between Derby Line and Stanstead.", "The front door is in Canada, but a lot of the books are on the American side.", "Inside the reading room, a black line runs across the floor. That line is the border.", "Imagine reading a book in a quiet room, then glancing down to see a country border between your feet.", "A reader can sit at a table on one side of the line while a friend sits on the other.", "Upstairs is an opera house too. The stage is in the United States, while most of the seats are in Canada.", "So the audience watches a show in one country while the actors perform in another.", "The building was meant to be shared by both towns, and it has stayed open to both communities.", "Visitors from Canada walk in through the front door, and they are expected to leave the same way.", "There is no passport counter at the door, yet the rules about where you may walk are real.", "That is the real surprise on this border: a line the size of a strip of tape that both countries respect.", "So here is the loop. Your library card can work in two countries, and a black line on the floor marks the border.", "Fort Blunder, Point Roberts, the Northwest Angle, Hyder, the Grey Zone, Canusa Street and the Haskell Library, all on one border.", "Tomorrow: another place that looks fake on the map but is completely real."], "job": ""}, {"date": "2026-10-25", "kind": "Short", "category": "geography", "title": "This Indian Island Sits Inside a River", "hook": "Your boat ride in Assam lands on the world's largest river island.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Majuli in Assam sits in the Brahmaputra and is recognised as the world's largest river island. You reach it by boat, and people live, farm and study there. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Majuli #IndiaFacts", "script": ["Your boat ride in Assam lands on an island.", "It is the world's largest river island.", "It sits inside the Brahmaputra river.", "Real villages are built on this island.", "People farm rice on land surrounded by river.", "You can only reach it by water.", "The river that surrounds it also shapes it.", "Your boat ride ends on a river island.", "Tomorrow: another place that sounds fake but is real."], "job": ""}, {"date": "2026-10-25", "kind": "Short", "category": "geography", "title": "Your Map Shows a 48 km Chain to Sri Lanka", "hook": "Your satellite map shows India reaching toward Sri Lanka.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Adam's Bridge, also called Ram Setu, is a chain of shoals between India and Sri Lanka. It runs about 48 km between Pamban Island and Mannar Island. Open your satellite map and zoom in yourself. Series: Places That Shouldn't Exist.\n\n#Shorts #RamSetu #Geography", "script": ["Your satellite map shows India reaching toward Sri Lanka.", "It's a chain of shoals, about 48 kilometres long.", "Zoom in and it looks like a bridge.", "It's called Adam's Bridge, or Ram Setu.", "It runs between Pamban Island and Mannar Island.", "The water over it is very shallow.", "Your satellite map shows that chain right now.", "Tomorrow: a capital city with no traffic lights."], "job": ""}, {"date": "2026-10-25", "kind": "Short", "category": "geography", "title": "Your Drive in Bhutan's Capital Has No Lights", "hook": "Your drive through Thimphu has no traffic lights.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Thimphu, the capital of Bhutan, has no traffic lights. A police officer directs the cars by hand instead. Bhutan is also famous for measuring Gross National Happiness. Series: Places That Shouldn't Exist.\n\n#Shorts #Bhutan #Geography", "script": ["Your drive through Thimphu has no traffic lights.", "A police officer directs every car by hand.", "Not one signal in the whole capital.", "Hand signals decide who goes first.", "Bhutan even measures Gross National Happiness.", "Cross from India, and the signals vanish.", "Your drive in Thimphu runs on hands, not lights.", "Tomorrow: the first Indian in space."], "job": ""}, {"date": "2026-10-25", "kind": "Short", "category": "space", "title": "India Seen From Space: Saare Jahan Se Accha", "hook": "Your answer from space was Saare Jahan Se Accha.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In April 1984  no sense, from a German village surrounded by Switzerland to a lake with no agreed border, ending on a strange enclave right here in India. Every place is real and you can check it on a map.\n\n#borders #geography #facts", "script": ["Your cycle path is Belgian land, but German villages sit on both sides of it.", "That is real, and it is only border number seven. Today we count down seven borders that make no sense.", "Each one is stranger than the last, and the number one border is right here in India.", "By the end, you will see a piece of land inside a piece of land, inside another piece of land.", "On the way, you will meet a village with two currencies and a town trapped inside France.", "You will also see a lake that three countries have never agreed how to divide.", "Stay till the end, because the last border was only fixed in 2015, after a deal between India and Bangladesh.", "Number seven. The Vennbahn, a railway built more than a hundred years ago, when this whole area belonged to Germany.", "It carried coal and steel between German cities and Luxembourg, running through quiet green hills near the Belgian border.", "Then Germany lost the First World War, and the peace treaty of 1919 handed that railway line to Belgium.", "Belgium got the track, but not the land around it. So a thin Belgian strip now runs through German ground.", "Today the trains are gone. The old line is a famous cycle path, about 125 kilometres long.", "The route also reaches Luxembourg, so one old railway line links three countries today.", "You ride on Belgian land, while German villages like Mützenich sit beside you, on both sides of the path.", "Think about it. You stay on a path owned by one country, while the villages next to you belong to another.", "There is no wall and no passport check, because both countries are in Europe's open-border zone.", "So the map changed after a war, and a railway stayed behind as a Belgian strip in Germany.", "Strange? Yes. But number six is stranger, because it is a whole village that is surrounded by another country.", "Number six. Büsingen, a German village completely surrounded by Switzerland.", "Look at the map, and you see a small German pocket, with Swiss land on every side.", "It sits on the Rhine river, near the Swiss city of Schaffhausen, so Switzerland really is all around it.", "The people there are German citizens, so they follow German law and vote in German elections.", "But the village sits inside the Swiss customs area, and both euros and Swiss francs are used there.", "Two countries' money, in one small village. That is rare for any place on Earth.", "To reach the rest of Germany by road, you have to cross Swiss land first.", "Imagine a village in one Indian state, where every road out passes through a different country. That is daily life here.", "Small, quiet, and perfectly normal for the people who live there, yet it looks like a mistake on the map.", "But a piece of America is stuck on the wrong side of a border too.", "And that one begins with a map that was simply wrong.", "Number five. The Northwest Angle, a small piece of Minnesota that sits north of the rest of the United States.", "On a map it looks like a mistake, a little box of America stuck on top of Canada.", "To drive there from the rest of Minnesota, you must go through Canada, because no road connects it by land.", "So an American has to enter Canada, and then come back into the United States on the same trip.", "Why? In 1783, the treaty makers used a map that was wrong about the lakes and rivers.", "They believed the Mississippi river began farther north than it really does, and they drew the line using that idea.", "The mistake was never undone, so this corner of America ended up cut off from the rest by land.", "Much of it is lake and forest, so the real way in is often by boat or plane.", "One wrong map, and a whole corner of a country was cut off. Next, a whole town goes the same way.", "Number four. Llívia, a Spanish town that sits inside France.", "Spain is only a few kilometres away, but between the town and Spain lies French land.", "This goes back to 1659, when Spain gave several villages to France in the Treaty of the Pyrenees.", "But Llívia counted as a town, not a village, so it stayed Spanish. One word on paper decided the border.", "Today a road called the neutral road connects Llívia to Spain. The land is French, but a Spanish road runs across it.", "If you like strange places like these, this is a good moment to subscribe, because there are more to come.", "So a Spanish town lives inside France, with its own fields, its own streets and a Spanish name on the map.", "Now imagine that, but with an entire region, big enough to be a small country.", "Number three is not a town at all, and it belongs to one of the biggest countries on Earth.", "Number three. Kaliningrad, a part of Russia that is not connected to the rest of Russia.", "It sits on the Baltic coast, with Poland on one side and Lithuania on the other.", "Poland and Lithuania are both in the European Union, so this is a Russian region surrounded by EU land and sea.", "This land used to be a German city called Königsberg, until the Soviet Union took it after the Second World War.", "Today, travel by road or train from there to the rest of Russia means passing through other countries.", "Imagine if Goa belonged to India, but every road to the rest of India passed through another country.", "That is what Russia lives with in Kaliningrad, a piece of the country that cannot be reached by land alone.", "A piece of land cut off from its country. Now, what about a border that is missing from the map?", "Number two does not even have a line on the map in the middle of the water.", "Number two. Lake Constance, where three countries share one lake, and nobody has agreed where the borders lie.", "Germany, Switzerland and Austria all touch its shores. It sits near the Alps and is hugely popular with tourists.", "On land, the borders are clear. On the water, there is no officially agreed line.", "The three countries hold different views on how the lake should be divided, and that question is still open.", "Boats, fishing and rescue are handled by practical agreements, so everyday life carries on without trouble.", "So you can sail across it, and never know which country's water you are floating on.", "A border that is clear on land, and simply fades away at the water's edge.", "Now for the one I promised, because it is the strangest border on this list, and it is in India.", "Number one. Cooch Behar in West Bengal, near the Bangladesh border.", "Until 2015, this area was full of tiny islands of land, each belonging to the other country.", "There were 111 Indian enclaves inside Bangladesh, and 51 Bangladeshi enclaves inside India.", "Some were just a few fields big. People lived there as citizens of a country they could not easily reach.", "Many struggled to get schools, hospitals or electricity, because the country around them was not their own.", "Think of the people. For decades, they lived on land that the official maps called foreign.", "And the strangest of them all was called Dahala Khagrabari.", "It was an Indian plot, inside a Bangladeshi plot, inside an Indian plot, inside Bangladesh.", "Experts called it the world's only third-order enclave. Standing there, you were in India, inside Bangladesh, inside India, inside Bangladesh.", "On the night of 31 July 2015, India and Bangladesh finally swapped the enclaves, and people could choose their country.", "After nearly seventy years, the maps finally became simple. And that is the countdown, from a Belgian strip in Germany to land inside land inside land.", "Which brings us back to the start: your cycle path is Belgian land, but German villages sit on both sides of it.", "Next video: time zones that make no sense, including Nepal's, which sits fifteen minutes ahead of India's."], "job": ""}, {"date": "2026-10-26", "kind": "Short", "category": "geography", "title": "Your Nepal Flag Drawing Can't Be a Rectangle", "hook": "Your drawing of Nepal's flag can't be a rectangle.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Nepal has the only national flag in the world that is not a rectangle or square. It is made of two stacked triangles. The two points are said to stand for the Himalayas. Series: Places That Shouldn't Exist.\n\n#Shorts #Nepal #FlagFacts", "script": ["Your drawing of Nepal's flag can't be a rectangle.", "It's the only national flag that isn't.", "Two triangles are stacked on top of each other.", "The two points are said to stand for the Himalayas.", "Neighbours India and China use rectangles.", "Every other country uses a four-sided flag.", "Your drawing of Nepal's flag needs two triangles.", "Tomorrow: your Everest photo crosses a border."], "job": ""}, {"date": "2026-10-26", "kind": "Short", "category": "geography", "title": "Your Everest Summit Photo Is a Border Photo", "hook": "Your Everest summit photo is also a border photo.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The border between Nepal and China runs across the top of Mount Everest. Stand on the summit and you are on the line between two countries. Everest is 8,849 metres tall. Series: Places That Shouldn't Exist.\n\n#Shorts #Everest #Geography", "script": ["Your Everest summit photo is also a border photo.", "The Nepal and China border runs across the top.", "One side is Nepal, the other is Tibet, China.", "Everest stands 8,849 metres tall.", "Climbers can stand in two countries at once.", "Many climbers start from the Nepal side.", "Your summit photo is a border photo too.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-10-26", "kind": "Short", "category": "space", "title": "Your 2 Rupee Note Carried a Satellite", "hook": "Your old 2 rupee note had a satellite on the back.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "India's first satellite, Aryabhata, launched in 1975. It was printed on the back of the 2 rupee note. Check an old note and you can see it yourself.\n\n#Shorts #ISRO #Aryabhata", "script": ["Your old 2 rupee note had a satellite on the back.", "That satellite is Aryabhata, India's very first.", "It launched in 1975, from a Soviet rocket.", "India built the satellite itself, at ISRO.", "Then it was printed on everyday pocket money.", "Millions of people held a satellite without knowing.", "Check your old notes. It might still be there.", "Tomorrow: ISRO rocket parts carried by bicycle."], "job": ""}, {"date": "2026-10-26", "kind": "Short", "category": "space", "title": "ISRO Carried Rocket Parts on a Bicycle", "hook": "Your idea of a rocket launch breaks at early ISRO.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In ISRO's early days, rocket parts were carried to the launch site on a bicycle. A famous photo also shows a satellite moved on a bullock cart. Today India sends missions to the Moon and Mars.\n\n#Shorts #ISRO #SpaceFacts", "script": ["Your idea of a rocket launch breaks at early ISRO.", "Rocket parts rode to the launch site on a bicycle.", "That launch site was a small fishing village.", "It gets stranger. A satellite rode a bullock cart.", "The photo is real, and ISRO shares it proudly.", "Those same people later reached the Moon and Mars.", "So next time, remember the bicycle.", "Tomorrow: why your Netflix screenshot goes black."], "job": ""}, {"date": "2026-10-26", "kind": "Short", "category": "technology", "title": "Your Netflix Screenshot Is Just Black", "hook": "Your Netflix screenshot comes out as a black screen.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Try taking a screenshot while a Netflix or Prime Video show is playing. On many phones the picture comes out as a plain black frame. The apps block screen capture to protect the video.\n\n#Shorts #Netflix #PhoneTricks", "script": ["Your Netflix screenshot comes out as a black screen.", "Open any show and play it.", "Now take a screenshot, like always.", "Open your gallery. The picture is just black.", "The app told your phone to block the capture.", "It is meant to protect the movies.", "Same trick works on Prime Video, on many phones.", "Tomorrow: the country that is almost underwater."], "job": ""}, {"date": "2026-10-27", "kind": "Long video", "category": "geography", "title": "Why Belgium Is Stranger Than You Think", "hook": "Your bike path in Belgium runs through Germany, and every metre of it still belongs to Belgium.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A Belgian bike path cuts through Germany, and that is only the start. Six true facts about Belgium: three languages, 541 days without a government, the longest tram line in the world, Antwerp's diamonds, a land that belonged to nobody, and the Vennbahn railway strip inside Germany.\n\n#Belgium #Geography #FactsThatSoundFake", "script": ["Your bike path in Belgium runs through Germany, and every metre of it still belongs to Belgium.", "Step off that path and you are in German villages. Stay on it and you never leave Belgium.", "And this is just one oddity in a country that is smaller than the Indian state of Kerala.", "Today I will show you six facts about Belgium that sound fake but are completely true.", "And by the end, you will see exactly how a Belgian railway ended up cutting through Germany.", "Let us start with a country that cannot even agree on how to say hello.", "Chapter one. Belgium has three official languages, and one small country has to juggle all of them.", "In the north, people speak Dutch. In the south, people speak French. In a small eastern corner, people speak German.", "Yes, German. A small part of eastern Belgium speaks German every day and even has its own government.", "Belgium covers about thirty thousand square kilometres. Kerala is bigger than that, yet Belgium fits three languages.", "Even the capital, Brussels, uses two languages on its signs, so one road can have two different names.", "Think of a city sign in two languages, but with each language belonging to a different part of the country.", "There is even a language border across the country, fixed by law in the early nineteen sixties.", "Cross that line, and the official language of schools and government offices changes.", "Belgium even has six governments for under twelve million people. That is a lot of ministers.", "And all those governments lead us to chapter two, which is even stranger.", "Chapter two. Imagine a country running for almost a year and a half without a real government.", "Belgium did exactly that. After elections in June 2010, the parties could not agree on a new government.", "It took five hundred and forty one days before a new government was sworn in, in December 2011.", "That is more than a year and four months. A full election, and nobody could form a team.", "The north and the south wanted very different things, and the talks kept breaking down.", "Yet trains ran, schools opened, and salaries were paid, because a caretaker government kept daily work going.", "Some people joked that Belgium works fine without a government. Of course, that is only a joke.", "People held protests and demanded their leaders end the deadlock, and the long wait became world news.", "For Indian viewers, imagine no new Prime Minister for one and a half years after a general election.", "It is hard to picture, but it really happened in a rich European country.", "Now let us leave politics and go to the coast, where a vehicle breaks a world record.", "Stay with me, because the biggest surprise is still waiting at the end.", "Chapter three. Belgium has a tram that runs along its whole coastline, and it is the longest tram line in the world.", "It is called the Kusttram, which simply means the coast tram.", "It runs from De Panne near the French border all the way to Knokke-Heist near the Dutch border.", "That is about sixty-eight kilometres, which is more like a train journey than a city tram ride.", "A tram is usually a short city ride, but this one runs beside the sea for hours.", "You sit by the window with the North Sea on one side and beach towns on the other.", "It stops at many small beach towns, so you can hop off for an ice cream and hop back on.", "Most countries use trams inside one city. Belgium stretched one along its entire coast.", "A tram that lasts for hours is odd, but the next chapter is about something that glitters.", "Chapter four has an Indian connection that most people never hear about.", "One Belgian city handles most of the world's rough diamonds, and it is not anywhere near a diamond mine.", "It is Antwerp. Rough stones arrive from mines, and traders there buy, sell, and send them out again.", "If you enjoy strange places and facts like these, this is a good moment to subscribe, because there is more coming.", "Now here is the part Indian viewers will love. Many diamond traders in Antwerp come from Gujarati families.", "Families from places like Palanpur moved to Antwerp decades ago, and Indian businesses became a major force there.", "Surat, back in India, is where a huge share of the world's diamonds are cut and polished.", "So a stone can be traded in Belgium, polished in Gujarat, and worn at a wedding anywhere in the world.", "A walk through the Antwerp diamond district shows shops and offices packed into just a few streets.", "Big deals there have long been sealed with a handshake and a word of good luck.", "Next is a place that was once a territory no single country owned, and it nearly spoke Esperanto.", "Chapter five. For about a hundred years, a tiny patch of land near Belgium belonged to no single country.", "It was called Neutral Moresnet, and it was one of the smallest territories in Europe.", "After Napoleon was defeated, Prussia and the Netherlands could not agree who should get this small zinc mine area.", "So they did the simple thing. They agreed to share it, and it stayed that way for about a hundred years.", "Later, Belgium took the Dutch side after it became independent, so Belgium and Prussia shared it together.", "The zinc mine made the land valuable, and workers and their families lived there under shared rule.", "It was so small that you could walk across it in a short time.", "Around 1908, a local doctor named Wilhelm Molly pushed a bold idea. He wanted it to become an Esperanto country.", "Esperanto is a language invented so that people from every country could talk to each other.", "They even planned to rename the place Amikejo, which means place of friendship.", "The plan never fully worked. After the First World War, the Treaty of Versailles gave Moresnet to Belgium.", "That same treaty is the key to our last chapter, so remember it.", "Because it also decided who got a railway, and that is where Belgium gets truly strange.", "Chapter six, the biggest one. A railway that Belgium owns, running through German land.", "It is called the Vennbahn, and Germany built it long ago to carry coal and iron.", "After the First World War, the Treaty of Versailles in 1919 gave the railway line to Belgium.", "But the line did not stay inside Belgium. It kept crossing the border, in and out of Germany.", "So Belgium did not just get a railway. It got the land under the tracks, even where that land was German.", "Picture a thin strip of Belgium running through German countryside, like a ribbon laid across the map.", "German villages sit on both sides of that strip, with German homes close to a Belgian track.", "Trains stopped running long ago, and the old railway became a cycle path about a hundred and twenty five kilometres long.", "It is a popular cycle route, running through forests, hills and small towns.", "And yes, if you cycle it, you pass through Germany while staying on a path that belongs to Belgium.", "There are no passport checks on the way, since Belgium, Germany and Luxembourg are all in the Schengen area.", "The path even reaches Luxembourg, so one ride can touch three countries.", "The route starts in Aachen, in Germany, and ends in Troisvierges, in Luxembourg.", "The strip is Belgian, but the homes, shops and farms on either side are German.", "So the opening line is true. Yes, you can cycle through Germany and never leave Belgium.", "That was Belgium: three languages, and a government that took five hundred and forty one days to form.", "A record-breaking coast tram, a diamond city with Indian roots, and a land that belonged to nobody.", "And a railway strip Belgium owns, cutting through Germany. Your bike path in Belgium really does run through Germany.", "Tomorrow: a country that sits on two continents at once."], "job": ""}, {"date": "2026-10-27", "kind": "Short", "category": "geography", "title": "The Maldives Is Barely Above the Sea", "hook": "Your Maldives holiday is on the lowest country on Earth.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Maldives is the lowest-lying country on Earth. Its highest natural point is often listed at only about 2.4 metres above sea level. Most of the islands sit just above the waves.\n\n#Shorts #Maldives #Geography", "script": ["Your Maldives holiday is on the lowest country on Earth.", "Its highest natural point is about 2.4 metres.", "That is shorter than a basketball hoop.", "The whole country is a chain of tiny islands.", "Your resort sits just above the waves.", "Rising seas are a real worry there.", "So that paradise is the lowest place on Earth.", "Tomorrow: a ferry from Europe to Asia."], "job": ""}, {"date": "2026-10-27", "kind": "Short", "category": "geography", "title": "This Ferry Ride Crosses Two Continents", "hook": "Your ferry ride in Istanbul crosses two continents.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Istanbul is split by the Bosphorus strait, with one side in Europe and the other in Asia. Commuters cross between continents by ferry every day. It is one city on two continents.\n\n#Shorts #Istanbul #Geography", "script": ["Your ferry ride in Istanbul crosses two continents.", "A narrow strait splits the city in half.", "One side is Europe. The other is Asia.", "People cross it by ferry on the way to work.", "A short ferry ride takes you between continents.", "You can have breakfast in Europe, lunch in Asia.", "So one boat ticket crosses a whole continent line.", "Tomorrow: a country with eleven clocks."], "job": ""}, {"date": "2026-10-27", "kind": "Short", "category": "geography", "title": "Russia Has 11 Time Zones in One Country", "hook": "Your phone clock in Russia has to handle 11 time zones.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Russia spans 11 time zones, more than any other country. When it is morning in one end, it can already be night at the other. India has just one, which makes this even stranger to picture.\n\n#Shorts #Russia #TimeZones", "script": ["Your phone clock in Russia has to handle 11 time zones.", "That is one country with eleven different clocks.", "India has only one time zone, IST.", "Russia stretches from Europe all the way to the Pacific.", "When Moscow wakes up, Kamchatka is already ahead.", "Trains there run on Moscow time, so stations look strange.", "So one phone, eleven different times of day.", "Tomorrow: a border that runs through a house."], "job": ""}, {"date": "2026-10-27", "kind": "Short", "category": "space", "title": "Your Country Launched 104 Satellites at Once", "hook": "Your country put 104 satellites up with one rocket.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In February 2017, ISRO's PSLV-C37 carried 104 satellites into orbit on a single launch from Sriharikota. It was a world record at the time. Part of the series: India In Space.\n\n#Shorts #ISRO #Space", "script": ["Your country put 104 satellites up with one rocket.", "It happened in February 2017.", "ISRO's PSLV-C37 lifted off from Sriharikota.", "That was a world record at the time.", "Most of them were tiny nanosatellites.", "They were released one after another in orbit.", "One rocket. One ride. One hundred and four.", "Your country did that. Next: a town being moved."], "job": ""}, {"date": "2026-10-27", "kind": "Short", "category": "technology", "title": "Your Phone Camera Translates Signs Live", "hook": "Your phone camera can read a Hindi sign out loud in English.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Open Google Lens, tap Translate, and point it at a sign in another language. The text is swapped into English right on your screen as you move. Try it on any Android or iPhone with Google Lens.\n\n#Shorts #GoogleLens #PhoneTricks", "script": ["Your phone camera can translate any sign live.", "Open Google Lens and tap Translate.", "Point it at a Hindi sign.", "The words swap into English on your screen.", "Move the camera and the text follows.", "It works on menus and signboards too.", "No typing, no photo, just point.", "Your camera now reads signs for you. Next: France's strange map."], "job": ""}, {"date": "2026-10-28", "kind": "Long video", "category": "geography", "title": "7 Borders That Make No Sense (India's Is Wildest)", "hook": "Your road in Estonia used to run through Russia, and you could not stop, slow down, or step out of the car.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that sound fake: a US town you can only reach through Canada, a German town inside Switzerland, a Spanish town inside France, an Estonian road through Russia, and India's land-inside-land-inside-land enclave. Watch the countdown to find out how Cooch Behar's 162 enclaves were finally swapped with Bangladesh in 2015.\n\n#borders #geography #india", "script": ["Your road in Estonia used to run through Russia, and you could not stop, slow down, or step out of the car.", "That road is number two on today's list. Number one is in India, where land sat inside land, inside land, inside another country.", "Seven borders, each one stranger than the last. All real, all on your map, and two of them changed in recent years.", "We start with an American town that you can only reach by driving through another country.", "Then a German town packed inside Switzerland, an Italian town on a Swiss lake, and a Spanish town sitting in France.", "Stay till the end, because the last border has a tiny patch of land that sat inside three other pieces of land.", "Number seven. Point Roberts, Washington. It is part of the United States, but you cannot drive there from the rest of it.", "Look at the map near Vancouver. A small hook of land hangs below the Canadian coast, and it belongs to America.", "The cause is one straight line. The border follows the 49th parallel, and that line slices through the tip of a peninsula.", "The land south of the line became American, even though it hangs off Canada with no road joining it to the United States.", "So to drive home to the rest of Washington, you cross into Canada, drive through it, and then cross back into America.", "That is two border crossings for a trip inside your own country, just to run a simple errand.", "Canadian suburbs sit right beside the town, so the border is a short walk from many homes there.", "It is a place where the map and the road disagree. And it is not even the strangest one of its kind.", "Next, a town where the shops take Swiss money, but the town is officially German.", "Number six. Büsingen am Hochrhein. It is a German town, and Swiss land surrounds it on every side.", "Find it on the map beside the Rhine. A small German patch floats inside Switzerland, with no German road joining it to Germany.", "The town is part of Germany, but it sits inside the Swiss customs area, so shopkeepers there use Swiss francs.", "Its cars even have their own number plate code, BÜS, so a German car there stands out at once.", "Locals say the odd borders came from old deals between old kingdoms, and nobody tidied them up afterwards.", "So here is a town where you can walk to Switzerland in minutes, yet it is still German on paper.", "And the next town is stuck even deeper in the same trap, only with a lake and a casino.", "Number five. Campione d'Italia. An Italian town that sits on the shore of Lake Lugano, inside Switzerland.", "Mountains cut the town off from the rest of Italy, so for ages the easy road in and out was a Swiss one.", "Everyday life leaned on Switzerland. People there used Swiss francs and worked with Swiss shops and services.", "In 2020 that changed, and the town joined the European Union's customs area, with the euro as its money.", "So an Italian town trapped in Switzerland slowly turned into an EU patch in a country outside the EU.", "Now a town that has been stuck for more than three hundred and fifty years, thanks to one old word in a treaty.", "Number four. Llívia. A Spanish town that sits fully inside France, just beyond the Pyrenees.", "In 1659, Spain and France signed the Treaty of the Pyrenees, and Spain handed over a list of villages to France.", "But Llívia was a town, not a village. So by the wording of the treaty, it stayed Spanish.", "That single word kept Llívia Spanish while French land closed in around it, and it is still Spanish today.", "A neutral road links it to Spain. That road counts as French land, yet Spanish traffic is allowed on it.", "If you like strange places like this, subscribe, because we find a new one on the map every day.", "Walk the streets of Llívia and you see Spanish signs, Spanish food, and French mountains right outside the town.", "Fun fact for map fans: its chemist's shop is one of the oldest in Europe, kept as a museum.", "That was a mistake of one word. The next one is a mistake of a whole map.", "Number three. The Northwest Angle in Minnesota. It is the only part of the lower United States north of the 49th parallel.", "Look at the top of Minnesota on any map. A little square of land pokes up into Canada like a thumb.", "Old treaty makers drew the line using a map that was wrong about where the Mississippi River started.", "When people later checked the real land, the line already stood, and the Angle stayed on the American side.", "Most of it is water in Lake of the Woods, with forest and islands, and no road joins it to the rest of Minnesota.", "You can reach the Angle by boat across the lake, or by road through Canada, and then through a border check.", "People who live there are fully American, yet they go to the next town by crossing a whole other country.", "A wrong map built that border, and the people there still follow it. But next, a border that is not even wrong.", "It is a road. You can drive on it, but the land under your wheels belongs to another country.", "That road is back, because we are at number two, and it is the one I opened with.", "Number two. The Saatse Boot, in south-east Estonia. A road between two Estonian villages that crossed into Russia.", "On a map the Russian land is shaped like a boot, and the road from Värska to Saatse ran straight across it.", "The stretch was roughly a kilometre long. Drivers could pass through, but they could not stop, get out, or even slow down.", "There was no gate and no passport check for people passing through. Just signs, a road, and Russian land on either side.", "The land stayed Russian because border treaties between Estonia and Russia were never ratified, so the old lines stayed.", "Locals used it every day to get to work, school, and shops, and for years nobody thought twice about it.", "Then, in October 2025, armed Russian personnel were seen on the stretch, and Estonia shut the road.", "The government has now closed those road sections for good, with barriers, fences, and signs where cars once passed.", "Locals now take a muddy forest road, and a proper bypass is still being built.", "So the strangest road in Europe, the last one that ran through Russia, is now just a closed piece of history.", "Now for number one. It is in India, it involves a football field of land, and it had people living in no-man's land.", "Number one. The Cooch Behar enclaves, between West Bengal and Bangladesh. The most tangled border ever drawn.", "For decades, Indian villages sat inside Bangladesh, and Bangladeshi villages sat inside India. In all, there were 162 such patches.", "111 of them were Indian, inside Bangladesh. 51 were Bangladeshi, inside India. Each was a tiny piece of one country, surrounded by the other.", "A local story says the Maharaja of Cooch Behar and the ruler of Rangpur once played chess or dice for these lands.", "Whatever the cause, the patches stayed. If you lived in one, there was no school, hospital, or electricity from your own country.", "Walk out of your field and you were abroad, with no visa, no papers, and often no easy way to reach your own country.", "And then there is the one that blew people's minds, a patch called Dahala Khagrabari.", "It was Indian land inside a Bangladeshi enclave, inside an Indian enclave, inside Bangladesh. The only one of its kind in the world.", "It was tiny, about the size of a football field, and stand in the middle and you were standing in four borders at once.", "Then, at midnight on 31 July 2015, India and Bangladesh finally swapped these lands in a historic deal.", "India received 51 Bangladeshi enclaves, and Bangladesh received 111 Indian ones. Maps were redrawn, and the patchwork vanished.", "People living there could choose which country they wanted to belong to, and many saw their first proper Indian or Bangladeshi flag.", "So the strangest border of all lived in India, and it ended in our lifetime, with the whole thing settled by a pen.", "That is the countdown: a US town behind Canada, a German town in Switzerland, an Italian one on a lake, and a Spanish one in France.", "Then a bit of America stuck above America, a road through Russia, and India's land inside land inside land.", "So remember, your road in Estonia really did run through Russia, and you could not stop.", "Tomorrow: more places on the map that should not exist."], "job": ""}, {"date": "2026-10-28", "kind": "Short", "category": "geography", "title": "Fly From Paris, Land in France 12 Hours Away", "hook": "Your flight from Paris can land in a French island across the world.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "France has more time zones than any other country because of its overseas territories. Paris to French Polynesia is a 12 hour time difference in summer. Part of the series: Places That Shouldn't Exist.\n\n#Shorts #Geography #France", "script": ["Your flight from Paris can land in France again.", "But the clock there is way off.", "Tahiti is French, on the other side of the world.", "In summer it's 12 hours behind Paris.", "France owns lands on many oceans.", "That gives it more time zones than any country.", "Leave Paris at night, land in someone's morning.", "Same country, different day. Next: a town on the move."], "job": ""}, {"date": "2026-10-28", "kind": "Short", "category": "geography", "title": "A Whole Swedish Town Is Being Moved", "hook": "Your whole town gets moved if the ground below it is worth more.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Kiruna in northern Sweden sits on a huge iron ore mine, and the ground under the town centre is becoming unstable. So the town is being
