te 1970s, Pakistan gave permits to foreign climbers to explore the glacier.", "Some Western maps then began drawing the border straight across to the Karakoram Pass, which put Siachen on Pakistan's side.", "India saw those maps and permits as a quiet claim on the ice, and decided it could not wait.", "The Indian Army sent its own mountaineering expeditions up the glacier to show it was watching.", "Notice how strange that is. A fight over a glacier was built from climbing permits and the way a map was drawn.", "And the name itself is gentle. Siachen is often translated as place of wild roses.", "Roses, on a glacier where almost nothing grows. And the next fact is where the story turns serious.", "Fact three: in April 1984, two armies raced for ridges and passes around eighteen thousand feet high.", "On the thirteenth of April, India launched Operation Meghdoot, named after the cloud messenger in an old Sanskrit poem.", "Helicopters lifted Indian soldiers onto the heights, because there was no road and no easy path on foot.", "India took the main passes along the Saltoro Ridge: Sia La, Bilafond La and Gyong La.", "Reports say Pakistan was preparing its own move, and found Indian troops already holding the high ground.", "Since then, India has held the high ridge, and Pakistan holds positions lower down on the other side.", "Pakistan tried to push back in 1987, and a post was later renamed Bana Top after Bana Singh, who won the Param Vir Chakra.", "That post sits well above twenty thousand feet, higher than most people ever climb in their lives.", "Think about that. Two armies fought for land with no farms, no villages and no roads.", "If you enjoy strange maps and places like this, subscribe, because we post a new one every day.", "In the end, the race was won in days, but holding the ridge has taken decades.", "Now, what is life up there actually like?", "Because the real enemy on Siachen was never the other army.", "Fact four: the weather on Siachen has killed far more soldiers than gunfire ever did.", "Temperatures at the posts can fall to around minus fifty degrees Celsius in winter.", "Blizzards can last for days and bury a tent overnight.", "At that height there is far less oxygen, so even walking ten steps can leave you breathless.", "Frostbite is a daily danger, and touching bare metal in that cold can tear your skin.", "Some posts can only be reached by helicopter, and bad weather can cut them off for days.", "Deep cracks called crevasses hide under fresh snow, so soldiers walk roped together.", "Indian soldiers first train at a high-altitude school in Ladakh, to let their bodies adjust before they go up.", "Tours at the highest posts are kept short, because the body wears down in that thin, freezing air.", "In 2012, an avalanche buried a Pakistani army camp at Gayari, and more than a hundred soldiers died.", "No battle did that. A mountain of snow slid down in seconds.", "And one survival story from Siachen sounds so unlikely that it feels made up.", "Fact five: in February 2016, an avalanche hit an Indian army post at Siachen and buried ten soldiers.", "Rescuers dug for days in the freezing cold, using dogs and detection equipment to search the snow.", "On the sixth day, they found Lance Naik Hanumanthappa Koppad alive, under many feet of snow.", "He was barely conscious, but he was breathing, kept alive in a small pocket of air under the snow.", "He was flown to an army hospital in Delhi, and for a few days the whole country prayed for him.", "Sadly, he died on the eleventh of February, but his story shows how brutal this land is.", "The other nine soldiers buried with him did not survive.", "Remember, every one of these stories sits on one unfinished sentence from 1949.", "Which brings us to the biggest fact of all, and it is about right now.", "Fact six: more than seventy-five years later, the line is still not defined past NJ9842.", "India and Pakistan have held talks about Siachen over many years, and reports say they came close to a deal more than once.", "Pulling troops back sounds simple, but each side wants today's positions written down first, and that has been the sticking point.", "In November 2003, the two countries agreed a ceasefire, and the guns on Siachen have been largely quiet since.", "So today it is a frozen standoff, with soldiers living at the top of the world just to hold a position.", "In 2019, India opened the area from Siachen base camp up to Kumar Post to tourists.", "The glacier matters beyond politics. Its meltwater feeds the Nubra River, which flows into the Shyok and then the Indus.", "Studies say Siachen has been shrinking over the years.", "Waste left by decades of soldiers adds to the damage, which makes the glacier's future a new kind of dispute.", "So the question has changed. It is not only who owns the glacier, but what will be left of it.", "Now go back to the start. Your map of the Line of Control stops at NJ9842.", "Beyond it, the agreement says only: thence north to the glaciers.", "Five words, one dot on a map, and one of the toughest places humans have ever fought over.", "No farms, no villages, no roads, and still two armies stayed, all because one sentence was left unfinished.", "That is why Siachen is stranger than you think. The world's highest battlefield began with a gap on a map.", "Tomorrow: the country whose clock is exactly fifteen minutes ahead of India's."], "job": ""}, {"date": "2026-11-28", "kind": "Short", "category": "geography", "title": "A Beach Where Jumbo Jets Land Overhead", "hook": "Your beach towel has jumbo jets landing over your head.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Maho Beach on Sint Maarten sits right beside the runway of Princess Juliana airport. Landing jets pass very low over the sand and swimmers. It is a real beach and a real airport.\n\n#Shorts #Geography #MahoBeach", "script": ["Your beach towel has jumbo jets landing over your head.", "This is Maho Beach, on Sint Maarten.", "The airport runway starts right behind the sand.", "Planes pass so low you feel it.", "Jet blasts can throw sand at people.", "Tourists wait just to watch it.", "Swimmers look up and see landing gear.", "A beach day with a runway overhead. Tomorrow: smoke over an Indian island."], "job": ""}, {"date": "2026-11-28", "kind": "Short", "category": "geography", "title": "India's Only Active Volcano Sits at Sea", "hook": "Your boat in India's Andaman Sea passes a live volcano.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Barren Island in India's Andaman Sea is the only confirmed active volcano in South Asia. Boats can pass it and see smoke rising over black volcanic rock. It sits alone in the middle of the sea.\n\n#Shorts #Geography #India", "script": ["Your boat in India's Andaman Sea passes a live volcano.", "It is called Barren Island.", "It is the only confirmed active volcano in South Asia.", "You can see smoke over black rock.", "And it sits alone in open sea.", "It belongs to India's Andaman and Nicobar Islands.", "A volcano hiding in plain sight. Tomorrow: a train crossing a waterfall."], "job": ""}, {"date": "2026-11-28", "kind": "Short", "category": "geography", "title": "The Train That Crosses a 310 m Waterfall", "hook": "Your train in Goa rides right across a giant waterfall.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Dudhsagar Falls in Goa is a four-tier waterfall about 310 metres tall. A railway bridge crosses right in front of it, so passing trains share the view. Its name means sea of milk.\n\n#Shorts #Goa #India", "script": ["Your train in Goa rides right across a giant waterfall.", "This is Dudhsagar Falls.", "The railway bridge crosses its front.", "The waterfall drops in four tiers.", "It is about three hundred ten metres tall.", "Its name means sea of milk.", "Trains roll past a wall of white water. Tomorrow: a robot astronaut."], "job": ""}, {"date": "2026-11-28", "kind": "Short", "category": "space", "title": "India Is Sending a Robot Woman to Space", "hook": "Your first Indian astronaut crew member may be a robot.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "ISRO plans to fly Vyommitra, a female-looking humanoid robot, on an uncrewed Gaganyaan test flight. She can talk and acts as a stand-in for a human crew member. It is a rehearsal for sending Indians to space.\n\n#Shorts #Space #ISRO", "script": ["Your first Indian astronaut crew member may be a robot.", "Her name is Vyommitra.", "ISRO built her to look female and human.", "She can talk to the mission team.", "On Gaganyaan's test flight, she is the crew.", "She acts as a stand-in for a human.", "A robot goes first so people can follow. Tomorrow: windows with no shades."], "job": ""}, {"date": "2026-11-28", "kind": "Short", "category": "technology", "title": "Plane Windows That Darken at a Button", "hook": "Your plane window can go dark without any shade.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Boeing 787 Dreamliner windows have no pull-down shades. Instead the glass dims when you press a button, and you can watch it darken. It is real technology on real passenger planes.\n\n#Shorts #Technology #Boeing787", "script": ["Your plane window can go dark without any shade.", "This is a Boeing 787 Dreamliner.", "There is no plastic shade to pull.", "You just touch a button.", "The glass slowly turns dark blue.", "You can watch the darkening happen.", "Press again and the sky comes back.", "A window that dims itself. Tomorrow: another strange place."], "job": ""}, {"date": "2026-11-29", "kind": "Long video", "category": "geography", "title": "6 Borders That Make No Sense, and India's Is Worst", "hook": "Your Punjab and your Bengal were split by a stranger who had never seen either.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Six real borders that make no sense, counting down from a Spanish town inside France to the Radcliffe Line, which was drawn in about five weeks by a British lawyer who had never been to India. You will see Llívia, Büsingen, Lesotho, Point Roberts and the Durand Line before the biggest one. Watch to the end for what happened to Punjab and Bengal in 1947.\n\n#borders #india #geography", "script": ["Your Punjab and your Bengal were split by a stranger who had never seen either.", "A British lawyer drew India's biggest border in about five weeks, and he had never been to India before.", "By the end, you'll see how that line was drawn, and why it is the strangest border on Earth.", "Stay till the last one, because that line still shapes the lives of well over a billion people.", "But first, five more borders that make no sense, each one stranger than the last.", "Some are towns stuck inside other countries. One is a whole country stuck inside another. Let's count down from six.", "Number six: a Spanish town sitting inside France, and it exists because of a single word in an old treaty.", "In 1659, Spain gave France a list of villages. Llívia was called a town, not a village, so it stayed Spanish.", "Today it is a Spanish town ringed on every side by France.", "To reach the rest of Spain, people drive along a short road through France that is kept neutral.", "On the map it looks like a mistake, a small Spanish island floating in a French sea.", "One word in one treaty put a Spanish town inside France. And that is the mildest border on this list.", "Number five: a German town where shops take Swiss francs, even though you are standing in Germany.", "Büsingen am Hochrhein is a German town completely surrounded by Switzerland, with Swiss land between it and the rest of Germany.", "It sits inside the Swiss customs area, so everyday life there mixes Swiss money, Swiss rules and German law.", "The people are German citizens, and their cars even carry their own special BÜS number plates.", "Just beyond the town sign, a few steps in any direction, you are standing in Switzerland.", "A town that lives by two countries' rules. But what if it was a whole country? Number four is exactly that.", "Number four: Lesotho, a whole country with South Africa on every single side.", "Imagine a separate country in the middle of India, with Indian land on every side. That is Lesotho and South Africa.", "Its lowest point is over a kilometre above sea level, the highest lowest point of any country in the world.", "That is why Lesotho is nicknamed the Kingdom in the Sky, and why people there wear thick blankets as everyday clothes.", "It even sells water to South Africa, sent through huge tunnels under its mountains.", "That is strange. But number three is a piece of America you can only reach by passing through another country.", "Number three: Point Roberts, a piece of the United States that hangs off the end of a Canadian peninsula.", "On a map it looks like a small thumb of America stuck onto Canada.", "In 1846 a treaty drew the border along one line of latitude, and the tip of this peninsula ended up American.", "It has American houses, American shops and American flags, but the only land road out goes through Canada.", "To drive to the rest of Washington state, residents must cross into Canada, then show their papers again to re-enter America.", "All because of a straight line on a map. And lines drawn from far away cause the next border too.", "Number two: a line that cuts through families, and one country has never fully accepted it.", "In 1893, Sir Mortimer Durand, a British official, agreed a boundary with the ruler of Afghanistan. It is called the Durand Line.", "It runs through the land of the Pashtun people, so cousins, markets and grazing paths ended up split between two countries.", "The famous Khyber Pass sits right on this line, between Pakistan and Afghanistan.", "Today it is the border between Pakistan and Afghanistan, and Afghan governments have long refused to formally accept it.", "A line drawn by a British official more than a century ago still decides who lives in which country.", "Notice the pattern: a line drawn far from the land, by someone who does not live there, and it lasts for generations.", "And now the biggest one, from our own story. If you enjoy strange places and facts like these, do subscribe.", "Number one: the Radcliffe Line, India's strangest border, because of who drew it and how fast.", "In 1947 Britain was leaving India, and independence was fixed for the fifteenth of August.", "The country would split into India and Pakistan, and someone had to draw the line through Punjab and Bengal.", "The man chosen was Cyril Radcliffe, a London lawyer. He had never been to India before.", "He arrived in early July 1947. That left about five weeks to cut two huge provinces in half.", "There was no time to walk the land or meet the villages he was splitting.", "Two commissions helped, one for Punjab and one for Bengal, each with four judges from Congress and the Muslim League.", "The judges could not agree on the key questions, so the final decision fell to Radcliffe alone.", "The date for independence was fixed, so the deadline could not move, whatever the map looked like.", "His instructions were to follow areas where Muslims or non-Muslims were the majority, and to consider \"other factors\" too.", "Those other factors included canals, railways and roads, and they pulled the line in different directions.", "But the biggest problem was the calendar. Independence arrived before the map did.", "Pakistan and India were born on the fourteenth and fifteenth of August. The line was published on the seventeenth.", "For two days, millions of people did not know which country their own village belonged to.", "In Punjab, Lahore, a city with many Hindus and Sikhs, went to Pakistan. Amritsar, roughly fifty kilometres away, stayed in India.", "Nankana Sahib, the birthplace of Guru Nanak, also went to Pakistan, along with many other places sacred to Sikhs.", "The line also cut through the canals that watered Punjab's farms, so fields were separated from the water they depended on.", "In Bengal, Murshidabad had a Muslim majority yet went to India, while Khulna had a Hindu majority yet went to Pakistan.", "People in Murshidabad flew the Pakistani flag for two days, until the map arrived and they had to take it down.", "Pakistan was born in two pieces, West and East, with more than a thousand kilometres of India in between.", "Twenty-four years later, in 1971, the eastern piece broke away and became the country we now call Bangladesh.", "In the Chittagong Hill Tracts, people raised the Indian flag on the fifteenth of August, then learned their land had gone to Pakistan.", "Today the India-Bangladesh border runs for over four thousand kilometres, the longest land border India shares with any country.", "It twists through rivers, rice fields and villages, and pockets of one country inside the other were only swapped in 2015.", "The human cost was enormous. Millions crossed the new line on foot, by train and by bullock cart.", "Estimates of the dead run from hundreds of thousands to over a million, in one of the largest migrations in history.", "Many families in India, Pakistan and Bangladesh still tell the story of a home, a field or a neighbour left behind in 1947.", "Radcliffe left India within days of finishing. Reports say he turned down his fee and burned his working papers.", "The poet W. H. Auden later wrote a poem called Partition about him, a stranger who decided the fate of millions.", "Wagah sits on the old Grand Trunk Road between Amritsar and Lahore, and the border cuts straight across it.", "Go to Wagah every evening and you can see it: soldiers on both sides lower flags and close the gates while crowds cheer.", "That line at the gate comes from about five weeks of work in 1947.", "That is why it beats every other border here. The others came from old treaties. This one split living regions, and it still shapes the news today.", "Look at India's map again and remember: the land, the rivers and the people did not draw this line.", "Your Punjab and your Bengal were split by a stranger who had never seen either.", "Next video: more places where the map says one thing and the ground says another."], "job": ""}, {"date": "2026-11-29", "kind": "Short", "category": "geography", "title": "One Indian Territory Split Across 3 States", "hook": "Your map shows one territory sitting in three states.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Puducherry is one Union Territory, but it comes in four separate pieces. Puducherry and Karaikal sit in Tamil Nadu, Mahe is in Kerala, and Yanam is in Andhra Pradesh. Part of the series Places That Shouldn't Exist.\n\n#Shorts #India #Geography", "script": ["Your map shows one territory sitting in three states.", "It is Puducherry, and it comes in four pieces.", "Puducherry and Karaikal sit on Tamil Nadu's coast.", "Mahe is on Kerala's coast, far away.", "Yanam sits inside Andhra Pradesh.", "Four pieces, one government, three neighbouring states.", "Drive between them and you cross state lines.", "One territory, scattered across three states.", "Tomorrow: the capital that belongs to no state."], "job": ""}, {"date": "2026-11-29", "kind": "Short", "category": "geography", "title": "The City That Is Capital of Two States", "hook": "Your drive into Chandigarh reaches two capitals at once.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Chandigarh is the capital of both Punjab and Haryana. Yet the city belongs to neither, because it is a Union Territory run by the Centre. Part of the series Places That Shouldn't Exist.\n\n#Shorts #India #Geography", "script": ["Your drive into Chandigarh reaches two capitals at once.", "It is the capital of Punjab and Haryana.", "But the city belongs to neither state.", "Chandigarh is a Union Territory, run by the Centre.", "Both states work inside a city they don't own.", "Two capitals, zero ownership.", "Technically, you just drove out of both states.", "Tomorrow: a plant that grew on the Moon."], "job": ""}, {"date": "2026-11-29", "kind": "Short", "category": "space", "title": "A Cotton Plant Sprouted on the Moon", "hook": "Your cotton seed sprouted on the Moon's far side.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2019, China's Chang'e 4 lander carried cotton seeds to the far side of the Moon. One sprouted inside a sealed canister, the first plant to sprout on the Moon. The freezing lunar night later ended the experiment. Part of the series If You Were in Space.\n\n#Shorts #Space #Moon", "script": ["Your cotton seed sprouted on the Moon's far side.", "China's Chang'e 4 lander carried it there in 2019.", "The seed sat inside a sealed canister.", "Soon a green cotton sprout appeared.", "First plant ever to sprout on the Moon.", "The canister held air, water and soil.", "Then the freezing lunar night killed it.", "Still, a plant grew where no plant had.", "Tomorrow: soil from that same far side."], "job": ""}, {"date": "2026-11-29", "kind": "Short", "category": "space", "title": "Soil From the Side of the Moon We Never See", "hook": "Your first far-side Moon soil arrived in 2024.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2024, China's Chang'e 6 scooped up soil from the Moon's far side and brought it to Earth. It was the first time samples from that side ever came home. The capsule landed in Inner Mongolia. Part of the series If You Were in Space.\n\n#Shorts #Space #Moon", "script": ["Your first far-side Moon soil arrived in 2024.", "China's Chang'e 6 scooped it up.", "The far side never faces Earth.", "We only ever see one face of the Moon.", "No one had brought samples back from there.", "The capsule landed in China's Inner Mongolia.", "Scientists are now studying that soil.", "Soil from a place we never see.", "Tomorrow: blood delivered by drone."], "job": ""}, {"date": "2026-11-29", "kind": "Short", "category": "technology", "title": "Drones Drop Blood by Parachute in Rwanda", "hook": "Your blood delivery can arrive by drone.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Rwanda, Zipline drones fly medical supplies, including blood, to health facilities. The drone does not land: it drops the package by parachute. Part of the series Tech That Sounds Fake.\n\n#Shorts #Technology #Drones", "script": ["Your blood delivery can arrive by drone.", "In Rwanda, Zipline drones fly medical supplies.", "That includes blood for hospitals.", "The drone never even lands.", "It drops the package by parachute.", "The box floats down to a small drop zone.", "Then the drone flies back to base.", "Your blood could come from the sky.", "Tomorrow: seven islands hiding in a city map."], "job": ""}, {"date": "2026-11-30", "kind": "Long video", "category": "geography", "title": "Why India's Border Was Drawn in 5 Weeks by a Stranger", "hook": "Your border with Pakistan and Bangladesh was drawn in five weeks by a lawyer who had never visited India.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 1947 a British lawyer named Cyril Radcliffe, who had never been to India, drew the lines that split Punjab and Bengal. This video follows the Radcliffe Line from the secret map and the flags that changed after Independence Day to the cut canals, the Wagah ceremony and the man who left. Some details, like his refused fee and burned papers, come from reported accounts and are marked that way.\n\n#Partition #RadcliffeLine #IndiaPakistan", "script": ["Your border with Pakistan and Bangladesh was drawn in five weeks by a lawyer who had never visited India.", "He had old maps, an old census and a deadline. And he finished before the two new countries were even born.", "By the end, you'll see two famous cities split by a line, a flag swapped three days after Independence Day, and what happened to the man who drew it.", "That's seven stories, and each one is stranger than the one before.", "The last one is about the mapmaker himself, and it is not what you would expect.", "But first, the strangest choice of all: who they picked to do the job.", "Chapter one. They picked him because he knew nothing about India.", "Cyril Radcliffe was a British barrister. He reached India on the eighth of July, 1947, for the first time in his life.", "British leaders chose him partly because he had no ties to India, so nobody could call him biased.", "India was due to become free in about five weeks. That was his whole deadline, for a land of hundreds of millions of people.", "He chaired two commissions, one for Punjab and one for Bengal. Each had four Indian judges, two from each side.", "The judges argued for weeks and could not agree. So the final call on every disputed district fell to Radcliffe alone.", "His rule looked simple on paper: Muslim-majority areas to Pakistan, the rest to India, with other factors also considered.", "His main data was the census of 1941. Villages, canals, railways and farms all had to fit around those numbers.", "He worked through the Delhi summer, mostly kept apart from the very people his lines were about to change.", "A line that would decide homes for millions of people was being drawn from an office desk.", "And when he finished, nobody was allowed to see the result. Which brings us to chapter two.", "Chapter two. The country was free, but its borders were still a secret.", "Radcliffe finished his decisions on the twelfth of August, 1947.", "But India and Pakistan became independent on the fourteenth and fifteenth, and the map had still not been shown to anyone.", "The award was held back and published only on the seventeenth of August, after the celebrations were over.", "One reason given is that the delay was meant to stop border arguments from spoiling Independence Day.", "So for about two days, millions of people celebrated freedom without knowing which country their village was in.", "Imagine raising a flag on your roof and not knowing whether it is even your country's flag.", "In Punjab, families waited for news, unsure whether home would end up in India or in Pakistan.", "When the map came out, many people discovered they were on the wrong side of a line they never chose.", "Then came one of the largest migrations in human history. Estimates say millions crossed in both directions.", "The number of deaths is still debated. Estimates vary widely, but even the lowest are in the hundreds of thousands.", "That is the cost of a line drawn fast. Next, two famous cities that sit about fifty kilometres apart.", "Chapter three. Two great cities, and one border between them.", "Amritsar and Lahore were the two great cities of old Punjab, roughly fifty kilometres apart on the same Grand Trunk Road.", "Lahore went to Pakistan. Amritsar, home of the Golden Temple, stayed in India.", "Sikhs lost a great deal in this split. Nankana Sahib, the birthplace of Guru Nanak, ended up in Pakistan.", "Punjab itself was cut in two. Today the name means one state in India and one province in Pakistan.", "Punjabi is spoken on both sides, with the same songs, the same food and the same jokes.", "Many families were separated from relatives and land, and some still talk about the home they left behind.", "Today the road between the two cities runs into a border gate, and most travellers cannot simply drive through.", "If you like strange places and facts like these, subscribe, because the next chapters get stranger.", "Here is a quick teaser: the next place had its flag swapped three days after Independence Day.", "Chapter four. Bengal, where some towns raised the wrong flag.", "Radcliffe cut Bengal too. The west stayed with India, and the east became East Pakistan, which is Bangladesh today.", "The line did not follow rivers or hills neatly. It followed old district and village boundaries on old maps.", "Murshidabad had a Muslim majority, yet it went to India. Khulna had a narrow Hindu majority, yet it went to East Pakistan.", "Historians still argue over those choices, and people on both sides of the line remember them.", "On the fifteenth of August, parts of Nadia, Murshidabad and Malda reportedly flew Pakistan's flag, because the map was not yet public.", "After the award came out on the seventeenth, the Indian tricolour replaced it on the eighteenth.", "Some people in those places still celebrate their Independence Day on the eighteenth of August.", "The Chittagong Hill Tracts, where most people were not Muslim, went to East Pakistan as well.", "Calcutta stayed in India with its jute mills, but most of the jute fields ended up in East Pakistan.", "A single line separated a city's factories from the farms that fed them.", "And the strangest part is that rivers do not stay still for lines. The next chapter is all about water.", "Chapter five. The line also cut through rivers and canals.", "Punjab means land of five rivers, and the irrigation network built there by the British was among the largest in the world.", "Suddenly a border drawn on paper ran across canals that had been built to serve one single province.", "The headworks that sent water out could end up on one side, while the fields that needed it lay on the other.", "Within months a dispute broke out over who controlled that water, and it dragged on for years.", "In 1960, India and Pakistan signed the Indus Waters Treaty to share the rivers.", "The World Bank helped broker it. That shows how seriously a line across a canal can be taken.", "A border drawn in five weeks took thirteen years to settle, just on the question of water.", "Even today, some farmers in Punjab have fields beyond the border fence, and they must go through a gate to reach them.", "That is the farming side of the story. Now for the one place where the line becomes a show.", "Chapter six. The one place where the Radcliffe Line becomes a daily performance.", "At Attari-Wagah, on the Grand Trunk Road between Amritsar and Lahore, crowds gather every single evening.", "Indian and Pakistani soldiers march in sharp, high-kicking steps towards the gate while the crowds cheer on both sides.", "Then the two flags are lowered at the same moment, and the gates are shut for the night.", "The same line that took five weeks to draw now draws crowds every single day.", "A border drawn by a stranger has become something people travel for hours to watch.", "Strange as that is, the strangest part of this story is still ahead. It is about the man himself.", "Chapter seven. The mapmaker who left.", "Radcliffe left India around Independence Day, and accounts say he never came back.", "He reportedly refused his fee of forty thousand rupees, and did not want to be paid for the line.", "He also reportedly burned his papers before leaving, so the thinking behind many of his choices was never fully explained.", "Not every detail is documented, but accounts agree he was troubled by the violence that followed his map.", "Think about it: one man spent five weeks on a map, and millions of people still live with it every day.", "That is the line behind your border with Pakistan and Bangladesh: a stranger, a deadline and an old census.", "Next in this series, more places where one line on a map cuts through real life. And it all began with a lawyer who had never visited India."], "job": ""}, {"date": "2026-11-30", "kind": "Short", "category": "geography", "title": "Mumbai Was Seven Islands, Not One City", "hook": "Your map of Mumbai hides seven separate islands.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Mumbai was once a group of seven separate islands. Land reclamation slowly joined them into the single city on the coast. Colaba, Mazagaon, Worli, Mahim and Parel are among the old island names. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Mumbai #Geography", "script": ["Your map of Mumbai hides seven separate islands.", "Long ago, they really were seven islands.", "Sea water flowed between them.", "Land reclamation slowly joined them together.", "Today they form one single city.", "Colaba, Mahim and Parel were once islands.", "The city you know is stitched-together land.", "Seven islands, one coastline.", "Tomorrow: another map that lies to you."], "job": ""}, {"date": "2026-11-30", "kind": "Short", "category": "geography", "title": "Your Watch Runs 1 Hour Ahead in Assam", "hook": "Your watch in Assam's tea gardens runs an hour ahead.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Many Assam tea gardens run on Bagan time, an informal clock one hour ahead of India's official time. It exists so workers can use the early daylight in the east. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Assam #IndiaFacts", "script": ["Your watch in Assam's tea gardens runs an hour ahead.", "It is called Bagan time.", "India has one official time, IST.", "Tea gardens keep their own clock anyway.", "Sunrise comes very early in Assam.", "So workers start and finish earlier, using daylight.", "Same country, two clocks, one hour apart.", "Your watch in Assam might be an hour ahead.", "Tomorrow: camels standing in front of snow peaks."], "job": ""}, {"date": "2026-11-30", "kind": "Short", "category": "geography", "title": "Sand Dunes in Front of Snow Peaks in India", "hook": "Your camel ride here is on a two-humped camel.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hunder in Ladakh's Nubra Valley has sand dunes sitting at over 3,000 metres, with snow peaks behind them. You can ride double-humped Bactrian camels here. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Ladakh #IndiaFacts", "script": ["Your camel ride here has two humps.", "This is Hunder, in Ladakh's Nubra Valley.", "You are over 3,000 metres up.", "Sand dunes stretch out right in front.", "Snow peaks rise right behind them.", "Those are Bactrian camels, built for cold.", "Two humps, dunes, snow: one camel ride.", "Tomorrow: your Earth, seen from the Moon."], "job": ""}, {"date": "2026-11-30", "kind": "Short", "category": "space", "title": "Your Whole Earth Rising Over the Moon", "hook": "Your Earth once rose above the Moon, and someone photographed it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In December 1968, Apollo 8 astronaut Bill Anders took the photo known as Earthrise. It shows our blue Earth above the grey lunar surface, seen from orbit around the Moon. Part of the If You Were in Space series.\n\n#Shorts #Apollo8 #SpaceFacts", "script": ["Your Earth once rose above the Moon.", "This is Earthrise, from December 1968.", "Apollo 8 astronaut Bill Anders took it.", "Three men were orbiting the Moon.", "They saw Earth appear over grey ground.", "Anders grabbed a camera and shot it.", "A blue marble above a grey world.", "Your whole Earth, floating above grey ground.", "Tomorrow: a train that floats on magnets."], "job": ""}, {"date": "2026-11-30", "kind": "Short", "category": "technology", "title": "Your Airport Train Floats at 430 km/h", "hook": "Your airport train in Shanghai floats.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Shanghai's maglev airport train floats above its track using magnets, so there are no wheels rolling on rails. On a commercial run it reaches about 430 km/h. Part of the Tech That Sounds Fake series.\n\n#Shorts #Maglev #TechFacts", "script": ["Your airport train in Shanghai floats.", "It never touches the track.", "Magnets lift it just above the rail.", "Magnets push and pull it forward.", "On a commercial run, it hits about 430 km/h.", "That is far faster than Indian trains.", "Your airport ride is a floating train.", "Tomorrow: the only forest with wild Asiatic lions."], "job": ""}, {"date": "2026-12-01", "kind": "Long video", "category": "geography", "title": "The Border Where You Can See Pakistan's Gurdwara", "hook": "Your eyes can see a gurdwara in Pakistan from an Indian field, and the road that leads there has been shut.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "From a viewing point at Dera Baba Nanak in Punjab, you can look across the border at Gurdwara Darbar Sahib in Kartarpur, Pakistan. This countdown covers why the shrine ended up on the other side in 1947, how the visa-free Kartarpur Corridor opened in 2019, and why it is shut on the Indian side today. It is a strange border story, and every fact in it is true.\n\n#Kartarpur #IndiaPakistan #StrangeBorders", "script": ["Your eyes can see a gurdwara in Pakistan from an Indian field, and the road that leads there has been shut.", "That is Gurdwara Darbar Sahib in Kartarpur, one of the holiest places in Sikhism, only a few kilometres from the border.", "Most strange borders split streets or houses. This one splits a pilgrim from the place where Guru Nanak spent his last years.", "Today is a countdown of five strange facts about Kartarpur, and each one is stranger than the one before.", "By the end, you will know how a visa-free road opened, why it closed, and what you can still see today.", "Number one is about a gate that exists on the map but not in practice. First, let us start at five.", "Number five: a viewing point. At Dera Baba Nanak, in Punjab's Gurdaspur district, there is a spot built just to look at Pakistan.", "From there, pilgrims look across the border fields toward Kartarpur, and the gurdwara is a small shape far away.", "Binoculars and telescopes help. People bring their families, hold the lenses up, and search the horizon for a dome.", "Think about that. You travel for hours, and the holy place you came for is a few kilometres away but out of reach.", "For many years before 2019, this was how most Indian pilgrims saw the shrine. They bowed toward it from the Indian side.", "People say the Ardas, the Sikh prayer, facing Pakistan. It is a border you can feel in your chest, not just see on a map.", "Your phone map shows the same thing. Tap Kartarpur, and the pin sits just beyond a thin dotted line.", "So why is this shrine on the wrong side of that line? Number four explains it.", "Number four: 1947. When British India was divided, the line went through Punjab, the home of Guru Nanak's people.", "Some of the most sacred Sikh places ended up in India, and some ended up in Pakistan. Kartarpur was one of those.", "Guru Nanak founded Kartarpur around 1504. Tradition says he settled here and lived for about the last eighteen years of his life.", "He did not sit on a throne. He farmed the land, and people of every background ate together at his table.", "That idea became the langar, the community kitchen, which still serves free food to anyone at Sikh gurdwaras today.", "Guru Nanak died at Kartarpur in 1539. So the place where his journey ended now lies in a different country.", "There is a famous story from that day. Hindus and Muslims both loved him, and each wanted to hold his last rites.", "The story says that when the cloth was lifted, only flowers were found. Each community took half and honoured him in its own way.", "That is why Kartarpur holds both a samadhi and a grave. One holy man, two ways of remembering him.", "Now picture the border again. It runs close to a place built on the idea that no one is separate.", "That is the irony. A man who taught that people are one, and a line drawn in 1947 that says otherwise.", "And the line is not far at all. The gurdwara is only a few kilometres away, closer than many people live from their own market.", "So how did Sikhs from India get across before 2019? That is number three, and it is a story of paperwork.", "Number three: the visa wall. Before 2019, an Indian pilgrim needed a Pakistani visa to visit the gurdwara in person.", "Groups called jathas could go to Pakistan for certain festivals, under an agreement from 1974 about visiting religious shrines.", "They usually crossed at Wagah near Amritsar. The trip was long, and it was tied to set dates.", "That meant a place only a few kilometres from your village could need a long journey and a visa.", "Imagine needing a passport, a visa, a long bus ride and a schedule, just to reach a place you can see through binoculars.", "For years, Sikh leaders and ordinary families asked for a simple, direct road to Kartarpur.", "That demand never went away. At Dera Baba Nanak, people gathered and asked for the same thing.", "Then, in 2019, the two governments said yes. That brings us to number two, and it is the part that sounds fake.", "Number two: in November 2019, the Kartarpur Corridor opened, just before Guru Nanak's 550th birth anniversary.", "The two countries signed the agreement in October 2019, and the road opened about a month later. For these neighbours, that is fast.", "A gate opens in the fence at Dera Baba Nanak. Walk through it, and a few kilometres later you reach Pakistan's gurdwara.", "Indian pilgrims did not need a visa. They needed a permit, which they applied for online before the trip.", "The rules were strict. It was a day trip, so pilgrims had to return to India the same day.", "Pakistan also charged a service fee of twenty US dollars per pilgrim, which became a big debate in India.", "The agreement allowed up to 5,000 pilgrims a day, though the real numbers were often lower.", "If you enjoy strange places and facts like this, subscribe, because there is a new one every day.", "Inside, you walk along a fenced path. Pakistan's fields stretch out on both sides, but you cannot wander off it.", "You reach Gurdwara Darbar Sahib, where the langar serves food and the courtyard holds pilgrims of every background.", "For the first time in decades, a Sikh from Punjab could pray where Guru Nanak lived, and be home for dinner.", "The corridor was closed in March 2020 because of Covid. It reopened in November 2021, and pilgrims returned.", "For a while, it felt like the border had a door in it. A real door, in a real fence.", "But the story has another turn, and number one is the strangest, because it is a corridor that exists but is closed.", "Number one: the corridor is real, signed, and still on the map, but Indian pilgrims cannot use it right now.", "India suspended the corridor on 7 May 2025, after the Pahalgam attack and the tension that followed between the two countries.", "The agreement was renewed for five more years in October 2024, so the paper is still alive. The road is the part that is shut.", "In July 2026, the Indian government told Parliament that the corridor will stay suspended because of the current security situation.", "Sikh leaders, including the Akal Takht Jathedar, have asked for it to reopen. As of now, there is no confirmed date.", "Pakistan's side has reportedly stayed open as a goodwill gesture. So the gate is open on one side and closed on the other.", "That is the strangest border fact of all. A door in a fence, with a lock on only one side.", "And that is why Dera Baba Nanak matters again. The viewing point is back to being the place where people look.", "So once more, families stand in a field in Punjab, lift their binoculars, and search for a shrine across the line.", "That is the whole story in one picture. A holy place close enough to see, yet far enough to feel.", "Notice what the border really did here. It did not hide Kartarpur. It left it in plain sight, and that makes it hurt more.", "It shows how a line from 1947 can still shape a family's prayer today. Maps are never just maps.", "Let us run the countdown once more. Five, a viewing point where a field becomes a holy window.", "Four, a line drawn in 1947 that left Guru Nanak's final home in Pakistan. Three, years of visas and long journeys.", "Two, a corridor that opened with a permit instead of a visa, a day trip, and a fee that sparked debate.", "And one, a corridor that is still signed and still on the map, but shut on the Indian side.", "Which brings us back to where we began. Your eyes can see a gurdwara in Pakistan from an Indian field.", "Whether the gate reopens is up to two governments. The view, at least, does not need anyone's permission. Would you walk that road?", "Tomorrow: another border that looks fake on the map, and is completely real."], "job": ""}, {"date": "2026-12-01", "kind": "Short", "category": "geography", "title": "The Only Place on Earth With Wild Asiatic Lions", "hook": "Your safari in Gujarat can show lions found nowhere else in the wild.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Gir forest in Gujarat is the only place on Earth where wild Asiatic lions live. They are a different subspecies from African lions. Part of the Places That Shouldn't Exist series.\n\n#Shorts #GirForest #IndiaFacts", "script": ["Your safari in Gujarat can show lions.", "Not African lions, Asiatic lions.", "Gir forest is their only wild home.", "Nowhere else on Earth has wild ones.", "Africa's lions are a different subspecies.", "Asiatic lions once roamed much wider.", "Now this is their last wild home.", "Your safari in Gir could show them.", "Tomorrow: boulders balanced across a whole landscape."], "job": ""}, {"date": "2026-12-01", "kind": "Short", "category": "geography", "title": "Hampi: Giant Boulders Among Ancient Temples", "hook": "Your Hampi photo shows giant boulders balanced everywhere.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hampi in Karnataka is a landscape of giant boulders scattered and balanced across the land, with ancient temples among them. It was once the capital of the Vijayanagara empire and is a UNESCO World Heritage Site. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Hampi #IndiaFacts", "script": ["Your Hampi photo shows boulders stacked everywhere.", "Giant rocks balance across the whole land.", "Some look ready to roll.", "Ancient temples sit right among them.", "This was once the Vijayanagara capital.", "It is a UNESCO World Heritage Site.", "The rocks are far older than the temples.", "Your Hampi photo shows rocks and temples.", "Next: another place that looks fake."], "job": ""}, {"date": "2026-12-01", "kind": "Short", "category": "space", "title": "Your Charger vs the Moon Landing Computer", "hook": "Your charger may out-think the Apollo 11 computer.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Apollo Guidance Computer had about 4 KB of RAM and 72 KB of storage, and it helped land humans on the Moon. Some modern fast chargers contain chips more capable than that. Space history sounds fake until you compare the numbers.\n\n#Shorts #Apollo11 #SpaceFacts", "script": ["Your charger may out-think the Apollo 11 computer.", "That computer had about 4 kilobytes of memory.", "Just 72 kilobytes of storage.", "A single phone photo is far bigger.", "Yet astronauts landed on the Moon with it.", "Some tiny chips inside chargers now beat it.", "Humans reached the Moon on less than your charger.", "Your charger may out-think the Moon landing.", "Next: a patch of sky packed with galaxies."], "job": ""}, {"date": "2026-12-01", "kind": "Short", "category": "space", "title": "Your Thumbnail Covers 10,000 Galaxies", "hook": "Your outstretched thumbnail covers at least 10,000 galaxies.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hubble stared at one tiny, dark patch of sky for days. The Ultra Deep Field image revealed about 10,000 galaxies in that spot, which is smaller than your thumbnail at arm's length. Every dot in it is a whole galaxy.\n\n#Shorts #Hubble #SpaceFacts", "script": ["Your outstretched thumbnail covers at least 10,000 galaxies.", "Hubble aimed at one dark, empty-looking patch.", "It looked like nothing at all.", "Hubble stared at it for days.", "Then galaxy after galaxy appeared.", "About 10,000 of them, in that tiny spot.", "Every dot is a whole galaxy.", "Each one holds countless stars.", "Your thumbnail covers a sky full of galaxies."], "job": ""}, {"date": "2026-12-01", "kind": "Short", "category": "technology", "title": "India Built a Hyperloop Test Track", "hook": "Your train could be a pod in a tube.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "IIT Madras built a hyperloop test track in India. The idea is a pod travelling inside a sealed low-air tube to cut drag. It is only a test track so far, but it is real.\n\n#Shorts #Hyperloop #India", "script": ["Your train could be a pod in a tube.", "India already has a hyperloop test track.", "IIT Madras built it.", "The idea is a pod inside a sealed tube.", "Air is pumped out of the tube.", "Less air means less drag on the pod.", "Less drag means far higher speeds.", "It's only a test track so far.", "Your train could one day be a pod."], "job": ""}, {"date": "2026-12-02", "kind": "Long video", "category": "geography", "title": "Why Punjab Is Stranger Than You Think", "hook": "Your binoculars can show you a holy shrine in Pakistan, from a field in India.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Punjab is split between India and Pakistan, yet from the Indian side people could look across the border at Gurdwara Darbar Sahib in Kartarpur. This video covers the land of five rivers, two scripts for one language, the Grand Trunk Road, the evening ceremony at Attari-Wagah, the 2025 Ravi flood and the Kartarpur Corridor, which was reported shut at the latest reports. Facts were checked against news reports at the time of writing, so check for updates on the corridor's status before you plan a trip.\n\n#Punjab #Kartarpur #IndiaPakistan", "script": ["Your binoculars can show you a holy shrine in Pakistan, from a field in India.", "That is not a trick. For years, people really stood on the Indian side and looked across the border at it.", "By the end of this video, you will see exactly how that works, and why Punjab is stranger than you think.", "Start with the name. Punjab is a maths problem hiding in plain sight.", "Panj means five and ab means water in Persian, so Punjab means the land of five waters.", "Those five rivers are the Jhelum, the Chenab, the Ravi, the Beas and the Sutlej.", "Before 1947, all five flowed through one Punjab. After 1947, that one land became two, in two countries.", "Indian Punjab and Pakistani Punjab share a name, a history, and the same way of speaking, but not a flag.", "Walk across a Punjab field and the soil looks exactly the same on both sides, even though the countries are different.", "Now here is the first twist. A language you can hear on both sides, but cannot read on the other.", "In Indian Punjab, Punjabi is written in Gurmukhi, the script of Sikh scripture, which runs left to right.", "In Pakistani Punjab, the same language is written in Shahmukhi, which looks like Urdu and runs right to left.", "So two friends can speak the same sentence, laugh at the same joke, and still not read each other's signboards.", "Punjabi is actually the most spoken mother tongue in Pakistan. Same songs, same proverbs, two alphabets, one line on a map.", "Stay with me, because the next one is a road older than most countries, and a border cuts it in half.", "It is the Grand Trunk Road, one of the oldest and longest roads in South Asia.", "For centuries it carried traders, armies and pilgrims, from Bengal in the east all the way to Kabul.", "Ordinary families used it too, with bullock carts and bags of grain, long before anyone drew a border on it.", "It passes through Amritsar in India. Cross the border, and the same road reaches Lahore in Pakistan.", "Two of Punjab's great cities sit on one ancient road, but today you cannot just drive from one to the other.", "The road meets the border at Attari on the Indian side, and Wagah on the Pakistani side.", "And right there, where the road ends in a gate, there is a show every single evening.", "Every evening, soldiers from two armies perform a ceremony for huge crowds. It is called Beating Retreat.", "Border Security Force men stand on the Indian side. Pakistan Rangers stand on the other.", "They march in heavy boots, wear tall fan-shaped headgear, and kick their legs up as high as they can.", "The crowds on both sides cheer, and each side tries to be louder than the other.", "Then both flags are lowered at the same time, folded, and the gates are shut.", "It is part theatre, part serious military routine, and it has run for decades at a border most people never see.", "But the strangest part is not the show. It is what lies a few kilometres away from another gate on this border.", "That gate matters far more to millions of people. It leads to a guru's home, and first, we need the river.", "The Ravi is one of those five waters, and in 2025 it did something dramatic.", "Heavy monsoon rain swelled the Ravi until it overflowed, in late August 2025.", "News reports said the whole Kartarpur complex, including Gurdwara Darbar Sahib, went under floodwater.", "Reports said around 150 people were rescued, and the Guru Granth Sahib was moved to the first floor, above the water.", "A border cannot stop a river. The Ravi does not check passports. It simply flows from India into Pakistan.", "That is the lesson of Punjab. The land was split. The water was not.", "If you like strange places and facts like this, subscribe, because there is more like it every day.", "Now the shrine I promised you. Its name is Gurdwara Darbar Sahib, in a town called Kartarpur.", "Kartarpur is where Guru Nanak, the founder of Sikhism, settled in his later years, beside the Ravi.", "He did not live in a palace. He farmed the land there, and shared meals with everyone who came.", "He died at Kartarpur in 1539, and that is where this story gets even stranger.", "The story says Hindus, Muslims and Sikhs all claimed him, and each wanted to honour him in their own way.", "They were told to place flowers beside him. By morning, the story goes, only the cloth and the flowers remained.", "So the gurdwara today holds both a samadhi and a grave, side by side, for one man loved by many faiths.", "Then 1947 arrived, and the new border left Kartarpur in Pakistan, just across the river from India.", "Ask older families in Punjab about 1947, and many describe a home or a shrine that suddenly lay in another country.", "For Sikhs in India, their holiest places in Pakistan suddenly became places they could only pray towards.", "In their daily prayer, Sikhs have asked for open access to the gurdwaras that were left behind in Pakistan.", "The nearest Indian town is Dera Baba Nanak, in Gurdaspur district, only a few kilometres from the border.", "There, a raised viewing platform was opened in 2008, with binoculars put there by the Border Security Force.", "Pilgrims climbed up, raised the binoculars, and looked across the fields towards a distant white building.", "Some wept. Some folded their hands. Some simply stood there, because they could not go any closer.", "On foggy days, reports said, the view was hard, but people still came, just to face the right direction.", "Distance was never the problem. The shrine is only about four or five kilometres away from the Indian border.", "The problem was that a fence stood between a person and a place their family had prayed towards for generations.", "Then, in November 2019, something rare happened. The two governments opened a corridor.", "It opened around the 550th birth anniversary of Guru Nanak, and it was built for one purpose.", "Indian pilgrims could go from Dera Baba Nanak straight to Kartarpur, with a permit, but without a visa.", "Think about that. A pilgrim could go in the morning, pray at the very place of Guru Nanak, and be back by evening.", "For the first time in decades, thousands could see the shrine not through glass lenses, but with their own eyes.", "Two countries that rarely agree on anything agreed to keep this one path open for faith.", "The corridor agreement was even extended, and it now runs until October 2029.", "But the path has not stayed open. In May 2025, India suspended the corridor amid rising tensions.", "At the latest reports I could find, it was still shut, with no date given for it to reopen.", "So the old way is the way people fall back on. Stand on the Indian side, and look across the fields.", "Look at what that means. A holy place that was once a short walk is again a distant white shape on the horizon.", "Both sides look at the same sky, and the same Ravi river runs between them, as if nothing had changed.", "And behind that one shape, there are five rivers, two alphabets, one ancient road, and one ceremony of marching soldiers.", "Punjab is a place where the map says two things, and the people feel one.", "So the next time someone tells you geography is boring, ask them about the shrine you can see from India.", "Your binoculars really can show you a holy shrine in Pakistan, from a field in India, and now you know why.", "Next in this series: another place that sounds fake, but is completely real. See you there."], "job": ""}, {"date": "2026-12-02", "kind": "Short", "category": "geography", "title": "A Hillside in Azerbaijan Is On Fire", "hook": "Your hike in Azerbaijan ends at a burning hillside.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Yanar Dag near Baku in Azerbaijan has flames burning straight out of the ground. Natural gas seeps up through the rock and feeds the fire. The name means burning mountain, and it has burned for decades.\n\n#Shorts #Azerbaijan #PlacesThatShouldntExist", "script": ["Your hike in Azerbaijan ends at a burning hillside.", "Fire burns straight out of the ground.", "No logs. No fuel tank. Just rock.", "Natural gas seeps up through the rock.", "That gas feeds the flames nonstop.", "This hill is called Yanar Dag.", "Its name means burning mountain.", "It has burned for decades.", "Your hike ends at a hill on fire."], "job": ""}, {"date": "2026-12-02", "kind": "Short", "category": "geography", "title": "Egypt From Space: One Glowing Ribbon", "hook": "Your night satellite view of Egypt shows one glowing ribbon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Look at Egypt from space at night and you see one glowing ribbon in a black desert. That ribbon is the Nile, where most Egyptians live. The river decides where the lights are.\n\n#Shorts #Egypt #NileRiver", "script": ["Your night satellite view of Egypt: one glowing ribbon.", "Everything around it is black desert.", "That glowing ribbon is the Nile.", "Cities and farms line its banks.", "The river feeds them with water.", "Most Egyptians live right along it.", "Outside it, the desert is mostly empty.", "From space, you can see where people live.", "Egypt glows only where the Nile flows."], "job": ""}, {"date": "2026-12-02", "kind": "Short", "category": "geography", "title": "The Coldest Town on Earth Where People Live", "hook": "Your phone would struggle in Oymyakon, Siberia.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Oymyakon in Siberia is the coldest permanently inhabited place on Earth. A temperature of -67.7 °C was recorded there in 1933. Batteries lose power in the cold, so your phone would struggle.\n\n#Shorts #Siberia #PlacesThatShouldntExist", "script": ["Your phone would struggle in Oymyakon, Siberia.", "It is the coldest inhabited place on Earth.", "In 1933, it hit minus 67.7 degrees Celsius.", "Lithium batteries lose power in the cold.", "Your phone could shut down outdoors.", "Imagine charging it there.", "Still, hundreds of people live there.", "They live there all year round.", "Your phone would not last like they do."], "job": ""}, {"date": "2026-12-02", "kind": "Short", "category": "space", "title": "Webb's Mirror Is 18 Gold Hexagons", "hook": "Your telescope mirror is 18 gold hexagons.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The James Webb Space Telescope's mirror is built from 18 hexagonal beryllium segments with a thin gold coating. Gold reflects infrared light very well, which is what Webb is built to see.\n\nSeries: Space Facts That Sound Fake.", "script": ["Your telescope mirror is 18 gold hexagons.", "It's the James Webb Space Telescope.", "Each segment is beryllium, coated in thin gold.", "Gold reflects infrared light extremely well.", "Webb sees heat, not colors your eyes see.", "Together, the segments form one giant honeycomb.", "It floats in space, far beyond the Moon.", "Your telescope is a golden honeycomb in space.", "Tomorrow: a taxi with nobody driving."], "job": ""}, {"date": "2026-12-02", "kind": "Short", "category": "technology", "title": "This Taxi Has Nobody In The Driver's Seat", "hook": "Your taxi has no driver at all.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Waymo's robotaxis carry passengers with nobody in the driver's seat, and the steering wheel turns by itself. They use cameras, lidar and radar to read the road.\n\nSeries: Tech That Sounds Fake.", "script": ["Your taxi has no driver at all.", "Waymo robotaxis carry passengers with an empty driver's seat.", "The steering wheel turns all by itself.", "Cameras, lidar and radar watch the road.", "You open an app and ride.", "Real passengers already ride in several US cities.", "Nobody sits behind that turning wheel.", "Your taxi has no driver.", "Tomorrow: a city abandoned in the sea."], "job": ""}, {"date": "2026-12-03", "kind": "Long video", "category": "geography", "title": "6 Borders That Make No Sense (Last One Is in India)", "hook": "Your night in Longwa village, Nagaland, can put your head in India and your feet in Myanmar.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A countdown of six real borders that look fake on a map: a runway you walk across, a Russian region cut off from Russia, a Spanish town inside France, a German village inside Switzerland, an enclave inside an enclave, and a chief's house in Nagaland where the India-Myanmar line runs through the building. Every place in this video is real and you can find it on a map. Watch to the end for India's strangest border.\n\n#borders #geography #strangeplaces", "script": ["Your night in Longwa village, Nagaland, can put your head in India and your feet in Myanmar.", "That is not a joke. A real border line runs straight through a real house, and real people live there.", "Today I will count down six borders that make no sense, from a runway you walk across to a village inside another country.", "Each one is stranger than the one before it, and you can find every one of them on a normal map.", "The last one is in India. By the end, you will see why a chief's house beats all the others.", "Let us start at number six, and the strange part is that you can walk right across it.", "Number six. Gibraltar. To walk from Spain into Gibraltar, you cross an active airport runway on foot.", "Yes, a runway. The main road into Gibraltar cuts straight across the strip where planes land and take off.", "Gibraltar belongs to the United Kingdom, but it sits at the southern tip of Spain, joined to the Spanish mainland.", "So the border is a narrow neck of land, and the airport was built right across it.", "When a plane is about to land or take off, barriers come down and the road closes. Cars, bikes and people just wait.", "Then the plane is gone, the barriers lift, and everyone goes back to crossing a country border like nothing happened.", "Picture it: you are in the queue for passport check, and a jet rushes past right in front of you.", "The reason is size. Gibraltar is tiny, so a road and a runway had to share the same flat ground.", "It is a rare place where an airport, a road and a country border all fit into one spot.", "Now think about how odd that is. A plane lands where people were walking from one country to another a minute ago.", "But a runway is at least on land that connects to its own country. The next place does not even have that.", "Number five is a piece of Russia with no land link to Russia.", "Number five. Kaliningrad, a piece of Russia that is not connected to the rest of Russia by land.", "It sits on the Baltic coast, with Poland on one side and Lithuania on the other.", "Both are in the European Union and NATO, so this Russian region is surrounded by them, except for the sea.", "The reason goes back to the end of the Second World War, when this area was taken from Germany.", "Then the Soviet Union broke up in 1991, and the lands between Kaliningrad and Russia became independent countries.", "Overnight, a region that was once joined by Soviet land was suddenly cut off by new borders.", "Today, a train or truck going between Kaliningrad and the rest of Russia has to cross other countries, or go by sea or air.", "The city's old name was Königsberg, and it was a German city for centuries before that.", "So an old German city now sits in Russia, on the far side of Poland and Lithuania from Moscow.", "Imagine a piece of India that you could only reach by crossing two other countries first.", "That is the kind of map problem that politicians still argue about today.", "But that is a whole region. Next, a single Spanish town that is surrounded by France.", "Number four. Llívia, a Spanish town that sits completely inside France.", "Walk to the edge of town, and your next step is on French land.", "The reason is a treaty from 1659, the Treaty of the Pyrenees, when Spain handed France a set of villages.", "But Llívia was counted as a town, not a village, so it was not on the list that went to France.", "One word in a treaty left a Spanish town stuck inside French land, and it has been there ever since.", "Today it is joined to Spain by a road that is treated as neutral, and cars pass along it freely.", "So you can drive from Spain to Llívia with French land on both sides of the road.", "Think about a local. Your home is in Spain, but your neighbours across the field live in France.", "No giant wall divides them. Most of the time you would not even notice you had crossed the line.", "That is why border lines are about paperwork, not nature. A treaty can break a map in two.", "If you like strange places and facts like these, subscribe, because there are plenty more coming.", "Number three is a tiny village that is German in law, Swiss in money, and surrounded by Switzerland.", "Number three. Büsingen, a German village that sits inside Switzerland, with Swiss land on every side.", "It is part of Germany, but it sits right next to the Swiss city of Schaffhausen.", "People here pay in euros and Swiss francs, and shops often take both.", "The village is also inside Switzerland's customs area, so Swiss rules apply to many everyday goods.", "Yet the people there vote in German elections, and German law applies in many matters.", "Even the phones are mixed. The village uses the Swiss phone area code, not a German one.", "And its car number plates start with BÜS, a code that belongs to this one small village.", "Imagine a village where your law is German, your phone is Swiss, and your wallet holds two currencies.", "It exists because of old deals made centuries ago, and later talks never changed it.", "Most of us struggle with one currency. These people handle two, plus the rules of two countries.", "Number two is a piece of Oman with a piece of the UAE inside it, which is inside the UAE.", "Number two. Madha, a piece of Oman that sits inside the United Arab Emirates, with Emirati land all around it.", "It lies in the mountains in the east of the UAE, away from the big glass cities.", "So an Omani village is surrounded by the UAE. That alone already sounds odd enough.", "But inside Madha, there is a smaller piece of land that belongs to the UAE. It is called Nahwa.", "Nahwa is an Emirati enclave inside an Omani enclave, inside the UAE. A border inside a border inside a border.", "On the map, it looks like a nesting doll: the UAE, then Oman, then the UAE again.", "Nahwa belongs to the emirate of Sharjah, even though Madha completely surrounds it.", "Reports say people there move between the pieces without much fuss, because the two countries are friendly.", "Lots of Indians live and work in the UAE and Oman, so this map may be closer to home than you think.", "Local tribal loyalties from long ago helped shape this map, not straight lines drawn with a ruler.", "Two enclaves, one inside the other, and still not the strangest border on this list.", "Number one is in India, in the hills of Nagaland. And it runs through someone's bedroom.", "Number one. Longwa, a Konyak Naga village in the Mon district of Nagaland, right on the border with Myanmar.", "The Konyak people have lived in these hills for generations, long before this line was drawn on a map.", "The border cuts through the village itself, and some homes sit on both sides of the line.", "The most famous one is the house of the Angh, which is the word for the village chief.", "The India-Myanmar border runs right through the Angh's house. One part is in India, and one part is in Myanmar.", "Locals like to say that in this house, you can eat in one country and sleep in another.", "The villagers hold citizenship of both sides. A person can belong to two countries at once.", "For years, people here could cross without a visa under the Free Movement Regime, though India has moved to end it and fence the border.", "Konyak elders are known for the tattoos on their faces, and for a headhunting past that ended decades ago.", "A simple boundary pillar on the ground shows where India ends and Myanmar begins.", "Step across it and, for the villagers, that is just a walk to the neighbour's. For everyone else, it is another country.", "That is why it is number one. Not the size, not the money, but a border that cuts through a family's home.", "Quick look back: a runway, a Russian region, a Spanish town, a German village, and an enclave inside an enclave.", "And at the top, a bed in Nagaland that can sit in two countries, because a line on a map ran through a family's house.", "So remember: your night in Longwa can put your head in India and your feet in Myanmar.", "Tomorrow: more places on the map that look fake, but are completely real."], "job": ""}, {"date": "2026-12-03", "kind": "Short", "category": "geography", "title": "The Empty Concrete City In The Sea", "hook": "Your ferry ride ends at an empty concrete city.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hashima Island in Japan is a concrete city that was abandoned in 1974. It is nicknamed Battleship Island because of its shape, and it still sits empty in the sea.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your ferry ride ends at an empty concrete city.", "This is Hashima Island, in Japan.", "People left it in 1974.", "Its shape earned the name Battleship Island.", "Apartment blocks still stand above the waves.", "It was a coal mining island.", "Now the whole city sits empty in the sea.", "Your ferry ride reaches a ghost city.", "Tomorrow: monasteries on stone pillars."], "job": ""}, {"date": "2026-12-03", "kind": "Short", "category": "geography", "title": "Monasteries Built On Giant Rock Pillars", "hook": "Your photo shows monasteries on stone pillars.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Meteora in Greece has monasteries built on top of tall sandstone pillars. Some are still reached by steps carved into the rock.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your photo shows monasteries on stone pillars.", "This is Meteora, in Greece.", "The pillars are tall sandstone rock.", "Monks built monasteries right on top.", "Some are still reached by carved steps.", "Steps cut straight into the rock.", "Six monasteries are still active today.", "Your photo shows homes built on pillars.", "Tomorrow: tiny animals that survived space."], "job": ""}, {"date": "2026-12-03", "kind": "Short", "category": "space", "title": "Tiny Animals Survived Open Space", "hook": "Your tardigrade survived open space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2007, microscopic tardigrades, or water bears, flew on the Foton-M3 mission and were exposed to space. Some came back alive and went on to lay eggs.\n\nSeries: If You Were in Space.", "script": ["Your tardigrade survived open space.", "In 2007, water bears flew on Foton-M3.", "Tardigrades are tiny animals under a millimetre long.", "They sat exposed to the vacuum of space.", "They faced space radiation too.", "Some came back alive.", "Then they laid eggs.", "Your tardigrade survived open space.", "Tomorrow: crossing India in six minutes."], "job": ""}, {"date": "2026-12-03", "kind": "Short", "category": "space", "title": "The ISS Crosses India In About 6 Minutes", "hook": "Your whole country flies by in minutes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The ISS travels at about 7.7 km per second. India is roughly 2,900 km wide east to west, so the station could cross it in about 6 minutes.\n\nSeries: Space Facts That Sound Fake.", "script": ["Your whole country flies by in minutes.", "The ISS moves about 7.7 kilometres per second.", "India is roughly 2,900 kilometres wide.", "East to west, that's about six minutes.", "That's shorter than a song.", "The station circles Earth every ninety minutes.", "That's about sixteen orbits every day.", "Your whole country flies by in minutes.", "Tomorrow: more facts that sound fake."], "job": ""}, {"date": "2026-12-03", "kind": "Short", "category": "technology", "title": "Your Face Is Your Boarding Pass in India", "hook": "Your face is a boarding pass at some airports.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At some Indian airports, DigiYatra lets a camera read your face and open the gate. You register once in the app first. Delhi, Bengaluru and Varanasi were among the first to use it.\n\n#Shorts #DigiYatra #TechFacts", "script": ["Your face is a boarding pass at some airports.", "It's called DigiYatra, and it's real.", "Walk up to the gate.", "A camera looks at your face.", "The gate opens by itself.", "You don't pull out a boarding pass.", "You register once on the app first.", "Delhi, Bengaluru and Varanasi already use it.", "So yes, your face opens the gate.", "Tomorrow: the sun that refuses to set."], "job": ""}, {"date": "2026-12-04", "kind": "Long video", "category": "geography", "title": "Northeast India: 7 Facts That Sound Fake", "hook": "Your night in Longwa, Nagaland, puts your bed in India and Myanmar at once.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Northeast India has a village where the India-Myanmar border runs through the chief's house, a national park that floats on a lake, and tea gardens that run an hour ahead of Indian time. This video walks through seven real, checkable facts about the region, ending at Longwa in Nagaland. Watch to the end to see where the line cuts through the Angh's home.\n\n#NortheastIndia #Longwa #IndiaFacts", "script": ["Your night in Longwa, Nagaland, puts your bed in India and Myanmar at once. The border runs straight through the chief's house.", "That is real, and it is the last stop in this video. Before it, six more places in Northeast India that sound fake.", "You will see clocks that run an hour ahead, an island the river is eating, and a national park that floats on water.", "By the end, you will see where the line cuts through the chief's home, and why villagers hold two citizenships.", "Each place is stranger than the one before it. So start where the whole region hangs by a thread.", "First, look at a map of India. The Northeast hangs off the country by a thin strip of land.", "It is called the Siliguri Corridor, or the Chicken's Neck, and in places it is only tens of kilometres wide.", "Nepal, Bhutan and Bangladesh all crowd around it, so three other countries sit beside one narrow road to the region.", "Seven states, with their own languages and foods, depend on that thin link for trains and highways.", "Now stay with me, because the strangeness really starts with the clocks.", "Next: tea time. India has one official time zone, but in Assam's tea gardens, people often run on a different clock.", "It is called Bagan time, and it runs one hour ahead of Indian Standard Time.", "The sun rises very early in the Northeast, so planters moved the clocks forward to use the daylight.", "So a worker can start at what your phone calls seven in the morning, while the garden clock already says eight.", "Your phone shows IST. The garden bell follows its own time, and nobody there thinks twice about it.", "Same country, same day, two clocks. And that is the mildest thing on this list.", "Next: an island so big it has villages, farms and monasteries, and it sits inside a river.", "Majuli sits in the Brahmaputra, and in 2016 Guinness recognised it as the world's largest river island.", "Picture a place where you take a ferry to school, and the school is on an island.", "The Brahmaputra floods every year, and the river keeps eating the island's banks. Majuli has been shrinking.", "Satras, which are old Vaishnav monasteries, still stand there, with monks who keep dance and mask-making alive.", "So you can visit a living culture, on land the river is slowly taking back.", "But the next place is even stranger, because there the ground itself floats.", "In Manipur there is a lake where the ground floats, and people live and fish on it.", "Loktak is covered in phumdis, thick mats of weeds, soil and plant matter that drift on the water.", "Some are thick enough for fishermen to build huts on, so whole homes float in the lake.", "The biggest mat holds Keibul Lamjao, the only floating national park in the world.", "It protects the sangai, a rare deer with antlers that curve like a dancer's arms.", "So a deer lives and walks on a field that is actually sitting on a lake.", "Now head west to Meghalaya, where bridges are not built with steel or concrete. They are grown.", "The Khasi people guide the roots of rubber fig trees across a stream, and wait for years until they hold.", "Some of these living root bridges are said to be hundreds of years old, and they get stronger as they grow.", "Nearby, Mawsynram holds the Guinness record for the highest average yearly rainfall of any place on Earth.", "People there wear woven bamboo shields called knups on their backs, like a turtle shell, to stay dry.", "And at Dawki, the Umngot river is so clear that boats look like they are floating in the air.", "That glass-like view is best in the cooler dry months, when the water is calm and clear.", "If you like places that sound fake but are true, subscribe. The next two stops are in Nagaland.", "One is
