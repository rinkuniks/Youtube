 and the ghost taps stop.", "Your screen taps itself, no finger needed. Tomorrow: a river that flows backwards."], "job": ""}, {"date": "2026-11-04", "kind": "Long video", "category": "geography", "title": "7 Facts That Make Switzerland Stranger Than You Think", "hook": "Your Italian mountain hut ended up in Switzerland, and nobody carried it an inch.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Melting ice near the Matterhorn has shifted the Swiss-Italian border, and the two countries have agreed to redraw it. Along the way we cover Swiss shelters for everyone, a guinea pig law, a station clock that waits, and a German town locked inside Switzerland. Watch to the end to see the moving border on the map.\n\n#Switzerland #Geography #Matterhorn", "script": ["Your Italian mountain hut ended up in Switzerland, and nobody carried it an inch.", "Melting ice near the Matterhorn moved a real border, and Switzerland and Italy have agreed to redraw it on the map.", "That is one reason Switzerland is stranger than you think. By the end, you will see that line move.", "The country from Bollywood songs and chocolate also hides bunkers, a strange pet law, and a German town inside it.", "Seven facts, each one stranger than the one before. The first is hidden underground, and you have probably walked right over it.", "Fact one is hidden under your feet, in almost every neighbourhood.", "Switzerland has a law that says every resident must have a place in a nuclear shelter.", "Not just the army. Not just the rich. Every ordinary person, in an ordinary apartment block.", "New buildings must include a shelter, or the owner pays money so a shelter can be built somewhere else.", "So under many Swiss homes, behind a thick steel door, sits a concrete room built to survive a disaster.", "In daily life, many are just storage rooms for old bicycles and winter tyres.", "Even some Swiss mountains were hollowed out into military hideouts, and a few are now museums or hotels.", "Picture a calm postcard valley, cows with bells, and a hidden fortress behind a rock that looks like any other.", "That is the Swiss style: peaceful on the surface, very well prepared underneath.", "Remember this one when you reach the end, because the biggest surprise is about a mountain, not a bunker.", "Switzerland stayed out of both world wars, and planning like this is part of its national character.", "So if a Swiss neighbour looks relaxed, remember they may have a shelter room ready downstairs.", "Fact two sounds like a joke, but it is a real rule about pets.", "In Switzerland, it is not allowed to keep a single guinea pig alone.", "The reason is simple. Guinea pigs get lonely, and Swiss law treats that loneliness as a real animal welfare problem.", "The same logic applies to some other social animals, such as budgies, which should live with company.", "Swiss pet owners who lose one guinea pig often have to find a new friend for the other one.", "Think about that. A government rule written to protect a pet from feeling alone.", "The Swiss constitution even talks about the dignity of creatures, which is why animal rules here go deeper than usual.", "It sounds soft and gentle, but it fits the country's habit of planning for everything.", "And speaking of planning, the next fact is about Swiss soldiers and what they keep in their cupboards.", "Fact three: in Switzerland, many soldiers keep their army rifle at home.", "Most of its soldiers are ordinary citizens doing militia service, then going back to normal jobs.", "Their rifle can sit in a cupboard at home, next to the cereal and the school bags.", "Shooting is a normal community hobby here, with clubs and an annual national shooting event.", "Soldiers no longer take army ammunition home, only the rifle itself.", "Compare that with how most countries think about weapons, and you see why Switzerland feels like another planet.", "The idea is old. Every citizen is part of the defence, not just somebody in a distant barracks.", "That trust between people and the state shows up in everyday life, even in how trains run.", "And Swiss trains bring us to a clock that does something very strange every minute.", "Fact four is on the wall of almost every Swiss railway station.", "It looks like a plain white clock with a red second hand shaped like a lollipop.", "But watch closely. The second hand races around, then stops at the top for a moment, waiting.", "It pauses at the top of each minute, and then the whole minute jumps forward together.", "That clock was designed for railway timing, so trains could leave exactly when the minute changed.", "Swiss railways are famous for running on time, and that tiny pause is a little symbol of it.", "The design is so loved that it has been copied onto watches and screens around the world.", "If you like strange places and facts like these, subscribe, because there is plenty more where this came from.", "And the next fact is about words, because Switzerland cannot even agree on how to say hello.", "Fact five: Switzerland has four national languages, and none of them is called Swiss.", "They are German, French, Italian, and Romansh, a small Latin language spoken in the mountains of Graubünden.", "So one train ride can start with German announcements and end in French ones.", "A Swiss person may speak German at home, French at work, and English with tourists.", "To avoid choosing a side, Swiss coins and stamps use Latin, and that is why the country code is CH.", "CH stands for Confoederatio Helvetica, which is Latin for the Swiss Confederation.", "Latin works as a neutral choice that no region can claim as its own.", "So the country that looks perfectly organised has an official name that hardly anyone speaks.", "Indian films made Swiss meadows famous, and a statue of director Yash Chopra stands in Interlaken for that reason.", "Swiss tourism honoured him for bringing visitors to the country, and Indian viewers still picture those meadows.", "But now we reach the places where Switzerland's own map gets truly weird.", "Fact six: there is a German town that sits entirely inside Switzerland. It is called Büsingen.", "Look at a map: this German town is surrounded by Swiss land.", "Geographers call Büsingen an exclave of Germany, a piece of one country cut off inside another.", "People there are German citizens, but they live in the Swiss customs area.", "Everyday life there uses Swiss francs, even though the town belongs to Germany.", "Imagine a village that belongs to Punjab but sits inside Himachal. Büsingen is that idea, but with two countries.", "To get to the rest of Germany, residents have to cross Swiss land first.", "The town is also linked to nearby Swiss buses, so daily life feels Swiss and German at once.", "How did this happen? Old treaties and old land deals drew lines that nobody wanted to change.", "Hold that thought: if a town can be locked inside another country, a border can also slide around with the weather.", "And for the last fact, we go up into the Alps to the most famous mountain in Switzerland.", "Fact seven: the Matterhorn, the pointed mountain on chocolate wrappers, sits right on the border of Switzerland and Italy.", "On the Italian side it is called Cervino, and the border here follows the line where water flows apart.", "That line runs through snow and ice, and the ice is not staying still.", "Near a place called Testa Grigia, the Theodul glacier has been retreating, so the line where the water divides has moved.", "Because the border follows that line, the border moved too, without anyone drawing a new line.", "A mountain hut called Rifugio Guide del Cervino is the famous example, and it now sits mostly on the Swiss side.", "The hut was built on Italian land with an Italian name, so nobody carried it across. The ice simply melted around it.", "Switzerland and Italy reached a deal in 2023 to sort this out, including land swaps so mountain stations stay on their current side.", "The area matters because tourists ski here even in summer, and lifts and huts need to know whose land they stand on.", "You can even ski from Zermatt in Switzerland to Cervinia in Italy in a single day and have lunch in another country.", "So the map you saw in school is not fixed. In the Alps, the border can move because the climate changed.", "Border posts do not move. Water, ice and rock do, and the lines on the map follow them.", "Now picture the map on screen: the old line, the new line, and a mountain hut caught between them.", "That is the payoff of this video: the Swiss-Italian border near the Matterhorn really is being redrawn, because ice melted.", "Shelters for everyone, guinea pig rules, a waiting clock, a German town, and a border that melts.", "Which means your Italian mountain hut really can end up in Switzerland, and nobody has to carry it an inch.", "Next in this series: Why Japan Is Stranger Than You Think."], "job": ""}, {"date": "2026-11-04", "kind": "Short", "category": "geography", "title": "A River That Flows Backwards Every Year", "hook": "Your boat on this river would suddenly start drifting backwards.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Cambodia's Tonle Sap river changes direction twice a year. In the dry season it drains the lake into the Mekong. When the monsoon swells the Mekong, the water pushes back up into the lake.\n\n#Shorts #Geography #Cambodia", "script": ["Your boat here would suddenly drift backwards.", "This is the Tonle Sap river in Cambodia.", "In the dry season, it flows toward the Mekong.", "Then the monsoon rains arrive.", "The Mekong swells and pushes the water back.", "The river reverses and fills a huge lake.", "India's monsoon season does this to rivers too.", "A river that flows backwards, every year. Tomorrow: an island shaped like a tree."], "job": ""}, {"date": "2026-11-04", "kind": "Short", "category": "geography", "title": "Dubai's Palm Tree Island Is Made of Sand", "hook": "Your satellite map of Dubai shows an island shaped like a palm tree.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Palm Jumeirah in Dubai is a real island shaped like a palm tree. It did not exist naturally. It was built by piling sand into the sea, and you can see it from space.\n\n#Shorts #Dubai #Geography", "script": ["Your satellite map of Dubai shows a giant palm tree.", "It's not a drawing. It's a real island.", "Nothing was there before. Just open sea.", "Workers built it by piling sand into the water.", "Now homes and hotels line its branches.", "You can spot it from space.", "Open your map and zoom in on Dubai.", "A palm tree built from sand. Tomorrow: a vault inside a frozen mountain."], "job": ""}, {"date": "2026-11-04", "kind": "Short", "category": "geography", "title": "The Vault Inside a Frozen Arctic Mountain", "hook": "Your breakfast has a backup copy inside a frozen mountain.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Svalbard Global Seed Vault in Norway stores backup seeds from around the world inside a mountain in the Arctic. The cold helps keep them safe for the long term. It works like an insurance policy for the world's food crops.\n\n#Shorts #Geography #Norway", "script": ["Your food has a backup inside a frozen mountain.", "It's called the Svalbard Global Seed Vault.", "It sits deep in the Arctic, near the North Pole.", "Inside, seeds from around the world are stored.", "Crops like rice and wheat are kept safe there.", "The cold keeps them preserved for the long term.", "If a crop is ever lost, the backup exists.", "Your food has a backup in the ice. Tomorrow: a white spacesuit that turned black."], "job": ""}, {"date": "2026-11-04", "kind": "Short", "category": "space", "title": "Moon Dust Turned Apollo 17 Suits Dark", "hook": "Your white spacesuit would come back from the Moon filthy and dark.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo 17's Gene Cernan and Harrison Schmitt came back with suits coated in lunar dust. The dust was sticky and clung to suits and tools. It was one of the real headaches of walking on the Moon.\n\n#Shorts #Space #Apollo", "script": ["Your white spacesuit would come back dark and filthy.", "That's what happened to Apollo 17's Gene Cernan.", "Moon dust is sharp and sticky.", "It clung to the suits and the tools.", "Brushing it off barely worked.", "Dust even came back inside the spacecraft.", "Walking on the Moon was a messy job.", "A white suit, ruined by dust. Tomorrow: your newspaper photo is secretly dots."], "job": ""}, {"date": "2026-11-04", "kind": "Short", "category": "technology", "title": "Your Newspaper Photo Is Made of Tiny Dots", "hook": "Your colour newspaper photo is secretly made of tiny dots.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Colour photos in newspapers are printed using tiny dots of ink. Zoom your phone camera in close and the picture breaks apart into coloured dots. From far away, your eyes blend them into a smooth image.\n\n#Shorts #Technology #PhoneTricks", "script": ["Your colour newspaper photo is secretly made of dots.", "Grab any newspaper and open your camera.", "Zoom in close on a colour picture.", "The photo breaks apart into coloured dots.", "Printers use just a few ink colours.", "Your eyes blend the dots into smooth colour.", "Move back and the dots disappear.", "Your newspaper photo is just tiny dots. Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-11-05", "kind": "Long video", "category": "geography", "title": "6 Places Stuck Inside Another Country (India Too)", "hook": "Your passport can say Uzbekistan while every road around you is in Kyrgyzstan.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Your passport can say Uzbekistan while every road around you is in Kyrgyzstan, and that is one of six real border oddities in this countdown. From Sokh in the Fergana Valley to the Cooch Behar enclaves between India and Bangladesh, every place is on a real map. Watch to the end for India's strangest border.\n\n#borders #geography #mapfacts", "script": ["Your passport can say Uzbekistan while every road around you is in Kyrgyzstan.", "That is real, and it is one of six places in this video where a border makes no sense at all.", "By the end, you will see a tiny patch of India that sat inside Bangladesh, inside India, inside Bangladesh.", "We count down from six, and every place is stranger than the one before it.", "No tricks and no made-up maps. Every place here is on a real map that you can open right now.", "So let us start with a piece of Russia that is not connected to the rest of Russia.", "Number six: Kaliningrad, a part of Russia that has no land link to the rest of Russia.", "Look at the map. Poland sits on one side, Lithuania on the other, and the Baltic Sea is in front.", "The rest of Russia lies far to the east, with other countries standing in between.", "Its people are Russian citizens, but their neighbours on every land side are in the European Union.", "Before 1945, this was Königsberg, a German city. After the Second World War it became Soviet.", "Then the Soviet Union broke up, and Kaliningrad was left stranded behind brand new borders.", "Even today, going there by land from mainland Russia means passing through other countries.", "That is why many travellers choose to fly or sail there instead.", "The lesson of this list: borders follow history first, and common sense almost never.", "But Kaliningrad is a whole region. The next place is one small town that lives by two sets of rules.", "Number five: Büsingen, a German town sitting inside Switzerland, with Swiss land all around it.", "Walk out of the town in almost any direction, and you step straight into Switzerland.", "The town is small enough to walk across, yet it has its own German mayor and council.", "Cars here carry their own number plate code, BÜS, so everyone knows they belong to this one town.", "Shops accept euros, but Swiss francs are used a lot too, because the town sits inside the Swiss customs area.", "Its landline phone numbers start with the Swiss country code, even though the town is German.", "On paper it is German. In daily life, it behaves a lot like Switzerland.", "In 1918, most residents voted to join Switzerland, but the Swiss could not offer anything in exchange.", "So the town stayed German, stuck forever on the wrong side of the line.", "That was a town. The next one is a Spanish town inside France, and it exists because of one word.", "Number four: Llívia, a Spanish town sitting inside France.", "On the map, it is a small Spanish dot with French land all around it, a short way from Spain itself.", "The reason goes back to a treaty in 1659, when Spain handed France a list of villages in the Pyrenees.", "Llívia was once the capital of its valley, so it was officially a town, not a village, and it was not on the list.", "That one word is why a Spanish place sits inside France more than 350 years later.", "A short road links it to Spain. It runs over French land, but Spanish travellers are allowed to use it.", "So you can drive from Spain to a Spanish town, and spend part of the journey in France.", "Today, people move between France and Llívia without passport checks, because both countries share the Schengen area.", "Now it gets harder to follow. The next place is a piece of one country, inside another, with a third piece inside that.", "Number three: Madha, a small area of Oman that sits inside the United Arab Emirates.", "Look at the map and you see Omani land with the UAE on every side.", "And inside Madha there is another surprise: a village called Nahwa, which belongs to the UAE.", "So you get the UAE, then Oman inside it, then the UAE again inside that.", "Think of nesting dolls, except every doll is a piece of a different country.", "On a map app, you can zoom in and see the border line wrapping around Nahwa like a small circle.", "Why does this exist? Local tribes were loyal to different rulers, and the borders followed those loyalties, not neat lines.", "Remember that idea: borders that follow people, not maps. It matters for the next two places.", "If you enjoy strange places like these, subscribe, because there are more of them coming.", "Because number two sits in a valley where three countries are tangled together like a ball of wool.", "Number two: Sokh, in the Fergana Valley of Central Asia.", "On the map, Sokh is an Uzbek enclave, and Kyrgyz land surrounds it on every side.", "This is not a tiny hamlet. Tens of thousands of people live there.", "Most of them speak Tajik, so you get Tajik speakers, holding Uzbek citizenship, living inside Kyrgyzstan.", "Three countries share this valley: Uzbekistan, Kyrgyzstan and Tajikistan.", "The lines were drawn in the Soviet era, when they were only lines inside one big country.", "Then in 1991 those inside lines turned into real international borders almost overnight.", "And Sokh is not alone. The valley has several pockets like it, belonging to different countries.", "Tajikistan has a pocket called Vorukh, and Uzbekistan has another called Shakhimardan, both surrounded by Kyrgyz land.", "To reach the rest of Uzbekistan from Sokh, you have to cross Kyrgyz land first.", "Water, roads and grazing land have caused real clashes between villagers in this valley.", "Sokh shows what happens when a map is drawn for one country, and then used by three.", "Now for number one, the one I promised. It is in India, and the people there lived stuck between two countries.", "Number one: the Cooch Behar enclaves, where India and Bangladesh were tangled together like spaghetti.", "Before 2015, Indian plots sat inside Bangladesh, and Bangladeshi plots sat inside India.", "Old maps of this area look like a torn sheet of paper, with tiny shapes scattered everywhere.", "Many of those plots came from old land deals between local rulers, centuries ago.", "Some were just a few farm fields, and one field could be India while the next was Bangladesh.", "In 2015, India gave 111 enclaves to Bangladesh, and Bangladesh gave 51 to India.", "That is 162 pockets of land, all settled at midnight on a single night in July.", "Now the really strange part. Some enclaves sat inside other enclaves.", "Picture an Indian plot, inside a Bangladeshi plot, inside an Indian plot, inside Bangladesh.", "At the centre was Dahala Khagrabari, known as the only third-level enclave in the world.", "People there held one country's papers, but every step outside their plot meant walking through another country.", "Reports from the time said many residents struggled to get schools, electricity and hospitals nearby.", "In 2015, India and Bangladesh finally signed the deal and cleaned up these lines.", "Residents were allowed to choose which country they wanted to belong to.", "For many families, it meant a proper address, a school and a vote, maybe for the first time.", "So India's strangest border is one that no longer exists, and it ended with a signature, not a war.", "That is six borders that make no sense, from a Russian region cut off from Russia to the tangled fields of Cooch Behar.", "And back in the Fergana Valley, Sokh is still there, still Uzbek, with Kyrgyz land all around it.", "Open your map app, search the Fergana Valley, and zoom in. You can see these pockets for yourself.", "Your passport can say Uzbekistan while every road around you is in Kyrgyzstan, and it is true.", "Next video: more places on the map that look like mistakes, but are completely real."], "job": ""}, {"date": "2026-11-05", "kind": "Short", "category": "geography", "title": "Your boat floats between two rivers", "hook": "Your boat here sails between two colours of water.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Near Manaus in Brazil, the dark Rio Negro meets the sandy Solimões and the two flow side by side for kilometres. Differences in temperature, speed and density keep them apart for a while. This is the Meeting of Waters.\n\n#Shorts #Amazon #Geography", "script": ["Your boat here sails between two colours of water.", "Near Manaus, the Rio Negro meets the Solimões.", "One is dark as tea. The other is sandy brown.", "They flow side by side for kilometres.", "Different temperature, speed and density keep them apart.", "Later they blend into the mighty Amazon.", "Your boat sits right on that line.", "Next: a city with no cars at all."], "job": ""}, {"date": "2026-11-05", "kind": "Short", "category": "geography", "title": "Your city trip has zero cars", "hook": "Your whole city trip here happens with zero cars.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Venice's historic centre has no roads for cars. Canals work as the streets, and people travel by boat or on foot. Buses, taxis and ambulances are all boats.\n\n#Shorts #Venice #Geography", "script": ["Your whole city trip here happens with zero cars.", "Venice's historic centre has no roads.", "Canals are the streets instead.", "Buses, taxis and ambulances are all boats.", "Cars must stop at Piazzale Roma.", "After that, you walk or float.", "Venice: where every road is water.", "Next: trash left on the Moon."], "job": ""}, {"date": "2026-11-05", "kind": "Short", "category": "space", "title": "96 bags of human waste are on the Moon", "hook": "Your trash is sitting on the Moon right now.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo crews left about 96 bags of human waste on the Moon, along with boots, tools and cameras. They dumped unneeded weight so they could bring Moon rocks home. With no weather there, much of it just sits.\n\n#Shorts #Moon #Space", "script": ["Your trash is sitting on the Moon right now.", "Apollo crews left about 96 bags of human waste.", "Yes, bags of poop, just lying there.", "They also left boots, tools and cameras.", "They dumped weight to bring Moon rocks home.", "No rain will ever wash it away.", "So yes, your trash is on the Moon too.", "Next: a tree that visited the Moon."], "job": ""}, {"date": "2026-11-05", "kind": "Short", "category": "space", "title": "Trees grown from seeds that orbited the Moon", "hook": "Your local tree might have been to the Moon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo 14 carried tree seeds around the Moon in 1971. After they returned, the seeds were planted on Earth and the trees became known as Moon trees. Some still stand today.\n\n#Shorts #Apollo14 #Space", "script": ["Your local tree might have been to the Moon.", "Apollo 14 carried tree seeds around the Moon.", "Astronaut Stuart Roosa packed them in his kit.", "While others walked, he orbited alone.", "Back on Earth, the seeds were planted.", "They became known as Moon trees.", "Some still stand today.", "Your tree might have a Moon cousin.", "Next: money that changes colour."], "job": ""}, {"date": "2026-11-05", "kind": "Short", "category": "technology", "title": "Your Rs 500 note changes colour when tilted", "hook": "Your Rs 500 note changes colour when you tilt it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On the Rs 500 note, the numeral 500 shifts from green to blue when you tilt it. That is colour-shifting ink, a security feature that is hard to copy. Grab a note and try it.\n\n#Shorts #Rupee #Facts", "script": ["Your Rs 500 note changes colour when tilted.", "Look at the 500 on the note.", "Tilt it and green turns blue.", "That is colour-shifting ink.", "It is hard to copy.", "Cheap fakes often miss this trick.", "Try it now with a note from your wallet.", "Your Rs 500 note is hiding a trick.", "Next: tigers that swim."], "job": ""}, {"date": "2026-11-06", "kind": "Long video", "category": "geography", "title": "Why the Fergana Valley Is Stranger Than You Think", "hook": "Your map shows an Uzbek town with Kyrgyz land on every side, and by the end you will see five more.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Sokh is a piece of Uzbekistan that sits fully inside Kyrgyzstan, and it is one of several odd border pockets in the Fergana Valley. This video explains how Soviet-era lines, the 1991 break-up and a few land swaps created the tangled map you see today. You will visit Shohimardon, Vorukh, Chongara, Tash-Tobo, Barak and Sokh, and learn the Babur link that Indian students know.\n\n#FerganaValley #Enclaves #StrangeBorders", "script": ["Your map shows an Uzbek town with Kyrgyz land on every side, and by the end you will see five more.", "Look closely: Sokh belongs to Uzbekistan, yet it touches Uzbekistan nowhere. It is a pocket of one country, stuck inside another.", "That kind of pocket is called an enclave, and this one valley in Central Asia is full of them.", "You will meet a mountain resort that sits in the wrong country, and villages that changed countries without moving an inch.", "You will also see a place where arguments over roads and water turned serious, and one patch of land shared by three peoples.", "It is called the Fergana Valley, and its tangle is a story of Soviet planners, pencil lines and one big collapse.", "Stay till the end, because Sokh itself, the town on your screen, keeps its strangest part for last.", "One green valley, three countries, and a history older than almost any border you know.", "The Fergana Valley is a wide bowl of farmland ringed by mountains, shared today by Uzbekistan, Kyrgyzstan and Tajikistan.", "Two rivers, the Naryn and the Kara Darya, meet here and form the Syr Darya, which waters the fields for miles.", "Ancient Chinese records praised the powerful horses of this region, and Silk Road traders passed through its towns.", "Here is a link every Indian student knows: Babur, founder of the Mughal empire, was born in Andijan, in this valley.", "Margilan here is famous for silk, and Osh, on the Kyrgyz side, is one of Central Asia's oldest cities.", "It is one of the most crowded parts of Central Asia, so a border here cuts through busy farms and towns.", "Families here often have relatives on the other side, and bazaars have long mixed Uzbek, Kyrgyz and Tajik traders.", "Russia took over the region in the 1870s, and the Soviets followed. Still, for ordinary people, the valley felt like one place.", "The valley was one living region, with no walls through its fields. Then someone picked up a pencil.", "Next: how a few lines drawn in the 1920s created the mess on your screen.", "These borders were drawn inside a single country, so at the time they seemed harmless.", "In the 1920s, Soviet planners split Central Asia into republics, and the Fergana Valley was cut between three of them.", "Everything still belonged to the Soviet Union, so a republic line felt like the line between two Indian states.", "The lines often wiggled around canals, hills and villages, which is why they zigzag so wildly on a map.", "Look at the Uzbek, Kyrgyz and Tajik borders here, and they twist like a piece of torn paper.", "The result was a patchwork, with small pockets of one republic left inside another, like islands in a green sea.", "In 1991 the Soviet Union broke up, and those soft internal lines suddenly became real international borders with guards.", "A farmer walking to his own field, or a child walking to school, might now have to cross a foreign country.", "Today the valley still holds several of these pockets. Let us visit them one by one, starting with a mountain resort.", "Here is a holiday spot that belongs to Uzbekistan, though every road out of it leads into Kyrgyzstan.", "It is called Shohimardon, or Shakhimardan, a green mountain valley with a cold river and a shrine linked to Ali.", "People travel there for fresh air and pilgrimage, but the whole place is an island of Uzbekistan, with Kyrgyz land on every side.", "Imagine a piece of Gujarat sitting inside Rajasthan, with its own border posts. That is how strange this is.", "Your own mountain resort, in your own country, but the only way there runs through someone else's land.", "For years, reaching it from the rest of Uzbekistan has meant crossing Kyrgyz land first.", "Before 1991 nobody noticed. Afterwards, an ordinary drive to the mountains turned into a trip with guards and paperwork.", "And that is the gentle one. The next pocket belongs to a different country, and it has caused real trouble.", "A town of Tajikistan sitting inside Kyrgyzstan, cut off from the rest of its own country.", "This is Vorukh, a Tajik enclave. Kyrgyz land surrounds it, and Tajikistan itself starts only on the other side of that land.", "So Uzbek pockets, Tajik pockets and Kyrgyz land are all mixed up in one valley, like three puzzles tipped onto one table.", "They speak different languages too. Tajik is close to Persian, while Uzbek and Kyrgyz are Turkic, so words change as you cross.", "Imagine your road home passing through another country's villages, with their police and their rules.", "Roads, canals and grazing land here all cross national lines, so every shared road or stream can become a quarrel.", "Over the years, disputes over roads and water in this region have flared into violence, and people on both sides have been hurt.", "In 2025, Kyrgyzstan and Tajikistan signed a treaty to settle their long border dispute, which is good news for villages like these.", "If you like strange places and facts like these, subscribe, because tomorrow there is another one waiting.", "Next, villages that woke up in a different country without moving a single house.", "Imagine your village stays exactly where it is, but the country on the map changes. That has happened here.", "Uzbekistan once held four pockets inside Kyrgyzstan: Sokh, Shohimardon, Chongara and Tash-Tobo.", "Chongara and Tash-Tobo were small villages, and in a recent land swap they changed countries without moving an inch.", "Today only Sokh and Shohimardon remain under Uzbek control, and the other two now sit under Kyrgyz rule.", "There was also Barak, a Kyrgyz pocket inside Uzbekistan, and a treaty from 2022 settled its future through a land exchange.", "Two governments sat at a table and traded patches of land, like cards, to make the map cleaner.", "The deals took years of talks, with surveyors walking the land and checking every field and canal.", "For a person in a swapped village it is a quiet change: same house, same field, different flag.", "That is how most enclaves end. Not with a war, but with a signature, a survey team and a lot of paperwork.", "But one pocket is too big and too tangled for an easy swap, and that is the one on your screen.", "Back to Sokh, the largest and most complicated pocket in the whole valley.", "It lies in Kyrgyzstan's Batken region, in the south of the valley, among mountains and the Sokh river.", "Many of its people are ethnic Tajik, yet the land is Uzbek, and the country around it is Kyrgyz.", "So three peoples touch one place: Tajik families, an Uzbek government, and Kyrgyz neighbours on every side.", "A Tajik-speaking village, in an Uzbek pocket, inside Kyrgyzstan. Say that fast and you will understand the headache.", "Zoom into the map and Sokh appears as a tiny outlined island inside Kyrgyzstan.", "Getting in and out has meant passing Kyrgyz checkpoints, so a short trip can turn into a long one.", "Sokh is named after the river that runs through it, and that river is the lifeline of the whole pocket.", "Water is the other worry. The river feeds farms on both sides, so who controls the flow matters to everyone.", "Because it is cut off, supplies, schools and hospitals often depend on roads that pass through another country's land.", "Kyrgyzstan and Uzbekistan have agreed to open more checkpoints for cars and minibuses, which could make life here easier.", "Both governments know this matters, which is why talks about roads, water and checkpoints for Sokh have gone on for years.", "Remember, none of this is ancient. It is a leftover of lines drawn about a hundred years ago.", "So when you see a tiny odd shape on a map, remember it is a village, a road and a family.", "Now the loop. Your map of Sokh shows Uzbek land with Kyrgyz land on every side, and now you know why.", "A valley shared by three countries, cut by Soviet pencil lines, and frozen into real borders in 1991.", "Tomorrow: a country whose front door opens straight into another country's land."], "job": ""}, {"date": "2026-11-06", "kind": "Short", "category": "geography", "title": "Your boat trip goes through tiger territory", "hook": "Your boat here floats through tiger territory.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Sundarbans is the world's largest mangrove forest, shared by India and Bangladesh. Tigers here swim between the islands. A boat trip floats right through their home.\n\n#Shorts #Sundarbans #Geography", "script": ["Your boat here floats through tiger territory.", "The Sundarbans is the world's largest mangrove forest.", "India and Bangladesh share it.", "Tigers here swim between the islands.", "They even cross salty tidal rivers.", "Roots poke up from the mud like spikes.", "Twice a day, tides flood the forest.", "Your boat floats where tigers swim.", "Tomorrow: more places that seem fake."], "job": ""}, {"date": "2026-11-06", "kind": "Short", "category": "geography", "title": "Your Gujarat snow is really salt", "hook": "Your feet can stand on snow that is really salt.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Great Rann of Kutch in Gujarat is a huge white salt desert that looks like snow. In the monsoon it fills with water and becomes a shallow lake. Then the salt comes back. Part of the Places That Shouldn't Exist series.", "script": ["Your feet can stand on snow that is really salt.", "This is the Great Rann of Kutch, Gujarat.", "It is a vast white salt desert.", "Then the monsoon arrives.", "Rain turns the whole desert into a shallow lake.", "The white ground vanishes under water.", "Months later, the salt is back.", "So your Gujarat snow is really salt.", "Tomorrow: the tallest waterfall on Earth."], "job": ""}, {"date": "2026-11-06", "kind": "Short", "category": "geography", "title": "The tallest waterfall turns to mist midair", "hook": "Your Angel Falls photo shows water turning into mist.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Angel Falls in Venezuela is the world's tallest waterfall, with a drop of 979 metres. That is taller than the Burj Khalifa. Much of the water turns to mist before it reaches the ground.", "script": ["Your Angel Falls photo shows water turning to mist.", "This is Venezuela's Angel Falls.", "It is the world's tallest waterfall.", "The water drops 979 metres.", "That is taller than the Burj Khalifa.", "Much of it turns to mist before landing.", "The falls fade away in midair.", "So your photo shows water turning to mist.", "Tomorrow: socks that saved three astronauts."], "job": ""}, {"date": "2026-11-06", "kind": "Short", "category": "space", "title": "Socks and duct tape saved Apollo 13", "hook": "In space, your life can depend on duct tape.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "When Apollo 13 lost power, carbon dioxide began building up inside the spacecraft. Square filters had to fit a round hole. Engineers built a fix from socks, cardboard and duct tape, and all three astronauts came home alive.", "script": ["In space, your life can depend on duct tape.", "Apollo 13 lost power on the way to the Moon.", "Carbon dioxide was building up inside.", "The filters were square, but the hole was round.", "Engineers on the ground designed a fix.", "They used socks, cardboard and duct tape.", "The crew built it and breathed again.", "Duct tape and socks brought them home.", "Tomorrow: your microwave hides a tiny shield."], "job": ""}, {"date": "2026-11-06", "kind": "Short", "category": "technology", "title": "Your microwave door is a cage for waves", "hook": "Your microwave door is full of tiny holes for a reason.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The metal mesh on your microwave door has holes smaller than the microwaves, so they cannot get out. Light waves are far smaller, so you can still see your food. Look at your door and you can see it right now.", "script": ["Your microwave door is full of tiny holes.", "That metal mesh blocks the microwaves.", "Microwaves are about twelve centimetres long.", "The holes are much smaller than that.", "Light waves are far tinier still.", "So light passes through and you see the food.", "The microwaves cannot squeeze through.", "Your door is a cage for waves.", "Tomorrow: the strip holding India's map together."], "job": ""}, {"date": "2026-11-07", "kind": "Long video", "category": "geography", "title": "Your Street Ends in Another Country: 6 Odd Borders", "hook": "Your shopping street in Brazil ends in Uruguay, and nobody stops you crossing it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Six real borders that look like map mistakes, from a Brazilian street that runs into Uruguay to the enclaves India and Bangladesh finally swapped in 2015. Each one is stranger than the last, and every one can be checked on a map. Tell us which border you would live on.\n\n#borders #geography #mapfacts", "script": ["Your shopping street in Brazil ends in Uruguay, and nobody stops you crossing it.", "Today I have six real borders that make no sense, and every single one is stranger than the one before it.", "By the end, you will see a place in India where land sat inside land, inside other land, inside another country.", "Some of these borders run through parks. Some cut off whole towns. One of them was never even drawn on the water.", "You can find every one of them on a map, and you can check each fact yourself after the video.", "Stay till the end, because number one is in India, and it involves tiny plots of land stacked inside each other.", "We start at number six, where the border is a park and the two towns share the same pavement.", "Number six. Santana do Livramento in Brazil and Rivera in Uruguay look like one single town from above.", "But you are looking at two countries, and the line between them is very hard to spot on the ground.", "In many places, a row of small border markers is all that separates Brazil from Uruguay.", "In other places, a long public park sits right on the line, so you can walk across it without noticing.", "Walk along one pavement, and you can pass from Brazil into Uruguay between one shop and the next.", "In Brazil, people speak Portuguese. A few steps away in Uruguay, the main language is Spanish.", "Many locals speak a mix of both, so one single conversation can slide across the border and back.", "Rivera has duty-free shops, so many Brazilian shoppers happily walk across the line just to buy things there.", "A special agreement between the two countries lets people in border cities like these work, study and use public services on both sides.", "So a person can live in one country and go to school or work in the other, every single day.", "Imagine paying for your chai in one country and walking home to another before it even cools.", "Two flags, two languages, two countries, and one shared pavement. That is number six.", "But a border that is easy to cross is only the start. Next, an American town that cannot reach America.", "Number five is a piece of the United States that you cannot reach by road without leaving the United States.", "Number five. Look at the map near Vancouver, and you will find a piece of the United States hanging off Canada.", "It is called Point Roberts, in Washington state, and it sits on a small peninsula just below the forty-ninth parallel.", "The border between the US and Canada follows that line of latitude, so this little tip ended up on the American side.", "The problem is that the rest of America is a long way off, across water and across Canada.", "To reach the rest of the United States by road, a resident has to drive into Canada first.", "That means crossing a border to go to the American mainland, and crossing another border again to come back home.", "Minnesota has a similar oddity called the Northwest Angle, a piece of land you can only reach by land through Canada.", "On a map, these places look like mistakes. They are what you get when treaty makers draw straight lines across land they barely mapped.", "A straight line on paper, and a town that needs a border crossing to go home. That is number five.", "Number four is an entire town that sits inside another country, and it has been there for hundreds of years.", "Number four. Llívia is a Spanish town sitting completely inside France, with French land on every side.", "The story goes back to 1659, when Spain and France signed the Treaty of the Pyrenees after a long war.", "France was given a set of villages in this area. But Llívia was officially a town, not a village.", "Because of that wording, Llívia stayed Spanish, and the French villages around it went to France.", "One word in a treaty left a Spanish town stranded, with a different country in every direction.", "Today, a short road links Llívia to the rest of Spain. It is called the neutral road.", "The road crosses French land, but it is kept neutral so that people can travel between the town and Spain.", "Visitors come to Llívia for its old pharmacy museum and mountain views, and the border is just a quiet road.", "If you like strange places and facts like these, subscribe, because there is another one waiting tomorrow.", "So far, every border has been odd. But number three is a German town that lives inside Switzerland.", "Number three. Büsingen am Hochrhein is a German town of old houses, a church and a river, surrounded by Switzerland.", "Büsingen is part of Germany. Its people are German citizens and follow German law.", "But the town sits inside the Swiss customs area, so businesses there are treated like part of Switzerland.", "Both euros and Swiss francs are used in town, even though Germany only uses the euro.", "Even the car number plates are special. They start with BÜS, so you can spot a Büsingen car on the road.", "From the outside, Büsingen looks like a quiet village on the Rhine. All of the strangeness is hidden in the map.", "A German town in Switzerland, with its own plates and two currencies. That is number three.", "Number two is even stranger, because this border does not exist at all. And it is on the water.", "Number two. Lake Constance, where Germany, Switzerland and Austria meet, has no agreed border across its water.", "On land, borders are clear. But on this big lake, the three countries never signed a line through the middle.", "The three countries have different views on how to divide the water, and they have never agreed on one answer.", "So when a boat sails across the middle of the lake, there is no official line to tell you which country it is in.", "Ferries, fishermen and sailors share the water through practical agreements instead, so daily life carries on without any trouble.", "A famous lake with three countries on its shore, and not one official line anywhere on its water. That is number two.", "Now for number one, and it is right here in India, which is exactly why I saved it for last.", "Number one. On the border between India and Bangladesh, in West Bengal's Cooch Behar region, the map once looked like a puzzle.", "Small patches of India sat inside Bangladesh. And small patches of Bangladesh sat inside India.", "In India, we know these patches as chhitmahals, the word used for these enclaves along the Bengal border.", "Some were just villages, with farms, houses and families cut off from the country they belonged to.", "Then it got stranger. One plot was an Indian piece of land inside a Bangladeshi piece inside an Indian piece inside Bangladesh.", "It was called Dahala Khagrabari, and it was the only one of its kind in the whole world.", "People in such pockets often struggled to get a school, a hospital or electricity, because the country around them did not own them.", "For years they lived in the middle of a country that was not theirs, and their own government could not easily reach them.", "Then in 2015, India and Bangladesh swapped these lands. One hundred and eleven Indian enclaves went to Bangladesh, and fifty-one Bangladeshi ones came to India.", "People living there got a choice of which country to belong to, and families had to decide where their future would be.", "It was a rare border clean-up on this scale, and it happened right here in South Asia.", "So one of the strangest borders in the world was in our own backyard. Now it is a puzzle that has been solved.", "That was all six: a shared street, a stranded American town, a Spanish town in France, a German town in Switzerland, a lake with no line, and India's puzzle map.", "So go back to the start: your shopping street in Brazil really does end in Uruguay, and nobody stops you crossing it.", "Next video: another place that sounds fake but is completely real. Same channel, same strange maps."], "job": ""}, {"date": "2026-11-07", "kind": "Short", "category": "geography", "title": "India's map hangs on a 22 km strip", "hook": "Your map of India hangs on a strip about 22 km wide.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Siliguri Corridor in West Bengal is only about 22 km wide at its narrowest. It links India's northeast to the rest of the country. Nepal, Bhutan and Bangladesh squeeze in around it, which is why it is nicknamed the Chicken's Neck.", "script": ["Your map of India hangs on a thin strip.", "This is the Siliguri Corridor in West Bengal.", "At its narrowest, it is about 22 kilometres wide.", "Nepal, Bhutan and Bangladesh squeeze around it.", "It links India's northeast to the rest of the country.", "Trains and highways all squeeze through here.", "It is often called the Chicken's Neck.", "One thin strip holds your map together.", "Tomorrow: stand in four states at once."], "job": ""}, {"date": "2026-11-07", "kind": "Short", "category": "geography", "title": "Stand in four US states at once", "hook": "Your body can be in four US states at once.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At the Four Corners Monument, Utah, Colorado, Arizona and New Mexico meet at a marker on the ground. Put a hand or foot on each quadrant and you are touching all four states. It is the only point in the US where four states meet.", "script": ["Your body can be in four states at once.", "This is the Four Corners Monument.", "Utah, Colorado, Arizona and New Mexico meet here.", "Two feet and two hands, four states.", "It is the only place in the US like this.", "Visitors line up for this photo.", "A marker on the ground shows the spot.", "Right there, your body is in four states.", "Next: another place that shouldn't exist."], "job": ""}, {"date": "2026-11-07", "kind": "Short", "category": "space", "title": "Your rocket got hit by lightning twice", "hook": "Your rocket launch can get hit by lightning.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo 12 was struck by lightning twice in the first minute after liftoff in 1969. Systems dropped out, then came back, and the crew flew on to the Moon. Part of the series 'If You Were in Space'.\n\n#Shorts #Apollo12 #Space", "script": ["Your rocket launch can get hit by lightning.", "Apollo 12 was struck twice in 1969.", "Both strikes came in the first minute.", "Warning lights flooded the crew's panels.", "Power dropped out for a moment.", "Controllers got the systems back online.", "The crew flew on to the Moon.", "Struck twice, and it still landed there.", "Tomorrow: the town that fined NASA."], "job": ""}, {"date": "2026-11-07", "kind": "Short", "category": "space", "title": "A town fined NASA $400 for littering", "hook": "Your falling space station can earn you a littering fine.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "When Skylab fell on Western Australia in 1979, the town of Esperance fined NASA 400 dollars for littering. The fine was finally paid in 2009. Part of the series 'If You Were in Space'.\n\n#Shorts #Skylab #SpaceFacts", "script": ["Your falling space station can earn a littering fine.", "In 1979, Skylab broke up over Western Australia.", "Pieces landed near the town of Esperance.", "The town fined NASA 400 dollars for littering.", "NASA ignored the ticket for decades.", "In 2009, a radio host paid it.", "The fine was settled thirty years later.", "A space station got a littering ticket.", "Tomorrow: a sticker with no battery."], "job": ""}, {"date": "2026-11-07", "kind": "Short", "category": "technology", "title": "Your FASTag sticker has no battery", "hook": "Your FASTag sticker has no battery inside.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A FASTag is a passive RFID tag. The toll reader's radio waves power it for a moment, it replies with its ID, and the barrier lifts as you pass. No battery needed.\n\n#Shorts #FASTag #Technology", "script": ["Your FASTag sticker has no battery inside.", "It's a passive RFID tag.", "The toll reader sends out radio waves.", "Those waves power the tag for a moment.", "The tag replies with its ID.", "The toll comes from your linked account.", "The barrier lifts as you roll through.", "No battery, and it still pays your toll.", "Tomorrow: a lake with no agreed border."], "job": ""}, {"date": "2026-11-08", "kind": "Long video", "category": "geography", "title": "Why Brazil's Border With Uruguay Is Stranger Than You Think", "hook": "Your street in Santana do Livramento ends in Uruguay, and nobody stops you.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Santana do Livramento, Brazil, a street runs straight into Rivera, Uruguay, and only markers or a park show where one country ends. This video walks through seven true facts about the Brazil-Uruguay border: a shared square, a mixed language, duty-free shops that turn locals away, clocks that once disagreed, a treaty for border families, and an avenue named for the neighbour. Watch to the end for the strangest street of all.\n\n#Geography #Borders #Brazil", "script": ["Your street in Santana do Livramento ends in Uruguay, and nobody stops you. No gate, no guard, only a marker.", "Two towns, one built-up area: Brazil's Santana do Livramento and Uruguay's Rivera. Well over a lakh people live across the pair.", "By the end, you will see a park split by a border, shops that refuse locals, and clocks that disagreed.", "You will also meet an avenue where Brazil's street is named Uruguay, and Uruguay's street is named Brazil.", "Seven strange facts about this border, and each one is stranger than the last. The final one sounds like a joke.", "Think of crossing a busy road in your own city. Now imagine that road is a line between two countries.", "Fact one: you can walk from Brazil to Uruguay without ever noticing.", "In Santana do Livramento, the streets simply carry on into Rivera. The buildings, shops and traffic barely change.", "Only a row of border markers tells you where one country stops. Many people walk past them every day without looking down.", "Locals call it the Fronteira da Paz, the Border of Peace, because the line is open and easy to cross.", "Inside town there is no fence and no wall. A cyclist can cross countries without even slowing down.", "Everyday life flows across the line. People cross to shop, eat and visit family, often without a second thought.", "Imagine your neighbour lives in Brazil and you live in Uruguay, yet you share the same street life.", "The two towns grew up together. Rivera is the capital of its Uruguayan department, and Livramento is a Brazilian city of its own.", "And yet each side keeps its own flag, its own laws and its own money.", "But the best part of the border is not a street. It is a park, and it is next.", "Fact two: there is a public square where you can stand in two countries at once.", "It is called the Praça Internacional, or International Park. It was opened in 1943 by the leaders of Brazil and Uruguay.", "It is often called the only square in the world shared by two nations. Half of it is Brazilian and half is Uruguayan.", "Picture a cricket ground where the boundary rope is also a border between two countries. That is the idea here.", "Walk across the grass and you step from Brazilian soil onto Uruguayan soil. Markers show where the line runs.", "Families picnic here. Kids play on both sides of the line, and nobody asks which country they belong to.", "Imagine a football rolling out of Brazil and into Uruguay. Nobody needs a visa to fetch it.", "Most borders in the world are walls, rivers or mountains. This one is a public lawn.", "A border you can sit on with a cup of chai. Well, here it is mate, the local herbal tea.", "Next, the way people talk here. It is not quite Portuguese, and not quite Spanish.", "Fact three: Brazil speaks Portuguese and Uruguay speaks Spanish, but the border speaks both at once.", "Residents switch between Portuguese and Spanish and blend them together. The mix is commonly called portuñol.", "It is a bit like Hinglish, where Hindi and English tumble into one sentence without anyone blinking.", "Shop owners, taxi drivers and kids at school slide between the two without a second thought.", "A Brazilian can start in Portuguese, a Uruguayan can answer in Spanish, and both usually get it.", "The languages are close cousins, which helps, just as Hindi and Marathi are relatives.", "So one street can carry signs in Portuguese, signs in Spanish, and cash in two currencies, the Brazilian real and the Uruguayan peso.", "Two flags, two languages, two currencies. And yet, one daily life.", "Now to the fact that sends Brazilians across the line with empty bags.", "Fact four: in Rivera there are shops where Uruguayans are not allowed to buy.", "These are duty-free shops, called free shops. They sit near the border and mainly serve Brazilian shoppers.", "To buy, you must show a foreign ID, such as a passport. A Uruguayan local cannot just walk in and shop.", "Think airport duty-free, but on a normal city street.", "Shopping is a huge draw. Santana do Livramento is one of the top tourist spots in Rio Grande do Sul, largely for shopping.", "If you like strange places that sound fake but are true, subscribe. There is a lot more like this.", "So the border works like a giant price tag. Cross the line, and the rules about who can buy what flip.", "Think of people in India crossing into another state for cheaper goods. Same idea, but with a whole country.", "The shops are built right beside the line, so the walk from Brazil is short.", "That was strange. The next fact is about time itself.", "Fact five: for some summers, the clock changed by an hour when you crossed the street.", "Today, southern Brazil and Uruguay run on the same clock, three hours behind UTC.", "But Brazil used to move its clocks forward every summer. Uruguay had stopped doing that in 2015.", "That meant in summer, Rio Grande do Sul's clocks ran one hour ahead of Uruguay's, right across the border.", "So a Livramento shop could close at six while the Rivera cafe across the road still said five.", "Imagine India with two time zones just across one road. Your phone would have to guess.", "Brazil scrapped daylight saving time in 2019, so the mismatch is gone.", "India keeps one clock across the whole country. Here, two small towns once needed two.", "Today you can cross the street and the time stays the same. Strange that it used to be different.", "Next, the rules that let families live a life across both countries.", "Fact six: two governments signed a deal that lets border families live across both countries.", "In 2002, Brazil and Uruguay signed an agreement in Montevideo for people living in linked border towns.", "It covers residence, study and work. Santana do Livramento and Rivera are on the list of linked towns.", "So under the deal, a Brazilian living there can work or study on the Uruguayan side. And the reverse.", "A later addition in 2008 covered health care, letting border residents use medical services on either side.", "There is a limit. It only covers services that already exist in the town, under each country's rules.", "Officials have even pushed for a shared hospital care model for the two cities in recent years.", "In other places, crossing for a doctor needs visas and forms. Here, governments wrote the paperwork in advance.", "A border is usually where rules get strict. Here, the rules were written to make crossing easy.", "And there is another border town where the street itself is the line.", "Fact seven, the biggest one: Chuí in Brazil and Chuy in Uruguay are split by a single avenue.", "It lies near the Atlantic coast of southern Brazil, far from Rivera, at the other end of the border.", "The avenue has two names. Brazil calls its side Avenida Uruguai, and Uruguay calls its side Avenida Brasil.", "So Brazil's street is named after Uruguay, and Uruguay's street is named after Brazil.", "The median strip in the middle of the avenue is where the line runs. Step across it and you change countries.", "No bridge, no river, no checkpoint in town. Immigration posts sit several kilometres outside, not on the avenue.", "Picture parking your car in Brazil while your friend parks in Uruguay, one lane apart.", "Even the money changes at the median. The Brazilian real on one side, the Uruguayan peso on the other.", "One more twin trick: a town called Aceguá exists on the Brazilian side, and another Aceguá on the Uruguayan side.", "Same name, same border, two countries. Even the maps need a second look.", "So that is seven strange facts. A street that flows into Uruguay, a park split in two, and a mixed language.", "Shops that refuse locals, clocks that once disagreed, a treaty for families, and an avenue named for the neighbour.", "Now back to the start. Your street in Santana do Livramento ends in Uruguay, and nobody stops you.", "Not a wall, not a fence, just a marker. Sometimes the strangest border is the one that is easiest to cross.", "Tomorrow: another place where the map and real life refuse to agree."], "job": ""}, {"date": "2026-11-08", "kind": "Short", "category": "geography", "title": "Three countries, one lake, no agreed border", "hook": "Your boat on Lake Constance floats where no border is agreed.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Germany, Austria and Switzerland all touch Lake Constance, yet there is no officially agreed border line through the water. Boats cross it every day. Part of the series 'Places That Shouldn't Exist'.\n\n#Shorts #Geography #LakeConstance", "script": ["Your boat on Lake Constance floats where no border is agreed.", "Germany, Austria and Switzerland all touch this lake.", "Nobody has officially agreed where the lines run.", "Each country holds its own view of the water.", "There is no painted line on the water.", "Yet ferries cross it every day.", "Practical agreements keep things running.", "You could cross three countries without a line.", "Tomorrow: a lake that looks blood red."], "job": ""}, {"date": "2026-11-08", "kind": "Short", "category": "geography", "title": "Tanzania's lake with blood-red water", "hook": "Your photo of Lake Natron can show blood-red water.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Lake Natron in northern Tanzania can look blood red. The water is very salty and alkaline, and dead birds and animals can get coated in crusty mineral deposits. Flamingos still nest there. Part of the series 'Places That Shouldn't Exist'.\n\n#Shorts #LakeNatron #Geography", "script": ["Your photo of Lake Natron can show blood-red water.", "It's real, in northern Tanzania.", "The red comes from tiny microorganisms.", "The water is extremely salty and alkaline.", "Dead birds can get coated in crusty minerals.", "In photos, they look like statues.", "Yet flamingos nest on this lake.", "Red water, crusty statues, all real.", "Tomorrow: a sky full of balloons."], "job": ""}, {"date": "2026-11-08", "kind": "Short", "category": "geography", "title": "Turkey's sunrise sky full of balloons", "hook": "Your dawn in Cappadocia fills the sky with balloons.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At dawn in Cappadocia, Turkey, hot-air balloons rise above rock chimneys made of volcanic rock. On busy mornings hundreds can fly together, and the sight is famous around the world. Part of the series 'Places That Shouldn't Exist'.\n\n#Shorts #Cappadocia #Travel", "script": ["Your dawn in Cappadocia fills the sky with balloons.", "They float above rock chimneys.", "The chimneys are towers of volcanic rock.", "Locals call them fairy chimneys.", "Balloons lift off at sunrise.", "Hundreds can rise together on busy mornings.", "Travelers come from around the world to see it.", "Wake early, and the sky is crowded with color.", "Tomorrow: another place that sounds fake."], "job": ""}, {"date": "2026-11-08", "kind": "Short", "category": "space", "title": "Your Moon Hides the Entire Sun", "hook": "Your Moon can hide the whole Sun.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Sun is about 400 times wider than the Moon, and also about 400 times farther away. That is why the Moon can cover the Sun almost exactly in a total solar eclipse. Series: Space Coincidences.\n\n#Shorts #SolarEclipse #Space", "script": ["Your Moon can hide the whole Sun.", "The Sun is far bigger than the Moon.", "About 400 times wider, in fact.", "But it's also about 400 times farther away.", "So both look the same size in your sky.", "That perfect match is pure coincidence.", "The Moon drifts away, so this won't last forever.", "Right now, your Moon hides the whole Sun."], "job": ""}, {"date": "2026-11-08", "kind": "Short", "category": "technology", "title": "Your Stove Lighter Needs No Battery", "hook": "Your gas stove lighter makes sparks without batteries.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Click-style gas lighters use a piezoelectric crystal. A spring-loaded hammer squeezes the crystal, and that squeeze makes a high-voltage spark. Try it next time you light the stove.\n\n#Shorts #Science #HowItWorks", "script": ["Your gas stove lighter makes sparks without batteries.", "Click it and watch the spark jump.", "Inside is a tiny crystal.", "A spring-loaded hammer squeezes it hard.", "Squeezing that crystal makes real electricity.", "It's called the piezoelectric effect.", "Thousands of volts, from one click.", "The spark lights the gas, and your stove starts.", "No battery. Just a squeeze and a spark."], "job": ""}, {"date": "2026-11-09", "kind": "Long video", "category": "geography", "title": "6 Strange Borders, India's Is the Wildest", "hook": "Your street can be half Hong Kong and half China, and India has an even stranger border.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Six real borders that make no sense: a Spanish town inside France, a US peninsula you reach through Canada, a road across an airport runway, a German town using Swiss money, a street split between Hong Kong and China, and India's nested enclave in Cooch Behar. Every one is true, and every one is on a real map. Watch to the end for the strangest border of all.\n\n#borders #geography #facts", "script": ["Your street can be half Hong Kong and half China, and India has an even stranger border.", "By the end of this video, you will see a farm plot in India that sat inside a pocket, inside a pocket, inside a pocket.", "Six real borders, each one stranger than the last. Every one of them is on a real map, and you can check them yourself.", "The last two are the best, and the very last one is in India. Stay with me, because it gets weird fast.", "We start small, with a quiet mountain town where a very old mistake in a treaty still decides who owns the land.", "So here is number six: a Spanish town that France completely surrounds, and the odd reason it is still Spanish.", "Number six. Llívia is a Spanish town, but you will not find it on the Spanish side of the mountains.", "It sits inside France, a short drive from the border. Spanish flags fly there, and people live by Spanish rules.", "The reason goes back to 1659. In a peace treaty, Spain agreed to hand a group of villages over to France.", "But Llívia was counted as a town, not a village. So by the wording of the treaty, it was never given away.", "Think about that. One word in an old document, and hundreds of years later the map still shows a Spanish island in France.", "Today a special road links Llívia to the rest of Spain. That road is treated as neutral ground between the two countries.", "So you can drive from Spain to this Spanish town while the French countryside rolls past on both sides of your window.", "It also has a pretty old centre and a church on a hill, and the views over the French hills are lovely.", "A town that is Spanish on paper and French on every side, all because a treaty forgot one place.", "That is strange, but at least you can drive there. The next place has a road you must leave your own country to use.", "Let us go from Europe to the west coast of North America, where one border line cut right through a peninsula.", "Number five. Point Roberts is part of the United States, in the state of Washington, and the map shows it clearly.", "But the border was drawn along a straight line of latitude, the 49th parallel, and it sliced the tip of a peninsula off.", "That left a small piece of America that hangs below Canada, with no American road connecting it to the rest of the country.", "So the only land route from Point Roberts to the rest of the United States goes through Canada.", "Residents cross into Canada, drive through it, and then cross back into America. That is two border checks just to reach the next big town.", "Or they can take a boat across the water, which skips Canada altogether, though the weather has to be kind.", "Imagine driving to the supermarket and needing to show your passport twice. For these people, that is normal life.", "It is still part of the United States, with American addresses, American laws and a very strange commute.", "One straight line drawn on a map, long ago, and a whole community still pays for it every time it leaves home.", "But the next border does something even odder. It makes cars and people wait for airplanes.", "Now we go back to Europe, to a huge rock beside the sea, at the very south of Spain.", "Number four. Gibraltar sits at the tip of Spain, and it belongs to the United Kingdom.", "The main road in from Spain crosses the airport runway. Yes, the very runway where aircraft land.", "The road is called Winston Churchill Avenue, and for most of the day it is just a busy road.", "But when a plane is about to land or take off, barriers come down and the cars and walkers all have to wait.", "Then the plane rolls across, the barriers lift, and people carry on to work, to school or to the beach.", "So here the border between Spain and the UK is a place where you queue twice: once for the passport check, and again for a plane.", "And it all sits under a giant rock, with a small town built at its foot and monkeys running around on top.", "Very few borders in the world are crossed over a runway, and this is the one most people have heard about.", "The next place is not an island or a peninsula. It is a whole town that sits in the wrong country.", "And the people there handle their money in a way that does not match the country they officially belong to.", "Number three. Büsingen am Hochrhein is a German town, but Switzerland surrounds it on every side.", "To drive from Büsingen to the rest of Germany, you have to pass through Swiss land. There is no way around.", "The town is also part of the Swiss customs area, and the Swiss franc is used in everyday life there.", "So it is a town with German law, a German address and Swiss money in the shops. Few places mix two countries so completely.", "If you enjoy strange places and facts like these, subscribe, because the next two borders are the best ones in the video.", "These first four were odd, but you could still tell where the line was. The next one runs right down the middle of a street.", "Chung Ying Street is the heart of this next story, and it sits in a small town on the edge of Hong Kong.", "Number two. Sha Tau Kok sits right next to the mainland Chinese city of Shenzhen, and a border cuts through the old town.", "The name Chung Ying Street means China-Britain Street, and that name is no accident, because both countries met on this very road.", "In 1898, Britain and China agreed on a border for the Hong Kong area. In this town, the line ran down the middle of the lane.", "Stone markers were set into the road to show where the line goes. They are still there, numbered one after another.", "One side of a stone reads Anglo-Chinese Boundary 1898 in English. The other side carries Chinese writing for the same line.", "So on one side of the street you are in Hong Kong, and on the other side you are in mainland China.", "Shop doors face each other across the lane. Take a few steps across the road, and you are under a different system of laws.", "For many years the Hong Kong side lay inside a closed frontier zone, so even getting to the street needed a permit.", "That is why some people say it is the street with one road and two systems. The border is literally under your feet.", "There is no wall down the middle, no fence, just old stones and a road that people have shared for over a century.", "A single lane, two governments, and a line that was drawn when the town was a fishing village.", "Walk it slowly, and you cross a border without any gate, any guard or any sign other than a worn stone.", "Strange, right? And yet it is still not the strangest border in this video. That one is in India.", "To find it, we go to the far north of West Bengal, to a district called Cooch Behar, right on the border.", "Number one. Here, India and Bangladesh once had a tangle of tiny pockets of land inside each other's territory.", "Over a hundred Indian pockets lay inside Bangladesh, and about fifty Bangladeshi pockets lay inside India.", "They came from old deals between local kings, and then Partition in 1947 locked every one of them in place.", "People who lived in these pockets were cut off from their own country. Many struggled to get schools, clinics, power and water.", "To reach your own country, you first had to cross foreign land. Sometimes you had to do it more than once.", "Now for the part I promised. Among these pockets was a plot called Dahala Khagrabari, and it was the strangest of all.", "It was a piece of India, inside a piece of Bangladesh, inside a piece of India, inside Bangladesh.", "That makes it the only third-order enclave in the world, a pocket inside a pocket inside a pocket, with nothing else like it.", "The plot was farmland with nobody living on it. Its owner was a Bangladeshi farmer who lived in the pocket around it.", "So an Indian field was owned by a Bangladeshi farmer, who lived on Indian land, inside Bangladesh. Try drawing that on paper.", "In 2015, India and Bangladesh finally swapped these pockets. India even changed its constitution to make it happen.", "Dahala Khagrabari went to Bangladesh on the first of August 2015, and the strangest plot on the map disappeared.", "People in the pockets could choose their country, and many finally got proper addresses, roads and electricity.", "So the next time a border looks like a simple line on your phone, remember these six places.", "A Spanish town in France, a US peninsula you reach through Canada, and a road that crosses a runway.", "A German town using Swiss money, a street split down the middle, and a field inside three other pockets of land.", "Borders are drawn by people, and people make odd choices. And yes, your street really can be half Hong Kong and half China.", "Tomorrow: the country with no border at its own front door."], "job": ""}, {"date": "2026-11-09", "kind": "Short", "category": "geography", "title": "These Avatar Mountains Are Real", "hook": "Your view here looks like Avatar's floating mountains.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "These sandstone pillars are in Zhangjiajie, China, and they inspired the floating mountains in the film Avatar. One pillar was even renamed Avatar Hallelujah Mountain. Nothing floats, but the clouds make it look like it does.\n\n#Shorts #China #PlacesThatShouldntExist", "script": ["Your view here looks like Avatar's floating mountains.", "These are real sandstone pillars in China.", "They're in Zhangjiajie, wrapped in cloud.", "Thousands of them rise straight up.", "Filmmakers used them as inspiration for Pandora.", "One pillar was renamed Avatar Hallelujah Mountain.", "Nothing floats, the clouds just hide the base.", "Your Avatar view is real, and it's in China."], "job": ""}, {"date": "2026-11-09", "kind": "Short", "category": "geography", "title": "Light Beams Cut Through This Canyon", "hook": "Your camera here catches light cutting through solid rock.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Antelope Canyon in Arizona is a slot canyon of smooth, wave-like orange sandstone. Flash floods carved it over time, and sunlight drops in as bright beams. It looks like a different planet, but it's in the US Southwest.\n\n#Shorts #AntelopeCanyon #PlacesThatShouldntExist", "script": ["Your camera here catches light cutting through solid rock.", "This is Antelope Canyon in Arizona.", "A beam drops down into the dark.", "The walls look like frozen orange waves.", "Flash floods carved every curve.", "Rain far away can send water rushing in.", "Over time, that water polished the sandstone smooth.", "A beam of light on rock water carved."], "job": ""}, {"date": "2026-11-09", "kind": "Short", "category": "space", "title": "Your Moon Is Escaping Earth", "hook": "Your Moon is slowly drifting away from Earth.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Moon moves away from Earth by about 3.8 centimetres every year. Scientists measure it by firing lasers at mirrors left on the Moon by Apollo astronauts and timing the return of the light. It's roughly the speed your fingernails grow.\n\n#Shorts #Moon #Space", "script": ["Your Moon is slowly drifting away from Earth.", "About 3.8 centimetres every single year.", "That's roughly how fast your fingernails grow.", "We know because of mirrors on its surface.", "Apollo astronauts left them there.", "Scientists fire lasers at them from Earth.", "They time how long the light takes to return.", "Your Moon is leaving, one fingernail at a time."], "job": ""}, {"date": "2026-11-09", "kind": "Short", "category": "space", "title": "Saturn Is Light Enough to Float", "hook": "Your bathtub water could float the planet Saturn.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Saturn is less dense than water, because it's mostly hydrogen and helium. So in a giant enough ocean, the whole planet would float. Of course, no such ocean exists.\n\n#Shorts #Saturn #Space", "script": ["Your bathtub water could float the planet Saturn.", "Saturn is less dense than water.", "It's mostly hydrogen and helium gas.", "Yet it's about ninety-five times Earth's mass.", "Find a giant enough ocean, and it floats.", "Of course, no such ocean exists.", "It would bob like a giant beach ball.", "Your bathtub water could float a whole planet."], "job": ""}, {"date": "2026-11-09", "kind": "Short", "category": "technology", "title": "Your Calculator Runs On Light, Not Battery", "hook": "Your solar calculator can run with no battery, and your finger can switch it off.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Many solar calculators have no battery at all. They run on the light hitting a small solar panel. Cover it with your finger and watch the display fade. Try it on your own calculator.\n\n#Shorts #Technology #Science", "script": ["Your solar calculator can run with no battery.", "Cover the small solar panel with your finger.", "Watch the numbers start to fade.", "Uncover it, and they come back.", "That strip is a small solar cell.", "It turns room light into electricity.", "Even a desk lamp is
