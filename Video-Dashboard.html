enough.", "So your finger can switch it off.", "Try it now. Your calculator runs on light."], "job": ""}, {"date": "2026-11-10", "kind": "Long video", "category": "geography", "title": "Why Hong Kong Is Stranger Than You Think", "hook": "Your lane in Sha Tau Kok, Hong Kong, has a street where one footstep takes you into mainland China.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hong Kong has a street split by a border, an escalator that changes direction, and a walled city that no longer exists. This video explains six true facts about Hong Kong, from Chung Ying Street in Sha Tau Kok to the 1898 lease behind it. Watch to the end to see why the border stones are still in the road.\n\n#HongKong #Geography #StrangeFacts", "script": ["Your lane in Sha Tau Kok, Hong Kong, has a street where one footstep takes you into mainland China.", "Stone markers stand in the middle of the road, with Hong Kong on one side and mainland China on the other.", "By the end, you will see exactly why that street exists, and it is not even the strangest part.", "Here are six facts about Hong Kong that sound fake but are true, and each one is stranger than the last.", "The final one explains the street, and it starts with a rental deal signed more than a hundred years ago.", "But first, let us start with a border that sits inside a single country, and why you still need papers.", "Fact one: Hong Kong is part of China, yet travellers still go through border control between the two.", "Officers check your travel documents on the way in and on the way out, just like at an airport.", "Hong Kong runs its own immigration system, and even mainland Chinese citizens need a special permit to visit.", "Along that border runs a strip of land called the Frontier Closed Area, which was set up in 1951.", "For decades, you needed a permit to enter large parts of it, and Sha Tau Kok sat inside it.", "Chung Ying Street was in that closed zone too, so visitors needed permission just to walk its length.", "The name Chung Ying means China and Britain. It is literally the China-Britain Street.", "Keep that name in mind, because it is the biggest clue to the surprise at the end.", "Fact two: the money in your pocket changes the moment you cross, even though it is the same country.", "Hong Kong has its own currency, the Hong Kong dollar, printed on its own banknotes.", "The mainland uses the yuan, so two different kinds of money circulate in one country.", "Hong Kong also issues its own passport, which is separate from the mainland Chinese passport.", "It has its own courts and its own laws on many matters, under a plan called one country, two systems.", "That promise is written in Hong Kong's Basic Law, which says the system stays for fifty years after 1997.", "Fifty years after 1997 is 2047, so that is a date people there keep in mind.", "And the street from the start is the exact place on the ground where those two systems meet.", "Hold on to that. Next, we leave politics and look at daily life, which is just as odd.", "Fact three: a free outdoor escalator in Hong Kong changes direction depending on the time of day.", "It is the Central to Mid-Levels escalator on Hong Kong Island, and the whole system is about 800 metres long.", "In the morning rush it runs downhill, so people living on the slope can ride down to work.", "Later in the day it flips and carries people uphill towards their homes.", "It is often described as the longest covered outdoor escalator system in the world.", "Now look at the taxis. In Hong Kong, the colour of the taxi tells you where it works.", "Red taxis cover the main urban areas, green taxis serve the New Territories, and blue taxis serve Lantau Island.", "So the paint on the car works like a map you can hail.", "Now the clock. Hong Kong runs two and a half hours ahead of India, so noon in Delhi is 2:30 there.", "And Hong Kong shares its time with Beijing, so crossing at Sha Tau Kok does not change the hour at all.", "So the street splits the laws, the money and the paperwork, but not the time.", "The next place was so crowded that it became a legend, and today it no longer exists.", "Fact four: Hong Kong once had a walled neighbourhood where the government hardly governed.", "It was Kowloon Walled City, a small old fort that grew into one of the most crowded places ever built.", "The 1898 deal let Chinese officials stay inside the fort, but within a year Britain pushed them out.", "After that, its legal status stayed murky for decades, and nobody fully took charge of what happened inside.", "People kept building upward without a plan until the fort was packed with thousands of homes, shops and workshops.", "The alleys were so narrow and shaded that residents relied on electric lights even during the day.", "Hong Kong tore it down in 1993 and 1994, and the people who lived there were moved out.", "Today a quiet garden called Kowloon Walled City Park sits on that very spot.", "The fort's old government building still stands inside the park, so you can walk where it all happened.", "If you enjoy strange places and facts that sound fake but are true, subscribe, because more like this are coming.", "Now for something Indian viewers will recognise, right in the middle of a glass-and-steel skyline.", "Fact five: Hong Kong has a South Asian side that most postcards never show.", "In Tsim Sha Tsui stands Chungking Mansions, a huge building packed with shops, guesthouses and curry restaurants.", "Inside you can find Indian food, phone shops and traders who have come from many countries.", "It sits right on one of the busiest shopping streets in the city, which makes the contrast sharper.", "Across the harbour in Wan Chai, there is a gurdwara called the Khalsa Diwan Sikh Temple, over a century old.", "Many Sikhs first came to Hong Kong during British rule, working in the police and as guards.", "So the same city that hosts a split street also hosts langar, samosas and Hindi conversations on the pavement.", "That mixture comes from the same history as the street: Britain, China and trade, all colliding in one place.", "Which brings us to the final fact, the one that explains Chung Ying Street, and it is the strangest of all.", "Fact six: a street was split because of a rental agreement, and that agreement ended long ago.", "In 1842, after the First Opium War, China gave Hong Kong Island to Britain under the Treaty of Nanking.", "In 1860, Britain also took the Kowloon peninsula, the area just across the water from the island.", "Then in 1898, Britain signed a lease for a much larger area north of Kowloon, called the New Territories.", "The lease ran for 99 years, which means it was due to end in 1997.", "Sha Tau Kok sits at the northern edge of that leased land, right where it met the rest of China.", "At the village there, the dividing line ran straight down a narrow street, with houses on both sides.", "So stone markers were placed in the middle of the road, and they have stood there since the 1890s.", "On one side was British Hong Kong. On the other side, the Chinese mainland.", "People living on that street could step from one rule book to another by crossing the road.", "Then came 1997, and here is the twist: Britain gave back not just the leased land, but all of Hong Kong.", "That includes the island and Kowloon, which Britain had taken in the earlier treaties, not through a lease.", "So the lease ended, the colony ended, and you would expect the dividing line on the street to vanish.", "It did not. Hong Kong stayed a separate system, so the same stones in the road still mark a boundary.", "That is why Chung Ying Street, the China-Britain Street, is still split between two systems today.", "A line that began as the edge of a rental deal now separates two sets of rules, a few steps apart.", "For years you needed a permit to enter, because the whole area was a closed zone.", "So that is the answer: a street, a rental agreement from 1898, and a line that outlived its lease.", "To recap: a border inside one country, two kinds of money, an escalator that flips, and a vanished walled city.", "Add a gurdwara beside skyscrapers, and a street where one footstep takes you from Hong Kong into mainland China.", "Tomorrow, we visit a country that sits completely inside another country, and look at how that works."], "job": ""}, {"date": "2026-11-10", "kind": "Short", "category": "geography", "title": "Blue Fire Pours Down This Volcano", "hook": "Your night hike shows blue fire pouring down a volcano.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At Kawah Ijen in Indonesia, hot sulfur gas leaks from cracks in the rock and catches fire when it meets air. It burns electric blue, and some of it flows down the slope. It looks like lava, but it is burning sulfur.\n\n#Shorts #Geography #Places", "script": ["Blue fire pours down this volcano at night.", "It looks like glowing lava, but it isn't.", "This is Kawah Ijen, in Indonesia.", "Hot sulfur gas leaks from cracks in the rock.", "When it meets air, it catches fire.", "Sulfur burns blue, not orange.", "Some of it melts and flows, still burning.", "Miners still carry sulfur out of this crater.", "Blue fire you can only see after dark."], "job": ""}, {"date": "2026-11-10", "kind": "Short", "category": "geography", "title": "A Drilling Accident Made This Rainbow Geyser", "hook": "Your drive through Nevada passes a rainbow mound that spouts hot water.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Fly Geyser in Nevada is a colourful mound that spouts hot water. It exists because of a well drilled in 1964. Minerals from the water built the mound, and algae gave it those bright colours.\n\n#Shorts #Geography #Places", "script": ["A rainbow-coloured mound spouts hot water.", "It is Fly Geyser, in Nevada.", "And nature did not start it.", "In 1964, people drilled a well here.", "They hit scalding water underground.", "The water kept erupting, year after year.", "Minerals in the water built this mound.", "Algae gave it those bright colours.", "A drilling accident made this wonder."], "job": ""}, {"date": "2026-11-10", "kind": "Short", "category": "geography", "title": "The River Of Five Colours Is Real", "hook": "Your river in Colombia turns red, yellow, green and blue.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Caño Cristales in Colombia is nicknamed the river of five colours. In the right season its bed glows red, with yellow, green and blue around it. The red comes from a plant that grows on the riverbed.\n\n#Shorts #Geography #Places", "script": ["This river in Colombia runs bright red.", "Yellow, green and blue too.", "It is called the river of five colours.", "Its name is Caño Cristales.", "The red comes from a river plant.", "Sand, algae and clear water add the rest.", "But only in the right season.", "Other months, it looks far less colourful.", "A river that paints itself in colours."], "job": ""}, {"date": "2026-11-10", "kind": "Short", "category": "space", "title": "Saturn Has A Hexagon Wider Than Earth", "hook": "Your view of Saturn's north pole shows a giant six-sided cloud.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Saturn's north pole has a six-sided pattern of clouds. It is a jet stream, and NASA's Cassini spacecraft photographed it. The hexagon is wider than planet Earth.\n\n#Shorts #Space #Saturn", "script": ["Saturn's north pole has six straight sides.", "It is a giant hexagon of clouds.", "The Cassini spacecraft photographed it up close.", "It is a jet stream circling the pole.", "The hexagon is wider than Earth.", "Our whole planet could fit inside it.", "Nobody built it. It is weather.", "Weather that draws straight lines in space.", "Saturn's pole really is a hexagon."], "job": ""}, {"date": "2026-11-10", "kind": "Short", "category": "technology", "title": "That Tiny Hole In Your Plane Window", "hook": "Your plane window has a tiny hole, and it is there on purpose.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The small hole near the bottom of an airplane window is called a bleed hole. Windows are made of several panes, and the hole balances pressure between them. It lets the outer pane carry the pressure load, and it helps stop fogging.\n\n#Shorts #Technology #Aviation", "script": ["Your plane window has a tiny hole.", "It sits near the bottom.", "And it is there on purpose.", "The window is made of several panes.", "That hole is called a bleed hole.", "It balances pressure between the panes.", "So the outer pane takes the load.", "It also helps stop the glass fogging.", "A tiny hole, put there on purpose."], "job": ""}, {"date": "2026-11-11", "kind": "Long video", "category": "geography", "title": "Britain Owns Land in Cyprus (+5 More Strange Borders)", "hook": "Your British holiday could be on Cyprus, and the map says that land still belongs to the UK.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Britain still owns two pieces of Cyprus, an island in the European Union. This countdown of six strange borders starts with a road that stops for planes and ends with the India-Bangladesh enclaves, where one field sat inside land inside land inside land. Every place is real and you can find each one on a map.", "script": ["Your British holiday could be on Cyprus, and the map says that land still belongs to the UK.", "Britain owns two pieces of an island that is itself part of the European Union.", "That is only number two on today's list of borders that make no sense.", "Number one is in India, where one tiny patch of land sat inside three other patches of land.", "Six borders, each stranger than the last. Stay to the end and you will see how a map can tie itself in knots.", "And the fun part is that every one of these is real, with a place you can find on a map.", "Here is how it works: I count down from six, and the strangest border comes last.", "We start with a road where cars have to stop for aeroplanes.", "Number six: a road that closes whenever a plane lands.", "Gibraltar is a small British territory at the southern tip of Spain, joined to Spanish land by one border.", "Right beside that border, the airport runway cuts straight across the main road.", "The road is called Winston Churchill Avenue, and it carries everyday traffic like any other town road.", "When a plane is about to land or take off, barriers come down and everybody has to wait.", "Cars, scooters and people on foot all stop while the aircraft rolls across the road in front of them.", "Then the barriers lift and the traffic carries on, as if nothing happened.", "So if you walk in from Spain, you may cross a runway before you even reach the shops.", "The airport sits squeezed between the sea and the rock, so there was little room to build around the road.", "It is one of the very few places in the world where a main road crosses an active runway.", "The rock behind it is tiny, yet Britain has held it for more than three hundred years.", "Spain still claims it, so this small border is never just a road.", "But the next place has a bigger problem: you cannot drive to it from its own country.", "Number five: an American town you can only reach by driving through Canada.", "Point Roberts is part of Washington state, yet it hangs off the bottom of a Canadian peninsula.", "The border follows a straight line on the map, the forty-ninth parallel, and the town ended up on the wrong side of it.", "The Canadian part of that peninsula is a normal suburb, and Point Roberts is just the American tip at the end.", "So if you live there and want to drive to the rest of America, you must go through Canada first.", "That means two border checks just to drive home inside your own country.", "Minnesota has a similar place called the Northwest Angle, reachable by land only through Canada.", "Both exist because old treaties were drawn with straight lines on old maps, and nobody checked the real land.", "On a map these pieces look like mistakes. In real life, people go to school and buy groceries there.", "Their shops, post and school buses all depend on crossing a border that most of us never think about.", "The next town does something even odder with money.", "Number four: a German town completely surrounded by Switzerland.", "Büsingen sits on the Rhine, and every road out of it leads into Swiss land.", "It has been part of Germany for centuries, even though Switzerland surrounds it on all sides.", "It is German, yet its shops and people also use Swiss francs in daily life.", "Its cars carry special number plates with the letters BÜS, so everyone knows where they come from.", "A German town, Swiss money, and a border that does not follow any hill or river.", "It dates back to old territorial deals, and it stayed because nobody ever wanted to change it.", "So the map shows a small dot of Germany floating inside Swiss land.", "If you enjoy strange places like this, this is a good moment to subscribe, because tomorrow brings more of them.", "It is also a nice reminder that a country border is a human decision, not a natural one.", "Now a village that connects to its own country at one single point.", "Number three: an Austrian village that touches the rest of Austria at a single point.", "Jungholz sits high in the Alps, and Germany lies around it on almost every side.", "Its border with the rest of Austria is not a line at all. It is one point on a mountain.", "In everyday life, that means villagers drive through Germany to reach most places in Austria.", "Imagine telling a friend you live in Austria, then driving through Germany to get home.", "A single dot on a map is all that keeps the village legally Austrian.", "It also shows that a border can be one point, one line, or an entire river.", "Austria and Germany get along perfectly, so nobody minds. But few borders are held together this thinly.", "Next, the one from the start: British land on an EU island.", "Number two: land on Cyprus that belongs to the United Kingdom.", "Cyprus became independent from Britain in 1960, but Britain kept two areas for its military.", "They are called Akrotiri and Dhekelia, and together they are the British Sovereign Base Areas.", "Sovereign means they are not rented. Legally, that land is British territory.", "Together they cover less than three percent of the island, but they appear as British land on the map.", "Britain also kept them because of their position, close to the Middle East and the eastern Mediterranean.", "RAF Akrotiri is a working air base on the southern coast of the island.", "Cyprus joined the European Union in 2004, so the EU has an island with Britain still sitting on it.", "Cypriot villages and farms sit inside these areas, and people live ordinary lives there.", "The areas are run by a military administrator rather than a normal government.", "And the island has another border: a line that has split it in two since 1974.", "That line cuts through the capital, Nicosia, so one city has people on both sides of a closed street.", "So a single island carries a British border, a European border, and a divided capital.", "And yet number one is still stranger, and it is right here in India.", "Number one: a border so tangled that India and Bangladesh had to swap whole villages.", "In West Bengal, near the old kingdom of Cooch Behar, little islands of one country sat inside the other.", "Cooch Behar was once a princely state, and it joined India in 1949, two years after independence.", "These pockets are called enclaves, and for decades there were over a hundred and fifty of them.", "People in a Bangladeshi pocket were surrounded by India, and people in an Indian pocket by Bangladesh.", "Some were so small that they were only a few paddy fields or a single house.", "Walking to the market meant leaving your country, and often your schools, roads and power with it.", "Many people there had little access to school or electricity, because neither government could easily reach them.", "Then there was Dahala Khagrabari, a patch of India inside Bangladesh inside India inside Bangladesh.", "That is three layers of land wrapped around one small Indian field. It was the only place like it in the world.", "Everyone knew it was absurd, and for decades neither side could agree on a fix.", "Finally, in 2015, India and Bangladesh agreed to swap them. Around a hundred and sixty enclaves changed sides.", "At midnight on thirty-first July 2015, the pockets were handed over, and residents got to choose their country.", "The old knot is gone, but the story shows how a line on paper can trap real people.", "So Britain owns land in Cyprus, but India once had land inside land inside land.", "Tomorrow: more places on the map that should not exist, but do."], "job": ""}, {"date": "2026-11-11", "kind": "Short", "category": "geography", "title": "Your boat sails under a ceiling of stars", "hook": "Your boat glides under a sky of living lights.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Waitomo Caves in New Zealand look like a night sky, but the lights are glowing larvae hanging from the cave roof. They glow to lure insects into sticky silk threads. Part of the Places That Shouldn't Exist series.\n\n#Shorts #NewZealand #PlacesThatShouldntExist", "script": ["Your boat glides under a sky of living lights.", "This cave is in Waitomo, New Zealand.", "Those stars are thousands of glowing larvae.", "They're baby flies, not actually worms.", "Each one glows to lure insects in.", "Sticky silk threads hang down to trap them.", "So that starry ceiling is a hunting trap.", "Your sky of living lights is a trap.", "Next: a wave frozen in solid stone."], "job": ""}, {"date": "2026-11-11", "kind": "Short", "category": "geography", "title": "Your photo shows a giant wave made of rock", "hook": "Your photo shows a wave frozen in stone.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Wave Rock in Western Australia is a granite cliff about 14 metres high, shaped like a breaking ocean wave. It was carved by water and soil wearing away its base, not by the sea. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Australia #PlacesThatShouldntExist", "script": ["Your photo shows a wave frozen in stone.", "It's Wave Rock, in Western Australia.", "The cliff is about fourteen metres high.", "It's solid granite, not water or sand.", "Water and soil carved its curve underground.", "The rock itself is billions of years old.", "The sea is hundreds of kilometres away.", "A frozen wave, nowhere near the ocean.", "Next: a planet that rolls on its side."], "job": ""}, {"date": "2026-11-11", "kind": "Short", "category": "space", "title": "On Uranus, one day can last 42 years", "hook": "If you stood on Uranus, daylight could last 42 years.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Uranus is tilted about 98 degrees, so it rolls around the Sun like a ball. Its rings and moons circle it vertically, and each pole gets years of non-stop sunlight. Part of the If You Were in Space series.\n\n#Shorts #Uranus #IfYouWereInSpace", "script": ["If you stood on Uranus, daylight could last 42 years.", "The planet is tilted about 98 degrees.", "So it rolls around the Sun like a ball.", "Its rings stand upright, like a wheel.", "Its moons circle it vertically too.", "One pole faces the Sun, then the other.", "One lap around the Sun takes 84 years.", "Uranus is a planet lying on its side.", "Tomorrow: a blue sunset on Mars."], "job": ""}, {"date": "2026-11-11", "kind": "Short", "category": "space", "title": "On Mars, the sunset turns blue", "hook": "On Mars, your sunset would be blue.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Rover cameras have photographed sunsets on Mars where the sky around the setting Sun glows blue. Fine dust in the air scatters light differently from Earth's air, flipping the colours we know. Part of the If You Were in Space series.\n\n#Shorts #Mars #IfYouWereInSpace", "script": ["On Mars, your sunset would be blue.", "Rovers have photographed it themselves.", "On Earth, sunsets turn red and orange.", "On Mars, the glow around the Sun is blue.", "Fine dust in the air causes this.", "Dust scatters blue light toward your eyes.", "Its daytime sky is butterscotch, not blue.", "A blue sunset on a dusty red world.", "Next: why your chips packet is puffed."], "job": ""}, {"date": "2026-11-11", "kind": "Short", "category": "technology", "title": "Your chips packet is full of gas on purpose", "hook": "Your chips packet is full of gas, on purpose.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Grab any puffed packet of chips and you are holding a bag filled with nitrogen. The gas pushes out oxygen, which makes oils go stale, and it cushions the chips so fewer break. Try squeezing one and see.\n\n#Shorts #FoodFacts #TechFacts", "script": ["Your chips packet is full of gas, on purpose.", "It's nitrogen, pushed in before sealing.", "Oxygen makes the oil in chips go stale.", "Nitrogen pushes the oxygen out.", "So the chips stay fresh much longer.", "The puffed bag also cushions every chip.", "Without it, you'd get more crumbs.", "So yes, your packet is full of gas.", "Next: a country you can walk across."], "job": ""}, {"date": "2026-11-12", "kind": "Long video", "category": "geography", "title": "Why Cyprus Is Stranger Than You Think", "hook": "Your British holiday could be on Cyprus, and part of that island is still owned by the United Kingdom.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Cyprus is an EU island that drives on the left, sits close to Syria and Lebanon, and has a capital cut in half by a UN buffer zone. It also has two British Sovereign Base Areas, Akrotiri and Dhekelia, where the UK still holds land inside an EU country. Here are six true facts about Cyprus that sound fake.\n\n#Cyprus #Geography #StrangePlaces", "script": ["Your British holiday could be on Cyprus, and part of that island is still owned by the United Kingdom.", "That land sits inside a country that is a member of the European Union, and it runs under its own laws.", "But that is only one of the strange things about this island, and it is not even the strangest one.", "By the end, you will see why a map of Cyprus looks like it was drawn by three different governments.", "Stay for the last stop, because one British base there has ordinary Cypriot villages sitting inside its boundary.", "First, a quick look at where Cyprus actually is, because most people place it wrongly on the map.", "It is a Mediterranean island, the third largest in that sea, after Sicily and Sardinia.", "Six stops, each stranger than the one before. Let us start with something every Indian driver will recognise.", "Stop one: Cyprus drives on the left side of the road, exactly like India does.", "That is no accident. Britain ruled Cyprus for decades, and the driving habit stayed after the British left.", "India has the same story. British rule ended, but left-hand driving, and a lot of other habits, stayed behind.", "Rent a car in Cyprus, and you will sit on the right, change gears with your left hand, and feel at home.", "Cyprus is also in the Commonwealth, the same group of countries that India belongs to.", "So if you land there, the roads will feel oddly familiar, even though you are inside the European Union.", "Here is the twist. Most EU countries drive on the right. Only Cyprus, Ireland and Malta drive on the left.", "All three were once British. Remember that, because Britain comes back in a much bigger way at the end.", "Next, a stop where geography and politics disagree with each other, and the map gets confusing.", "Stop two: Cyprus is a member of the European Union, but geographically it sits in Asia.", "Look at it on a map. It lies close to Syria, Lebanon and Turkey, and far from mainland Europe.", "Greece is much farther away, yet Cyprus is an EU member, and since 2008 it has used the euro.", "So you can pay in euros on an island that is a short flight from the Middle East.", "Cyprus joined the European Union in 2004, along with nine other countries, mostly from Eastern Europe.", "Its name may be linked to copper. The Latin word for copper, cuprum, is connected to the island.", "Ancient people mined copper there, and that metal helped make bronze, so the island became famous for it.", "Cyprus is also where Greek myth says Aphrodite, the goddess of love, rose from the sea.", "Tourists visit a rock on the south coast called Petra tou Romiou, which is linked to that old legend.", "So far, that sounds like a normal holiday island. Now we get to the part where the island is cut in half.", "Stop three: Nicosia is the capital of Cyprus, and a line of walls, fences and sandbags runs straight through it.", "In 1974, a coup and a Turkish military intervention split the island, and it has stayed divided ever since.", "United Nations peacekeepers have patrolled the buffer zone between the two sides since 1964.", "That zone is called the Green Line, and it cuts through the middle of Nicosia, street by street.", "The north calls itself the Turkish Republic of Northern Cyprus, and only Turkey recognises it as a country.", "Everyone else, including India, treats the whole island as the Republic of Cyprus.", "In some places, the buffer zone is only a few metres wide. In other places it is much wider.", "Nicosia is often called the last divided capital in Europe, and on Ledra Street you walk straight up to a checkpoint.", "You show your passport, walk across on foot, and within minutes you are in a different part of the island.", "There is an Indian link here too. General Thimayya, one of India's most respected soldiers, served in Cyprus.", "He commanded the United Nations peacekeeping force on the island, and he died in Nicosia in 1965.", "Indian soldiers have served in United Nations missions around the world, and Cyprus is part of that story.", "If you enjoy strange places like this, subscribe to the channel, because there is another one tomorrow.", "Now for something even stranger. A village where the dividing line runs right through everyday life.", "Stop four: Pyla is a village inside the buffer zone, and both Greek Cypriots and Turkish Cypriots live there.", "It is the only village in the buffer zone that is shared by both communities.", "In the main square, a Greek Cypriot café and a Turkish Cypriot café sit close together.", "Pyla is also right next to the British base at Dhekelia. Hold that thought, because it matters later.", "Stop five: there is an airport in Nicosia where no passenger plane has taken off in decades.", "Nicosia International Airport closed in 1974, and it is still stuck inside the buffer zone today.", "Old aircraft were left behind, and a Cyprus Airways plane has sat on that airfield for decades.", "Imagine a departure gate that never opened again. The airport is still there, but nobody can fly from it.", "Travellers now use the airports at Larnaca and Paphos instead, and that is where your holiday flight would land.", "But the eeriest place is on the east coast. It is a whole resort town sitting behind a fence.", "Stop six: Varosha, a seaside resort in Famagusta that was fenced off in 1974.", "Before that, it was one of the most popular beach destinations in the Mediterranean, with hotels, shops and nightclubs.", "People fled, and the area was sealed off. For decades, hotels stood empty behind fences and soldiers.", "Weeds grew through shops and apartments, while the sea beside them stayed exactly the same.", "In 2020, part of Varosha's beach was opened to visitors, a decision that drew heavy international criticism.", "So today you can walk through streets of a ghost resort that was frozen in time.", "Varosha shows how fast a busy place can turn into a time capsule once a border appears.", "Now for the biggest one, and the reason we started with Britain. It is the strangest stop of all.", "Stop seven, or really the last one: when Cyprus became independent in 1960, Britain kept two pieces of the island.", "They are called Akrotiri and Dhekelia, and they are officially known as British Sovereign Base Areas.", "Akrotiri is on the south coast near Limassol. Dhekelia is on the east side, near Larnaca and Famagusta.", "These are not just army camps. They are British Overseas Territory, and the Union Jack flies there.", "That means a country inside the European Union has British territory sitting on its own island.", "Britain left the EU in 2020, yet it still holds land on an EU island.", "The bases have their own laws, their own police and their own courts, all under a British administrator.", "Yet they use the euro, just like the rest of Cyprus. So you pay in euros on British land.", "Here is the strangest part. People live inside them, and many are Cypriots, not British soldiers.", "Dhekelia, in particular, has Cypriot villages inside its boundary, so ordinary villagers live on British-controlled land.", "Under the 1960 treaty, the areas are meant for military use, not for general development.", "The RAF has an air base at Akrotiri, and it is an important British military site in the region.", "Its position, close to the Middle East, is the main reason Britain kept it after independence.", "Akrotiri also has a big salt lake, and in winter flamingos gather there, right beside a military base.", "So there are three layers on one island: the Republic of Cyprus, the north, and Britain's bases.", "Put it together. An island in Asia, inside the EU, that drives on the left.", "It has a capital cut in half, a ghost airport, and a ghost resort behind a fence.", "And it has two slices of land that belong to the United Kingdom, a country that left the EU.", "Your British holiday could be on Cyprus, and some beaches there really are on British soil.", "Next in this series: a whole country that sits entirely inside another country. See you there."], "job": ""}, {"date": "2026-11-12", "kind": "Short", "category": "geography", "title": "You can walk across this whole country", "hook": "You can walk across a whole country in minutes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Monaco covers only about 2 square kilometres on the French Riviera, making it the second-smallest country in the world after the Vatican. France surrounds it on every land side, yet Formula 1 races through its streets. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Monaco #PlacesThatShouldntExist", "script": ["You can walk across a whole country in minutes.", "It's Monaco, on the French Riviera.", "It covers only about two square kilometres.", "Only the Vatican is smaller.", "France surrounds it on every land side.", "Yet Formula 1 races through its streets.", "Racing cars roar past its apartment blocks.", "A whole country, crossed in minutes.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-11-12", "kind": "Short", "category": "geography", "title": "Your Rain Gauge Overflows in Meghalaya", "hook": "Your rain gauge here would never stay empty.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Mawsynram in Meghalaya, India is among the wettest places on Earth. Monsoon clouds hit the Khasi Hills and dump rain on this village. Locals even wear bamboo rain shields called knups.\n\n#Shorts #Meghalaya #Geography", "script": ["Your rain gauge here would never stay empty.", "This is Mawsynram, a village in Meghalaya.", "It is among the wettest places on Earth.", "Monsoon clouds crash into the Khasi Hills.", "Locals wear woven bamboo shields called knups.", "It covers the whole back, like a wearable umbrella.", "Meghalaya even means abode of clouds.", "So your rain gauge would never stay empty.", "Tomorrow: a forest that died standing up."], "job": ""}, {"date": "2026-11-12", "kind": "Short", "category": "geography", "title": "Your Trek Ends in a 900-Year-Old Dead Forest", "hook": "Your trek here ends in a forest of black dead trees.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Deadvlei in Namibia is a white clay pan filled with black dead trees under huge red dunes. The trees are roughly 900 years old. The air is so dry they never rotted away.\n\n#Shorts #Namibia #Geography", "script": ["Your trek here ends in a dead forest.", "This is Deadvlei, in Namibia.", "The black trees are roughly 900 years old.", "They stand on white cracked clay.", "Red dunes tower right behind them.", "A river once fed this spot.", "Dunes blocked it, and the trees died.", "The air is too dry for them to rot.", "Your trek ends at a forest frozen in time.", "Tomorrow: a volcano taller than Everest."], "job": ""}, {"date": "2026-11-12", "kind": "Short", "category": "space", "title": "On Mars, Everest Would Look Small", "hook": "If you stood on Mars, Mount Everest would look small.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Olympus Mons on Mars is about 22 km high, roughly two and a half times Everest's height above sea level. It is the tallest known volcano in our solar system. Everest would look small next to it.\n\n#Shorts #Space #Mars", "script": ["If you stood on Mars, Everest would look small.", "This is Olympus Mons, a volcano on Mars.", "It is about 22 kilometres high.", "That is roughly two and a half Everests.", "It is the tallest known volcano in our solar system.", "Its slopes rise gently, like a giant shield.", "You would need a spacesuit just to breathe.", "Your Everest would look small up there.", "Tomorrow: the lines on your car's back glass."], "job": ""}, {"date": "2026-11-12", "kind": "Short", "category": "technology", "title": "Your Car's Back Glass Has Hidden Wires", "hook": "Your car's back glass has wires baked right into it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The thin lines across your car's rear windshield are heating wires. Press the rear defogger button and they warm up to clear fog. You can see them on the glass right now.\n\n#Shorts #Cars #Technology", "script": ["Your car's back glass has wires baked into it.", "Those thin lines are not decoration.", "They are heating wires.", "Press the rear defogger button on your dashboard.", "The wires warm up and the glass heats.", "Fog and mist melt away from the glass.", "Monsoon drivers see them clear the view.", "Go look at your car's back glass.", "Tomorrow: a city that commutes by cable car."], "job": ""}, {"date": "2026-11-13", "kind": "Long video", "category": "geography", "title": "6 Absurd Borders, Ending in India's Weirdest", "hook": "Your speed sign flips from miles to kilometres on a road that never changes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Drive across the Irish border and your speed sign changes from miles to kilometres, with no gate and no guard. This countdown visits six real borders that make no sense: a German village inside Switzerland, a Spanish town in France, a piece of America you reach through Canada, a whole country inside another, and India's strangest enclave of all.\n\n#borders #geography #strangefacts", "script": ["Your speed sign flips from miles to kilometres on a road that never changes.", "That is border number six on today's list, and it is the most normal one. Everything after it gets stranger.", "We will visit a village stuck inside another country, and a town that Spain owns in the middle of France.", "Then a patch of America you can only reach by driving through Canada, and a whole country hidden inside another.", "And at the very end, an Indian border so strange that one little plot sat inside three layers of countries.", "Stay till the end, because that last one is real, it is in India, and it ended only a few years ago.", "Number six. Drive north on the road between Dundalk and Newry, and nothing looks different at first.", "There is no gate, no guard and no passport check. The road, the fields and the weather all stay the same.", "But watch the speed signs. In the Republic of Ireland, they are in kilometres per hour.", "Cross into Northern Ireland, part of the United Kingdom, and the same kind of sign now means miles per hour.", "So a number on a sign can be a different speed, depending on which side of an invisible line you are on.", "A limit of 100 in the Republic is about 62 miles per hour. Your speedometer might show either unit, so check.", "Distances change too. Road signs in the Republic count kilometres to the next town, and in the north they count miles.", "Locals cross this line every day to work, shop and visit family, often without noticing they have changed countries.", "The border runs about five hundred kilometres across the island, and many small roads cross it, with nothing to mark them.", "Often the only clue is the speed sign, a number that quietly changes its meaning.", "So that is number six: a border you can see only in the units on the sign. Now it gets stranger.", "Next, a village that is German, but you cannot reach Germany from it without driving through Switzerland.", "Number five. Büsingen am Hochrhein is a German village, and it is completely surrounded by Switzerland.", "Look at the map and you see a small German pocket, with Switzerland all around it.", "To reach the rest of Germany by road, you must drive through Switzerland first.", "Because of an old border deal, the village sits inside the Swiss customs area, which is the same as Switzerland for trade.", "Shops there widely accept Swiss francs, even though Germany uses the euro.", "Even the car number plates are special. Cars from the village carry the letters B, Ü, S, which no other German town uses.", "Swiss and German rules mix together here, so a small village has to follow two systems at once.", "A German village in Switzerland sounds odd, but wait: the next one is a Spanish town inside France.", "And it is there because of one word in a treaty from the sixteen hundreds.", "Number four. Llívia is a Spanish town, but it sits inside France, about one and a half kilometres from the Spanish border.", "In 1659, Spain and France signed the Treaty of the Pyrenees, and Spain gave France a group of villages.", "Llívia was officially a town, not a village. So the treaty did not cover it, and it stayed Spanish.", "That one tiny difference in a word still shapes the map today, more than three centuries later.", "A short road, called the neutral road, joins Llívia to Spain, and it passes through French land.", "Llívia even has one of Europe's oldest pharmacies, now a museum you can visit.", "So you can have lunch in France, drive a few minutes, and eat dessert in Spain, without leaving the mountains.", "Two countries, one valley, and a town that exists on the Spanish side only because of a legal word.", "But our next one is a corner of America above the line, and a mapmaker's mistake put it there.", "Number three. The Northwest Angle is part of Minnesota, but it hangs off the top of the state, north of the main border.", "Look at the 48 mainland states. This is the only place in them north of the 49th parallel.", "To reach it by road, you have to drive through Canada, and then enter America again on the other side.", "Or you can take a boat across Lake of the Woods, which is how many visitors actually arrive.", "The reason is a mapmaking mistake. In 1783, the treaty after the American Revolution used a map that was wrong.", "The treaty said the border would go to the northwestern point of Lake of the Woods, and then due west.", "But the real lake and rivers did not line up with the map, and later talks left this piece on the American side.", "So a bit of the USA is stuck up there, with forests, fishing lodges and water all around.", "People live there, and visitors come for fishing, even though the only road in goes through another country.", "A whole piece of America reached through Canada. But what about a whole country that sits inside another?", "If you enjoy strange places like these, do subscribe, because we post a new one every day.", "Number two. Lesotho is not a village or a town. It is a full country, and South Africa surrounds all of it.", "Whichever way you leave Lesotho by land, you end up in South Africa.", "More than two million people live there, with their own king, their own flag and their own money, called the loti.", "It is one of only three countries in the world that are completely surrounded by one other country.", "The other two are San Marino and the Vatican, which sit inside Italy, and both are tiny.", "Lesotho is large enough to have mountains, ski slopes and snow, in the middle of southern Africa.", "It is known as the Kingdom in the Sky, because every part of it is high above sea level.", "Its lowest point is about 1,400 metres up, which is the highest lowest point of any country in the world.", "Because of this, almost everything Lesotho trades with the outside world has to pass through South Africa first.", "A country inside a country is strange. But India has something even stranger, and it ended only in 2015.", "Number one. In Cooch Behar, in West Bengal, India and Bangladesh were mixed like a jigsaw.", "Small patches of Indian land sat inside Bangladesh, and small patches of Bangladeshi land sat inside India.", "These patches were called chhitmahals, or enclaves. Some were a few acres, and some were a few villages.", "One local story says the old kings of Cooch Behar and Rangpur played games and bet villages on them.", "Whatever the cause, the result was real: 162 patches of land that belonged to the wrong country.", "In 2015, India gave Bangladesh 111 enclaves, and Bangladesh gave India 51.", "Before that, people living in them were stuck. They were citizens of a country they could not easily reach.", "Many had no proper roads, schools or electricity from the government, because the land around them belonged to another country.", "Now for the strangest of all. One tiny plot called Dahala Khagrabari was a real-life Russian doll of countries.", "It was Indian land, inside a Bangladeshi enclave, inside an Indian enclave, inside Bangladesh.", "That is four layers of borders. It was the only one like this in the whole world.", "The plot was smaller than two acres, so a person could cross all of it in a short walk.", "Just to walk from there to mainland India, you would have had to cross four borders.", "At midnight on the thirty-first of July, 2015, the exchange began, and the enclaves changed hands.", "People waved flags, ate sweets and cheered, because many were finally getting a country that could reach them.", "Residents were given a choice, to stay where they were, or to move to the country they belonged to.", "Some moved across the border into India, and many others chose to stay, and became citizens of Bangladesh.", "A line that took decades to fix was finally redrawn by a treaty, and the jigsaw map became a clean line.", "So the strangest border on our list has already vanished. You can still see its odd shape in old maps.", "Let us count it back. Six, a sign that changes units. Five, a German village inside Switzerland.", "Four, a Spanish town in France. Three, American land you reach through Canada. Two, a country inside a country.", "One, an Indian plot inside three layers of borders. Every line on a map is a human decision.", "Which brings you back to the start: your speed sign flips from miles to kilometres, and no road has moved.", "Next video: time zones that make no sense, including one in Nepal where your watch jumps by fifteen minutes."], "job": ""}, {"date": "2026-11-13", "kind": "Short", "category": "geography", "title": "Your Commute Here Is a Cable Car", "hook": "Your commute in La Paz, Bolivia can be a cable car.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In La Paz, Bolivia, ordinary commuters ride cable cars to work. The Mi Teleférico network is one of the largest urban cable car systems in the world. Its lines are named after colours.\n\n#Shorts #Bolivia #Geography", "script": ["Your commute in La Paz can be a cable car.", "This is La Paz, in Bolivia.", "The city is packed into Andes valleys.", "Roads there jam up and climb steeply.", "So the city built cabins over the rooftops.", "It is called Mi Teleférico.", "It is among the largest urban cable car networks.", "Its lines are named after colours.", "Tomorrow: a road that ends at two seas."], "job": ""}, {"date": "2026-11-13", "kind": "Short", "category": "geography", "title": "Your Road Ends at India's Ghost Town", "hook": "Your road here ends with sea on both sides.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Dhanushkodi in Tamil Nadu sits at the tip of Rameswaram island, with the Bay of Bengal on one side and the Indian Ocean on the other. A cyclone in 1964 wrecked the town. Ruins still stand there today.\n\n#Shorts #Dhanushkodi #Geography", "script": ["Your road here ends with sea on both sides.", "This is Dhanushkodi, in Tamil Nadu.", "The Bay of Bengal is on one side.", "The Indian Ocean is on the other.", "A cyclone in 1964 wrecked the town.", "Broken buildings still stand on the sand.", "Sri Lanka is just across the water.", "Your road ends where the land does.", "Tomorrow: another place that sounds fake."], "job": ""}, {"date": "2026-11-13", "kind": "Short", "category": "space", "title": "Mars Has a Moon That Rises Backwards", "hook": "Your moon on Mars rises in the west.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Phobos, the larger of Mars's two moons, orbits faster than Mars spins. So from the surface it rises in the west and sets in the east. It is also slowly spiralling inward.\n\nSeries: If You Were on Another World.", "script": ["Your moon on Mars rises in the west.", "Then it sets in the east.", "Phobos orbits faster than Mars spins.", "It laps the planet in under eight hours.", "So it can rise twice in one day.", "And it is slowly spiralling inward.", "In tens of millions of years, it breaks apart.", "Your moon rises backwards, and it is doomed.", "Next: a helicopter that flew on Mars."], "job": ""}, {"date": "2026-11-13", "kind": "Short", "category": "space", "title": "A Helicopter Flew on Mars 72 Times", "hook": "Your helicopter has flown on Mars, 72 times.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In April 2021, NASA's Ingenuity made the first powered, controlled flight on another planet. It was planned as a five-flight demo. It went on to fly 72 times.\n\nSeries: If You Were on Another World.", "script": ["A helicopter has flown on Mars.", "NASA's Ingenuity lifted off in April 2021.", "It was the first powered flight on another planet.", "Mars air is far thinner than Earth's.", "NASA planned only five flights.", "It flew seventy-two times.", "One tiny helicopter, one whole planet.", "Your helicopter flew on Mars, seventy-two times.", "Next: boiling water on top of paper."], "job": ""}, {"date": "2026-11-13", "kind": "Short", "category": "technology", "title": "Boiling Water on Paper Without Burning It", "hook": "Your cooktop can boil water with paper under the pan.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "An induction cooktop does not heat itself. It makes a magnetic field that heats the metal pan directly, so a sheet of paper under the pan does not catch fire.\n\nSeries: Tech That Sounds Fake.", "script": ["Put paper under a pan on an induction cooktop.", "The water boils. The paper does not catch fire.", "The cooktop does not make heat itself.", "It makes a magnetic field instead.", "That field heats the metal pan directly.", "The pan heats the water.", "The paper just sits there, unburnt.", "Your cooktop boils water on paper.", "Next: a lake with floating islands."], "job": ""}, {"date": "2026-11-14", "kind": "Long video", "category": "geography", "title": "Why Ireland Is Stranger Than You Think", "hook": "Your speed sign flips from miles to kilometres on the same road, and nothing else changes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Drive across the Irish border and the speed sign flips from miles to kilometres, even though the road does not change. This video shows seven strange true facts about Ireland, from green and red post boxes to a clock that ran 25 minutes behind London.\n\n#Ireland #Geography #Borders", "script": ["Your speed sign flips from miles to kilometres on the same road, and nothing else changes. No wall, no guard, just a number.", "You are driving across Ireland, and in a few seconds you will cross a border that most drivers never even notice.", "By the end of this video you will see seven strange things this one island does to roads, clocks and phones.", "And the last one is the strangest: a border that hundreds of roads cross, with almost nothing to show it is there.", "Ireland is one island, but it is split into two countries: Northern Ireland, part of the United Kingdom, and the Republic of Ireland.", "Start with the sign that gives the game away. Stay with me, because it gets stranger from here.", "Strange thing one: the sign that changes its units. Drive south from Northern Ireland and the numbers look the same, but they mean something else.", "In Northern Ireland, speed limits and distances are in miles, just like the rest of the United Kingdom.", "In the Republic of Ireland, speed limits are in kilometres per hour. The Republic switched its speed signs to metric in January 2005.", "A sign showing 100 in the Republic means 100 kilometres per hour, which is about 62 miles per hour.", "Your car does not change at the border. Only the sign tells you which rules you just drove into.", "Drivers from Northern Ireland who cross the border have to stop thinking in miles and start thinking in kilometres, with no warning.", "Everything else about the road can stay the same: same tarmac, same hedges, same cows in the field next to it.", "Both sides drive on the left, so there is no lane switching like at some borders. The only clue is the number on the sign.", "Often the sign is the only thing telling you that you changed countries. That is how a border can hide in plain sight.", "Next, a clue that is much more colourful, and you can spot it from the car window. Look at the post boxes.", "Strange thing two: the post box that changes colour. Cross the border and the red letter box turns green.", "In Northern Ireland, post boxes are red, just like in England, Scotland and Wales. The Royal Mail runs them.", "In the Republic of Ireland, post boxes are painted green. An Post, the Irish postal service, runs those.", "The green is not an accident. After Ireland became independent, the old British red boxes were repainted green.", "Some of those old green boxes still carry the royal initials of British monarchs under the paint.", "So a green box can still carry a British royal mark, a small reminder of the history under the paint.", "Even the postal addresses change. The Republic uses a code called Eircode, and Northern Ireland uses UK postcodes.", "That means two different address systems on one small island, sometimes only a short drive apart.", "Speed signs and post boxes are easy to see. The next one is about something you cannot see at all: time.", "Strange thing three: Ireland's clocks used to be 25 minutes behind London. Not an hour, 25 minutes.", "Before 1916, Ireland ran on its own time called Dublin Mean Time, set by the sun over Dublin.", "It was about 25 minutes behind Greenwich Mean Time, the time that London used.", "Trains and ferries between the two islands had to account for that gap every single day.", "That changed in 1916, during the First World War, when Ireland moved its clocks to match Greenwich time.", "Today both parts of Ireland share one time zone, so there is no clock change at the border.", "In summer, clocks go forward by one hour on both sides at the same moment, so that part stays simple.", "So the old time gap is gone, but it shows that even time itself was once different on this island.", "Here is something to wait for: the next one happens in your pocket, and it can cost you money without you noticing.", "Your phone is about to get confused about which country it is in, and the next chapter shows how.", "Strange thing four: your phone can switch countries without you moving. Near the border, it may connect to the wrong country's network.", "Mobile towers do not stop at the border. A strong signal from a tower in the United Kingdom can reach into the Republic.", "Your phone simply picks the strongest signal. It does not care which country the tower stands in.", "People living near the border have reported their phones showing a UK network while they stand in the Republic, and the other way round.", "When that happens, calls and data can be billed as roaming, which may cost more than your normal plan.", "Some people near the border choose their network by hand to avoid surprises.", "If you enjoy strange places and facts like these, this is a good moment to subscribe, because there are more coming every day.", "Back to the island. So far you have seen a sign, a box, a clock and a phone that all get confused.", "The next one is about the shape of the Republic itself, and it looks wrong on a map.", "One whole county of the Republic is almost cut off from the rest of the country.", "Strange thing five: a county that belongs to one country but sits mostly behind another. Meet Donegal, in the north-west.", "County Donegal belongs to the Republic of Ireland, but it lies in the far north of the island.", "Northern Ireland sits right between Donegal and most of the Republic, like a wall of land.", "Look at the map and Donegal is joined to the rest of the Republic only by a narrow strip of land near the west coast.", "Drivers heading to Donegal can choose to pass through Northern Ireland, because it is often the shorter road.", "So you can leave the Republic, drive through another country, and arrive back in the Republic without showing anything.", "Remember, both sides drive on the left, so the only thing that changes along the way is the speed sign.", "Donegal also has Malin Head, the northernmost point of mainland Ireland.", "That point is in the Republic, even though it lies further north than Northern Ireland itself.", "The next one is not even on land. It is about water, and two governments have never fully agreed who owns it.", "Strange thing six: a stretch of water that two governments still do not fully agree on. It is called a lough.", "Lough is the Irish word for a lake or sea inlet, said much like the Scottish word loch.", "Two of them, Lough Foyle in the north-west and Carlingford Lough in the east, sit right on the border.", "The land border was drawn around 1921, but the line across these two loughs was never clearly settled.", "So the exact line in the water is still disputed between the United Kingdom and Ireland.", "People who fish and sail there have had to live with that grey area.", "It is a quiet disagreement, with no fences and no guards, just a line on the water that nobody has agreed on.", "Think about that: a border can be settled on land and still be unclear a few metres away in the water.", "That brings us to the biggest question of all: how do you manage a border that has almost no signs?", "The last chapter shows you the most surprising thing on this island, and it connects back to that first speed sign.", "Strange thing seven: a border with no checkpoint. The line between Northern Ireland and the Republic runs for about 500 kilometres.", "Hundreds of roads cross it, from big motorways to small country lanes between farms.", "Most of them have no guard, no barrier and no passport desk. Often, there is only a speed sign to tell you.", "That is possible because of the Common Travel Area, an arrangement between Ireland and the United Kingdom.", "It lets British and Irish citizens move, live and work in each other's countries, and it has existed for about a century.", "In the past, this border was very different. During the decades of conflict known as the Troubles, many roads had army posts and checkpoints.", "Today those posts are gone, and driving across is as simple as driving to the next town.", "Even after Brexit, when the United Kingdom left the European Union, the land border stayed open without regular passport checks.", "That is why a speed sign matters so much here. It is one of the few visible clues you will get.", "Some farms have land on both sides of the line, with a house in one country and a field in the other.", "People who live near the line can shop across it and may use two currencies, euros and pounds, in the same afternoon.", "So that is Ireland: green post boxes, a clock once 25 minutes off, phones that switch countries, and a border you can barely see.", "It is a quiet border, but it has a long story, and a speed sign is often its only signature.", "So the next time you drive down a road in Ireland and the speed sign flips from miles to kilometres, you will know why.", "Your speed sign flips from miles to kilometres on the same road, and nothing else changes. Tomorrow: another place where the map and the road disagree."], "job": ""}, {"date": "2026-11-14", "kind": "Short", "category": "geography", "title": "India's Lake With a Floating National Park", "hook": "Your boat in Manipur floats among drifting islands.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Loktak Lake in Manipur is covered in phumdis, floating mats of vegetation and soil. On them sits Keibul Lamjao, the world's only floating national park.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your boat in Manipur floats among drifting islands.", "They are called phumdis.", "Each one is a mat of living vegetation.", "They float on the water and drift around.", "One huge phumdi holds a national park.", "It is the world's only floating national park.", "Rare sangai deer live on that floating ground.", "Your boat floats beside a floating park.", "Next: a boat that seems to fly."], "job": ""}, {"date": "2026-11-14", "kind": "Short", "category": "geography", "title": "India's River So Clear Boats Seem to Fly", "hook": "Your boat in Meghalaya looks like it floats in the air.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Umngot river at Dawki, Meghalaya, is so clear that you can see the riverbed through the water. From the right angle, boats look like they are floating in mid-air.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your boat in Meghalaya looks like it floats in air.", "But that is water under it.", "The Umngot river is that clear.", "You can see every stone on the riverbed.", "The boat's shadow lies on the bottom.", "Your eyes lose track of the water surface.", "So the boat seems to hang in the air.", "Your boat floats in air, and it is water.", "Next: a post office high in the Himalayas."], "job": ""}, {"date": "2026-11-14", "kind": "Short", "category": "geography", "title": "Post a Letter From a Himalayan Village", "hook": "Your letter can be posted from 4,400 metres up.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hikkim, in Himachal's Spiti Valley, has a post office at about 4,400 metres, one of the highest in the world. People travel there just to post a letter.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your letter can be posted from 4,400 metres up.", "That is Hikkim, in Himachal's Spiti Valley.", "Its post office is among the highest in the world.", "The air up there is thin and cold.", "Still, your letter reaches any Indian address.", "Travellers climb up just to mail a postcard.", "Mountains all around, and a tiny red postbox.", "Your letter starts its trip from 4,400 metres up.", "Tomorrow: more places that feel fake."], "job": ""}, {"date": "2026-11-14", "kind": "Short", "category": "space", "title": "Your 90-day robot lasted 15 years on Mars", "hook": "Your robot built for 90 days lasted about 15 years.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "NASA's Opportunity rover was built for a 90-day mission on Mars. It landed in 2004 and kept going until 2018, helped along by wind gusts that cleaned its solar panels.\n\nSeries: If You Were in Space.", "script": ["Your robot built for 90 days lasted about 15 years.", "That robot was NASA's Opportunity rover.", "It landed on Mars in 2004.", "Dust kept covering its solar panels.", "Then Martian wind gusts blew them clean.", "It kept driving until 2018.", "It drove more than a marathon.", "Not bad for a ninety day robot.", "Tomorrow: the country that skipped a day."], "job": ""}, {"date": "2026-11-14", "kind": "Short", "category": "technology", "title": "Your smartwatch reads your pulse with light", "hook": "Your smartwatch flashes a green light at your skin.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "That green light on the back of your smartwatch is a heart rate sensor. It shines into your skin, and your blood flow changes how much light bounces back. Flip your watch over and look.\n\nSeries: Tech You Can Check.", "script": ["Your smartwatch flashes a green light at your skin.", "Flip your smartwatch over right now.", "Look at the green light on the back.", "It shines straight into your wrist.", "Your blood absorbs green light well.", "More blood flowing means less light returns.", "A sensor counts those tiny flickers.", "That flicker pattern is your pulse.", "So that green flash is counting your heartbeat.", "Tomorrow: the island where New Year starts first."], "job": ""}, {"date": "2026-11-15", "kind": "Long video", "category": "geography", "title": "7 Real Borders That Look Fake, Ending in India", "hook": "Your map once had a field of Indian land inside Bangladeshi land inside Indian land inside Bangladesh, and it was completely real.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that look fake on a map, from a fence that runs into the Pacific at Friendship Park to a field inside a field inside a field in India. Every place here is real and you can look it up on your phone. Watch to the end for the strangest border of all.\n\n#borders #geography #facts", "script": ["Your map once had a field of Indian land inside Bangladeshi land inside Indian land inside Bangladesh, and it was completely real.", "That is number one on today's list of seven borders that make no sense, and it sits right in India.", "But we start with a fence where families meet through mesh, and the border walks straight into the sea.", "Each stop gets stranger than the last, and by the end you will see why the final border is the craziest.", "These are real places on real maps, so you can check every one of them on your phone while you watch.", "We count down from seven, and seven is strange enough. Let's start with a hug through a fence.", "Seven: Friendship Park, where the United States meets Mexico beside the Pacific Ocean, near San Diego and Tijuana.", "Your hug at this fence is real, because families have stood on both sides and met through the mesh.", "The park was opened in 1971 by Pat Nixon, then the First Lady of the United States.", "She said she hoped the fence would not be there much longer, and it is still here today.", "Years ago people could touch hands through the bars. Later a fine mesh replaced them, and now it mostly allows fingertips.", "Families split by the border still come here, because it is one of the few places they can see each other.", "Access on the American side has been cut back and reopened again over the years, so the rules keep changing.", "Now look at the end of the map. The fence does not stop at the beach, it walks into the sea.", "Metal posts stand in the waves, so even the ocean has a border line you can see from the sand.", "A border you can touch with one fingertip is odd, but it is the mildest one on this list.", "Next, an American town that you can only reach by road if you drive through another country.", "Six: Point Roberts, Washington, an American town that hangs off the bottom of Canada.", "The Canada-US border follows the forty-ninth parallel, and this little peninsula sits just south of that line.", "So it is America, but the only land road to it from the rest of the United States goes through Canada.", "Residents drive north into Canada, pass a border post, cross Canadian land, then pass another post to reach mainland America.", "That means two border checks to travel between two American places, and a boat or plane is the only way around.", "When the border closed during the pandemic, the town was left in a very strange spot, and many people felt cut off.", "Many Canadians own homes there, and students are bused through Canada to reach their schools in the United States.", "All because a line on a map followed a parallel of latitude and ignored a peninsula hanging below it.", "Remember this: lines drawn with a ruler on a map never care about the ground underneath.", "Next, a German town where people spend Swiss money, and Switzerland is on almost every side.", "Five: Büsingen am Hochrhein, a German village that sits almost completely inside Switzerland.", "Look at the map and you will see a tiny German island, surrounded by Swiss land, next to the city of Schaffhausen.", "Its cars carry licence plates that begin with the letters BÜS, so you can spot a vehicle from this village on Swiss streets.", "The village is part of Germany, but it sits inside the Swiss customs area, so shops there follow Swiss rules.", "Many people there use Swiss francs for daily shopping, even though they live in Germany and Germany uses the euro.", "A few steps along the road and you pass from Germany into Switzerland without a guard or a gate.", "Why does it exist? Old agreements and centuries of deals left this village German, and nobody ever changed it.", "Locals live with two countries in one routine: a German address, Swiss money, and a Swiss town almost everywhere you look.", "If you thought that was odd, wait until you hear about a town that is Spanish but sits inside France.", "That is next, and a special road keeps it connected to Spain.", "Four: Llívia, a Spanish town sitting inside France, with French land on every side.", "In 1659 Spain and France signed the Treaty of the Pyrenees, and Spain handed over a set of villages.", "But Llívia was counted as a town, not a village, so it stayed Spanish while the villages around it became French.", "That tiny word in a treaty is the reason a Spanish town now sits in the middle of French land.", "A narrow road links it to the rest of Spain, and that road is called the neutral road.", "The road crosses French land, yet it is kept open so people can travel between the two Spanish places.", "Llívia even has a pharmacy said to be among the oldest in Europe, which visitors can see today.", "Think about that: a word in a treaty from the sixteen hundreds still decides which flag flies over a town today.", "If you like strange places like this, subscribe, because tomorrow's video will be just as strange.", "Three is where the border goes missing completely, and it happens in the middle of a lake.", "Tourists swim and sail there every summer, yet three countries have never agreed where their line runs.", "Three: Lake Constance, where Germany, Austria and Switzerland meet, and where the border is simply not agreed.", "On land, borders have posts and fences. On this lake, there is no officially agreed line in the water.", "The three countries have different ideas about it, and no treaty has ever settled the matter for the whole lake.", "Experts talk about three ideas: a line down the middle, shared ownership of the whole lake, or each country owning its shore.", "In practice, boats, ferries and fishing all work on local agreements, so daily life carries on.", "So you can sail from one country to another on this lake, and no map can tell you the exact moment you crossed.", "A border that exists on land and disappears in the water is strange, but the next one is a whole country.", "A country that fits entirely inside another country, with no sea and no neighbour except one.", "That is not a riddle. Open your map and you can find it in southern Africa.", "It is number two, and then we come back home to India for the strangest of all.", "Two: Lesotho, an entire country that is completely surrounded by South Africa.", "Every border Lesotho has is with one neighbour, so to travel anywhere abroad you must pass through South Africa first.", "Most countries have several neighbours. Lesotho has exactly one, and that border wraps all the way around it.", "It is also a mountain kingdom, with a king, a flag, its own currency and its own passport stamps.", "The country is often called the Kingdom in the Sky, because of its high mountains.", "Only a few countries in the world are fully surrounded like this, and the others are tiny European states.", "So a whole country with its own king sits in the middle of another country's map, like a hole in a doughnut.", "That is strange, but those borders at least kept one shape. The last one had a shape inside a shape inside a shape.", "And it was in India, along the Bangladesh border, in a place called Cooch Behar.", "One: the enclaves of Cooch Behar, India's strangest border, where villages of one country sat inside villages of another.", "For decades, over a hundred Indian pieces of land lay inside Bangladesh, and dozens of Bangladeshi pieces lay inside India.", "People in these pockets were often cut off from schools, markets and hospitals run by their own country.", "Then there was Dahala Khagrabari, a small farm plot, and its layers are why this one ends the list.", "It was Indian land inside a Bangladeshi plot, inside an Indian plot, inside Bangladesh. Four layers on one piece of ground.", "It was the world's only third-order enclave, and it was farmland that nobody lived on.", "In 2015 India and Bangladesh finally swapped these pockets, and the Dahala plot passed to Bangladesh.", "So the strangest border on this list is one you can no longer see on today's map, because it was finally fixed.", "So we end where we began: a field inside a field inside a field, plus a fence running into the sea.", "Next video: more places that look fake on a map, but are real. See you there."], "job": ""}, {"date": "2026-11-15", "kind": "Short", "category": "geography", "title": "Samoa deleted 30 December 2011", "hook": "Your calendar in Samoa once skipped a whole day.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On 29 December 2011 Samoa went to bed on a Thursday and woke up on Saturday. The country moved across the International Date Line to line up with Australia and New Zealand. Friday 30 December never happened there.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your calendar in Samoa once skipped a whole day.", "Thursday 29 December 2011 ended in Samoa.", "Next came Saturday the thirty-first.", "Friday simply never happened there.", "Samoa jumped across the International Date Line.", "It moved west, closer to Australia and New Zealand.", "Nobody in Samoa had a 30 December.", "Your calendar lost a whole day.", "Tomorrow: the country that sees New Year first."], "job": ""}, {"date": "2026-11-15", "kind": "Short", "category": "geography", "title": "Kiribati's islands see New Year first on Earth", "hook": "Your New Year arrives first in Kiribati.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Kiribati's Line Islands run on UTC+14, the earliest time zone on Earth. That means the New Year reaches them before anywhere else. India is about eight and a half hours behind.\n\nSeries: Places That Shouldn't Exist.", "script": ["Your New Year arrives first in Kiribati.", "Its Line Islands run on UTC plus fourteen.", "That is the earliest time zone on Earth.", "India is eight and a half hours behind.", "Kiribati was once split across two dates.", "So in 1995 it moved the date line.", "Now the whole country shares one date.", "Your New Year starts first in Kiribati.", "Tomorrow: a camera that survived Venus."], "job": ""}, {"date": "2026-11-15", "kind": "Short", "category": "space", "title": "A camera survived two hours on Venus", "hook": "Your camera on Venus would last about two hours.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 1982 the Soviet Venera 13 lander touched down on Venus and sent back the first colour photos of its surface. It survived about two hours in heat hot enough to melt lead. Engineers had only planned for around half an hour.\n\nSeries: If You Were in Space.", "script": ["Your camera on Venus would last about two hours.", "Soviet Venera 13 landed there in 1982.", "The surface is hot enough to melt lead.", "Engineers only expected about half an hour.", "It sent back the first colour photos.", "They showed an orange sky and flat rocks.", "Then the heat finally killed it.", "Those photos still exist today.", "Your camera lasted two hours on Venus.", "Tomorrow: a landing on a moon with lakes."], "job": ""}, {"date": "2026-11-15", "kind": "Short", "category": "space", "title": "Huygens landed on Titan and found a riverbed", "hook": "Your landing on Titan in 2005 showed a riverbed.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2005 the Huygens probe parachuted onto Saturn's moon Titan and photographed the surface. The pictures showed rounded pebbles and channels that look like a dry riverbed. Titan has lakes of liquid methane.\n\nSeries: If You Were in Space.", "script": ["Your landing on Titan in 2005 showed a riverbed.", "A probe parachuted onto Saturn's moon.", "It was called Huygens.", "Its camera showed round pebbles on the ground.", "Round pebbles mean liquid once flowed there.", "It also saw channels like a riverbed.", "Titan has lakes of liquid methane.", "It is the farthest landing from Earth.", "Your riverbed on Titan was real.", "Tomorrow: another fact that sounds fake."], "job": ""}, {"date": "2026-11-15", "kind": "Short", "category": "technology", "title": "Your Brain Can Move a Computer Cursor", "hook": "Your brain can move a computer cursor without your hand.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Neuralink patients with paralysis have moved a computer cursor using only their thoughts, shown in public demo videos. A tiny implant reads brain signals and tu
