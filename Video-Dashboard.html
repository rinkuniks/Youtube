 a chilli that works like a weapon. The other is a battle fought over a tennis court.", "Nagaland has a chilli that once held the world record for the hottest on Earth.", "It is the bhut jolokia, and Guinness certified it in 2007 at over a million Scoville units.", "The green chilli in your kitchen is only a small fraction of that heat.", "India's defence research lab even looked at it for chilli grenades, meant to control crowds without bullets.", "Now the war story. In April 1944, in Kohima, soldiers fought a battle across a tennis court.", "The court belonged to the British deputy commissioner's bungalow, and the two sides fought over it only metres apart.", "It is now remembered as the Battle of the Tennis Court, and the court's outline is marked inside the Kohima war cemetery.", "Kohima is seen as a turning point of the war in Asia, because the Japanese advance into India was stopped there.", "In 2013, Britain's National Army Museum voted Kohima and Imphal the greatest battle Britain ever fought.", "A memorial there carries these words: 'When you go home, tell them of us, and say,", "for your tomorrow, we gave our today.' It is carved in stone above the graves.", "You have now seen a floating park and a tennis court war. The last stop beats both.", "Last stop, the one I promised: Longwa village, in Mon district, home of the Konyak Naga people.", "Their grandfathers were headhunters. That stopped decades ago, but some elders still wear tattoos on their faces.", "Today they are known for hospitality, hornbill-feather headgear, and one very unusual line on the map.", "The village sits high on a ridge, with Myanmar's hills rolling out behind it.", "The India-Myanmar border runs right through Longwa. A boundary pillar marks it, and people stand with one foot on each side.", "The village chief is called the Angh. His large wooden house sits right on that line.", "So one part of the house is in India, and another part is in Myanmar.", "Locals say the chief can eat in one country and sleep in the other, with no passport check inside his own home.", "In a house like that, a bed can sit on one side of the line, and the kitchen on the other.", "The villagers also hold citizenship of both sides, so they are Indian and Myanmar citizens at once.", "Many families have members on each side, and people cross for farming, for weddings, and for work.", "Under a free movement arrangement, people living near the border have been able to cross a short distance without a visa.", "Both sides also share one language, Konyak, and one way of life, from long before any line was drawn.", "The line was drawn on a map, and it cut through Konyak land without asking the people who lived there.", "In a way, the people did not cross the border. The border crossed them.", "Visitors can walk the village lanes, see the chief's house, and meet elders who remember the old days.", "That may change. India has announced plans to fence the border and end free movement, and Naga groups have objected.", "So the open, shared life of Longwa may look different soon.", "Think back through the list. A thin strip of land holds a whole region to the country.", "A tea garden clock runs an hour ahead. A river keeps an island shrinking, and a lake carries a park.", "Roots become bridges, and a tennis court became a battlefield.", "And in Longwa, a chief's home sits across two countries, with villagers who hold citizenship of both.", "Tomorrow: the countries that sit completely inside another country. And remember, in Longwa your bed can sit in India and Myanmar at once."], "job": ""}, {"date": "2026-12-04", "kind": "Short", "category": "geography", "title": "Midnight on Your Clock, Sun in the Sky", "hook": "Your clock says midnight, and the sun is up.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In Tromsø, Norway, the sun does not set for roughly two months in summer. The city sits north of the Arctic Circle, and Earth's tilt keeps it facing the sun. Midnight can look like noon.\n\n#Shorts #MidnightSun #Norway", "script": ["Your clock says midnight, and the sun is up.", "This is Tromsø, in Norway.", "For roughly two months, it never sets.", "No sunset, no dark sky, no night.", "Locals can hike in daylight at midnight.", "Tromsø sits north of the Arctic Circle.", "Earth's tilt keeps it facing the sun.", "Midnight on the clock, daylight in the sky.", "Tomorrow: a waterfall that bleeds."], "job": ""}, {"date": "2026-12-04", "kind": "Short", "category": "geography", "title": "Antarctica Has a Blood-Red Waterfall", "hook": "Your hike in Antarctica ends at a blood-red waterfall.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Blood Falls flows out of the Taylor Glacier in Antarctica's McMurdo Dry Valleys. The red colour comes from iron in very salty water that rusts when it meets air. It looks like bleeding ice, but it is not blood.\n\n#Shorts #BloodFalls #Antarctica", "script": ["Your hike in Antarctica ends at a blood-red waterfall.", "It flows out of the Taylor Glacier.", "It looks like the ice is bleeding.", "But it is not blood.", "Salty water trapped under the glacier has iron.", "When that iron meets air, it rusts.", "Rusty red water spills onto white ice.", "The place is called Blood Falls.", "Antarctica really has a blood-red waterfall.", "Tomorrow: a country wider than the Moon."], "job": ""}, {"date": "2026-12-04", "kind": "Short", "category": "geography", "title": "Australia Is Wider Than the Moon", "hook": "Your map shows Australia is wider than the Moon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Australia is about 4,000 km from east to west. The Moon is about 3,474 km across. So the whole Moon would fit inside the width of one country.\n\n#Shorts #Australia #MoonFacts", "script": ["Your map shows Australia is wider than the Moon.", "Australia is about four thousand kilometres across.", "That is east to west.", "The Moon is about 3,474 kilometres wide.", "So the Moon would fit with room spare.", "Picture the Moon lying across Australia.", "Perth to Sydney is a very long flight.", "The Moon would fit inside its width.", "Tomorrow: a spoonful weighing a billion tonnes."], "job": ""}, {"date": "2026-12-04", "kind": "Short", "category": "space", "title": "A Teaspoon of Neutron Star Weighs a Mountain", "hook": "Your teaspoon would weigh about a billion tonnes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A neutron star is a collapsed dead star squeezed to about the size of a city. A teaspoon of its material would weigh about a billion tonnes. That is a hill's worth of rock on one spoon.\n\n#Shorts #NeutronStar #SpaceFacts", "script": ["Your teaspoon would weigh about a billion tonnes.", "That is if it were neutron star.", "Imagine the spoon next to a mountain.", "Matching it takes a whole hill of rock.", "A neutron star is a collapsed dead star.", "Its matter is crushed incredibly tight.", "A star squeezed to the size of a city.", "Your tiny spoon, carrying a hill's weight.", "Tomorrow: a post office built by a robot."], "job": ""}, {"date": "2026-12-04", "kind": "Short", "category": "technology", "title": "India's Post Office Printed by a Robot", "hook": "Your post office was printed by a robot.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Cambridge Layout post office in Bengaluru was built using a 3D-printing robot. Look closely at the footage and you can see the printed layers in the walls. It is a working post office, not a model.\n\n#Shorts #3DPrinting #Bengaluru", "script": ["Your post office was printed by a robot.", "This one is in Bengaluru's Cambridge Layout.", "A robot laid the walls layer by layer.", "Look closely and you can see the layers.", "Concrete comes out of a nozzle.", "It's India's first 3D-printed post office.", "Yes, you can post letters inside.", "A robot built your post office.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-12-05", "kind": "Long video", "category": "geography", "title": "7 Real Borders That Look Fake (Last One Is Indian)", "hook": "Your map hides a border where Indian land sits inside Bangladeshi land, inside Indian land, inside Bangladesh.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that look like mistakes on the map, starting with the cleared six-metre strip along the US-Canada border and ending with India's stacked enclaves in Cooch Behar. You will see Point Roberts, Kaliningrad, Llivia, Lake Constance and the rented rocket city of Baikonur on the way. Every place here is real and every fact is checked.\n\n#borders #geography #mapfacts", "script": ["Your map hides a border where Indian land sits inside Bangladeshi land, inside Indian land, inside Bangladesh.", "That place was real until 2015, and by the end of this video, you will see exactly how it worked.", "Before that, six more borders that look like mistakes. Each one is stranger than the one before it.", "Some are cut into forests, some sit inside other countries, and one is rented out so rockets can fly.", "Every place here is real, and the facts are checked. If a line sounds fake, remember that borders are made by people.", "We start at number seven, with a border that somebody trims like a hedge.", "Seven: a border so long that a whole team is paid to keep it visible.", "Open a satellite map over the forests between the United States and Canada, and zoom in until the trees get sharp.", "You will see a thin straight cut running through the woods, over hills, and even up mountain slopes.", "That strip is the border, and it is kept clear by the International Boundary Commission, run jointly by both countries.", "The cleared line is about six metres wide, wide enough that you can spot it from the air.", "Along it stand markers, stone and metal posts, so nobody has to guess where one country stops and the next begins.", "Trees keep growing, so if nobody cuts them, the line would slowly vanish into the forest.", "So crews go back and clear it again. A border here is not a line you draw once, it is a chore.", "This is the longest border between two countries anywhere in the world, and it needs a gardener.", "A border you can see from the air is odd. But the next one cuts a piece of America away from America.", "Six: a piece of the United States that you can only reach by road through Canada.", "It is called Point Roberts, a small tip of Washington state that hangs off the coast south of Vancouver.", "In 1846, a treaty drew the border along a straight line of latitude, the forty-ninth parallel.", "That straight line sliced across a peninsula, and the tip ended up American while everything above it stayed Canadian.", "So to drive from Point Roberts to the rest of its own country, you must enter Canada first.", "Then you drive through Canadian roads, and cross again at another checkpoint to get back into the United States.", "Think of living where reaching the rest of your own state means two border crossings.", "Nobody planned this. A treaty wanted a neat straight line, and the people at the tip were an afterthought.", "Maps love straight lines. Real life does not, and Point Roberts is what happens when the two clash.", "Next, a border that leaves a whole piece of Russia surrounded by European Union countries and the sea.", "Five: a Russian region that does not touch the rest of Russia.", "It is called Kaliningrad, on the Baltic Sea coast, with Poland on one side and Lithuania on the other.", "Between it and the main part of Russia lie other countries, so it sits like an island, only on land.", "Before 1945, this area was part of Germany, and its main city was called Konigsberg.", "After the Second World War, it was handed to the Soviet Union, and the city was renamed Kaliningrad.", "In 1991, the Soviet Union broke apart, and the countries between Kaliningrad and Russia became independent nations.", "Overnight, a Soviet region turned into a Russian pocket, with new borders around it that it never had before.", "To travel from Kaliningrad to the rest of Russia by road or rail, you have to cross foreign territory.", "It also holds important Russian naval ports on the Baltic, which is why this odd shape matters to the world.", "That is a lot of history on a single map. But our next border hides around one small town in the Pyrenees.", "Four: a Spanish town that sits completely inside France, with no Spanish land touching it.", "It is called Llivia, up in the Pyrenees mountains, and it is surrounded by French land on every side.", "The story goes back to a treaty in 1659, when Spain gave France a group of villages.", "Llivia was not a village, it was a town, so the treaty never handed it over.", "Because of that small word, the town stayed Spanish, while the land around it became French.", "A short road links Llivia to Spain, and that road is treated as neutral ground.", "So when you drive to Llivia from Spain, French land lies on both sides of the road.", "Today both countries are in the European Union, so you can cross without any passport check.", "If you like strange places and facts like these, subscribe, because there are many more coming.", "Now, number three has no clear border at all, and it is a place you can swim in.", "Three: a lake with three countries around it, and no agreed border across the water.", "It is Lake Constance, called the Bodensee in German, and Germany, Austria and Switzerland all touch its shores.", "On land, borders are easy: you can put a fence, a post or a stone. Water makes that hard.", "Across the open water of the lake, the three countries have never agreed on an official dividing line.", "Different countries have argued for different ideas, such as splitting it by lines or treating the lake as shared.", "So if you look at a map, the lake often shows no border line at all in the middle.", "Meanwhile, ferries, fishing boats and tourists sail across it every day, mostly without anyone worrying about it.", "Rules for fishing and boating are handled by agreements between neighbours, not by a line on the water.", "It is an odd lesson: some borders are so hard to draw that people simply carry on without one.", "But our next border is not missing. It is rented, and it is where space travel began.", "Two: a city in Kazakhstan that is run by Russia, so it can launch rockets.", "It is Baikonur, in the deserts of Kazakhstan, and it is the home of the world's first space launches.", "In 1957, Sputnik, the first satellite ever sent into orbit, lifted off from here.", "In 1961, Yuri Gagarin became the first human in space, and he also started his flight at Baikonur.", "Today the land is not owned by Russia. Kazakhstan leases the cosmodrome and the city to Russia.", "That lease runs until 2050, and Russia administers the city of Baikonur itself.", "So you have a Russian-run city in the Kazakh desert, with its own rules, built around rocket launches.", "Indian viewers have a link here too. In 1984, Rakesh Sharma flew to space from this very site.", "He rode a Soviet rocket to the Salyut 7 station and became the first Indian in space.", "Space begins on a rented plot of land. And our final border has the strangest ownership of all.", "One: India's strangest border, where land was stacked inside land, like a set of boxes.", "Go to Cooch Behar in West Bengal, near the Bangladesh border, and look at the old map.", "Before 2015, the border there was a mess of small pockets of Indian land inside Bangladesh, and the reverse.", "These pockets are called enclaves. There were one hundred and eleven Indian ones inside Bangladesh, and fifty-one Bangladeshi ones inside India.", "Stories say it began with old kings trading land centuries ago, though historians still debate the details.", "When the countries were divided in 1947, those pockets stayed where they were, cut off by foreign soil.", "People living inside them were stuck. To reach a school, a hospital or a market, they had to cross into another country.", "Then there is the strangest one of all, called Dahala Khagrabari, which sat at the very centre of the puzzle.", "It was Indian land, inside a Bangladeshi pocket, inside an Indian pocket, inside Bangladesh. That is four layers.", "It is often described as the only place of its kind in the world.", "In 2015, India and Bangladesh finally swapped the pockets. At midnight on 31 July, the old enclaves ended.", "Residents could choose which country to belong to, and many finally got an address that made sense.", "So that is the answer to the hook. Indian land could sit inside Bangladesh, inside India, inside Bangladesh.", "From a six-metre cut in a forest to a nest of enclaves, borders are only lines people agreed on.", "And where people disagree, or forget, the map gets very strange indeed.", "Tomorrow: the roads where your phone cannot decide which country you are in."], "job": ""}, {"date": "2026-12-05", "kind": "Short", "category": "geography", "title": "Your map shows 3 capitals in one country", "hook": "Your map of South Africa shows three capitals.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "South Africa has three capital cities, and each one holds a different branch of government. Pretoria is the executive capital, Cape Town is the legislative capital, and Bloemfontein is the judicial capital. Places That Shouldn't Exist, part of our daily series.\n\n#Shorts #SouthAfrica #Geography", "script": ["Your map of South Africa shows three capitals.", "Pretoria is where the government runs.", "Cape Town is where parliament meets.", "Bloemfontein holds the top appeals court.", "Three cities, three branches of power.", "Most countries keep all three in one city.", "South Africa spread them across the country.", "Each city holds a different piece of power.", "So your map shows three capitals.", "Tomorrow: a rocket pad Russia rents."], "job": ""}, {"date": "2026-12-05", "kind": "Short", "category": "geography", "title": "Russia pays rent to launch its rockets", "hook": "Your rocket lifts off from rented land.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Baikonur Cosmodrome sits inside Kazakhstan, but Russia leases it, and the lease runs until 2050. Yuri Gagarin launched from here in 1961, and India's Rakesh Sharma flew from here in 1984. Places That Shouldn't Exist.\n\n#Shorts #Space #Geography", "script": ["Your rocket lifts off from rented land.", "Baikonur sits inside Kazakhstan, not Russia.", "Russia leases the whole cosmodrome.", "That lease runs until 2050.", "Yuri Gagarin launched from here in 1961.", "India's Rakesh Sharma flew from here in 1984.", "Soyuz crews still leave from this rented ground.", "Your rocket launches from land Russia rents.", "Tomorrow: ice on the hottest planet's neighbour."], "job": ""}, {"date": "2026-12-05", "kind": "Short", "category": "space", "title": "Mercury hits 430°C and still has ice", "hook": "Your Mercury noon would hit about 430 degrees.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Daytime on Mercury reaches about 430 degrees Celsius, yet the planet has water ice. It sits in permanently shadowed craters near the poles, where sunlight never reaches. Radar images from Earth showed bright patches there, and a NASA probe later backed it up.\n\n#Shorts #Space #Mercury", "script": ["Your Mercury noon would hit about 430 degrees.", "Yet Mercury has real ice.", "It hides in craters at the poles.", "Sunlight never reaches the crater floors.", "Radar from Earth showed bright patches there.", "A NASA probe later backed it up.", "Hot enough to melt lead, yet ice survives.", "Same planet: baking heat and frozen ice.", "Tomorrow: a sunrise that runs backwards."], "job": ""}, {"date": "2026-12-05", "kind": "Short", "category": "space", "title": "On Mercury, the Sun rises, then backs up", "hook": "Your sunrise on Mercury can run backwards.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At certain spots on Mercury, the Sun rises, stops, slides back toward the horizon, then rises again. It happens because Mercury's orbit speed beats its slow spin when it is closest to the Sun. If you watch an animation of the Sun's path, you can see it.\n\n#Shorts #Space #Mercury", "script": ["Your sunrise on Mercury can run backwards.", "The Sun rises above the horizon.", "Then it stops and slides back down.", "Then it climbs back up again.", "Mercury orbits fast but spins slowly.", "Close to the Sun, its orbit outruns its spin.", "That makes the Sun appear to reverse.", "It only happens at certain spots.", "Sunrise, backwards, then forwards again.", "Tomorrow: a rocket engine printed in one piece."], "job": ""}, {"date": "2026-12-05", "kind": "Short", "category": "technology", "title": "India launched a rocket with a printed engine", "hook": "Your rocket engine can be one single 3D-printed piece.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "India's Agnikul builds rocket engines that are 3D-printed as a single piece. Its Agnibaan SOrTeD flew in 2024 from Agnikul's own private launchpad at Sriharikota. A rocket engine that starts as a printer file is now a real launch.\n\n#Shorts #Technology #ISRO", "script": ["A rocket engine can be one 3D-printed piece.", "India's Agnikul built exactly that.", "Printed as one piece, with no assembly.", "Its rocket Agnibaan SOrTeD flew in 2024.", "It launched from Sriharikota.", "From Agnikul's own private launchpad.", "A private pad, built by a private company.", "The engine started as a printer file.", "One printed piece, now flying.", "Tomorrow: a capital city cut in two."], "job": ""}, {"date": "2026-12-06", "kind": "Long video", "category": "geography", "title": "Why the US-Canada Border Is Stranger Than You Think", "hook": "Your satellite view of the US-Canada border shows a scar, a strip only six metres wide, cut through forest and mountain.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The US-Canada border is kept visible by a six-metre cleared strip, and it hides places that sound fake but are true: a town you can only reach through Canada, a city where you drive south into Canada, and a piece of Minnesota left behind by a wrong map. Watch to the end for the strangest one.\n\n#geography #borders #facts", "script": ["Your satellite view of the US-Canada border shows a scar, a strip only six metres wide, cut through forest and mountain.", "That scar is the border between the United States and Canada. It is real, and people keep it clear with saws.", "By the end, you will see a town you can only reach through Canada, and a city where you drive south to enter Canada.", "You will also see a park where families met when the border was closed, and a piece of America left behind by a wrong map.", "Seven strange facts, and each one is stranger than the last. The final one starts with a mapmaker's mistake.", "Let's start with that scar on the map, because somebody has to keep it clean.", "Fact one: this border has caretakers. They belong to a group whose only job is keeping a line visible.", "It is called the International Boundary Commission, with people from both Canada and the United States, set up under a treaty in 1908.", "They keep a strip about six metres wide cleared along the border, so anyone can see exactly where the line runs.", "That is about three metres on each side of the line, through thick forest, over mountain ridges and across open farmland.", "Crews cut back the trees and brush, and from the air it looks like a straight cut drawn across the wilderness.", "Along the strip stand markers made of stone, metal and concrete, so nobody can say they did not know where the line was.", "Much of the western border follows the 49th parallel, a line of latitude that mathematicians drew on a globe.", "Alaska's eastern edge follows a line of longitude instead, the 141st meridian, running north all the way to the Arctic Ocean.", "So a line drawn on a globe becomes a real strip in a real forest, and the trees keep trying to grow back.", "And that is the quiet part. Next, a city where you drive south to enter Canada.", "Fact two: there is a place where you drive south from America to reach Canada, and it is not a mistake.", "Stand in Detroit, Michigan, and look across the river. The city you see is Windsor, in Ontario, Canada.", "Windsor sits south of Detroit. Cross the Ambassador Bridge or take the tunnel, and you head south into another country.", "Most people picture Canada straight up north from America. Here, the map bends the other way and the compass looks wrong.", "The reason is the river. The Detroit River twists around, and the border follows the middle of the water.", "Many people cross here every day for work, shopping and hockey games, and the trucks never really stop.", "The Ambassador Bridge is one of the busiest crossings between the two countries, carrying car parts and goods all day.", "So if your GPS says head south to Canada, it is not broken. It is just the map.", "Now, a border does not always have to stop you. Sometimes it can feel like a handshake.", "The next place goes further. There, the border is a park where you can stand in both countries at once.", "Fact three: a park where the border is a line in the grass, and where families met when the border was shut.", "It is called Peace Arch Park, between Blaine in Washington state and Surrey in British Columbia.", "A white arch was built right on the line in 1921, to celebrate the peace between the two countries since the War of 1812.", "Walk in from either side, wander across the gardens, and you can stand with one foot in each country.", "There is one rule. You cannot walk on into the other country; you have to leave the way you came.", "In 2020, when the border was closed for COVID, the park stayed open, and it became a place to meet.", "Families split by the closure met on the grass, each person on their own side, for the first time in months.", "There is no wall in the middle. Just flowers, a few markers and an arch with a message about peace.", "That is a border at its friendliest. Now, a town that is American but has no road to America.", "Fact four: Hyder, Alaska, a tiny American town at the end of a road that only goes through Canada.", "You cannot drive to Hyder from the rest of Alaska. The only road in comes from Stewart, in British Columbia.", "Drive from Stewart into Hyder, and there is no American checkpoint waiting for you. You simply roll in.", "The checkpoint is Canadian, and you meet it when you leave Hyder. The check happens on the way out.", "That is the reverse of what you expect: the country you are leaving is the one that stops you.", "If you enjoy strange places like this, subscribe, because there is a new map that sounds fake but is true every day.", "Hyder is the kind of place where the map says one thing and the only road says another.", "The town leans on Stewart, the Canadian town next door, for supplies and services, even though it flies an American flag.", "Stay with me, because the next place has a river, three jurisdictions, and people who were here first.", "Fact five: a community that lived here long before any border, and a line that now runs through the middle of it.", "Akwesasne is a Mohawk territory on the St. Lawrence River, where New York, Ontario and Quebec all meet.", "The Mohawk people lived here long before either country existed, and they see their home as one place, not two.", "But on the map the territory is cut up: part in the United States, part in Canada, divided by an international line.", "That means ordinary things, like visiting family, can involve crossing a border that nobody in the community asked for.", "Mohawk leaders have long argued that people of this land should be able to move across it freely.", "It is a reminder that every line on a map was drawn over a place where people already lived.", "India knows this feeling too, where lines drawn on maps have split villages and families.", "The next two places exist because of the shape of the map. And the last one exists because of a mistake.", "Fact six: Point Roberts, Washington, an American town on a tiny hook of land cut off from America.", "The border follows the 49th parallel, but that line slices through a peninsula, leaving its tip on the American side.", "So the tip belongs to the United States, but the rest of Washington state is far away by land.", "To drive to the rest of Washington, you leave Point Roberts, cross into Canada, then cross the border again back into America.", "Two border checks just to drive home. People who live there plan their trips around the lines and the wait times.", "The cause is a treaty in 1846 that chose the 49th parallel as the border, using a ruler line with no thought for the coastline.", "The treaty makers drew the line on a map, and the land beneath it simply followed whatever the ruler said.", "That one line decided who would own the tip of a peninsula, without anyone really noticing at the time.", "The last place has the same problem, but bigger, and it comes from a map that was simply wrong.", "Fact seven: the Northwest Angle, a piece of Minnesota sitting north of the 49th parallel, surrounded by Canada and water.", "It is the northernmost point of the lower forty-eight states, a part of America above the line that should mark its edge.", "By road, you can only reach it through Manitoba in Canada. Otherwise, you cross Lake of the Woods by boat.", "So to drive from Minnesota to this part of Minnesota, you have to pass through another country first.", "How did this happen? In 1783, the people writing the peace treaty used a map, and the map was wrong.", "They believed the Mississippi River started farther north, and they wrote the border to run to that point.", "The river did not start where the map said, so the line got caught in a strange corner of land and water.", "Later agreements fixed most of the line, but this small angle of land stayed on the American side.", "One mistaken map in 1783, and today a piece of America is a Canadian road trip away.", "So back to the scar: a six-metre strip in the forest, kept clear so two countries never argue about where the line is.", "Every strange thing we saw today came from lines drawn by hand, on maps that were sometimes wrong.", "Next in this series: Why Japan Is Stranger Than You Think. Same rules: strange, but true."], "job": ""}, {"date": "2026-12-06", "kind": "Short", "category": "geography", "title": "You can walk across the last divided capital", "hook": "Your walk through Nicosia can cross a border.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Nicosia, the capital of Cyprus, is the last divided capital in the world. A UN buffer zone runs through the city, and you can see the barriers on the streets. Berlin was once split too, but it reunited, and Nicosia is still divided.\n\n#Shorts #Cyprus #Geography", "script": ["Your walk through Nicosia can cross a border.", "Cyprus's capital is split in two.", "A UN buffer zone runs through the city.", "Barriers block some of the streets.", "You can still cross on foot at Ledra Street.", "Nicosia is the last divided capital in the world.", "Berlin was divided too, but it reunited.", "Nicosia is still split today.", "So your walk crosses a divided capital."], "job": ""}, {"date": "2026-12-06", "kind": "Short", "category": "geography", "title": "One Room That Sits in Two Countries", "hook": "Your next step can cross into North Korea.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On the Panmunjom tour, blue huts sit right on the line between North and South Korea. Inside the meeting room, you can stand on both sides of the border. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Geography #Korea", "script": ["Your next step can cross into North Korea.", "It happens inside a small blue hut.", "The hut sits right on the border.", "Microphone wires on the table mark the line.", "Stand on one side, you're in South Korea.", "Walk around the table, and you're in North.", "Soldiers stand guard inside the room.", "One room, two countries, one tour.", "Tomorrow: a city carved from stone."], "job": ""}, {"date": "2026-12-06", "kind": "Short", "category": "geography", "title": "The Jordan Building Carved Into a Cliff", "hook": "Your first view of Petra is a carved cliff.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Petra's famous Treasury was carved straight into rose-red sandstone cliff by the Nabataeans. Much of the whole city was cut from rock, which is why it is nicknamed the Rose City. Part of the series Places That Shouldn't Exist.\n\n#Shorts #Petra #Jordan", "script": ["Your first view of Petra is a carved cliff.", "This giant building was never stacked.", "It is called the Treasury.", "The rock glows rose red in sunlight.", "Nabataean people carved it in Jordan's desert.", "They carved much of a city from stone.", "Tombs, temples and houses, all cut from rock.", "Petra is nicknamed the Rose City.", "Not built. Carved from one cliff.", "Tomorrow: a moon painted two colours."], "job": ""}, {"date": "2026-12-06", "kind": "Short", "category": "space", "title": "Saturn's Moon: Coal Black and Snow White", "hook": "Your trip to Saturn would show a two-toned moon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Iapetus, a moon of Saturn, is dark on one side and bright on the other. Cassini photos show it clearly, along with a huge ridge running around its equator that makes it look like a walnut. Part of the series If You Were in Space.\n\n#Shorts #Space #Saturn", "script": ["Your trip to Saturn would show a two-toned moon.", "One side is dark as coal.", "The other side is bright as snow.", "This moon is called Iapetus.", "Cassini photographed it up close.", "A huge ridge circles its equator.", "It makes the moon look like a walnut.", "Black on one side, white on the other.", "A two-toned walnut orbiting Saturn.", "Tomorrow: a train with nobody driving."], "job": ""}, {"date": "2026-12-06", "kind": "Short", "category": "technology", "title": "Delhi's Metro Line With No Driver", "hook": "Your Delhi Metro train can run with no driver.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Delhi Metro's Magenta Line runs driverless trains. With no driver's cabin, passengers can stand at the front window and watch the tunnel rush toward them. It runs from Janakpuri West to Botanical Garden.\n\n#Shorts #DelhiMetro #Technology", "script": ["Your Delhi Metro train can run with no driver.", "This is the Magenta Line.", "It runs driverless trains.", "Automated systems run it, not a person.", "So there is no driver's cabin.", "Passengers can stand at the front window.", "You watch the tunnel rush toward you.", "It runs from Janakpuri West to Botanical Garden.", "Yes, your Delhi Metro can drive itself.", "Tomorrow: hills that look like chocolate drops."], "job": ""}, {"date": "2026-12-07", "kind": "Long video", "category": "geography", "title": "7 Real Borders Stranger Than Fiction", "hook": "Your home address could once have been India, inside Bangladesh, inside India, inside Bangladesh.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that make no sense, from an American town you can only reach through Canada to a Korean war zone that became a wildlife haven. The last one is in India, where a single field once sat four layers deep inside two countries. Watch to the end to see how it was finally fixed.\n\n#borders #geography #india", "script": ["Your home address could once have been India, inside Bangladesh, inside India, inside Bangladesh.", "That place is number one on today's list of seven borders that make no sense.", "Before it, you will see an American town you can only reach through Canada, and a runway that stops traffic.", "You will also see a war zone that became a wildlife haven. The last border is in India.", "Quick promise: by the end, you will see why India wins this list by a mile.", "Every one of these is real, and each is stranger than the one before. Let's start.", "Number seven. Your drive home can cross two international borders, and you never leave your own country.", "Point Roberts is a small piece of Washington state in the USA, hanging off the bottom of Canada's British Columbia.", "The border follows the 49th parallel, and this tip of land fell just south of it. So it belongs to America.", "But no road inside America reaches it. To get there by land, you must drive into Canada, then back out again.", "That means a passport check going in, and another one coming out, just to reach a town that is American.", "The reason is a straight line drawn on a map long ago, with no thought for the land underneath it.", "For the people who live there, it is just how the road works.", "A pen stroke left an American town stuck on a Canadian peninsula. Easy so far. Number six is weirder.", "Number six. There is a Spanish town sitting fully inside France, and it has been that way for centuries.", "It is called Llivia, in the Pyrenees mountains, and French land surrounds it on every side.", "In 1659 a treaty gave France a set of villages. But Llivia was officially a town, not a village, so it stayed Spanish.", "One legal word, and a town stayed trapped inside another country. That tiny technical detail is the whole reason.", "A short road links it to Spain, and that road is treated as a special corridor.", "You can walk its streets, and a museum in the town tells the story of its strange position.", "Spanish streets, Spanish shops, and French fields on every side. Now let's go where a border meets an airport runway.", "Number five. Imagine walking out of a country on foot, and a plane landing right in front of you.", "That is Gibraltar, a British territory on Spain's southern tip. The road into town crosses the airport runway itself.", "When a plane lands or takes off, barriers come down, and cars, bikes and people simply wait. A red light for airplanes.", "Then the barrier goes up, and everyone walks across the same strip of tarmac where a jet touched down minutes ago.", "Spain disputes who owns the land under that runway, so the whole crossing sits on an argument over the border.", "You also pass border officers on the way in and out, so you cross a country line and an airfield together.", "A border, a runway and a traffic light in one spot. Next, a region cut off from its own country.", "Number four. There is a part of Russia that you cannot reach from Russia without leaving Russia.", "It is called Kaliningrad, on the Baltic Sea, squeezed between Poland and Lithuania. The rest of Russia is far away.", "Before 1945 it was the German city of Königsberg. After the Second World War, the Soviet Union took it over.", "Then the Soviet Union broke up, and Lithuania and others became independent countries. That left Kaliningrad cut off from the mainland.", "Now trains from mainland Russia must pass through Lithuania, and travellers need special transit documents.", "Imagine a state of India you could only visit by passing through another country. That is Kaliningrad's situation for Russia.", "And this is not a village. It is a whole region with a major seaport on the Baltic coast.", "Cut off by land and joined only by paperwork. Number three uses two currencies on the same street.", "Number three. There is a German town where shops take Swiss francs, and cars carry a special number plate.", "It is called Büsingen, and Switzerland surrounds it completely. You cannot reach it from Germany without crossing Swiss land.", "It is German, but it sits inside the Swiss customs area, so Swiss francs and euros are both part of daily life.", "Think of paying for chai in euros in one shop, and in francs in the next.", "Its cars even carry their own letters, BÜS, so a number plate alone tells you it is this one odd little town.", "Residents can vote in German elections, yet their daily life is wired to Switzerland.", "German citizens in a place that works a lot like Switzerland. A border that is real, but easy to forget.", "If you enjoy strange places like these, subscribe, because the last two are the ones people send to their friends.", "And number two is not a village or a town. It is a strip of land where a war is still on paper.", "Number two. A war zone that turned into one of the best wildlife havens you can see on a satellite map.", "It is the Korean DMZ, the demilitarised zone between North Korea and South Korea. It is about four kilometres wide.", "It was drawn in 1953, when the Korean War ended with a ceasefire. A full peace treaty never followed.", "Both sides keep soldiers close, and parts of the ground are mined. So for decades almost nobody has lived or farmed here.", "And that is the twist. With people gone, nature moved in. The most guarded strip of land became a quiet green corridor.", "Rare birds live there, including cranes, the tall white birds that Koreans see as a symbol of long life.", "Look at it on a satellite image and you can see a green belt cutting across the peninsula between two countries at odds.", "Barbed wire and watchtowers on both sides, and in the middle, birds that do not know there is a border.", "Many conservationists now call it an accidental nature reserve, and hope it is protected for good.", "One of the most tense borders on Earth is also a nature reserve by accident. Now, number one, in India.", "Number one. This is the border from the start of the video, and it is the strangest border story on the list.", "Along the India and Bangladesh border, there were small islands of land belonging to the other country.", "The area is Cooch Behar, in the north of West Bengal, not far from Assam and Bhutan.", "Indian villages stood inside Bangladesh, and Bangladeshi villages stood inside India. These pockets are called enclaves.", "Residents were cut off from their own country, and many struggled to get basic services like roads, schools and electricity.", "One patch, Dahala Khagrabari, was Indian land inside Bangladeshi land, inside Indian land, inside Bangladesh.", "Four layers of borders in one small field. It was known as the world's only enclave of that kind.", "People lived in these pockets for decades, holding the citizenship of a country they could barely reach.", "Finally, on the night of 31 July 2015, India and Bangladesh began swapping the enclaves. By midnight, 1 August, it was official.", "India handed over 111 enclaves to Bangladesh, and received 51 in return. Residents could choose which country to live in.", "After decades in limbo, thousands of people finally got a country with an address, roads and a government.", "So the address from the start of this video was real. A map once had India inside Bangladesh inside India inside Bangladesh.", "These leftovers came from old land deals between local rulers, which were never tidied up when later borders were drawn.", "It took until 2015 to fix them, and it is remembered as a rare, peaceful border swap.", "So yes, your address really could have been India inside Bangladesh inside India inside Bangladesh.", "Next video: more places where the map and the ground disagree."], "job": ""}, {"date": "2026-12-07", "kind": "Short", "category": "geography", "title": "The Philippines Hills That Turn Chocolate", "hook": "Your photo here shows over 1,200 green mounds.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Chocolate Hills on Bohol island in the Philippines are more than 1,200 grass-covered mounds. In the dry season the grass turns brown, and the hills look like chocolate drops. Part of the series Places That Shouldn't Exist.\n\n#Shorts #ChocolateHills #Philippines", "script": ["Your photo here shows over 1,200 green mounds.", "They are the Chocolate Hills, Philippines.", "Every mound is covered in grass.", "Each one is a rounded, cone-shaped hill.", "In the dry season, they turn brown.", "Then they look like chocolate drops.", "They are spread across Bohol island.", "Green hills, then chocolate hills, same place.", "Tomorrow: a mountain taller than Everest."], "job": ""}, {"date": "2026-12-07", "kind": "Short", "category": "geography", "title": "The Mountain Taller Than Everest", "hook": "If you measure from the base, Everest loses.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Measured from its base on the seafloor, Hawaii's Mauna Kea is about 10,200 metres tall, taller than Everest. Only about 4,200 metres of it rises above sea level, so most of the mountain is underwater. Part of the series Places That Shouldn't Exist.\n\n#Shorts #MaunaKea #Geography", "script": ["If you measure from the base, Everest loses.", "The winner is Mauna Kea in Hawaii.", "It is about 10,200 metres tall.", "Everest stands about 8,850 metres above sea level.", "But Mauna Kea's base is on the seafloor.", "Most of it is hidden underwater.", "Only about 4,200 metres sticks out.", "So measure from the base, and Everest loses.", "Follow for the next place that sounds fake."], "job": ""}, {"date": "2026-12-07", "kind": "Short", "category": "space", "title": "Jupiter's Moon Is Covered in Erupting Volcanoes", "hook": "If you flew past Io, you'd see eruptions.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Io, a moon of Jupiter, is the most volcanically active body in the Solar System. Spacecraft have photographed its plumes blasting hundreds of kilometres above the surface. Part of the If You Were in Space series.\n\n#Shorts #Space #Jupiter", "script": ["If you flew past Io, you'd see eruptions.", "It's the most volcanic world in our Solar System.", "Plumes shoot hundreds of kilometres above the surface.", "Spacecraft photographed them blasting straight into space.", "The ground is lava lakes and yellow sulfur.", "Jupiter's gravity squeezes it, and that heat melts rock.", "So Io keeps erupting.", "Fly past Io, and eruptions are what you see.", "Tomorrow: a cliff taller than Everest."], "job": ""}, {"date": "2026-12-07", "kind": "Short", "category": "space", "title": "A Cliff Where Falling Takes Minutes", "hook": "If you jumped off Miranda's cliff, you'd fall for minutes.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Uranus's moon Miranda has a cliff called Verona Rupes, estimated at about 20 km tall. Miranda's gravity is so weak that a fall from the top would take many minutes. Part of the If You Were in Space series.\n\n#Shorts #Space #Uranus", "script": ["If you jumped off Miranda's cliff, you'd fall for minutes.", "Verona Rupes is about 20 kilometres tall.", "That is more than twice Everest's height.", "Voyager 2 photographed it in 1986.", "Miranda looks like a patchwork of broken pieces.", "Its gravity is so weak, falling is slow.", "Estimates say the drop takes over ten minutes.", "Yes, you'd really fall for minutes.", "Tomorrow: the water drop that shows hidden colours."], "job": ""}, {"date": "2026-12-07", "kind": "Short", "category": "technology", "title": "Your White Screen Isn't Really White", "hook": "Your phone's white screen is secretly three colours.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Put a small drop of water on a white phone screen and film it up close. The drop acts like a tiny magnifier and shows the red, green and blue lights that make up every pixel. Wipe the screen dry afterwards.\n\n#Shorts #PhoneTricks #Tech", "script": ["Your phone's white screen is secretly three colours.", "Put one small drop of water on it.", "Now film it up close with your camera.", "The drop works like a tiny magnifying glass.", "White splits into red, green and blue.", "Every pixel is just three tiny coloured lights.", "Mixed together, they fool your eyes into white.", "Your white screen was never white.", "Tomorrow: statues with hidden bodies."], "job": ""}, {"date": "2026-12-08", "kind": "Long video", "category": "geography", "title": "Why Korea Is Stranger Than You Think", "hook": "Your border map shows two countries still at war, yet cranes nest between them.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Korea has a 4 km wide war zone where nature took over, a room that sits in two countries, a fake-looking village, and a time zone that moved by 30 minutes. Here are 7 true facts about the Korean peninsula, with a link to India that most people never hear about. Watch to the end to see why the most guarded border on Earth became a home for rare cranes.\n\n#Korea #DMZ #FactsYouDidntKnow", "script": ["Your border map shows two countries still at war, yet cranes nest between them. That strip of land is real, and it is stranger than it sounds.", "Between North and South Korea there is a strip about four kilometres wide where almost nobody has lived for decades.", "By the end of this video, you will see why the most guarded border on Earth became a home for rare birds.", "But first, seven true facts about Korea that sound fake. Each one is stranger than the one before it.", "There is a room where you can stand in two countries, a village that may be fake, and a clock that moved by thirty minutes.", "And one of these facts connects Korea to a famous Indian city. Keep watching for that one too.", "Fact one: North and South Korea never signed a peace treaty. They signed a ceasefire called an armistice on 27 July 1953.", "That means that, on paper, the Korean War never officially ended. The two sides simply stopped shooting.", "The ceasefire line created the Demilitarized Zone, or DMZ. It runs across the whole peninsula, about two kilometres on each side.", "The name is a joke, because it is one of the most heavily armed borders anywhere. Soldiers watch each other across it every day.", "Here is the part Indian viewers rarely hear. India played a big role in how that war ended.", "After the ceasefire, thousands of prisoners had to choose whether to go home or not. Indian troops were put in charge of guarding them.", "An Indian general, K S Thimayya, led that effort. So when you hear about Korea, India is part of the story.", "So, fact one: there is still no peace treaty. But the next fact is something you can actually walk into.", "Fact two is at a place called Panmunjom, inside the Joint Security Area. A few small blue huts sit right on the border line.", "Inside one hut, a table sits in the middle of the room. The border between the two countries runs straight across it.", "A cable of microphones on that table marks the line. One end of the table is in the South, the other is in the North.", "On guided tours, visitors have been able to step across to the far side of the room. For a moment, you are standing in North Korea.", "Compare that with India, where you can walk across a border at Sunauli without a visa. Here, the line is the most tense on Earth.", "Outside the huts, a low concrete strip runs along the ground. That small step is the border between two armies.", "Nearby is the Bridge of No Return, where prisoners in 1953 had to choose a side. Once they crossed, they could not come back.", "Today it is a quiet bridge with trees on either side. The history behind it is anything but quiet.", "The villages next to this border are even stranger, and one of them has a flagpole you can see from far away.", "So that was two facts. But the next one is a village with a flagpole so tall, it is part of an arms race.", "Fact three: both sides built a village inside the DMZ. The South's is called Daeseong-dong, often known as Freedom Village.", "Real farmers live there. They get special rules, like a curfew, but they are also exempt from taxes and military service.", "The North's village is Kijong-dong. It has bright, tidy buildings and one of the tallest flagpoles in the world.", "South Korea says the buildings are mostly empty shells, with lights that switch on and off by timer. North Korea calls it a real village.", "For years, both sides blasted loudspeakers at each other across the border. Sound itself became a weapon.", "If you like strange places and surprising facts like these, this is a good moment to subscribe. There are many more to come.", "Now, back to Korea. Because the next fact is about something hidden under the ground, and it was found by accident.", "In the 1970s, South Korea began finding secret tunnels dug under the border. Someone had been digging toward Seoul.", "It is tense for a reason. Seoul is a huge city, and these tunnels were close enough for a drive of under an hour.", "Fact four: when South Korea found one, the North said it was a coal mine. So they had painted the walls black.", "But the rock is granite, not coal. The black was only paint, and the story did not fit the rock around it.", "At least four of these tunnels have been found so far. Engineers still search the ground for more.", "Today you can walk down one of them on a tour. You wear a hard hat and bend low, because the ceiling is low.", "Imagine standing underground, knowing the border is just above your head. It is a very strange kind of tourism.", "That is one strange war. But the next fact is about something as ordinary as the time on your phone.", "Fact five: in 2015, North Korea moved its clocks back by thirty minutes. Pyongyang time became its own time zone.", "That put the North half an hour behind the South. The two Koreas were next to each other but on different clocks.", "An Indian viewer will know this feeling. India is five and a half hours ahead of GMT, a half-hour time zone too.", "So the half-hour clock is not that rare. But in Korea it was a political message, not just a map choice.", "North Korea explained the move as breaking away from Japanese colonial rule, which had set the older time.", "In 2018, after the two leaders met, North Korea moved its clocks forward again. Both sides now share one time.", "So for about three years, you could cross a line and gain or lose thirty minutes. That is real, and it is recent.", "It shows how a clock can be a flag. Time itself became a way to draw a border.", "The next fact is the one I promised earlier, and it starts in a city many of you know well.", "Fact six: an old Korean legend says that a princess from a place called Ayuta travelled by sea to Korea.", "Her name was Heo Hwang-ok, and the story says she married King Suro of Gaya in the year 48.", "Many Koreans believe Ayuta means Ayodhya. It is a legend, not proven history, but it is told in an old Korean book.", "Many families with the Kim surname from Gimhae say they descend from this queen. They treat the story with great respect.", "In Ayodhya there is a memorial to her. In 2018, Korea's First Lady visited the city to honour the queen.", "Today the story is a bridge between India and Korea. An old tale is now part of how two countries talk.", "Next time you hear about Korea, remember that a legend ties it to a city on the Saryu river.", "So that is six. But I saved the biggest one for last, and it brings us back to the cranes.", "Fact seven: the DMZ was meant to keep armies apart. But it also kept people out, and nature moved in.", "Farmers could not return, and landmines make walking there dangerous. For decades, almost nothing was built, ploughed or hunted.", "The result is a long green belt across the peninsula, with wetlands, forests and rivers that look wild from above.", "Rare red-crowned cranes are famous in East Asia, and they are a symbol of long life. They gather in and around the DMZ in winter.", "White-naped cranes come there too. Birds do not care about borders, and the empty land gives them quiet.", "Other wild animals have been seen there as well, such as the Amur leopard cat and the Asiatic black bear.", "That is the strange truth. One of the most dangerous borders on Earth has become one of the quietest wild places in the region.", "So go back to the start. Two countries still at war, with a strip between them where cranes nest.", "Seven true facts: no peace treaty, a room in two countries, a village that may be for show, secret tunnels, a moved clock, a legendary queen, and a wildlife haven.", "Next video: why Nepal's clock is fifteen minutes away from India's, and how one small change makes a whole country different."], "job": ""}, {"date": "2026-12-08", "kind": "Short", "category": "geography", "title": "Easter Island's Giant Heads Have Buried Bodies", "hook": "Your photo of Easter Island's heads misses their bodies.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The famous Easter Island moai are often called heads, but excavations found full torsos buried underground. Soil built up around many of them over time. Part of the Places That Shouldn't Exist series.\n\n#Shorts #EasterIsland #Geography", "script": ["Your photo of Easter Island's heads misses their bodies.", "They're called heads, but they're full statues.", "Soil slowly buried them up to the shoulders.", "Excavations dug down and found torsos below.", "Some even have carvings on their backs.", "There are nearly 900 of these statues.", "Most were carved in one volcano's quarry.", "So your photo shows only the top.", "Tomorrow: monkeys drawn in the Peruvian desert."], "job": ""}, {"date": "2026-12-08", "kind": "Short", "category": "geography", "title": "A Giant Monkey Is Drawn Into Peru's Desert", "hook": "Your flight over Peru would show a giant monkey.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Nazca Lines in Peru include a monkey, a hummingbird and a spider drawn into the desert floor. They are around 2,000 years old and are best seen from the air. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Nazca #Peru", "script": ["Your flight over Peru would show a giant monkey.", "It is drawn into the desert floor.", "Nearby: a hummingbird and a spider.", "These Nazca lines are around 2,000 years old.", "From the ground, they look like faint lines.", "The shapes are best seen from the air.", "Experts still debate why they were made.", "Your window seat gets the best view.", "Tomorrow: a whole town painted blue."], "job": ""}, {"date": "2026-12-08", "kind": "Short", "category": "geography", "title": "The Moroccan Town Painted Blue", "hook": "Your walk in Chefchaouen is a walk through blue.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Chefchaouen in northern Morocco is famous for its blue-painted walls, doors and stairs. Its old town is known as the Blue Pearl. India has a Blue City too, Jodhpur, but this one feels different. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Morocco #Chefchaouen", "script": ["Your walk in Chefchaouen is a walk through blue.", "Walls, doors and stairs are painted blue.", "The old town is called the Blue Pearl.", "It sits in the mountains of northern Morocco.", "Rajasthan has its own Blue City, Jodhpur.", "Here the blue spreads through nearly every lane.", "Even the stairs are blue.", "So your walk never leaves the blue.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-12-08", "kind": "Short", "category": "space", "title": "Mars Has a Canyon Longer Than India", "hook": "Your India map is shorter than this Mars canyon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Valles Marineris on Mars is about 4,000 km long. India is roughly 3,200 km from top to bottom, and the canyon almost crosses the United States. Part of the Mind-Bending Facts series.\n\n#Shorts #Mars #SpaceFacts", "script": ["Your India map is shorter than this Mars canyon.", "It's called Valles Marineris, about 4,000 kilometres long.", "India is roughly 3,200 kilometres from top to bottom.", "Lay it over America and it almost crosses.", "It's also deep, up to about seven kilometres.", "It's the biggest canyon known in our solar system.", "So yes, your India map is shorter than Mars.", "Tomorrow: salt dancing on a phone speaker."], "job": ""}, {"date": "2026-12-08", "kind": "Short", "category": "technology", "title": "Make Salt Dance on Your Phone Speaker", "hook": "Your phone speaker can make salt dance.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Lay your phone flat, stretch cling film over the speaker, sprinkle salt and play bass-heavy music. The grains jump and shift because sound is vibration. Works with any phone speaker.\n\n#Shorts #PhoneTricks #Science", "script": ["Your phone speaker can make salt dance.", "Lay your phone flat, speaker facing up.", "Stretch cling film tight over it.", "Sprinkle a pinch of salt on top.", "Play loud, bass-heavy music.", "Watch the grains jump and shift.", "Sound is vibration, and the film shows it.", "So your speaker really can make salt dance.", "Tomorrow: snow on a mountain at the equator."], "job": ""}, {"date": "2026-12-09", "kind": "Long video", "category": "geography", "title": "7 Borders That Make Zero Sense (India's Is Wildest)", "hook": "Your map once held a patch of India inside Bangladesh inside India inside Bangladesh, and it was completely real.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Seven real borders that look fake on a map, from a lake with no agreed border to an island where you can see China's skyline from Taiwanese land. The countdown ends on India's strangest border of all, the Cooch Behar enclaves that were swapped with Bangladesh in 2015. Watch to the end for a patch of land that sat inside three layers of other countries.\n\n#borders #geography #india", "script": ["Your map once held a patch of India inside Bangladesh inside India inside Bangladesh, and it was completely real.", "That is one of seven borders in this video that make no sense, and each one is stranger than the last.", "We start with a lake where nobody ever agreed on a line, and we end on India's strangest border.", "Along the way, you will see a town you can only reach by driving through another country.", "You will see a runway that cuts across a road, and an island where you can see China from Taiwanese land.", "By the end, you will know how Indian villagers once lived on land that was stuck inside a foreign country.", "Let's start with number seven, in the middle of Europe, on a lake you may have seen on holiday postcards.", "Number seven: Lake Constance, a huge lake in the Alps that touches Germany, Austria and Switzerland.", "Three countries share its shores, and they have never signed a treaty that fixes the border through the water.", "Look at a map and you will find a blank space on the water, right where a border line should be.", "Austria has long argued that the whole lake is shared. Others see it differently, so the line stays missing.", "So how do they run the lake? They agree on rules for boats and fishing, not on borders.", "Imagine a cricket ground where the boundary rope was never laid, yet everyone keeps playing and nobody argues.", "That is a border that works only because everyone is polite, and it has worked for a very long time.", "That one is calm. The next border is perfectly clear on a map, and that is exactly the problem.", "Number six: Point Roberts, a small town in Washington state, on the American side of the map.", "Here is the twist: you cannot drive there from the rest of America without crossing Canada first.", "The border follows the 49th parallel, and the tip of this peninsula landed just south of that line.", "So the town is American land, but the only road to it by land runs through Canada.", "To get there from Seattle, you leave the United States, cross Canada, and then enter the United States again.", "Think of reaching your own house only by passing through your neighbour's compound, with a guard at both gates.", "The road is real, the border posts are real, and the town is real. It just sits on the wrong side of a line.", "Point Roberts shows that a line can be perfectly clear on paper and still make everyday life odd.", "And if that feels strange, wait until you meet a Spanish town that is stuck inside France.", "Number five: Llívia, a Spanish town that sits completely inside France, with French land on every side.", "In 1659, Spain and France signed a treaty that handed France a list of villages in the Pyrenees.", "Llívia was a town, not a village, so it was never on the list, and it stayed Spanish.", "A single word in a treaty from 1659 still decides which flag flies over its streets today.", "A short road links it to the rest of Spain, and that road is treated as neutral ground.", "Walk out of town in any other direction and you are in France, with French road signs and French village names.", "It is a tiny place, but it proves that a border can survive just because someone read a treaty very carefully.", "Remember this: a border does not need to make sense, it only needs to be written down.", "Next, a village that is German on paper, yet sits inside a Swiss world of francs and customs.", "Number four: Büsingen am Hochrhein, a German village surrounded on every side by Switzerland.", "It follows German law, but for customs purposes it counts as part of Switzerland.", "Shops here accept Swiss francs and euros, so your change might come back in either currency.", "Many people there live like their Swiss neighbours, working and shopping just across the line.", "Its odd position goes back centuries, to deals between rulers long before modern passports even existed.", "So its people follow one country's laws, use two currencies, and live inside another country's land.", "If strange maps like these are your thing, subscribe now. Number three is where a runway cuts a road in two.", "Number three: Gibraltar airport, where a runway cuts straight across a busy public road.", "Gibraltar is a British territory at the southern tip of Spain, and the Spanish border sits right beside the airport.", "The main road into town, Winston Churchill Avenue, crosses the runway itself, with no bridge and no tunnel.", "When a plane is about to land or take off, barriers come down and the road closes to cars and walkers.", "Think of a railway crossing in an Indian town, only the train is an airplane.", "Cars wait, scooters wait, people wait with shopping bags, and then the jet roars past right in front of them.", "Anyone walking in from Spain has to cross the runway to reach the town on the other side.", "A border post and an airport are squeezed into the same tiny patch of ground, and they share it politely.", "Gibraltar is so small that the runway takes up a big part of the flat land it has.", "Now we reach the top two, and both are places where the border is very close to you.", "Number two: Kinmen, an island run by Taiwan, but only a few kilometres from the Chinese city of Xiamen.", "Take a boat there, and from Taiwanese land you can see China's skyline across the water.", "Xiamen's tall buildings stand on the horizon, while Kinmen's beaches are lined with old steel anti-landing spikes.", "Kinmen is much farther from Taiwan's own main island than it is from China, yet it belongs to Taiwan's government.", "In 1958, China began a heavy artillery bombardment of Kinmen, and shelling went on for years afterwards.", "Today, people on Kinmen make knives from steel taken from old shell casings, and tourists buy them as souvenirs.", "Since 2001, ferries have run between Kinmen and Xiamen, so a short boat ride now links two places that once exchanged fire.", "Picture standing on one beach, seeing a modern Chinese city, and knowing the border is just that thin strip of water.", "There is no fence and no painted line here, just open sea, and you can see the other side with your own eyes.", "For people in Kinmen, China is not a headline, it is the view from the beach.", "The two sides see their future very differently, yet the water between them stays only a few kilometres wide.", "But number one is stranger than all of these, and it is right here in India.", "Number one: the enclaves of Cooch Behar, India's strangest border of all, on the edge of Bangladesh.", "For decades, the India-Bangladesh border here was a jigsaw puzzle of small patches, each belonging to the other country.", "An Indian village could be surrounded by Bangladesh, and a Bangladeshi village could sit deep inside West Bengal.", "These patches were called enclaves, and before 2015 there were 111 Indian ones inside Bangladesh and 51 Bangladeshi ones inside India.", "One legend says it began with a chess game between two local rulers, who bet villages on the result.", "Whatever the cause, people in these patches lived in limbo, often cut off from schools, electricity and hospitals.", "To reach their own country, many had to cross a foreign border first, and their own officials often could not reach them.", "And then came the truly crazy bit, a plot of land called Dahala Khagrabari.", "It was a tiny piece of India, inside a piece of Bangladesh, inside a piece of India, inside Bangladesh.", "Map experts often described it as the only one of its kind in the world.", "A farmer there was in India, but to reach the Indian mainland he had to cross several borders in a row.", "At midnight on 31 July 2015, India and Bangladesh finally swapped these patches under a land boundary agreement.", "Residents were given a choice of country, and many people finally became citizens of the land they had always lived on.", "For the first time, many of them could get roads, electricity and schools from the country around them.", "That is India's strangest border: a puzzle of tiny patches that took nearly seventy years to untangle.", "Think about it: a border is usually a line on a map, but here it was pieces of two countries mixed together.", "So India's strangest border is not a wall or a fence. It was a tangle of tiny lands that nobody could reach.", "Seven borders, seven different ways a map can go strange, and the wildest one was sitting in India all along.", "And that is why your map once held a patch of India inside Bangladesh inside India inside Bangladesh.", "Next video: borders where the clock jumps by just fifteen minutes when you step across."], "job": ""}, {"date": "2026-12-09", "kind": "Short", "category": "geography", "title": "Snow on a Mountain Near the Equator", "hook": "Your Kilimanjaro climb ends on snow, near the equator.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Mount Kilimanjaro in Tanzania sits just south of the equator, yet its summit has snow and glaciers. At about 5,895 metres the air is far colder, though the glaciers have been shrinking for decades.\n\n#Shorts #Kilimanjaro #Geography", "script": ["Your Kilimanjaro climb ends on snow, near the equator.", "Tanzania's hot plains surround it.", "The summit is about 5,895 metres high.", "Air that high is far colder.", "So glaciers still cling to the top.", "They've been shrinking for decades.", "Your tropical climb ends with snow.", "Tomorrow: a lake of glowing lava."], "job": ""}, {"date": "2026-12-09", "kind": "Short", "category": "geography", "title": "A Volcano Crater Full of Glowing Lava", "hook": "Your night view here is a lake of lava.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Nyiragongo in the Democratic Republic of Congo has held one of the largest lava lakes on Earth. At night the crater glows, and the city of Goma sits close by.\n\n#Shorts #Volcano #Geography", "script": ["Your night view here is a lake of lava.", "This is Nyiragongo, in the Democratic Republic of Congo.", "Its crater has held a glowing lava lake.", "It's among the largest lava lakes on Earth.", "At night, the crater glows red-orange.", "The city of Goma sits close by.", "Scientists monitor it closely.", "Your night view: a lake of fire.", "Tomorrow: a rover finds leopard spots on Mars."], "job": ""}, {"date": "2026-12-09", "kind": "Short", "category": "space", "title": "A Leopard-Spotted Rock Found on Mars", "hook": "Your Mars rover found a leopard-spotted rock.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2024, NASA's Perseverance rover photographed a rock called Cheyava Falls with spots and streaks. NASA called it a possible sign of ancient microbial life. It is not proven, and the rover collected a sample for study.\n\n#Shorts #Mars #NASA", "script": ["Your Mars rover found a leopard-spotted rock.", "In 2024, Perseverance photographed it.", "NASA named the rock Cheyava Falls.", "Its spots and streaks looked strange.", "A possible sign of ancient microbial life.", "That means possible, not proven.", "The rover collected a sample from it.", "Your leopard-spot rock stays a Martian mystery.", "Tomorrow: a chipped window in space."], "job": ""}, {"date": "2026-12-09", "kind": "Short", "category": "space", "title": "A Tiny Speck Cracked the ISS Window", "hook": "Your space station window has a chip in it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 2016, a tiny piece of space debris, likely a paint fleck, struck the Cupola window on the International Space Station. It was only thousandths of a millimetre across, yet it left a visible chip.\n\n#Shorts #ISS #SpaceFacts", "script": ["Your space station window has a chip.", "It's the Cupola, the ISS's big window.", "In 2016, something struck it.", "Likely a speck of paint.", "It was thousandths of a millimetre across.", "Yet it left a visible crack.", "Space junk moves faster than a bullet.", "Your window's chip came from a paint speck.", "Next: more facts that sound fake."], "job": ""}, {"date": "2026-12-09", "kind": "Short", "category": "technology", "title": "Your Phone Shoots Invisible Dots at You", "hook": "Your phone shoots invisible dots at your face.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Face ID-style phones project a grid of infrared dots to map your face. Your eyes can't see infrared, but many phone cameras can, so a second phone shows the dots as a purple glow. It works best in a dark room and depends on the camera you film with. Part of the Try This Now series.\n\n#Shorts #TryThisNow #PhoneTricks", "script": ["Your phone shoots invisible dots at your face.", "Film it with a second phone.", "Point that camera at the front sensor.", "A purple glow of dots appears.", "Those dots map your face in 3D.", "Your eyes can't see infrared light.", "But many phone cameras can.", "Works best in a dark room.", "Your phone shoots those dots every unlock.", "Tomorrow: a church carved downward into rock."], "job": ""}, {"date": "2026-12-10", "kind": "Long video", "category": "geography", "title": "Why Kinmen Is Stranger Than You Think", "hook": "Your beach on Kinmen, Taiwan, faces a Chinese skyline, and the island's kitchen knives were once bombs.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Kinmen belongs to Taiwan, yet it sits only a few kilometres from the Chinese city of Xiamen. In this video you will see six true facts about the island: the skyline across the water, phones that can join a Chinese network, tap water that comes through a pipe from China, life under military rule until 1992, a war fought with loudspeakers, and kitchen knives made from bombs.\n\n#Kinmen #Taiwan #StrangePlaces", "script": ["Your beach on Kinmen, Taiwan, faces a Chinese skyline, and the island's kitchen knives were once bombs.", "Kinmen belongs to Taiwan, yet it sits only a few kilometres from the Chinese city of Xiamen, across a narrow strip of water.", "Taiwan's main island is far away across the sea, but this small island is almost touching the coast of China.", "By the end you will see how a bomb became a knife, and why that is only part of the story.", "Six strange facts are coming, and each one is stranger than the one before it.", "Stay for the last one, because it explains how this island ended up this way.", "Fact one: you can stand on Taiwanese land and look straight at the buildings of another country.", "Take a boat to Kinmen, walk to the shore that faces Xiamen, and just look across the water.", "You can see a modern skyline with tall towers and cranes, and every one of those buildings is in mainland China.", "Xiamen is a large port city in Fujian province, with millions of people living in full view of this small island.", "Imagine standing in your own city and seeing a rival country's towers just across a narrow strip of sea.", "And Kinmen is nowhere near the rest of Taiwan. It sits much closer to China than it does to Taipei.", "Older maps spell the name Quemoy, and during the Cold War this small island was a famous flashpoint.", "Even the clock matches China. Kinmen, Xiamen and Taipei all share one time, which is two and a half hours ahead of India.", "People on both sides of the water also grew up speaking the same Hokkien dialect, also called Minnan.", "So the voices sound alike, but the flags are different. Now, fact two, which happens right inside your pocket.", "Fact two: on Kinmen, your phone can get confused about which country it is standing in.", "Phones look for the strongest signal, and on the Xiamen side of the water there are Chinese mobile towers very close by.", "Visitors and locals have reported their phones joining a Chinese network and sending a welcome message from China.", "A roaming warning can pop up even though you never left Taiwan, and you never boarded a ship or a plane.", "Signals do not care about borders, and on Kinmen the border is only water, which radio waves cross very easily.", "Now think about what a place this close to China had to prepare for in the past.", "In 1949, soldiers from the Chinese mainland tried to land on Kinmen near a village called Guningtou.", "The defenders won that battle, and it is the main reason Kinmen is still under Taiwan today.", "Some beaches still have rows of steel spikes stuck in the sand, built to rip open landing boats.", "Guningtou is still remembered on the island with a museum and a memorial.", "Those spikes are still there for tourists to photograph. But fact three is about something you drink every day.", "Fact three: some of the water running out of Kinmen's taps travels from China.", "Kinmen is small and often short of fresh water, so for years the island has had to think hard about every drop.", "In 2018, a pipeline opened that carries water under the sea from the Chinese side, in Fujian province, to Kinmen.", "The water comes from the Chinese side because that is the nearest big supply, a short distance from where Kinmen sits.", "Think about that: two governments that are political rivals, connected by one
