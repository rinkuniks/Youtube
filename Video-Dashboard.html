 relocated, including its church. Part of the series: Places That Shouldn't Exist.\n\n#Shorts #Kiruna #Geography", "script": ["Imagine your whole town being picked up and moved.", "This is Kiruna, in northern Sweden.", "Right under it sits a giant iron mine.", "Mining makes the ground unstable.", "So the town centre is relocating.", "Even the church was moved, in one piece.", "It rolled several kilometres across town.", "A whole town, moved for the ground below. Next: India on the Moon."], "job": ""}, {"date": "2026-10-28", "kind": "Short", "category": "space", "title": "India Landed Near the Moon's South Pole", "hook": "Your Moon landing map has India at the south pole.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On 23 August 2023, Chandrayaan-3 touched down near the lunar south pole. The Pragyan rover then rolled out onto the surface. Part of the series: India In Space.\n\n#Shorts #Chandrayaan3 #Moon", "script": ["Your Moon landing map has India at the south pole.", "Chandrayaan-3 touched down on 23 August 2023.", "It landed near the Moon's south pole.", "Then a ramp opened on the lander.", "Out rolled the Pragyan rover.", "Its wheels left marks on the lunar dust.", "Few places on the Moon are harder to reach.", "India is at the south pole. Next: India's first Mars try."], "job": ""}, {"date": "2026-10-28", "kind": "Short", "category": "space", "title": "India Reached Mars on Its First Try", "hook": "Your country reached Mars on its very first try.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "ISRO's Mangalyaan reached Mars orbit in September 2014 on India's first attempt. That made India the first Asian country to reach Mars orbit. Part of the series: India In Space.\n\n#Shorts #Mangalyaan #ISRO", "script": ["Your country reached Mars on its very first try.", "Mangalyaan arrived in September 2014.", "It was ISRO's first attempt at Mars.", "Many Mars missions by others had failed.", "India's worked the first time.", "It became the first Asian country in Mars orbit.", "Mars looked down on Indian hardware.", "Your country, Mars, first try. Tomorrow: another place that sounds fake."], "job": ""}, {"date": "2026-10-28", "kind": "Short", "category": "technology", "title": "Your Humming Can Name Any Song", "hook": "Your humming can name a song you forgot.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Google app can identify a song from your humming alone. Hum for 10 to 15 seconds and it lists the matching tracks on screen. Try it on the tune stuck in your head.\n\n#Shorts #Tech #PhoneTricks", "script": ["Your humming can name a song you forgot.", "Open the Google app on your phone.", "Tap the mic, then tap search a song.", "Now hum the tune for ten to fifteen seconds.", "No lyrics, no singing, just the melody.", "A list of matching songs appears on screen.", "That tune stuck in your head now has a name.", "So go hum something right now."], "job": ""}, {"date": "2026-10-29", "kind": "Long video", "category": "geography", "title": "Why Estonia Is Stranger Than You Think", "hook": "Your drive on this Estonian road went through Russia for about 100 metres, and you could not stop.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Estonia has an Estonian road that drove through Russia for about 100 metres, ice roads over the sea, two castles facing each other across a river, and a government that lives on your phone. Here are seven true facts about Estonia that sound fake. The Saatse Boot road was closed in 2025, so we explain what happened and what replaces it.\n\n#Estonia #GeographyFacts #StrangePlaces", "script": ["Your drive on this Estonian road went through Russia for about 100 metres, and you could not stop.", "Not a tunnel, not a bridge. Just an ordinary road, an ordinary car, and a short stretch of Russian soil.", "That road is real, and we will drive it at the end, but Estonia has six other surprises to show you first.", "Its whole population is smaller than the city of Pune, yet this country keeps doing things bigger countries only talk about.", "By the end you will see why a tiny country on the Baltic Sea feels a little like another planet.", "Stay for the last one, because the story of that road took a sharp turn in 2025.", "Number one: in Estonia, the sauna is not a spa treat. It is a family habit, the way chai is at home.", "Many homes and holiday cottages have their own sauna, heated to far above any summer afternoon in Delhi.", "In the south, people still use a smoke sauna, where smoke fills the room first and is aired out before anyone goes in.", "That tradition is so old that UNESCO added the Võro smoke sauna to its list of living heritage in 2014.", "For generations, people there treated the sauna as the place to wash, to heal, and in old times even to give birth.", "And here is the twist: after the heat, many Estonians run outside and jump into snow or an icy lake.", "So the first strange fact is a country that relaxes by going from burning hot to freezing cold in seconds.", "Now from a hot room to a frozen sea, because the next fact lets you drive on water.", "Number two: Estonia has more than two thousand islands, and in winter some of them are joined to the mainland by roads of ice.", "The two biggest, Saaremaa and Hiiumaa, have towns, farms, schools and lighthouses, so these are real homes, not just rocks in the sea.", "When the Baltic Sea freezes hard enough, the government opens official ice roads, with speed limits and proper road signs.", "The best known one links the mainland to Hiiumaa, and it is counted among the longest ice roads in Europe.", "Picture your car rolling along with the sea under your tyres, and fish swimming silently below you.", "It only opens when the ice is thick enough, and in a warm winter it may not open at all.", "In summer the same route is a ferry crossing, so one journey becomes a boat ride or an ice drive depending on the season.", "Next, a river that works as a border, and two castles that stare at each other.", "Number three: in Narva, on Estonia's eastern edge, you can stand by a river and look straight at Russia.", "The Narva river is the border. On the Estonian bank stands Hermann Castle, a medieval fortress with a tall tower.", "On the Russian bank, just across the water, stands Ivangorod Fortress, facing the Estonian castle like a mirror.", "Two fortresses, two countries, one narrow river between them, and a bridge that works as the border crossing.", "Think of two old forts facing each other across a river, each flying a different flag. That is an everyday view here.", "Narva was badly damaged in the Second World War, and its castle has been carefully restored so visitors can climb it today.", "Most borders feel far away, hidden in mountains or deserts. This one is a riverside walk and a view you cannot miss.", "But the next place was not shaped by any border. It was shaped by something that fell from the sky.", "Number four: on the island of Saaremaa there is a round crater, made when a meteorite hit the ground thousands of years ago.", "The biggest crater at Kaali is about 110 metres across, and it holds a small pond at the bottom.", "Some researchers think old local myths about a fallen sun may be a memory of this very impact.", "You can walk a path through the trees and stand on the rim, with no mountain anywhere in sight.", "A hole from space, in a country that looks flat and calm on the map, and you can visit it on a weekend trip.", "If you enjoy strange places like this, this is a good moment to subscribe, because we post more of them every day.", "And the next story is about a country that sang its way to freedom.", "Number five: Estonia won back its freedom with songs, and the movement is called the Singing Revolution.", "Under Soviet rule, many national songs were discouraged. In 1988, huge crowds gathered in Tallinn to sing them together.", "Hundreds of thousands of people stood in one field and sang, in a country with a very small population.", "Then in 1989, about two million people in Estonia, Latvia and Lithuania held hands in a human chain.", "It stretched roughly 600 kilometres, about the road distance from Delhi to Jaipur and back again.", "Estonia became independent again in 1991, and the change happened largely without the war that many people had feared.", "Even today, a giant song festival is held in Tallinn, a tradition that began back in the 1800s.", "A weapon made of voices. That is one of the strangest ways any country has ever won back its freedom.", "But the next fact is about the future, because Estonia lives online more than almost any country.", "Number six: in Estonia you can vote from your phone or laptop, and nationwide online voting has been allowed there since 2005.", "Think of UPI and Aadhaar, but for most of your government paperwork. Taxes, prescriptions and records, all online.", "For many people, filing taxes takes just a few minutes with a digital ID. A few things still need you in person, like getting married.", "The system keeps a log of who looked at your data, and citizens can check it. Your records are not a black box.", "Since 2014, even foreigners can apply for e-Residency, a digital identity that lets you run a company from anywhere.", "So a person in India can own an Estonian company without ever living in Estonia.", "And Skype, the app that put millions of people on video calls, was built by engineers from this small country.", "A country with fewer people than Pune built tools that changed how the world makes calls, signs papers and runs businesses.", "Now the last place. It is the one from the start, and the biggest surprise of all.", "Number seven: the Saatse Boot, a road in south-east Estonia that crossed into Russia and came back out.", "It is called the Boot because, on the map, the Russian patch pushing into Estonia looks exactly like a boot.", "After the Soviet Union broke up, the new border left that patch on the Russian side, with a village road running through it.", "Drive in from the Estonian side, and for about 100 metres you were officially in Russia.", "The rules were simple: do not stop, do not get out of the car, and keep driving until you are back home.", "Locals used this road in daily life, because it was the shortest way between villages in that corner of Estonia.", "On a map, your blue dot slid out of Estonia, into Russia, and back again within seconds.", "Think how strange that is. A local bus, a tractor or a family car could briefly be in another country.", "Now the twist. In 2025, Estonia closed this road to traffic after reports of armed men seen near it.", "So the road you could not stop on is now a road you cannot use at all.", "Estonia is building new roads that stay inside its own land, so villagers no longer need to cross Russia to get home.", "The boot is still on the map, and the border has not moved. Only the way people get around it has changed.", "So that is Estonia: a sauna, a frozen sea, two castles, a meteorite crater, a revolution of songs and a government on your phone.", "And remember where we started: for about 100 metres, an Estonian road went through Russia, and you could not stop.", "Tomorrow: a country with no airport of its own."], "job": ""}, {"date": "2026-10-29", "kind": "Short", "category": "geography", "title": "This Mountain Beats Everest In One Way", "hook": "Your climb up Chimborazo ends farther from Earth's centre than Everest.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Ecuador's Chimborazo is not the highest mountain above sea level, but its summit is the point on Earth's surface farthest from the planet's centre. Earth bulges at the equator, and Chimborazo sits right near it.\n\n#Shorts #Geography #Facts", "script": ["Your climb up Chimborazo ends farther out than Everest.", "Not higher above sea level, but farther from Earth's centre.", "Everest still wins on height above the sea.", "But Earth is not a perfect ball.", "It bulges around the equator.", "Chimborazo sits in Ecuador, close to that bulge.", "That lifts its summit farthest from Earth's centre.", "So the real top of Earth isn't Everest."], "job": ""}, {"date": "2026-10-29", "kind": "Short", "category": "geography", "title": "India And Pakistan Face Off Every Evening", "hook": "Your evening at Wagah shows two countries lowering flags face to face.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Every evening at the Wagah border near Amritsar, Indian and Pakistani border forces perform a flag-lowering ceremony facing each other. Crowds gather on both sides to watch it.\n\n#Shorts #India #Geography", "script": ["Your evening at Wagah shows two countries lowering flags together.", "It happens near Amritsar, at sunset, every day.", "Soldiers from both sides march toward the gate.", "They stamp, high-kick and stare each other down.", "Crowds on both sides cheer and chant.", "Then the gates open and both flags come down.", "The gates close again, until tomorrow evening.", "That's the daily flag face-off at Wagah."], "job": ""}, {"date": "2026-10-29", "kind": "Short", "category": "geography", "title": "Walk Between Two Continents In Iceland", "hook": "Your next step in Iceland can take you between two continents.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "At Thingvellir National Park in Iceland, the North American and Eurasian tectonic plates are pulling apart, and the rift is visible on the ground. You can walk through the gap between them.\n\n#Shorts #Iceland #Geography", "script": ["Your next step in Iceland can cross two continents.", "This is Thingvellir National Park.", "Here, the North American plate meets the Eurasian plate.", "They are slowly pulling apart.", "That split is a visible rift in the ground.", "And there is a path you can walk through it.", "One wall is North America, the other Eurasia.", "So yes, you can stand between continents."], "job": ""}, {"date": "2026-10-29", "kind": "Short", "category": "space", "title": "Indian Languages Are Flying Through Space", "hook": "Your Hindi, Tamil, Telugu and Bengali greetings are flying through space.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Voyager Golden Record carries greetings in 55 languages, including Hindi, Tamil, Telugu and Bengali. It also holds Indian classical music by Kesarbai Kerkar. The Voyager probes launched in 1977 and carry it into interstellar space.\n\n#Shorts #Space #Voyager", "script": ["Your Hindi, Tamil, Telugu and Bengali greetings are flying through space.", "It's the Voyager Golden Record.", "Voyager launched in 1977.", "The record carries greetings in 55 languages.", "Several of them are Indian languages.", "It also holds Indian classical music.", "The singer is Kesarbai Kerkar.", "Your languages are still travelling through space."], "job": ""}, {"date": "2026-10-29", "kind": "Short", "category": "technology", "title": "Chrome Hides A Dinosaur Game Offline", "hook": "Your Chrome browser hides a dinosaur game when you go offline.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Chrome has a built-in dinosaur game that shows up when you have no internet. Turn off your data, open any page, and tap the dinosaur to play.\n\n#Shorts #Chrome #Tech", "script": ["Your Chrome browser hides a dinosaur game offline.", "First, turn off your mobile data and Wi-Fi.", "Now open any page in Chrome.", "You get the no internet screen.", "See the little dinosaur? Tap it.", "It starts running, and you tap to jump.", "Dodge the cactuses and see how far you get.", "Next time you're offline, play the dinosaur."], "job": ""}, {"date": "2026-10-30", "kind": "Long video", "category": "geography", "title": "The Whisky War Island and 5 Stranger Borders", "hook": "Your bottle of whisky once started a border war, and in 2022 Canada and Denmark finally split an island in half.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "A countdown of six real borders that look like mistakes on the map: a Spanish town inside France, a piece of America you reach through Canada, a country inside another country, the Hans Island whisky war, Russia's cut-off Baltic region, and the tangled India-Bangladesh enclaves. Every border here is real, and the last one is in India.\n\n#borders #geography #factsyoucantbelieve", "script": ["Your bottle of whisky once started a border war, and in 2022 Canada and Denmark finally split an island in half.", "By the end, you will have seen six borders that look like mistakes on the map, and every one of them is real.", "The last one is in India, and it was so tangled that two countries had to swap land to fix it.", "The whisky island is number three, so stay for the story of the bottles.", "We count down from six to one, and each border is stranger than the one before.", "Number six: a small Spanish town called Llívia sits completely inside France, with French land on every side.", "Drive through the Pyrenees mountains and you will pass Spanish town signs while every field around you belongs to France.", "The reason is an old treaty from 1659, when Spain handed France a list of villages.", "Llívia was officially a town, not a village, so it was never on the list, and it stayed Spanish.", "People there speak Spanish and Catalan, pay in euros, and vote in Spain, even though France surrounds the whole town.", "A short road over French land links it to Spain, and Europe's open borders mean nobody stops you.", "Try this on your map app: search for Llívia and zoom out. You will see Spain floating inside France.", "So one word in a 1659 treaty left a Spanish town trapped inside France, and it is still there.", "But a town is small. Next is a piece of America that you can only reach by driving through Canada.", "Number five: Point Roberts, a small corner of Washington state in the USA that hangs off the bottom of Canada.", "Open your map app near Vancouver and zoom in. You will see a tiny American shape hanging below Canada's coast.", "The border follows a straight line, the 49th parallel, and this little peninsula falls just south of it.", "So it belongs to America, but the only road out of it goes into Canada.", "To reach the rest of the USA by road, residents must cross into Canada, then cross back out again.", "That means passing through border control twice, just to drive to another American town.", "Many Canadians own holiday homes there, but they can only reach them by crossing the border too.", "The people who live there still hold American passports, vote in American elections, and use American money.", "On a map it looks like a typo: a piece of one country cut off by the shape of another.", "A straight line trapped those people. The next country is trapped by another country on every single side.", "Number four: Lesotho, a whole country with no coast and only one neighbour, and that neighbour wraps all the way around it.", "Look at southern Africa on any map. Lesotho is a country-shaped hole inside South Africa.", "It is one of only a few countries in the world that are completely surrounded by another.", "Even its lowest point is high: the whole country sits more than one thousand metres above sea level.", "People call it the Kingdom in the Sky, and its border with South Africa runs along rivers and mountains.", "Many people there wear thick woollen blankets, because the mountains get cold and snow does fall.", "The capital, Maseru, sits so close to the border that you can see South Africa from the city.", "At Maseru Bridge, a short bridge over the Caledon River is where you cross between the two countries.", "If you like strange places and facts like these, subscribe, because we find more of them every day.", "Now the one that started this video: two countries, one tiny rock, and a war fought with bottles.", "Number three: Hans Island, a bare rock in the freezing water between Canada and Greenland.", "It is just over one square kilometre in size, with no trees, no people and no town.", "It is named after Hans Hendrik, a Greenlandic Arctic traveller who helped early expeditions in the area.", "In 1973 Canada and Denmark drew their sea border, but they left this one rock undecided.", "Both said it was theirs. Greenland belongs to the Kingdom of Denmark, so Denmark claimed it too.", "In 1984, Canadian soldiers landed, planted a flag, and left a bottle of Canadian whisky behind.", "Soon a Danish minister landed, planted a Danish flag, and left schnapps with a note saying welcome to the Danish island.", "For years, visitors kept swapping flags and bottles. People called it the Whisky War, and nobody ever fired a shot.", "Both sides stayed friendly the whole time. Canada and Denmark are close partners, so it was always a polite fight.", "Getting there means crossing icy water, so the people who visited were mostly soldiers, officials and scientists.", "Finally, on 14 June 2022, both countries agreed to share the rock and split it down the middle.", "The new border on the island is just over a kilometre long, and follows a natural ridge in the rock.", "That gave Canada a second land border, and its first one with a European country.", "Two countries chose friendship over a fight, and ended a war that ran for almost forty years.", "Next is a Russian region on the Baltic Sea that no road from Russia can reach without crossing other countries.", "Number two: Kaliningrad, a Russian region that is not connected to the rest of Russia.", "Poland sits on one side of it and Lithuania on the other, and both are in the European Union.", "So Russian land sits on the European map like a missing puzzle piece, far from Russia's main territory.", "The area used to be German, a city called Königsberg, until it was handed to the Soviet Union after World War Two.", "The famous philosopher Immanuel Kant lived his whole life in that city, when it was still called Königsberg.", "Most Germans left or were forced out, Russians moved in, and the city got a new name.", "In 1946 it was named Kaliningrad, after a Soviet leader called Mikhail Kalinin.", "Today, to get there by land, Russian citizens must pass through other countries, because no direct route exists.", "On a map it looks like a mistake, yet around a million people live there.", "But the strangest border of all is right here in India, and it was only fixed in 2015.", "Number one: the Cooch Behar enclaves on the India and Bangladesh border, often called the strangest border on Earth.", "Our own backyard hides it, in north Bengal, in the district of Cooch Behar, right by the Bangladesh border.", "More than a hundred and fifty tiny islands of land, each belonging to one country but sitting inside the other.", "In total, 111 Indian pieces of land sat inside Bangladesh, and 51 Bangladeshi pieces sat inside India.", "Some were just a few farm fields. People could walk out of their front door and into another country.", "The tangle goes back centuries to local rulers whose lands were mixed together, long before India and Bangladesh existed.", "When Britain divided India in 1947, the land stayed mixed, and the new border had to run around every single piece.", "Villagers often struggled to get roads, schools, hospitals or electricity, because neither government could easily reach them.", "And it gets worse. One plot, called Dahala Khagrabari, was Indian land inside Bangladeshi land inside Indian land inside Bangladesh.", "That is four layers of countries in one small farm field, the only one of its kind in the world.", "Then on the night of 31 July 2015, India and Bangladesh finally swapped the land.", "Many residents celebrated that night, as the flags of their new country went up over their villages.", "People living there were allowed to choose which country they wanted to belong to.", "Thousands of people changed their country overnight without moving an inch from their own homes.", "It took a treaty from 1974 and many years of delay, but the tangle was finally cleared.", "And that is how a border war once fought with bottles of whisky became one of the calmest endings on any map.", "Tomorrow: the country that has no border at its own front door."], "job": ""}, {"date": "2026-10-30", "kind": "Short", "category": "geography", "title": "Your Golf Ball Can Fly Into Another Country", "hook": "Your golf ball can cross a border.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Green Zone golf course sits on the Sweden-Finland border at Haparanda and Tornio. Part of the course is in each country, and Finland is one hour ahead of Sweden. Same round, two countries, two time zones.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your golf ball can cross a border.", "This course sits in Haparanda and Tornio.", "Some holes are Swedish, some are Finnish.", "The border runs right through the fairways.", "Finland is one hour ahead of Sweden.", "Walk into Finland and it's an hour later.", "Same game, two countries, two time zones.", "So yes, your golf ball crossed a border.", "Tomorrow: ice so clear you can see through it."], "job": ""}, {"date": "2026-10-30", "kind": "Short", "category": "geography", "title": "Your Feet On Ice You Can See Through", "hook": "You can stand on ice you see through.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Lake Baikal in Siberia freezes into ice so clear you can see cracks and bubbles deep below. It is the deepest lake on Earth and holds about 20% of the world's unfrozen fresh water. All of that sits right under your boots.\n\n#Shorts #LakeBaikal #PlacesThatShouldntExist", "script": ["You can stand on ice you see through.", "This is Lake Baikal in Siberia, Russia.", "Winter ice here is clear as glass.", "You can see cracks racing far below.", "Bubbles hang frozen deep inside the ice.", "Baikal is the deepest lake on Earth.", "It holds about 20% of Earth's unfrozen fresh water.", "All of it sits beneath your boots.", "Tomorrow: your whole world, smaller than one pixel."], "job": ""}, {"date": "2026-10-30", "kind": "Short", "category": "space", "title": "Your Whole World Is Less Than One Pixel", "hook": "Your whole world is less than one pixel.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 1990, Voyager 1 turned its camera back toward Earth from about 6 billion km away. In the photo, our whole planet is less than one pixel. It is called the Pale Blue Dot.\n\n#Shorts #PaleBlueDot #Voyager1", "script": ["Your whole world is less than one pixel.", "Voyager 1 took this photo in 1990.", "It was about six billion kilometres away.", "Earth is that tiny speck of light.", "Every person you know is inside it.", "Every city, every border, every ocean.", "It is called the Pale Blue Dot.", "So your whole world is under one pixel.", "Tomorrow: Voyager's message takes almost a day."], "job": ""}, {"date": "2026-10-30", "kind": "Short", "category": "space", "title": "Your Voyager 1 Message Is Almost A Day Old", "hook": "Your Voyager 1 message arrives nearly a day late.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Voyager 1 launched in 1977 and now flies in interstellar space. Its radio signal travels at the speed of light, yet it takes close to a full day to reach Earth. The probe is still sending data home.\n\n#Shorts #Voyager1 #SpaceFacts", "script": ["Your Voyager 1 message arrives nearly a day late.", "It left Earth in 1977.", "Radio waves travel at the speed of light.", "Even so, the trip takes close to a day.", "It now flies in interstellar space.", "It still sends data home today.", "Its power source is nearly fifty years old.", "So today's news from Voyager is a day old.", "Tomorrow: a QR code that survives scribbles."], "job": ""}, {"date": "2026-10-30", "kind": "Short", "category": "technology", "title": "Your QR Code Still Scans After You Scribble", "hook": "Your QR code still scans after a scribble.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "QR codes carry built-in error correction, so a damaged code can still be read. At the highest setting, up to about 30% of a code can be lost. Try it with a pen and your phone camera, but heavy damage will break it.\n\n#Shorts #QRCode #TechFacts", "script": ["Your QR code still scans after a scribble.", "Draw a few lines across a QR code.", "Now point your phone camera at it.", "It still opens, as if nothing happened.", "UPI-style QR codes carry extra backup data.", "That lets damaged parts be rebuilt.", "At the highest setting, about 30% can be lost.", "Too much damage will still break it.", "Tomorrow: white terraces filled with warm blue water."], "job": ""}, {"date": "2026-10-31", "kind": "Long video", "category": "geography", "title": "Why Canada Is Stranger Than You Think", "hook": "Your map of Hans Island shows a rock that Canada and Denmark split down the middle in 2022.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Canada looks calm on the map, but it has a rock that was split after a whisky war, a French island off its coast, and a town you can only drive to through Canada. Seven true facts about its coastline, lakes, clocks and borders, ending with the story of Hans Island. Which one surprised you most?\n\n#Canada #Geography #StrangeFacts", "script": ["Your map of Hans Island shows a rock that Canada and Denmark split down the middle in 2022.", "That rock is the strangest thing in this video, so it is saved for last. But Canada has six other surprises first.", "By the end, you'll know how two countries fought a war using bottles of alcohol, and why nobody got hurt.", "On the way you'll see a French island next to Canada, an American town you reach only through Canada, and a moving compass target.", "Every fact here is true, and each one is stranger than the one before it.", "We start with something you can see on any map, which is the very edge of Canada.", "First: Canada has more coastline than any other country on Earth.", "Russia, Australia and Indonesia are all huge, yet none of them beat Canada. Its coastline is the longest in the world.", "The secret is the Arctic. The far north is not one solid block of land. It is a giant maze of islands.", "Baffin Island alone is about the size of Spain, and it is only one island among thousands.", "Every bay and every island adds more shoreline, so the coast keeps growing the more carefully you measure it.", "Imagine walking all of it. Most of that walk would be frozen, empty and very far from any road.", "On a globe, the top of Canada looks like torn paper, with channels of water cutting between islands everywhere.", "Now go inland, because Canada has another record that sounds fake, and this one involves water everywhere.", "Second: Canada has more lakes than any other country.", "From a plane, large parts of Canada look like someone spilled water across the map and walked away.", "Many of these lakes are so small and remote that most maps never gave them a name.", "Here is the odd one. Manitoulin Island sits in Lake Huron, and it is the largest island in a freshwater lake in the world.", "On that island is Lake Manitou, so you now have a lake inside an island that sits inside a lake.", "Inside Lake Manitou sits Treasure Island, so you can stand on an island, in a lake, on an island, in a lake.", "Your brain needs a second to picture that. Take your time, because the next stop messes with your watch.", "Third: in Newfoundland, the clock is set half an hour away from the zones next to it.", "Indian viewers know this feeling. India also runs on a half-hour offset, so our time is never a clean hour.", "When the next province over says eleven thirty, St John's already says noon.", "That means even a short flight to Newfoundland changes your watch by thirty minutes, not a full hour.", "A small part of Labrador, in the same province, even follows the other clock, so the border of time gets messy.", "Half-hour clocks are rare. Only a few places in the world use them, and Newfoundland is the famous one in North America.", "Next, we leave the clocks and go to a place where the map and the road completely disagree.", "Fourth: there is an American town that you can only reach by land by driving through Canada.", "Point Roberts, Washington, hangs off the coast like a tiny thumb pointing down from Canada.", "The border follows the forty-ninth parallel, a straight line, and that line cuts across the tip of a peninsula.", "So the town belongs to the United States, but the rest of the United States is on the other side of Canada.", "To drive to the rest of their own country, residents cross into Canada, travel through it, and cross back again.", "Two border checks just to reach the rest of your own country by road. Imagine that on a normal weekend.", "On three sides there is water, and on the fourth side there is Canada, so the town is almost an island.", "The next place sits in the sea just off Canada, and it is not Canadian at all.", "Fifth: just off Newfoundland, there are islands that belong to France.", "They are called Saint-Pierre and Miquelon, and they sit a short boat ride from the Canadian coast.", "People there are French citizens, they vote in French elections, and they pay for things in euros.", "So you can stand in North America, look at the Canadian shoreline, and still pay in European money.", "The bakeries sell baguettes, and the road signs are in French, just across the water from Newfoundland.", "These islands are all that remains of a much larger French empire that once covered a huge part of North America.", "If you enjoy strange places and facts like these, subscribe, because we find a new one every day.", "Now for something that cannot be fenced or taxed: the spot that your compass points to.", "Sixth: your compass does not point to the North Pole at all.", "It points to the magnetic north pole, a spot that was once up in the Canadian Arctic.", "And that spot never sits still. Liquid iron deep inside the Earth keeps moving, and the pole moves with it.", "In recent decades it has drifted away from Canada, heading across the Arctic Ocean toward Siberia.", "Scientists must update the world magnetic model regularly, because navigation systems depend on it.", "Your phone's compass can use that model too, so a wandering spot in the Arctic can affect the arrow on your map.", "Picture a landmark that wanders across the Arctic by itself. That is the planet's magnetic pole.", "And now the one I promised: a story with a rock, a flag, and a bottle of whisky.", "Seventh: Hans Island, a bare rock in the water between Canada and Greenland.", "It is about one square kilometre, with no trees and nobody living on it, just rock and ice.", "It sits in a narrow channel of sea, and both Canada and Denmark, which Greenland belongs to, said it was theirs.", "The argument began in the 1970s, when the two countries drew their sea border and left this rock undecided.", "Nobody fired a shot. Instead, visiting officials played a very polite game of one-upmanship.", "Canadian soldiers landed, raised a flag, and left a bottle of Canadian whisky behind.", "Then Danish visitors arrived, planted a Danish flag, and left a bottle of schnapps with a note: welcome to the Danish island.", "This went back and forth for years, and the media gave it a name: the Whisky War.", "It is probably the friendliest war in history, because the only weapons were bottles.", "Over time there were more flags, more visits and more careful diplomats on both sides, all over a rock nobody lived on.", "Then in June 2022, after almost fifty years of this, the two countries finally signed a deal.", "They did not hand it to one side. They drew a line across the island, following a natural ridge.", "The island was divided almost in half, and both sides now own a piece of it.", "That also means Canada now shares a land border with a European country, which was never true before.", "Greenland's leaders and Inuit from both sides took part in the talks, and Inuit keep access for hunting and fishing.", "So the biggest fact is this: a fight over a tiny rock ended with bottles, a ridge and a signature.", "Greenlanders call the island Tartupaluk, and some in Canada want that to be its official name.", "Remember the first line? Your map of Hans Island shows a rock that Canada and Denmark split down the middle in 2022.", "Now you know the story behind that line, from the first bottle of whisky to the final signature.", "Seven facts, one country, and not a single one of them is made up. Canada really is stranger than you think.", "Tomorrow: another country that looks perfectly ordinary on the map, and isn't."], "job": ""}, {"date": "2026-10-31", "kind": "Short", "category": "geography", "title": "Your Feet On White Stone Pools In Turkey", "hook": "Your feet walk through warm blue pools on white stone.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Pamukkale in Turkey is famous for white terraces filled with warm blue water. They are made of travertine, a stone left behind by mineral-rich spring water over a very long time. The name means cotton castle in Turkish.\n\n#Shorts #Pamukkale #PlacesThatShouldntExist", "script": ["Your feet walk through warm blue pools.", "This is Pamukkale in Turkey.", "Those white terraces look like snow.", "But they are solid stone.", "It is travertine, left behind by spring water.", "Minerals in the water harden layer by layer.", "Over time, it built whole hillsides.", "The Turkish name means cotton castle.", "So your feet walk on stone made by water."], "job": ""}, {"date": "2026-10-31", "kind": "Short", "category": "geography", "title": "Your torch lights a cave with its own clouds", "hook": "Your torch lights a cave with its own clouds.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Hang Son Doong in Vietnam is one of the biggest caves on Earth. Sunlight pours through collapsed roofs, so trees grow on the floor and clouds can form inside. Series: Places That Shouldn't Exist.\n\n#Shorts #Geography #Vietnam", "script": ["Your torch lights a cave with its own clouds.", "This is Hang Son Doong, in Vietnam.", "Two huge roof collapses let sunlight pour in.", "Trees and grass grow on the cave floor.", "Clouds form inside, drifting through the dark.", "It is one of the biggest caves on Earth.", "A river runs through it too.", "Outsiders only explored it in 2009.", "Your torch there lights up indoor weather.", "Tomorrow: ships sailing through sand."], "job": ""}, {"date": "2026-10-31", "kind": "Short", "category": "geography", "title": "Your ship seems to sail through sand", "hook": "Your ship in Egypt seems to sail across sand.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "From the shore of the Suez Canal, giant ships look like they glide straight across the Egyptian desert. The canal links the Mediterranean and the Red Sea. Series: Places That Shouldn't Exist.\n\n#Shorts #SuezCanal #Geography", "script": ["Your ship in Egypt seems to sail across sand.", "From the shore, giant vessels glide over desert.", "This is the Suez Canal in Egypt.", "It links the Mediterranean and the Red Sea.", "It runs about 193 kilometres.", "In 2021, one ship blocked it for six days.", "Indian cargo bound for Europe has long used this shortcut.", "So yes, ships really do sail through sand.", "Tomorrow: a Tesla parked in space."], "job": ""}, {"date": "2026-10-31", "kind": "Short", "category": "space", "title": "A Tesla has orbited the Sun since 2018", "hook": "Your car stays home. A Tesla orbits the Sun.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In February 2018 SpaceX launched a red Tesla Roadster on a Falcon Heavy rocket. In the driver's seat is a mannequin called Starman, and the car is still travelling around the Sun. Series: If You Were in Space.\n\n#Shorts #SpaceX #Space", "script": ["Your car stays home. A Tesla orbits the Sun.", "It launched in February 2018 on a SpaceX rocket.", "Behind the wheel sits a mannequin named Starman.", "He wears a full SpaceX spacesuit.", "The dashboard says Don't Panic.", "It has already flown past the orbit of Mars.", "Nobody is steering. It just keeps coasting.", "Your car stays home. Starman's keeps going.", "Tomorrow: your fan spins backwards on video."], "job": ""}, {"date": "2026-10-31", "kind": "Short", "category": "technology", "title": "Your ceiling fan can spin backwards on camera", "hook": "Your phone can film a ceiling fan spinning backwards.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Film a spinning fan or wheel with any phone and it can look slow, frozen or even reversed. It is the wagon-wheel effect: video is made of still frames, and the blades move just far enough between them to fool you. Try it right now.\n\n#Shorts #TryThis #Phone", "script": ["Your phone can film a ceiling fan spinning backwards.", "Switch on your fan and film it.", "Watch: the blades can slow, stop, or reverse.", "The fan is not changing direction at all.", "Video is just still frames, many per second.", "Your brain links them and sees backwards motion.", "It is called the wagon-wheel effect.", "So your fan never reversed, only the video.", "Tomorrow: planes landing below sea level."], "job": ""}, {"date": "2026-11-01", "kind": "Long video", "category": "geography", "title": "7 Insane Borders, Including a War Over Goats", "hook": "Two European countries nearly went to war over a rock with goats on it, and soldiers were sent in by helicopter.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Spain and Morocco nearly went to war in 2002 over Perejil, a bare goat island. This countdown also visits a runway that cars cross, a Spanish town inside France, a German village inside Switzerland, and ends on the tangled India-Bangladesh enclaves. Every border here is real, and you can find each one on a map.\n\n#borders #geography #mapfacts", "script": ["Two European countries nearly went to war over a rock with goats on it, and soldiers were sent in by helicopter.", "That is not a joke, and it is not a movie plot. It really happened in the year 2002.", "In this video you will see seven borders that make no sense, from runways to enclaves.", "One of them cuts a runway in half, and one hides a whole town inside another country.", "But the strangest of all is in India, and it involves land that changed countries at midnight.", "We will count down from seven to one, and every border is stranger than the last.", "So stay until the end, because the goat island is only number three.", "Let us start at number seven, with a runway that a road crosses.", "Number seven: a road that stops for airplanes. This is Gibraltar, a small British territory on the southern tip of Spain.", "Right at the Spanish border, the main road runs straight across the airport runway.", "When a plane is about to land, barriers come down and cars, bikes and walkers all wait.", "Then the plane lands, the barriers go up, and everyone carries on, as if nothing happened.", "The runway was built on a narrow strip of land during the Second World War.", "Spain does not accept that Britain owns that strip, so the airport itself sits on disputed land.", "So you can stand at a border crossing and watch a jet roll by a few metres away.", "Passports are checked on foot, and then you walk straight over the runway to enter town.", "That is odd, but at number six, a whole Spanish town is hiding inside France.", "Number six: a Spanish town that sits entirely inside France. It is called Llívia, in the Pyrenees mountains.", "Look at the map and you will see a small Spanish island, with France on every side.", "The reason goes back to a treaty in 1659, when Spain gave France a group of villages.", "But Llívia was officially a town, not a village, so the treaty never took it away.", "That tiny wording difference is why it is still Spanish more than three hundred years later.", "A neutral road links Llívia to Spain, so Spanish drivers can travel there without entering France.", "Llívia even has one of the oldest pharmacies in Europe, in a Spanish town surrounded by France.", "A border shaped by one missing word, and it is still on the map today.", "Next, a village where people pay with two different currencies, because Switzerland is all around them.", "Number five: Büsingen, a German village with no land link to Germany at all.", "It is surrounded by Switzerland, so to reach the rest of Germany you must cross Swiss land.", "Büsingen is part of Germany, but it sits inside the Swiss customs area, so its shops follow Swiss rules.", "Many shops accept Swiss francs as well as euros, so your wallet needs to be ready for both.", "It even has its own car number plates, which start with the letters BÜS.", "In 1918 most villagers voted to join Switzerland, but Switzerland refused.", "So they stayed German, in the middle of Switzerland, where they still live today.", "It is a quiet village, but it proves a border can wrap around a place like a ring.", "Now for a place in North America that you can only drive to by leaving your own country.", "Number four: Point Roberts, an American town you can only reach by road through Canada.", "It sits on the tip of a small peninsula, just south of a straight line drawn on the map.", "That line is the forty-ninth parallel, chosen as the border long ago by treaty.", "The line was straight, so it cut the peninsula, and the tip ended up in the United States.", "Today, to drive from Point Roberts to the rest of America, you must cross into Canada first.", "Then you cross back into the United States, which means two border checks for a normal trip.", "If you enjoy strange maps like this, subscribe, because there are more places like these on the channel.", "A simple straight line created a town that is American on paper and Canadian by road.", "And at number three, one rock nearly started a war between two friendly countries.", "Number three: Perejil Island, the goat island. Its name is the Spanish word for parsley.", "It is a bare rock, with almost nothing on it, only about two hundred metres off the coast of Morocco.", "Spain says it is Spanish, Morocco says it is Moroccan, and for decades nobody lived there.", "Some goats grazed on the rock, and that was about all there was.", "Then in July 2002, a small group of Moroccan soldiers landed there and set up a post.", "Spain called it a hostile act, because Spain has its own city of Ceuta only a few kilometres away.", "Ceuta and Melilla are Spanish cities on the African coast, and they are the only land borders between the EU and Africa.", "Spain sent warships, and for days two neighbours stared at each other over a narrow stretch of sea.", "On the morning of 17 July, Spanish special forces came in by helicopter and landed on the rock.", "They removed the handful of Moroccan soldiers, and no one was killed.", "Then American diplomats stepped in, and both sides agreed to go back to how things were before.", "So today, the rock is empty again, with no flag, no troops and no one living there.", "Two countries almost fought a war over a rock with no people and no buildings.", "At number two, a region of Russia that cannot be reached by land from Russia.", "Number two: Kaliningrad, a part of Russia that is cut off from the rest of Russia.", "It sits on the Baltic Sea, with Poland on one side and Lithuania on the other.", "After the Soviet Union broke up in 1991, the countries around it became independent.", "That left Kaliningrad as a separate piece, far from the Russian mainland.", "Travel between Kaliningrad and the rest of Russia by land means crossing other countries.", "Trains have had to cross Lithuania to get through, with special rules for the passengers.", "Imagine a piece of your own state sitting across foreign lands, with no road to it at home.", "But even this is not the strangest. For that, we need to go to India.", "Number one: the border enclaves of Cooch Behar, on the India and Bangladesh border.", "For decades, small pieces of India lay inside Bangladesh, and small pieces of Bangladesh lay inside India.", "These pockets were called enclaves, and they were scattered across the border like puzzle pieces.", "People living in them were cut off from their own country, with no easy road to it.", "Some villagers had little access to schools, hospitals or electricity, because the country around them did not govern their land.", "It gets stranger. In one place, there was Indian land inside Bangladeshi land inside Indian land inside Bangladesh.", "That plot was called Dahala Khagrabari, and it is often called the only one of its kind in the world.", "At midnight on 31 July 2015, India and Bangladesh finally swapped these pockets of land.", "In total, one hundred and sixty-two enclaves changed hands, and about fifty thousand people had to choose.", "For many, it meant a proper address, a vote and access to services from the country they lived in.", "It was one of the most tangled borders ever drawn, and it was right here in our own backyard.", "And that is why India has the strangest border of all, even if it was finally tidied up.", "So that is seven borders: a runway, a Spanish town in France, a German village in Switzerland, and more.", "And remember the goat island: two countries, helicopters, warships, and nobody hurt over a bare rock.", "Tomorrow: the country that has no border at its own front door. See you then."], "job": ""}, {"date": "2026-11-01", "kind": "Short", "category": "geography", "title": "Your plane lands below sea level", "hook": "Your plane lands below sea level in the Netherlands.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Amsterdam's Schiphol airport sits about three metres below sea level. It was built on the bed of a drained lake, and dikes and pumps keep the sea out. Series: Places That Shouldn't Exist.\n\n#Shorts #Netherlands #Geography", "script": ["Your plane lands below sea level in the Netherlands.", "Schiphol sits about three metres below sea level.", "Schiphol was once the bottom of a lake.", "Dikes hold the sea back.", "Pumps keep the land dry.", "About a quarter of the country is this low.", "Without dikes, much of it would flood.", "So yes, your plane lands below the sea.", "Tomorrow: a country two borders from any sea."], "job": ""}, {"date": "2026-11-01", "kind": "Short", "category": "geography", "title": "The country that is landlocked twice", "hook": "Your map hides a country that is landlocked twice.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Liechtenstein only touches Switzerland and Austria, and both of them are landlocked too. That makes it doubly landlocked: you cross two borders to reach a country with a coast. Only one other country is in the same position, Uzbekistan. Series: Places That Shouldn't Exist.\n\n#Shorts #Liechtenstein #Geography", "script": ["Your map hides a country that is landlocked twice.", "Liechtenstein has no coast, and neither do its neighbours.", "It touches only Switzerland and Austria.", "Both of those are landlocked too.", "Reaching a coastal country means crossing two borders.", "Only one other country is like this: Uzbekistan.", "Nepal needs just one border to reach India's coast.", "So Liechtenstein is landlocked, twice.", "Tomorrow: another place that shouldn't exist."], "job": ""}, {"date": "2026-11-01", "kind": "Short", "category": "space", "title": "Your Moon Footprints Could Last Millions of Years", "hook": "Your footprints on the Moon could last millions of years.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "The Moon has no wind and no flowing water, so Apollo boot prints are still sitting in the dust. Only tiny space dust slowly wears them down. Part of the If You Were in Space series.\n\n#Shorts #Moon #Space", "script": ["Your Moon footprints could last millions of years.", "On Earth, wind and rain erase footprints fast.", "The Moon has no wind at all.", "It has no flowing water either.", "So Apollo boot prints are still sitting there.", "Only tiny space dust slowly wears them down.", "Those prints are over fifty years old.", "Your Moon footprints could last millions of years.", "Tomorrow: the flag that did not survive."], "job": ""}, {"date": "2026-11-01", "kind": "Short", "category": "space", "title": "Your Moon Flag Fell Over When You Left", "hook": "Your flag on the Moon fell over when you left.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Buzz Aldrin said the lander's exhaust knocked the Apollo 11 flag over as they lifted off. It is one of the odd little details of leaving the Moon. Part of the If You Were in Space series.\n\n#Shorts #Apollo11 #Moon", "script": ["Your Moon flag fell over when you left.", "Apollo 11 planted a flag on the Moon.", "Then the lander engine fired to leave.", "Buzz Aldrin said the exhaust knocked it over.", "He watched it topple as they lifted off.", "The flag stood close to the lander.", "Later crews planted their flags farther away.", "Your Moon flag fell over when you left.", "Tomorrow: a black bar on your screen."], "job": ""}, {"date": "2026-11-01", "kind": "Short", "category": "technology", "title": "Your Phone Camera Sees a Bar Screens Hide", "hook": "Your phone camera can show a black bar rolling down a screen.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Point your phone camera at a laptop or TV and you may see a dark bar rolling down it. Screens redraw the picture many times a second, and your camera can catch that clash. It depends on the screen, so try a few.\n\n#Shorts #PhoneTricks #Tech", "script": ["Your phone camera can show a black bar on screens.", "Open your camera and point it at a laptop.", "Your eyes see one steady picture.", "But screens redraw the image many times a second.", "Your camera catches the screen mid-redraw.", "That clash shows up as a dark rolling band.", "It depends on the screen, so try a few.", "Your phone camera can show a black bar.", "Tomorrow: a country thinner than a ribbon."], "job": ""}, {"date": "2026-11-02", "kind": "Long video", "category": "geography", "title": "Why Spain Is Stranger Than You Think", "hook": "Your holiday in Spain can put you in Africa, and a goat island there once nearly started a war.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Spain keeps cities in Africa, a town inside France, and a clock that follows the wrong country. In 2002 it even sent troops to a bare rock called Perejil Island and nearly went to war with Morocco. Here are six true facts about Spain's time, borders and map that sound fake but are real.\n\n#Spain #Geography #StrangeFacts", "script": ["Your holiday in Spain can put you in Africa, and a goat island there once nearly started a war.", "That rock is real, it is bare, and in 2002 two countries almost went to war over it.", "By the end of this video, you will see the smallest war that never quite happened.", "But first, six facts that make Spain stranger than almost any country in Europe.", "Some are on the map, some are on your watch, and one is right on an airport runway.", "Let us start with the clock on your wrist, because Spain is living in the wrong time.", "Fact one: Spain is on the wrong time zone, and it has been that way for over eighty years.", "Look at a globe. Madrid sits roughly in line with London and Lisbon, yet its clocks follow Berlin and Paris.", "In 1940, Spain's ruler Franco moved the clocks forward one hour, to match Nazi Germany.", "When the war ended, Spain never changed the clocks back, and it still uses that same time today.", "So in summer, the sun in Madrid can set after nine thirty at night.", "That is one reason a Spanish dinner often starts at nine or even ten at night.", "Shops close for a long afternoon break, and the streets come alive again late in the evening.", "Even prime-time television starts late, close to ten at night, so the whole country lives a few hours behind its clock.", "People in Spain keep debating whether to switch to London time and finally fix it.", "Imagine eating dinner at ten at night and calling it normal. In Spain, that is just a Tuesday.", "Fact two: a Spanish town is stuck inside France, with French land on every single side.", "It is called Llívia, and it sits in the Pyrenees mountains, a short drive from the Spanish border.", "In 1659, Spain and France signed a treaty, and Spain handed over a whole set of villages.", "But Llívia was officially a town, not a village, so Spain kept it. One word saved it.", "Today it is a Spanish exclave, a small town with Spanish flags flying in the middle of France.", "A short road through French land links it to Spain, and that road is treated as neutral.", "Drive it, and you leave Spain, pass through France without stopping, and arrive back in Spain.", "Indian viewers may think of Dahagram, the Bangladeshi pocket inside India. Llívia is the same idea, in Europe.", "Its old pharmacy is one of the oldest in Europe, and people visit just to see it.", "The streets look like any Pyrenean town, with Spanish signs, Catalan voices and French hills all around.", "One small word in a treaty, written over three hundred years ago, still draws this border today.", "But Spain has an even stranger place, and this one has a road that crosses an airport runway.", "Fact three: at Gibraltar, a normal road crosses the airport runway, and traffic stops for airplanes.", "Gibraltar is a British territory at Spain's southern tip, with a huge rock rising above the town.", "Spain claims it, Britain keeps it, and people walk between the two every day.", "Walk out of the border gate and you step straight onto the runway road, called Winston Churchill Avenue.", "When a plane lands or takes off, the barriers drop, and cars, bikes and walkers all have to wait.", "Then the plane rolls across the exact spot where you were standing a few seconds earlier.", "Planes come in with the huge rock rising behind them, which makes it a famous airport to watch.", "The whole territory is smaller than a typical city district, yet it has its own government and its own police.", "If you like strange places and facts like these, subscribe, because there are plenty more coming.", "And now the land that really looks wrong on a map, because it sits in Africa and belongs to Spain.", "Fact four: Spain has two cities on Africa's coast, Ceuta and Melilla, and both have land borders with Morocco.", "Both have been under Spanish rule for centuries, long before Morocco became an independent country.", "They are the only places where the European Union has a land border with Africa.", "So a fence in Africa marks the edge of the EU, with Spanish police standing guard.", "People in Ceuta pay in euros, speak Spanish, and look out at Moroccan mountains from the beach.", "Morocco says both cities should belong to it, while Spain says they are as Spanish as Madrid.", "India knows this story too. Goa stayed Portuguese until 1961, long after India's independence.", "Ceuta sits so close to Europe that you can see the coast of Spain across the water.", "The Strait of Gibraltar is only about 14 kilometres wide at its narrowest, so Africa really is that close.", "Spain's reach into Africa does not stop there. Some of it sits even closer, out in the ocean.", "Fact five: the Canary Islands are Spanish, but they sit off the coast of Africa, not Europe.", "From Fuerteventura, Morocco is far closer than mainland Spain, which is more than a thousand kilometres away.", "They are part of Spain and the EU, so tourists pay in euros while looking toward the Sahara.", "The islands even have their own time zone, one hour behind mainland Spain.", "So you can take a flight within Spain and have your watch go back an hour.", "On Tenerife stands Mount Teide, the highest mountain in all of Spain, and it is a volcano.", "In winter, snow falls on its top, while the beaches below stay warm.", "At times, sand blows in from the Sahara and turns the sky orange and hazy.", "Now the story I promised: a rock so small that it nearly caused a war between two countries.", "Fact six: Perejil Island, a bare rock just off Morocco's coast, brought Spain and Morocco close to war.", "Perejil means parsley in Spanish. Morocco calls it Leila, and both countries say it is theirs.", "It has no houses and no people. The island is known mostly for goats.", "It sits only a few hundred metres from the Moroccan coast, not far from the Spanish city of Ceuta.", "For decades, neither country kept a flag or a soldier on it. It was simply nobody's rock.", "Then, on the eleventh of July 2002, a small group of Moroccan soldiers landed, raised a flag and set up camp.", "Morocco said it was watching for smugglers and illegal migrants. Spain heard something very different.", "Spain said the move broke the old understanding that nobody would occupy the rock, and asked Morocco to leave.", "The European Union backed Spain, while the Arab League backed Morocco, and Morocco still did not move.", "On the seventeenth of July, Spanish helicopters and navy ships came in at dawn.", "Spanish troops landed, took the handful of Moroccan soldiers, and raised a Spanish flag on the rock.", "No one was killed. The soldiers were flown to Ceuta and handed back to Morocco.", "Morocco was furious, and for a few days it looked like two countries might really start fighting.", "Then the American Secretary of State, Colin Powell, phoned both sides and helped them agree on a deal.", "The deal was simple: go back to how things were before the eleventh of July.", "Spain took its troops out, the Spanish flag came down, and the island went back to being empty.", "Even the name stays disputed: Perejil to Spain, Leila to Morocco, and Tura in Arabic.", "Today the dispute is still unresolved. Both claims remain, and the rock is still bare.", "Many people joked about a war over parsley, but soldiers and warships on both sides were really there.", "So yes, your holiday in Spain can put you in Africa, and a goat island really did nearly start a war.", "Tomorrow: the city that sits on two continents at once."], "job": ""}, {"date": "2026-11-02", "kind": "Short", "category": "geography", "title": "Your Map of Chile Is a Ribbon Country", "hook": "Your map of Chile shows a country shaped like a ribbon.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Chile stretches about 4,300 km from north to south but is only about 177 km wide on average. The Andes and the Pacific squeeze it into a thin strip. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Chile #Geography", "script": ["Your map of Chile shows a ribbon country.", "It stretches about 4,300 kilometres long.", "But it is only about 177 wide on average.", "The Andes mountains squeeze it from one side.", "The Pacific Ocean squeezes it from the other.", "Yet it runs from desert to glaciers.", "Your map of Chile shows a ribbon.", "Tomorrow: a lake split between India and China."], "job": ""}, {"date": "2026-11-02", "kind": "Short", "category": "geography", "title": "Your Pangong Lake Photo Is in Two Countries", "hook": "Your photo at Pangong Lake is taken on two countries at once.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Pangong Lake in Ladakh spans India and China. Its water is salty, yet it freezes over in winter. Part of the Places That Shouldn't Exist series.\n\n#Shorts #PangongLake #Ladakh", "script": ["Your Pangong Lake photo shows two countries.", "This Ladakh lake spans India and China.", "The border runs through the water itself.", "The water is salty, not fresh.", "Salty water is harder to freeze.", "Yet in winter the lake freezes over.", "Your Pangong photo shows two countries.", "Tomorrow: rice grown below sea level."], "job": ""}, {"date": "2026-11-02", "kind": "Short", "category": "geography", "title": "Your Kerala Rice Field Is Below Sea Level", "hook": "Your rice field in Kuttanad sits below sea level.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Kuttanad in Kerala is a region where farmers grow rice on land below sea level. They hold back the water with earth walls called bunds. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Kerala #Kuttanad", "script": ["Your Kuttanad rice field sits below sea level.", "Kuttanad is in Kerala, near the backwaters.", "Farmers grow rice on land lower than the sea.", "So water wants to flood every field.", "Farmers hold it back with earth walls.", "Those walls are called bunds.", "Your rice field sits below sea level.", "Tomorrow: another place that should not exist."], "job": ""}, {"date": "2026-11-02", "kind": "Short", "category": "space", "title": "Hammer and Feather Fell Together on the Moon", "hook": "Your hammer and feather would hit the Moon together.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "In 1971, Apollo 15 astronaut David Scott dropped a hammer and a feather at the same time on camera. They landed together because the Moon has almost no air to slow the feather. Series: Things That Sound Fake.\n\n#Shorts #Space #Apollo15", "script": ["Your hammer and feather would hit the Moon together.", "Apollo 15 astronaut David Scott actually did it.", "They landed at the exact same moment.", "On Earth, air slows the feather down.", "The Moon has almost no air at all.", "So gravity pulls everything down equally fast.", "It was 1971, and the camera caught it.", "Your hammer and feather fall together up there.", "Tomorrow: copy text from a photo of a page."], "job": ""}, {"date": "2026-11-02", "kind": "Short", "category": "technology", "title": "Your Phone Can Copy Text Off a Paper Page", "hook": "Your phone can copy the words off a printed page.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Open the Google app on any Android or iPhone, tap the Lens icon and point it at a book. The words become text you can copy and paste. Try it now with whatever is near you.\n\n#Shorts #PhoneTricks #GoogleLens", "script": ["Your phone can copy the words off a printed page.", "Open the Google app, tap the Lens icon.", "Point it at any book.", "Words on the paper light up.", "Tap them, and they become real text.", "Copy it, then paste it into a message.", "Try it now with any book nearby.", "Your phone just read a page for you.", "Tomorrow: a village inside an enclave."], "job": ""}, {"date": "2026-11-03", "kind": "Long video", "category": "geography", "title": "The Matterhorn Border Moves. 6 More Make No Sense", "hook": "Your hike near the Matterhorn can cross a border that moves with the weather.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Melting glaciers have moved the Swiss-Italian border near the Matterhorn, and the two countries agreed a new line. This countdown covers seven real borders that make no sense, from a Spanish town inside France to a village in India that was once land inside land inside land. Watch to the end for the strangest one.\n\n#borders #geography #facts", "script": ["Your hike near the Matterhorn can cross a border that moves with the weather. Melting ice is literally shifting the line between two countries.", "That is only one of seven real borders in this video that make no sense. And the last one is in India.", "By the end, you will see a piece of India that was land inside land inside land, inside another country.", "Each one is stranger than the one before it. So let's count down from seven.", "Every place here is on a normal map. Nothing is made up, and you can look all of them up yourself.", "Starting with a town that Spain owns, in the middle of France.", "Number seven. Llívia is a Spanish town, and France surrounds it on every side.", "In 1659, Spain and France signed a treaty and handed villages over to France.", "But Llívia was officially a town, not a village. So the treaty skipped it, and it stayed Spanish.", "Today you can stand in a Spanish town and see only French countryside around you.", "A later treaty, in 1866, made a special road to connect Llívia to the rest of Spain.", "It is called a neutral road. France cannot put a customs checkpoint on it.", "So you drive from France, through a strip that belongs to nobody's rules, into a Spanish town.", "That is a strange map. But the next one has a village living by two sets of rules.", "Number six is a village that wanted to leave its own country.", "Büsingen is a German village, and Switzerland almost completely surrounds it.", "In 1918, the villagers held their own vote about joining Switzerland. About 96 percent said yes.", "Switzerland said no, because Germany wanted too much money in exchange. So the village stayed German.", "Today it is politically part of Germany, but economically part of the Swiss customs area.", "Shops there can take both euros and Swiss francs. Your wallet needs to be ready for two currencies.", "And that is a village that is German on paper but Swiss in daily life.", "Now think about the opposite: a place that is Italian, but lives like Switzerland.", "That is number five, and it has a casino as big as the town.", "Campione d'Italia is Italian land on the shore of Lake Lugano, inside Swiss territory.", "The euro is the legal currency, but people there use the Swiss franc in daily life.", "Cars are registered with Swiss authorities, even though the town belongs to Italy.", "And the casino there is a giant landmark, with gambling rules that are different from both countries.", "So you can be in Italy and pay in Swiss money. But next, the border itself starts to move.", "Number four is the one from the start. A border that melts.", "In the high Alps, the Swiss-Italian border does not follow a fence or a river.", "It follows the watershed, the crest line of snow and glaciers, where water flows one way or the other.", "But glaciers are melting. When the ice shrinks, the crest line moves, and so does the border.", "If you like strange places and facts like this, a subscribe would help a lot. There are many more coming.", "Near Zermatt in Switzerland and Breuil-Cervinia in Italy, the line is no longer where the old map put it.", "So Switzerland and Italy agreed on a new border in 2023, and Switzerland approved it in 2024.", "Reports say Switzerland gains a little land, and the deal also covers mountain huts, like the Carrel refuge.", "The huts matter, because climbers sleep there. The countries want each hut to stay in the country it is in now.", "That is a border written in ice, and the ice is disappearing. Next, a piece of America only reachable through Canada.", "Number three starts with a map mistake from long ago.", "The Northwest Angle is part of Minnesota, in the United States, but it sits north of the rest of the state.", "Old treaty-makers worked from a map that was wrong about where the Mississippi River begins.", "When the border was drawn, the mistake left a small piece of Minnesota attached to the wrong side.", "To drive there by road, you have to pass through Canada, in the province of Manitoba.", "Imagine going home in your own country, and needing to cross another country to do it.", "It is a small corner of land and lakes, and it is still part of the United States.", "That is a mistake on a map. Next is a whole region cut off from its own country.", "Number two is bigger than any town. It is a piece of Russia that Russia cannot reach by land.", "Kaliningrad sits on the Baltic Sea, with Poland on one side and Lithuania on the other.", "Russia's main land is far to the east. So Kaliningrad is separated from it by other countries.", "The city used to be called Königsberg, and it was German until 1945.", "After the Second World War, it became Russian. Today it is a Russian region inside the European Union's neighbourhood.", "That is a big place that is cut off. But now we reach the one that India made even more complicated.", "Number one is in West Bengal, in the Cooch Behar area, along the India-Bangladesh border.", "For decades, there were small patches of Indian land inside Bangladesh, and Bangladeshi land inside India.", "These patches are called enclaves. There were more than 160 of them, all packed along one border.", "Imagine living in a village that is Indian, but every road out of it leads into another country.", "Residents often had trouble reaching schools, hospitals and officials, because the country around them was the other one.", "Then there was the strangest piece of all. It was called Dahala Khagrabari.", "It was Indian land, inside Bangladeshi land, inside Indian land, inside Bangladesh.", "It was the only third-order enclave in the world. That means land inside land inside land, inside a country.", "You could be standing on Indian soil and be three borders deep inside Bangladesh.", "The two countries agreed to fix this. At midnight on 31 July 2015, the enclaves were exchanged.", "India received 51 Bangladeshi enclaves. Bangladesh received 111 Indian enclaves.", "People living there could choose whether they wanted to live in India or in Bangladesh.", "For many, it meant they finally had a road, a school and a vote in the country they lived in.", "So the strangest border of all was not a wall or a war zone. It was a puzzle of tiny islands of land.", "And most of that puzzle is gone now, solved by one midnight in 2015.", "So that is seven borders. Spain inside France, and Germany inside Switzerland.", "Italy using Swiss money, and a Matterhorn border that melts and moves.", "A piece of Minnesota you reach through Canada, and a Russian region cut off from Russia.", "And India's land inside land inside land, in Bengal. All real, and all on the map.", "The Matterhorn one is still changing, because glaciers are still melting. The line you hiked on may not be the line next year.", "Your hike near the Matterhorn can cross a border that moves with the weather.", "Tomorrow: the country that has no border at its own front door."], "job": ""}, {"date": "2026-11-03", "kind": "Short", "category": "geography", "title": "A UAE Village Inside Oman Inside the UAE", "hook": "Your map of the UAE has a piece of Oman inside it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Madha is an Omani enclave surrounded by the UAE, and inside Madha sits Nahwa, a village that belongs to the UAE. Borders really can nest inside borders. Series: Places That Shouldn't Exist.\n\n#Shorts #Geography #PlacesThatShouldntExist", "script": ["Your map of the UAE has a piece of Oman inside it.", "It's called Madha, and it's Omani land.", "UAE territory surrounds it on every side.", "Now zoom in further.", "Inside Madha sits Nahwa, a UAE village.", "A UAE village inside Oman inside the UAE.", "Borders can nest inside borders like this.", "Your map's UAE contains Oman, which contains the UAE.", "Tomorrow: a capital city that's sinking."], "job": ""}, {"date": "2026-11-03", "kind": "Short", "category": "geography", "title": "Your Jakarta Trip Is to a Sinking City", "hook": "Your Jakarta trip is to a sinking city.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Parts of Jakarta are sinking, partly because of groundwater pumping, and the coast floods. Indonesia is building a new capital, Nusantara, on Borneo, and the sinking is one reason for the move. Series: Places That Shouldn't Exist.\n\n#Shorts #Jakarta #Geography", "script": ["Your Jakarta trip is to a sinking city.", "Parts of it drop a little every year.", "People pump groundwater from beneath the city.", "The land above slowly settles downward.", "Floods keep hitting the northern coast.", "So Indonesia is building a new capital.", "It's called Nusantara, on the island of Borneo.", "The sinking is one reason for the move.", "Pack for a capital that's slowly sinking.", "Tomorrow: golf on the Moon."], "job": ""}, {"date": "2026-11-03", "kind": "Short", "category": "space", "title": "A Man Played Golf on the Moon in 1971", "hook": "Your golf game on the Moon really happened.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "On Apollo 14 in 1971, Alan Shepard attached a golf club head to a tool handle and hit golf balls on the Moon. His stiff spacesuit meant a one-handed swing. Series: If You Were in Space.\n\n#Shorts #Space #Apollo14", "script": ["Your golf game on the Moon really happened.", "Alan Shepard did it on Apollo 14.", "He brought a golf club head along.", "He clipped it onto a tool handle.", "Then he swung at real golf balls.", "His stiff spacesuit forced a one-handed swing.", "It was 1971, and the camera caught it.", "Low gravity, no air, nothing to slow it.", "That's golf on the Moon, and it happened.", "Tomorrow: cars left parked up there."], "job": ""}, {"date": "2026-11-03", "kind": "Short", "category": "space", "title": "Three Cars Are Still Parked on the Moon", "hook": "Your Moon visit would find three parked cars.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Apollo 15, 16 and 17 each left a lunar rover on the Moon where the crews drove it last. They are still up there today. Series: If You Were in Space.\n\n#Shorts #Space #Apollo", "script": ["Your Moon visit would find three parked cars.", "They're lunar rovers from Apollo 15, 16 and 17.", "Astronauts drove them across the surface.", "Then they left them right where they stopped.", "Nobody brought them home.", "No rain or air means no rust.", "They've been sitting there since the early 1970s.", "So yes, three cars are parked on the Moon.", "Tomorrow: more facts that sound fake."], "job": ""}, {"date": "2026-11-03", "kind": "Short", "category": "technology", "title": "Your Phone Screen Taps Itself With Water", "hook": "Your phone screen can tap itself when water sits on it.", "status": "Script ready", "seconds": null, "publish_at": "", "uploaded": "", "url": "", "description": "Water drops on a touchscreen can fool it into registering touches that nobody made. Capacitive screens sense electrical charge, and water changes that charge. Watch one drop on your screen, then wipe it dry.\n\n#Shorts #Technology #PhoneTricks", "script": ["Your phone screen can tap itself with water.", "Drops on glass look like fingers to it.", "Touchscreens sense electric charge, not pressure.", "Water changes that charge, so it gets confused.", "Apps open and letters type by themselves.", "Watch one drop on your screen, then wipe it.", "Dry it off
