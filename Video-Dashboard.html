Set By the Moon", "hook": "Your Diwali date is picked by the moon, not the calendar.", "status": "Published", "seconds": 25.4, "publish_at": "", "uploaded": "2026-10-17 21:39", "url": "https://youtube.com/shorts/asoyquIrBfY", "description": "Diwali always falls on Amavasya, the new moon night of the month of Kartika. That is why the date jumps around every year on the usual calendar. It is the one night the moon vanishes, so the sky is as dark as it gets and every diya shines brightest. Series: Festival Facts That Sound Fake.\n\n#Shorts #Diwali #Facts", "script": ["Your Diwali date is picked by the moon, not the calendar.", "That is why it lands on a new date every year.", "Diwali always falls on Amavasya, the new moon night.", "On that night, the moon is completely invisible.", "So the sky is as dark as it ever gets.", "That is when a single diya shines the brightest.", "The festival of lights waits for the darkest night.", "Your Diwali date is picked by the moon. Tomorrow: the city that sits in two countries at once."], "job": "20261017-2131-diwali-date-is-set-by-the-new-moon"}, {"date": "2026-10-16", "kind": "Short", "category": "geography", "title": "Your Phone Clock Jumps 15 Minutes Here", "hook": "Walk into Nepal and your phone clock jumps 15 minutes.", "status": "Published", "seconds": 24.3, "publish_at": "", "uploaded": "2026-10-16 19:21", "url": "https://youtube.com/shorts/AESvNADf5T4", "description": "Cross the India-Nepal border and your phone clock jumps by just 15 minutes. Nepal runs on UTC+5:45, while India runs on UTC+5:30. Almost every country uses whole or half hours, which makes this one of the odd places on the map. Part of the Places That Shouldn't Exist series.\n\n#Shorts #Geography #Nepal", "script": ["Walk into Nepal and your phone clock jumps 15 minutes.", "Not an hour. Not thirty minutes. Fifteen.", "India runs on a half hour offset.", "Nepal chose five forty-five instead.", "Almost nobody on Earth keeps time like that.", "Your phone follows it without asking you.", "Same mountains, same border, different time.", "So step across, and watch your clock jump 15 minutes.", "Next: the country with no time zone."], "job": "20261016-1757-nepal-s-15-minute-time-zone-offset-from-"}, {"date": "2026-10-16", "kind": "Short", "category": "geography", "title": "Your GPS Routes Through Canada to This US Town", "hook": "Your GPS would route you through Canada to reach this American town.", "status": "Published", "seconds": 27.6, "publish_at": "", "uploaded": "2026-10-16 19:21", "url": "https://youtube.com/shorts/jm_NasPMLKc", "description": "The Northwest Angle in Minnesota is part of the United States, but the only way to reach it by road is to drive through Canada. It is cut off from the rest of Minnesota by Lake of the Woods and the Canadian border. Series: Places That Shouldn't Exist. Next up: another border that breaks your mental map.\n\n#Shorts #Geography #MapFacts", "script": ["Your GPS would route you through Canada to reach this American town.", "It is called the Northwest Angle, in Minnesota.", "It is the northernmost point of the lower forty-eight states.", "But it sticks up above the rest of Minnesota.", "A big lake cuts it off from the state.", "So the only road there runs through Canada.", "You leave the United States, then enter it again.", "That is why your GPS keeps pointing at Canada.", "An American town, reached through another country.", "Next in this series: a border drawn through someone's kitchen."], "job": "20261016-1846-northwest-angle-the-minnesota-town-you-c"}, {"date": "2026-10-16", "kind": "Short", "category": "space", "title": "Your Candle Flame Turns Into a Ball", "hook": "If you lit a candle in space, the flame would turn into a blue ball.", "status": "Published", "seconds": 29.1, "publish_at": "", "uploaded": "2026-10-16 19:22", "url": "https://youtube.com/shorts/CrEgPn-YoLg", "description": "On Earth, a flame points up because hot air rises. In space there is no up, so a candle flame becomes a small, dim, blue ball. NASA has studied fires on the space station to learn how to keep astronauts safe. Next in the If You Were in Space series: what happens when you try to burp.\n\n#Shorts #IfYouWereInSpace #SpaceFacts", "script": ["If you lit a candle in space, the flame would turn into a blue ball.", "Here on Earth, your candle flame points up.", "That's because hot air rises and pulls the flame with it.", "In orbit, nothing rises, because there is no up.", "So the flame spreads out evenly in every direction.", "It burns dimmer, cooler, and glows blue.", "NASA has studied this on the space station to keep crews safe.", "So the flame you know is really gravity's shape.", "Light one in space, and it's a blue ball. Next: burping in space."], "job": "20261016-1849-candle-flames-in-microgravity-burn-as-bl"}, {"date": "2026-10-16", "kind": "Short", "category": "space", "title": "Your Food Tastes Bland in Space", "hook": "If you ate dinner in space, you would crave hot sauce.", "status": "Published", "seconds": 24.8, "publish_at": "", "uploaded": "2026-10-16 19:22", "url": "https://youtube.com/shorts/h6rNV1I1U1U", "description": "In space, fluid in your body shifts toward your head, so you feel stuffed up like you have a cold. Your food tastes bland, and astronauts often reach for spicy flavors and hot sauce. Even salt and pepper come as liquids, because loose grains would float around the cabin. Part of the series: If You Were in Space.\n\n#Shorts #Space #Astronaut", "script": ["If you ate dinner in space, you would crave hot sauce.", "Without gravity, fluid in your body drifts upward.", "Your head fills up like you have a cold.", "Your nose blocks, and food tastes bland.", "So astronauts reach for strong, spicy flavors.", "Even salt and pepper come as liquids up there.", "Loose grains would float into the equipment.", "So yes, your dinner in space would need hot sauce.", "Next in If You Were in Space: trying to sleep."], "job": "20261016-1857-space-makes-food-taste-bland-so-astronau"}, {"date": "2026-10-16", "kind": "Short", "category": "technology", "title": "Your Phone Has No Yellow Light", "hook": "Your phone shows yellow without a single yellow light.", "status": "Published", "seconds": 25.7, "publish_at": "", "uploaded": "2026-10-16 19:22", "url": "https://youtube.com/shorts/lkzq-dRYHkE", "description": "Your phone screen can show yellow without a single yellow light in it. Put a drop of water on the screen and look closely: you'll see tiny red, green and blue stripes, and that's all the screen uses. Works on any phone. Part of the Everyday Tech Secrets series.\n\n#Shorts #PhoneTricks #TechFacts", "script": ["Your phone shows yellow without a single yellow light.", "Put one drop of water on the screen.", "Look closely through the drop.", "You'll see tiny red, green and blue stripes.", "That's every light your screen has.", "Yellow is just red and green glowing together.", "White is all three at full power.", "Your eyes blend them, so you never notice.", "So your phone never makes yellow. Your eyes do.", "Next in Everyday Tech Secrets: your TV remote."], "job": "20261016-1903-phone-screen-makes-yellow-from-red-and-g"}, {"date": "2026-10-16", "kind": "Short", "category": "geography", "title": "Panama Puts the Pacific East of the Atlantic", "hook": "Sail from the Atlantic to the Pacific, and you end up east.", "status": "Published", "seconds": 23.4, "publish_at": "2026-10-17 22:00", "uploaded": "2026-10-16 22:26", "url": "https://youtube.com/shorts/5UIPbxm6bA0", "description": "In Panama, the Pacific end of the canal sits east of the Atlantic end. The reason is the S-shaped bend of the isthmus, not a mistake on your map. Open any map app and check it yourself.\n\nSeries: Places That Shouldn't Exist. #Shorts #Geography #Panama", "script": ["Sail from the Atlantic to the Pacific, and you end up east.", "That sounds backwards. The Pacific is supposed to be west.", "But Panama is not shaped like the map in your head.", "The country bends into a sideways S.", "The canal cuts across it, running southeast.", "So the Pacific end sits east of the Atlantic end.", "Open your map app and look at Colón and Panama City.", "Sail the Atlantic to the Pacific, and you end up east."], "job": "20261016-2211-panama-canal-the-pacific-end-is-east-of-"}, {"date": "2026-10-16", "kind": "Short", "category": "geography", "title": "A Red Light That Stops for Jets", "hook": "Your car has to stop at a red light for airplanes here.", "status": "Published", "seconds": 29.7, "publish_at": "2026-10-17 13:00", "uploaded": "2026-10-16 22:26", "url": "https://youtube.com/shorts/PbnvH_hHKp4", "description": "In Gibraltar, the main road runs straight across the airport runway. When a plane is due, the barriers drop and the traffic waits. Would you drive across it?\n\n#Shorts #Geography #Gibraltar", "script": ["Your car has to stop at a red light for airplanes here.", "This is Gibraltar, a tiny British territory in Europe.", "Its main road runs straight across the airport runway.", "No bridge. No tunnel. Just a road and a runway.", "When a plane is due, barriers drop and traffic stops.", "Walkers and cyclists wait too, right beside the tarmac.", "Then a full jet lands across the road you just drove.", "Barriers lift, and everyone drives over the runway again.", "Next time your light turns red, remember: here it's for planes."], "job": "20261016-2215-gibraltar-road-crosses-the-airport-runwa"}, {"date": "2026-10-16", "kind": "Short", "category": "space", "title": "Your Burp Brings Lunch Back in Space", "hook": "If you burped in space, you would throw up a little.", "status": "Published", "seconds": 23.3, "publish_at": "2026-10-17 18:00", "uploaded": "2026-10-16 22:26", "url": "https://youtube.com/shorts/aBZcKs_sJPE", "description": "In space, there is no gravity to separate gas from liquid in your stomach, so a burp can bring a bit of food up with it. That is also why fizzy drinks are a bad idea for astronauts. Next in the series: what would happen if you sneezed in space.\n\n#Shorts #Space #IfYouWereInSpace", "script": ["If you burped in space, you would throw up a little.", "On Earth, gravity keeps gas above the liquid in your stomach.", "That is why a burp lets only air out.", "In orbit, there is no up or down.", "Gas and liquid just float mixed together inside you.", "So when the gas pushes out, food comes along.", "Fizzy drinks make it worse, so astronauts usually skip them.", "So in space, even a tiny burp is a gamble."], "job": "20261016-2218-burping-in-space"}, {"date": "2026-10-15", "kind": "Short", "category": "geography", "title": "Your Front Door Picks Your Country", "hook": "Your front door decides which country you live in.", "status": "Published", "seconds": 20.6, "publish_at": "", "uploaded": "2026-10-15 21:04", "url": "https://youtube.com/shorts/pAiwlCpJIyg", "description": "In the twin towns of Baarle-Hertog (Belgium) and Baarle-Nassau (the Netherlands), the border snakes through streets, shops and even homes. For houses it cuts across, the country is set by where the front door is. Would you want to live on this line?\n\n#Shorts #Geography #BaarleHertog", "script": ["Your front door decides which country you live in.", "In one small town, the border is a mess.", "Belgium and the Netherlands are stitched together.", "White crosses on the pavement mark the line.", "Sometimes it cuts straight through a house.", "So which country is your living room in?", "The rule is simple: wherever the front door is.", "So your front door really does pick your country."], "job": "20261015-1929-baarle-hertog-and-baarle-nassau-houses-s"}, {"date": "2026-10-15", "kind": "Short", "category": "geography", "title": "The Land Nobody Owns Is Real", "hook": "You could walk onto land that belongs to nobody.", "status": "Published", "seconds": 23.2, "publish_at": "", "uploaded": "2026-10-15 21:07", "url": "https://youtube.com/shorts/GIJ3i178JEk", "description": "Bir Tawil is a patch of desert between Egypt and Sudan that no country claims. Two old borders disagree, and both countries chose to claim a different, better piece of land instead. It is one of the few places on Earth with no government calling it theirs.\n\n#Shorts #Geography #BirTawil", "script": ["You could walk onto land that belongs to nobody.", "It's called Bir Tawil, between Egypt and Sudan.", "Two old borders were drawn, and they disagree.", "Each country chose the bigger, better piece instead.", "That left this desert triangle with no owner.", "Nobody lives there, and no government wants it.", "One man even planted a flag and crowned his daughter princess.", "So yes, land that belongs to nobody is real."], "job": "20261015-1932-bir-tawil-the-land-no-country-claims"}, {"date": "2026-10-15", "kind": "Short", "category": "space", "title": "Your Tears Won't Fall in Space", "hook": "If you cried in space, your tears would never fall.", "status": "Published", "seconds": 24.7, "publish_at": "", "uploaded": "2026-10-15 21:08", "url": "https://youtube.com/shorts/0SB04Qope5Y", "description": "In microgravity, nothing pulls a tear down your cheek. Instead it clings to your eye and grows into a wobbling liquid ball, as astronaut Chris Hadfield showed on camera. Here is what crying actually looks like in orbit.\n\n#Shorts #Space #Astronauts", "script": ["If you cried in space, your tears would never fall.", "On Earth, gravity pulls each tear down your cheek.", "On the space station, gravity barely pulls on anything.", "So the tear just stays on your eye.", "It keeps growing into a wobbling ball of water.", "Astronaut Chris Hadfield filmed this himself, on camera.", "The water sticks to your face until you wipe it off.", "In orbit, your tears never fall. They just pile up."], "job": "20261015-1935-crying-in-space-tears-don-t-fall"}, {"date": "2026-10-15", "kind": "Short", "category": "technology", "title": "Your Phone Is Secretly a Seismometer", "hook": "Your phone can warn you about an earthquake before you feel it.", "status": "Published", "seconds": 21.7, "publish_at": "", "uploaded": "2026-10-15 21:09", "url": "https://youtube.com/shorts/LJEjUP7nmsU", "description": "Opted-in Android phones use their built-in motion sensor to spot the first small waves of an earthquake and report them to Google, which can send warnings to people before the strong shaking reaches them. Check your phone's settings for Earthquake Alerts. It needs a connection and an Android phone.\n\n#Shorts #Android #TechFacts", "script": ["Your phone can warn you about an earthquake before you feel it.", "Inside it sits a tiny motion sensor.", "Millions of Android phones share what it feels.", "One phone feels a small, early shake.", "Many phones nearby report the same thing.", "Google's servers confirm it and send alerts.", "Your alert can land before the strong shaking does.", "So yes, your phone can feel quakes before you do."], "job": "20261015-2045-android-phones-as-a-crowdsourced-earthqu"}, {"date": "2026-10-15", "kind": "Short", "category": "technology", "title": "Your iPhone Back Is Secretly a Button", "hook": "Tap the back of your iPhone twice right now.", "status": "Published", "seconds": 21.6, "publish_at": "", "uploaded": "2026-10-15 21:10", "url": "https://youtube.com/shorts/fP5NdFr-p2o", "description": "Your iPhone has a hidden button on its back. It's called Back Tap, and it can take a screenshot, turn on the flashlight or run your own shortcut when you double or triple tap. Go to Settings, Accessibility, Touch, Back Tap. It needs an iPhone 8 or newer on iOS 14 or later.\n\nTomorrow: another thing your phone does that you never knew.\n\n#Shorts #iPhoneTips #PhoneHacks", "script": ["Tap the back of your iPhone twice right now.", "Nothing happens, because the button is switched off.", "Apple hid a secret button on the back.", "Open Settings, then Accessibility, then Touch.", "Scroll to the bottom and tap Back Tap.", "Pick what a double tap should do.", "Screenshot, flashlight, or your own shortcut.", "It even works through most phone cases.", "Now tap the back of your iPhone twice."], "job": "20261015-2049-iphone-back-tap-hidden-button"}, {"date": "2026-10-14", "kind": "Short", "category": "technology", "title": "Your Phone Has a Secret Magnet Sensor", "hook": "Your compass app can feel metal you cannot see.", "status": "Published", "seconds": 24.4, "publish_at": "", "uploaded": "2026-10-14 22:01", "url": "https://youtube.com/shorts/1F3jYZpJxIc", "description": "Your phone has a built-in sensor that measures magnetic fields, and it's what powers the compass app. Hold a magnet near your phone and the compass swings away from north. Try it yourself, but keep strong magnets away from cards and your screen.\n\n#Shorts #Tech #PhoneTricks", "script": ["Your compass app can feel metal you cannot see.", "Grab any magnet, like one off your fridge.", "Now slowly move it toward your phone.", "Watch the compass needle spin away from north.", "Your phone has a tiny magnetic field sensor inside.", "It measures Earth's magnetic field to find north.", "A magnet nearby drowns out Earth's weak signal.", "Some apps even turn it into a metal detector.", "So yes, your compass can feel metal you cannot see."], "job": "20261014-2138-phone-magnetometer-detects-hidden-magnet"}, {"date": "2026-10-14", "kind": "Short", "category": "technology", "title": "Your Watch Spits Water Out With Sound", "hook": "Why does your watch make a weird tone after swimming?", "status": "Published", "seconds": 19.1, "publish_at": "", "uploaded": "2026-10-14 22:02", "url": "https://youtube.com/shorts/dR_7ompPMqk", "description": "If you have an Apple Watch, you can try this right now. Water Lock turns off touch, and when you unlock it with the Digital Crown, the watch plays tones that push water out of the speaker. That odd sound after a swim is your watch clearing itself.\n\n#Shorts #AppleWatch #TechFacts", "script": ["Why does your watch make a weird tone after swimming?", "That sound is pushing water out of the speaker.", "On Apple Watch, it is called Water Lock.", "Turn it on from Control Center.", "Then hold the Digital Crown to unlock.", "The watch plays tones, and the water leaves.", "Sound alone clears the speaker holes.", "So that weird tone is your watch drying itself."], "job": "20261014-2144-apple-watch-water-lock-ejects-water-with"}, {"date": "2026-10-14", "kind": "Short", "category": "technology", "title": "Your Phone Knows What Floor You're On", "hook": "Your phone knows when you change floors, and you never told it.", "status": "Published", "seconds": 23.7, "publish_at": "", "uploaded": "2026-10-14 22:02", "url": "https://youtube.com/shorts/ynqedkvb3fI", "description": "Most phones have a tiny air pressure sensor called a barometer. It notices the small pressure change when you ride an elevator or climb stairs, so your phone can tell when you change floors. Try a free barometer or sensor app, then ride an elevator and watch the reading move.\n\n#Shorts #PhoneTricks #TechFacts", "script": ["Your phone knows when you change floors, and you never told it.", "Inside it is a tiny air pressure sensor.", "Higher up, the air pushes down a little less.", "Even one floor changes the reading.", "Your phone feels that shift when you ride an elevator.", "Open any free barometer app and try it.", "Watch the number move as you climb the stairs.", "Your phone can feel the height of a building.", "That's how it knows your floor, and you never told it."], "job": "20261014-2146-phone-barometer-detects-floor-changes"}, {"date": "2026-10-14", "kind": "Short", "category": "space", "title": "Your Sky Has a Star With People Inside", "hook": "Your sky has a moving star with people inside.", "status": "Published", "seconds": 25.8, "publish_at": "", "uploaded": "2026-10-14 22:02", "url": "https://youtube.com/shorts/1BTi-do5gHw", "description": "That bright dot gliding across the night sky can be the International Space Station, and astronauts are living on it. NASA's Spot the Station site and app list the exact times it passes over your location. It's usually visible near dawn or dusk, looks like a fast, steady plane, and crosses the sky in a few minutes. Try it tonight and tell us what you saw.\n\n#Shorts #Space #ISS", "script": ["Your sky has a moving star with people inside.", "It's the International Space Station, flying right over your house.", "No telescope needed, just your own eyes.", "It looks like a bright, steady plane with no blinking lights.", "But it's way higher, and moves thousands of miles an hour faster.", "It crosses your whole sky in just a few minutes.", "NASA's Spot the Station app tells you exactly when.", "Open it now and check tonight's pass.", "Because your sky has a moving star with people inside."], "job": "20261014-2149-spotting-the-international-space-station"}, {"date": "2026-10-14", "kind": "Short", "category": "technology", "title": "Your Headphones Are Secretly Microphones", "hook": "Your speaker can hear you, and you can prove it.", "status": "Published", "seconds": 21.2, "publish_at": "", "uploaded": "2026-10-14 22:02", "url": "https://youtube.com/shorts/T1c1xlcEAWY", "description": "Your headphones can also work as a microphone, because a speaker and a microphone are built almost the same way. Plug wired earbuds into a mic input and talk into them to test it on your own gear. The sound is rough, but it works.\n\n#Shorts #TechFacts #Headphones", "script": ["Your speaker can hear you, and you can prove it.", "Grab any pair of wired earbuds.", "Plug them into a microphone input.", "Now talk into one of the earbuds.", "Your voice shows up as a recording.", "A speaker is just a microphone running backwards.", "Sound shakes the cone, and that makes electricity.", "The quality is bad, but it works.", "So yes, your speaker can hear you."], "job": "20261014-2154-headphones-and-speakers-work-as-micropho"}, {"date": "2026-10-13", "kind": "Short", "category": "geography", "title": "2 Miles Apart, 1 Day Apart", "hook": "If you live on this island, your neighbor 2 miles away is already living in tomorrow.", "status": "Published", "seconds": 25.2, "publish_at": "", "uploaded": "2026-10-13 10:19", "url": "https://youtube.com/shorts/aB3iScdPFbU", "description": "Two islands sit only two miles apart in the Bering Strait, but the International Date Line runs right between them. One island is always a full day ahead of the other, so neighbors are never on the same calendar date.\n\n#Shorts #Geography #DidYouKnow", "script": ["Your neighbor two miles away is already living in tomorrow.", "These are the Diomede Islands, in the Bering Strait.", "Only two miles of water separate them.", "But the international date line cuts right between them.", "One island is Russian, the other American.", "The Russian island is nicknamed Tomorrow Island.", "The American one is nicknamed Yesterday Island.", "So residents can stare across the water at a different day.", "Two miles apart, but never on the same date."], "job": "20261013-1007-diomede-islands-two-miles-apart-but-21-h"}, {"date": "2026-10-13", "kind": "Short", "category": "space", "title": "Venus Has a Birthday Problem", "hook": "If you lived on Venus, your year would end before your day did.", "status": "Published", "seconds": 27.5, "publish_at": "", "uploaded": "2026-10-13 21:26", "url": "https://youtube.com/shorts/FV8gX4U9hn8", "description": "Venus spins so slowly it finishes a full trip around the sun before it finishes spinning once. That means a Venusian year is shorter than a single Venusian day. Wild, but it checks out.\n\n#Space #Shorts #Venus", "script": ["If you lived on Venus, your year would end before your day did.", "Venus spins so slowly, one full day takes longer than its whole orbit.", "It circles the sun faster than it manages to turn once.", "So a Venus year finishes before a Venus day even does.", "Blame its backwards spin, nothing else in the solar system turns that way.", "Stand on Venus and the sun barely crawls across the sky.", "Which means on Venus your year always ends before your day does."], "job": "20261013-1013-venus-s-day-is-longer-than-its-year"}, {"date": "2026-10-13", "kind": "Short", "category": "technology", "title": "Your Phone Camera Can See Light You Can't", "hook": "Point your TV remote at your phone camera right now.", "status": "Published", "seconds": 24.4, "publish_at": "", "uploaded": "2026-10-13 10:19", "url": "https://youtube.com/shorts/iKhRk3Y50M4", "description": "Your eyes can't see infrared light, but most phone camera sensors can. Grab any TV remote, press a button in front of your camera, and watch the invisible beam light up on screen.\n\n#Shorts #TechFacts #HiddenFeature", "script": ["Point your TV remote at your phone camera right now.", "Press any button and watch the camera screen.", "A glowing white light flickers where you see nothing.", "That's infrared light, completely invisible to your eyes.", "Your eyes only catch a narrow slice of light.", "Camera sensors are built without that same filter.", "So it picks up wavelengths your eyes block out.", "Weak flicker means your remote's batteries are dying.", "Go point that remote at your camera again."], "job": "20261013-1016-phone-cameras-can-see-infrared-light-inv"}, {"date": "2026-10-13", "kind": "Short", "category": "geography", "title": "Your Map Has Been Lying About Africa", "hook": "Nobody tells you why you should stop trusting Mercator's map — Africa is bigger than it looks.", "status": "Published", "seconds": 22.0, "publish_at": "", "uploaded": "2026-10-13 21:56", "url": "https://youtube.com/shorts/KcVf93fpReU", "description": "Mercator's world map stretches land near the poles and shrinks land at the equator, so Africa looks far smaller than it really is. Line it up for real and it swallows the US, China, India, Japan, and most of Europe. Next time you look at a map, remember: Africa isn't small, your map just lies about it.\n\n#geography #mapfacts #Shorts", "script": ["Your map lies about Africa's size.", "Greenland looks almost as big as Africa.", "In real life, that's not close.", "Africa can fit the US and China.", "Add India, Japan, and most of Europe.", "That's several countries swallowed by one continent.", "Blame an old map trick called Mercator.", "It stretches the poles, shrinks the equator.", "So your map is still lying to you."], "job": "20261013-2117-africa-s-real-size-vs-mercator-map-disto"}, {"date": "2026-10-13", "kind": "Short", "category": "space", "title": "This Planet Rains Glass Sideways", "hook": "You won't believe this, but glass rains sideways here.", "status": "Published", "seconds": 26.1, "publish_at": "", "uploaded": "2026-10-13 21:56", "url": "https://youtube.com/shorts/hxG2NSAJ8KI", "description": "On HD 189733b, a cobalt-blue exoplanet 63 light-years away, winds howl near 4,500 miles per hour, melting silicate particles into glass that gets blasted sideways instead of falling down. NASA's Hubble telescope helped reveal this planet's strange blue color and brutal weather. It's one of the strangest skies ever found outside our solar system.\n\n#Space #Exoplanet #Shorts", "script": ["You won't believe this, but glass rains sideways here.", "This is HD 189733b, a real planet.", "It's a cobalt blue world in space.", "Winds there howl near 4,500 miles per hour.", "Silicate particles turn molten, forming tiny glass drops.", "Those winds blast the glass sideways, not down.", "No umbrella survives weather like that.", "So yes, somewhere out there, it rains glass."], "job": "20261013-2123-the-exoplanet-where-it-rains-glass-sidew"}, {"date": "2026-10-13", "kind": "Short", "category": "technology", "title": "This USB Cable Hacks Your Laptop", "hook": "You are probably charging your phone with a cable that can drain your bank account.", "status": "Published", "seconds": 27.1, "publish_at": "", "uploaded": "2026-10-14 09:33", "url": "https://youtube.com/shorts/Oj230EpywJs", "description": "A charging cable that looks completely normal can secretly act as a keyboard and type commands the moment you plug it in. It even creates its own WiFi hotspot so someone can control it from across a room. Security researchers built it to prove how easy it is to hide.\n\n#Shorts #TechFacts #CyberSecurity", "script": ["You are probably charging your phone with a cable that can drain your bank account.", "It looks exactly like a normal charging cable.", "But inside, a tiny chip hides where no one checks.", "Plug it into a laptop, and it starts typing on its own.", "Your computer thinks a person is at the keys.", "The cable even broadcasts its own WiFi signal.", "Someone nearby can take control from their phone.", "Researchers built it to prove how easy this is to hide.", "So next time, check the cable, not just the plug."], "job": "20261013-2159-malicious-usb-c-charging-cable-o-mg-cabl"}, {"date": "2026-10-13", "kind": "Short", "category": "geography", "title": "Earth's 0,0 Point Is Not Supposed to Exist", "hook": "You have never set foot here, but your apps keep sending strangers to 0,0.", "status": "Published", "seconds": 31.2, "publish_at": "", "uploaded": "2026-10-14 09:33", "url": "https://youtube.com/shorts/ERaoda6ts2c", "description": "Where the equator meets the prime meridian, there is no land, just open ocean and a single research buoy. But broken GPS software still drops people there by the thousands, turning empty water into the most visited fake place on Earth.\n\n#Shorts #Geography #NullIsland", "script": ["You have never set foot here, but your apps keep sending strangers to 0,0.", "This exact spot sits where the equator crosses the prime meridian.", "There is no island there, only deep water and one lonely buoy.", "But mapping software treats zero, zero as its default answer.", "So every time a phone or app loses your location, it guesses here.", "People, events, even entire companies get mapped to this empty water.", "Cartographers even gave the spot a nickname, Null Island.", "So next time your GPS freezes, remember who it secretly visits."], "job": "20261013-2205-null-island-the-fake-place-at-0-0-where-"}, {"date": "2026-10-13", "kind": "Short", "category": "space", "title": "Space Makes You 2 Inches Taller", "hook": "If you went to space you'd come back taller", "status": "Published", "seconds": 24.1, "publish_at": "", "uploaded": "2026-10-14 09:33", "url": "https://youtube.com/shorts/vbzAgBd9rpE", "description": "No gravity pressing down means your spinal discs expand and you actually grow in orbit. NASA has to build spacesuits roomier to account for it, and the extra height disappears once astronauts land back on Earth.\n\n#space #astronauts #Shorts", "script": ["If you went to space, you'd come back taller.", "No gravity pressing down means your spine stretches out.", "Astronauts can gain up to two inches in orbit.", "NASA actually builds spacesuits roomier for this.", "The discs between your vertebrae expand with no weight on them.", "Back pain is common while the body adjusts up there.", "Land back on Earth, and gravity squeezes you right back down.", "So yeah, go to space and you'd come back taller."], "job": "20261013-2211-astronauts-grow-taller-in-space-due-to-s"}, {"date": "2026-10-13", "kind": "Short", "category": "technology", "title": "The Elevator Button That Does Nothing", "hook": "Why have you never closed an elevator door?", "status": "Published", "seconds": 18.4, "publish_at": "", "uploaded": "2026-10-14 09:33", "url": "https://youtube.com/shorts/BoUGupsguEk", "description": "That close-door button you mash every trip? Most are not even wired to the door. Accessibility rules force elevators to stay open long enough that the button cannot speed things up anyway.\n\n#Shorts #Technology #LifeHacks", "script": ["Why have you never closed an elevator door?", "That button you mash does nothing.", "It is not wired to anything at all.", "Accessibility law forces doors open for everyone.", "Only a staff key makes it work.", "Technicians often disconnect it after complaints.", "You never controlled that door at all.", "So why do you still press it?"], "job": "20261013-2253-the-elevator-close-door-button-does-noth"}, {"date": "2026-10-13", "kind": "Short", "category": "geography", "title": "Alaska's 71-Mile Hemisphere Glitch", "hook": "You think you know which US point is farthest east. You don't.", "status": "Published", "seconds": 25.1, "publish_at": "", "uploaded": "2026-10-14 09:33", "url": "https://youtube.com/shorts/LtVUGwzk5-o", "description": "An uninhabited Aleutian island sits just past the 180th meridian, so the US owns land in the Eastern Hemisphere. That makes one tiny island both the easternmost and westernmost point in the country, 71 miles apart.\n\n#Shorts #Geography #Alaska", "script": ["You think you know which US point is farthest east. You don't.", "It's not Maine. It's not Florida.", "It's a tiny volcanic island off Alaska.", "The Aleutian chain crosses the 180th meridian.", "That line splits east from west on Earth.", "So part of Alaska sits in the Eastern Hemisphere.", "That makes it America's easternmost point.", "The westernmost US point sits just 71 miles away.", "So you still don't know which point is farthest east."], "job": "20261013-2257-alaska-s-aleutian-islands-straddle-the-1"}, {"date": "2026-10-12", "kind": "Short", "category": "", "title": "Your Phone Secretly Maps 21 Points On Your Hand", "hook": "Your phone turns your hand into twenty-one glowing points before you even notice it moved.", "status": "Rejected", "seconds": 31.0, "publish_at": "", "uploaded": "", "url": "", "description": "Your phone never sees a hand, it sees twenty-one tracked points and guesses the rest in real time. This is the same system behind AR filters, pinch gestures, and sign language apps, and you can watch it run live in your own browser with Google's MediaPipe hand landmarker demo.\n\n#Shorts #HandTracking #AR", "script": ["Your phone turns your hand into twenty-one glowing points before you even notice it moved.", "It's not seeing a hand, it's running a model trained on millions of hand photos.", "That model guesses where every knuckle and fingertip sits, dozens of times a second.", "That's how a filter snaps a ring onto your finger, no gloves needed.", "Try it yourself, Google's hand landmarker demo runs live in your browser.", "Move your hand and those same dots track you back, the same grid drawing on you the whole time you've watched this."], "job": "20261012-1932-how-hand-tracking-turns-your-hand-into-2"}, {"date": "2026-10-12", "kind": "Short", "category": "technology", "title": "Your Spacebar Is Secretly a Trackpad", "hook": "Stop tapping your screen to fix one letter, it is wasting your time.", "status": "Published", "seconds": 21.2, "publish_at": "", "uploaded": "2026-10-12 20:06", "url": "https://youtube.com/shorts/SLjOr_6AXHo", "description": "Your phone keyboard has a hidden cursor mode and most people never find it. Press and hold the spacebar and the keys fade out, turning the whole keyboard into a trackpad you can slide your thumb across. Works on both iPhone and Android, no app, no setting to turn on.\n\n#Shorts #PhoneTricks #HiddenFeatures", "script": ["Stop tapping your screen to fix one letter.", "Your keyboard has a hidden cursor mode.", "Press and hold the spacebar right now.", "Watch the letters fade into blank grey keys.", "Now slide your thumb to move the cursor.", "Drop it exactly where you need to edit.", "Works the same on iPhone and Android.", "No app, no setting, it was already there.", "So stop tapping, just hold and slide."], "job": "20261012-1949-spacebar-trackpad-trick-on-phone-keyboar"}, {"date": "2026-10-12", "kind": "Short", "category": "space", "title": "Astronauts See 16 Sunsets a Day", "hook": "If you went to the space station you would never see one sunset", "status": "Published", "seconds": 26.0, "publish_at": "", "uploaded": "2026-10-12 21:08", "url": "https://youtube.com/shorts/6PFNwG4f_0Q", "description": "The International Space Station circles Earth every 90 minutes, so the crew watches the sun rise and set about 16 times in a single day. No calendar up there works the way yours does.\n\n#Space #Astronauts #Shorts", "script": ["If you lived in space, you would see sixteen sunsets a day.", "The space station circles Earth every ninety minutes.", "That means the sun rises and sets over and over.", "Astronauts see sixteen sunrises in one single day.", "Their bodies have no idea when night should start.", "So crews live on strict schedules, not on sunlight.", "One day up there holds sixteen sunrises and sixteen sunsets.", "And while you watched this, they just saw another one."], "job": "20261012-2057-astronauts-on-the-iss-see-16-sunrises-an"}, {"date": "2026-10-12", "kind": "Short", "category": "geography", "title": "Point Nemo Is Closer to Space Than to People", "hook": "You will never be closer to astronauts than at this one spot on Earth.", "status": "Published", "seconds": 21.3, "publish_at": "", "uploaded": "2026-10-12 21:08", "url": "https://youtube.com/shorts/bptrOy8mYeM", "description": "There's a point in the ocean so remote that astronauts on the space station are the nearest humans to it. Point Nemo sits over a thousand miles from the closest land, making it Earth's most isolated spot. It's also where old spacecraft go to retire.\n\n#PointNemo #Geography #Shorts", "script": ["You'll never be closer to astronauts than here.", "It's called Point Nemo, the loneliest spot on Earth.", "Nearest land is over a thousand miles away.", "But the space station flies right overhead.", "When it passes, those astronauts are your nearest neighbors.", "Not one single person is closer to you.", "That's why old spacecraft get dumped there too.", "One spot on Earth, closer to space than people."], "job": "20261012-2102-point-nemo-the-ocean-spot-closer-to-astr"}], "built": "23 Oct 2026 11:20", "lastRun": "Autopilot run 22 Oct 2026 22:02\nYouTube: connec document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{filter=c.dataset.k;cards();list()});}
function list(){const q=document.getElementById("q").value.toLowerCase(),k=document.getElementById("kind").value;
const rows=D.rows.filter(r=>(!filter||r.status===filter)&&(!k||r.kind===k)&&(!q||(r.title+" "+r.hook+" "+r.script.join(" ")).toLowerCase().includes(q)));
document.getElementById("list").innerHTML=rows.slice(0,800).map((r,i)=>`<div class="row" data-i="${i}"><div>${esc(r.date)}<div class="m">${esc(r.kind)}</div></div>
<div class="m">${esc(r.category)}${r.seconds?"<br>"+Math.floor(r.seconds/60)+":"+String(Math.round(r.seconds%60)).padStart(2,"0"):""}</div>
<div><div class="t">${esc(r.title)||"<span class=m>(topic planned, script not written yet)</span>"}</div><div class="m">${esc(r.hook)}</div></div>
<div><span class="pill ${CLS[r.status]||"s-grey"}">${esc(r.status)}</span>${r.publish_at?`<div class="m">public at ${esc(r.publish_at)}</div>`:""}</div></div>
<div class="detail" id="d${i}">${r.url?`<p><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>${r.uploaded?" · uploaded "+esc(r.uploaded):""}</p>`:""}
${r.script.length?`<b>Script</b><ol>${r.script.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:"<p class=m>No script yet.</p>"}
${r.description?`<b>Description</b><p style="white-space:pre-wrap">${esc(r.description)}</p>`:""}${r.job?`<p class=m>job: ${esc(r.job)}</p>`:""}</div>`).join("")||"<div class=row>No videos match.</div>";
document.querySelectorAll(".row[data-i]").forEach(el=>el.onclick=()=>document.getElementById("d"+el.dataset.i).classList.toggle("open"));}
document.getElementById("q").oninput=list;document.getElementById("kind").onchange=list;cards();list();
</script></body></html>
